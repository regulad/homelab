---
# This host's Podman Quadlet services, from host_vars/<host>/services.yml. Each
# is one .container unit in /etc/containers/systemd/, with:
#   name            unit and default container name
#   state           present (default) or absent
#   description     [Unit] Description
#   after, wants    [Unit] ordering and wanted units
#   image           a major-version or channel tag, or latest only where
#                   upstream has no other; with auto_update: registry,
#                   podman-auto-update pulls new releases of that tag
#   container_name, user, auto_update, read_only (ReadOnly), drop_capabilities
#   (DropCapability), no_new_privileges (NoNewPrivileges), network
#   (Network, such as host), ports (PublishPort), volumes (Volume), tmpfs
#   (Tmpfs), ulimits (Ulimit, as name=soft:hard), exec (Exec, the arguments
#   after the image's entrypoint)
#   environment     Environment entries, in order
#   env_file        true to write quadlet_env_files[name], from the host's
#                   secrets.sops.yml, to /etc/containers/systemd/<name>.env
#   restart         [Service] Restart
#   wanted_by       [Install] WantedBy
quadlet_services: []
quadlet_env_files: {}
quadlet_dir: /etc/containers/systemd
