---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Regenerate the units, then restart only the services whose unit or env file
# changed.
- name: Restart changed Quadlet services
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: restarted
    daemon_reload: true
  loop: >-
    {{ ((quadlet_units.results | default([])) + (quadlet_envs.results | default([])))
       | selectattr('changed') | map(attribute='item.name') | unique | list }}
  register: quadlet_restarted
  # In check mode a new unit is not written, so systemd cannot find it.
  failed_when:
    - quadlet_restarted.failed | default(false)
    - not (ansible_check_mode and 'Could not find the requested service' in quadlet_restarted.msg | default(''))
