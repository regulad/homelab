---
# Template each network's .network unit and each service's .container unit,
# with its secret env file, into /etc/containers/systemd/, and keep each
# service running; a service's state: absent removes its unit and env file.
# Runs on generated hosts in podman_hosts (Phase 4).
- name: Split services into present and absent
  ansible.builtin.set_fact:
    quadlet_present: >-
      {{ quadlet_services | rejectattr('state', 'defined') | list
         + quadlet_services | selectattr('state', 'defined') | selectattr('state', 'eq', 'present') | list }}
    quadlet_absent: "{{ quadlet_services | selectattr('state', 'defined') | selectattr('state', 'eq', 'absent') | list }}"

# Before the services that join them, which require their network's service.
- name: Quadlet networks
  ansible.builtin.template:
    src: network.network.j2
    dest: "{{ quadlet_dir }}/{{ item.name }}.network"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ quadlet_networks }}"
  loop_control:
    label: "{{ item.name }}"
  register: quadlet_network_units
  notify: Reload systemd

- name: Quadlet units
  ansible.builtin.template:
    src: service.container.j2
    dest: "{{ quadlet_dir }}/{{ item.name }}.container"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ quadlet_present }}"
  loop_control:
    label: "{{ item.name }}"
  register: quadlet_units
  notify: Restart changed Quadlet services

- name: Quadlet env files
  ansible.builtin.copy:
    dest: "{{ quadlet_dir }}/{{ item.name }}.env"
    # Exactly one final newline, which the SOPS value can lose on its way in.
    content: "{{ quadlet_env_files[item.name] | regex_replace('\\n*$', '') }}\n"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ quadlet_present | selectattr('env_file', 'defined') | selectattr('env_file') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: quadlet_envs
  no_log: true
  notify: Restart changed Quadlet services

- name: Stop removed Quadlet services
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.service"
    state: stopped
  loop: "{{ quadlet_absent }}"
  loop_control:
    label: "{{ item.name }}"
  failed_when: false

- name: Remove absent Quadlet units
  ansible.builtin.file:
    path: "{{ quadlet_dir }}/{{ item.0.name }}.{{ item.1 }}"
    state: absent
  loop: "{{ quadlet_absent | product(['container', 'env']) | list }}"
  loop_control:
    label: "{{ item.0.name }}.{{ item.1 }}"
  notify: Reload systemd

- name: Quadlet services running
  # Quadlet units are generated, so systemd cannot enable them; [Install]
  # WantedBy starts them at boot. A new unit exists only once systemd reloads.
  ansible.builtin.systemd_service:
    name: "{{ item.name }}.service"
    state: started
    daemon_reload: "{{ quadlet_units is changed or quadlet_network_units is changed }}"
  loop: "{{ quadlet_present }}"
  loop_control:
    label: "{{ item.name }}"
  register: quadlet_started
  # In check mode a new unit is not written, so systemd cannot find it.
  failed_when:
    - quadlet_started.failed | default(false)
    - not (ansible_check_mode and 'Could not find the requested service' in quadlet_started.msg | default(''))

- name: Podman auto-update timer
  ansible.builtin.systemd_service:
    name: podman-auto-update.timer
    enabled: true
    state: started
  register: quadlet_timer
  # In check mode on a new Podman host, the package that ships it is not installed.
  failed_when:
    - quadlet_timer.failed | default(false)
    - not (ansible_check_mode and 'Could not find the requested service' in quadlet_timer.msg | default(''))
  when: quadlet_present | selectattr('auto_update', 'defined') | list | length > 0
