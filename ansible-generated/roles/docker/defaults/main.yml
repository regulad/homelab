---
# A ULA /64 for Docker's default bridge network. Set, it turns on IPv6 there,
# with Docker's ip6tables rules; each host takes its own prefix.
docker_ula_prefix: ""

# Other daemon.json settings, by name, which override the IPv6 ones.
docker_daemon_settings: {}

# Registries root logs into, each a registry, username and password, the
# password from SOPS.
docker_registries: []

# Compose projects tasks_from: compose brings up, each a name and its files'
# absolute paths in one directory, such as those host_files places.
docker_compose_projects: []
