---
# Converge the distribution's Docker (docker.io, not Docker CE) on the hosts in
# docker_hosts.
- name: Install Docker
  ansible.builtin.package:
    name: docker.io
    state: present

# A purge of Docker CE's leftover configuration once disabled these, which
# docker.io ships under the same names.
- name: Docker at boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - containerd.service
    - docker.socket
    - docker.service

- name: Gather the daemon settings
  ansible.builtin.set_fact:
    docker_daemon: >-
      {{ ({'ipv6': true, 'fixed-cidr-v6': docker_ula_prefix, 'ip6tables': true} if docker_ula_prefix else {})
         | combine(docker_daemon_settings) }}

- name: Read the daemon settings
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_file
  failed_when: false

# Rewritten only when the parsed settings differ, so the file's formatting never
# restarts Docker and every container with it.
- name: Daemon settings
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  when: >-
    (docker_daemon_file.content | default('e30=') | b64decode | from_json) != docker_daemon
  notify: Restart Docker

# root's logins, in /root/.docker/config.json, which Docker's CLI and Compose
# send with each pull. docker_login logs in again only when the file's
# credentials for a registry differ from the listed ones.
- name: Registry logins
  community.docker.docker_login:
    registry_url: "{{ item.registry }}"
    username: "{{ item.username }}"
    password: "{{ item.password }}"
  loop: "{{ docker_registries }}"
  loop_control:
    label: "{{ item.registry }}"
  no_log: true
