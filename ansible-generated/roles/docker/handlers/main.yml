---
# Stops every container. Services PartOf=docker.service, such as Wings, restart
# with it.
- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted

# SIGHUP: Docker takes its reloadable settings again (docker_reloadable_settings)
# and every container keeps running.
- name: Reload Docker
  ansible.builtin.systemd_service:
    name: docker
    state: reloaded
