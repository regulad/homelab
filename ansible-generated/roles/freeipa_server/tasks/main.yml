---
# Install a FreeIPA server once, with its own CA and no integrated DNS, which
# arawi's unbound serves, or join one as a replica, then converge its
# directory's anonymous access and migration mode. Runs on the generated hosts
# in freeipa_servers (Phase 4). FreeIPA configures no NTP client: in a
# container time comes from the Proxmox node, which the container cannot set,
# and an OCI instance's chrony already follows OCI's own time source.
- name: Check the passwords are set
  ansible.builtin.assert:
    that:
      - freeipa_server_domain | length > 0
      - freeipa_server_replica_of | length > 0 or freeipa_server_ds_password | length > 0
      - freeipa_server_admin_password | length > 0
    fail_msg: >-
      Set the domain and the admin password, and for a first server the
      Directory Manager's, in the host's secrets.sops.yml.
    quiet: true
  no_log: true

- name: Install FreeIPA's server
  ansible.builtin.dnf:
    name: ipa-server
    state: present

- name: Set up the server
  ansible.builtin.command:
    argv:
      - ipa-server-install
      - --unattended
      - --domain={{ freeipa_server_domain }}
      - --realm={{ freeipa_server_realm }}
      - --hostname={{ freeipa_server_hostname }}
      - --ds-password={{ freeipa_server_ds_password }}
      - --admin-password={{ freeipa_server_admin_password }}
      - --no-ntp
    creates: /etc/ipa/default.conf
  register: freeipa_server_installed
  when: freeipa_server_replica_of | length == 0
  no_log: true

# A replica enrols itself as admin and joins in one step. Without --setup-ca it
# keeps no CA: the first server's issues its certificates.
- name: Set up the replica
  ansible.builtin.command:
    argv:
      - ipa-replica-install
      - --unattended
      - --domain={{ freeipa_server_domain }}
      - --realm={{ freeipa_server_realm }}
      - --server={{ freeipa_server_replica_of }}
      - --hostname={{ freeipa_server_hostname }}
      - --principal=admin
      - --admin-password={{ freeipa_server_admin_password }}
      - --no-ntp
    creates: /etc/ipa/default.conf
  register: freeipa_server_replicated
  when: freeipa_server_replica_of | length > 0
  no_log: true

# A check run cannot reach the directory an install still pending would create.
- name: Directory settings
  community.general.ldap_attrs:
    dn: "{{ item.dn }}"
    attributes: "{{ item.attributes }}"
    state: exact
    server_uri: "{{ freeipa_server_ldapi_uri }}"
  loop:
    - dn: cn=config
      attributes: {nsslapd-allow-anonymous-access: "{{ freeipa_server_anonymous_access }}"}
    - dn: cn=ipaConfig,cn=etc,{{ freeipa_server_suffix }}
      attributes: {ipaMigrationEnabled: "{{ 'TRUE' if freeipa_server_migration_enabled else 'FALSE' }}"}
  loop_control:
    label: "{{ item.dn }}"
  when: not (ansible_check_mode and (freeipa_server_installed is changed or freeipa_server_replicated is changed))
