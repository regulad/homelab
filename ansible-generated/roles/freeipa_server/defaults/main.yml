---
# The deployment the server installs: its DNS domain and Kerberos realm. The
# server is the host itself, by its inventory name, which must resolve to its
# own address rather than loopback.
freeipa_server_domain: regulad.internal
freeipa_server_realm: "{{ freeipa_server_domain | upper }}"

# The Directory Manager's and admin's passwords, from the host's
# secrets.sops.yml.
freeipa_server_ds_password: ""
freeipa_server_admin_password: ""
