---
# Set the LDAP realm's bind account's password in FreeIPA to the one in SOPS,
# from maintenance.yml's jenkins-ldap-password, run after site.yml has given
# Jenkins the same password: until both agree, nobody can sign in to Jenkins.
- name: Check the run names its hosts and has both passwords
  ansible.builtin.assert:
    that:
      - ansible_limit is defined
      - jenkins_ldap_manager_password | length > 0
      - jenkins_freeipa_password | length > 0
    fail_msg: Name the Jenkins controllers with --limit, and set both passwords through SOPS.
    quiet: true

- name: The bind account's password
  community.general.ipa_user:
    name: "{{ jenkins_ldap_manager_user }}"
    password: "{{ jenkins_ldap_manager_password }}"
    update_password: always
    state: present
    ipa_host: "{{ jenkins_freeipa_host }}"
    ipa_user: "{{ jenkins_freeipa_user }}"
    ipa_pass: "{{ jenkins_freeipa_password }}"
    validate_certs: true
  delegate_to: "{{ jenkins_freeipa_delegate }}"
  become: false
  no_log: true

# FreeIPA expires a password an administrator sets at once.
- name: The bind account's password expiry
  community.general.ipa_user:
    name: "{{ jenkins_ldap_manager_user }}"
    krbpasswordexpiration: "{{ jenkins_ldap_manager_password_expiration }}"
    state: present
    ipa_host: "{{ jenkins_freeipa_host }}"
    ipa_user: "{{ jenkins_freeipa_user }}"
    ipa_pass: "{{ jenkins_freeipa_password }}"
    validate_certs: true
  delegate_to: "{{ jenkins_freeipa_delegate }}"
  become: false
  no_log: true
