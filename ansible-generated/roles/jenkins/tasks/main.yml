---
# Converge who may sign in to Jenkins and its plugins. Jenkins itself runs as a
# Quadlet (the quadlet role); its configuration is Jenkins's own until
# Configuration as Code takes it.

# Before the group, which lists them.
- name: Service users in FreeIPA
  community.general.ipa_user:
    name: "{{ item.name }}"
    givenname: "{{ item.givenname }}"
    sn: "{{ item.sn }}"
    password: "{{ item.password }}"
    update_password: on_create
    krbpasswordexpiration: "{{ jenkins_freeipa_password_expiration }}"
    state: present
    ipa_host: "{{ jenkins_freeipa_host }}"
    ipa_user: "{{ jenkins_freeipa_user }}"
    ipa_pass: "{{ jenkins_freeipa_password }}"
    validate_certs: true
  loop: "{{ jenkins_freeipa_service_users }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ jenkins_freeipa_delegate }}"
  become: false
  no_log: true

# Before the plugins, so that jenkins_api_user can sign in for the plugin
# manager.
# FIXME(#2): community.general 13.5.0's IPA client fails a member change that
# succeeded, as FreeIPA's result lists no failures as a dict of empty lists
# (fixed in PR 13188, backported to stable-13 as PR 13206). Revisit at the
# first 13.x release that carries it, and move requirements.yml's pin there.
- name: The LDAP realm's group
  community.general.ipa_group:
    name: "{{ jenkins_freeipa_group }}"
    user: "{{ jenkins_freeipa_members + jenkins_freeipa_service_users | map(attribute='name') | list }}"
    append: false
    state: present
    ipa_host: "{{ jenkins_freeipa_host }}"
    ipa_user: "{{ jenkins_freeipa_user }}"
    ipa_pass: "{{ jenkins_freeipa_password }}"
    validate_certs: true
  delegate_to: "{{ jenkins_freeipa_delegate }}"
  become: false
  when: jenkins_freeipa_members | length > 0 or jenkins_freeipa_service_users | length > 0
  no_log: true

# A service user whose password Jenkins refuses, as after it changes in SOPS,
# gets it set again. A check run cannot reach a user it has yet to create.
- name: Test the service users' passwords
  ansible.builtin.uri:
    url: "{{ jenkins_url }}/whoAmI/api/json"
    url_username: "{{ item.name }}"
    url_password: "{{ item.password }}"
    force_basic_auth: true
    status_code: [200, 401]
  loop: "{{ jenkins_freeipa_service_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: jenkins_service_user_logins
  check_mode: false
  no_log: true

- name: The passwords Jenkins refuses
  community.general.ipa_user:
    name: "{{ item.item.name }}"
    password: "{{ item.item.password }}"
    update_password: always
    state: present
    ipa_host: "{{ jenkins_freeipa_host }}"
    ipa_user: "{{ jenkins_freeipa_user }}"
    ipa_pass: "{{ jenkins_freeipa_password }}"
    validate_certs: true
  loop: "{{ jenkins_service_user_logins.results | selectattr('status', 'eq', 401) | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  delegate_to: "{{ jenkins_freeipa_delegate }}"
  become: false
  no_log: true

# FreeIPA expires a password an administrator sets at once, even in the call
# that creates its user with an expiry, so each service user's expiry is set
# after its password.
- name: The service users' password expiry
  community.general.ipa_user:
    name: "{{ item.name }}"
    krbpasswordexpiration: "{{ jenkins_freeipa_password_expiration }}"
    state: present
    ipa_host: "{{ jenkins_freeipa_host }}"
    ipa_user: "{{ jenkins_freeipa_user }}"
    ipa_pass: "{{ jenkins_freeipa_password }}"
    validate_certs: true
  loop: "{{ jenkins_freeipa_service_users }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ jenkins_freeipa_delegate }}"
  become: false
  no_log: true

# The plugin manager's view of each plugin's version. jenkins_plugin downloads
# a pinned plugin on every run to compare its checksum, and in check mode
# reports every installed one as changed, so only the plugins whose version
# differs from the pin, or which are missing, go to it.
- name: Read the installed plugins
  ansible.builtin.uri:
    url: "{{ jenkins_url }}/pluginManager/api/json?depth=1&tree=plugins[shortName,version]"
    url_username: "{{ jenkins_api_user }}"
    url_password: "{{ jenkins_api_password }}"
    force_basic_auth: true
  register: jenkins_plugins_live
  check_mode: false

- name: Plugins to install
  ansible.builtin.set_fact:
    jenkins_plugins_needed: >-
      {%- set live = jenkins_plugins_live.json.plugins | items2dict(key_name='shortName', value_name='version') -%}
      {%- set out = {} -%}
      {%- for name, version in jenkins_plugins.items() -%}
      {%- if live.get(name) != version -%}
      {%- set _ = out.update({name: version}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

# Each plugin's .jpi in jenkins_home/plugins, which Jenkins unpacks at its next
# start, so a new or changed plugin restarts it. What the unpacking writes is
# too much to declare; AIDE mails it once (AIDE.md).
- name: Plugins
  community.general.jenkins_plugin:
    name: "{{ item.key }}"
    version: "{{ item.value }}"
    with_dependencies: false
    jenkins_home: "{{ jenkins_home }}"
    owner: "{{ jenkins_owner }}"
    group: "{{ jenkins_owner }}"
    url: "{{ jenkins_url }}"
    url_username: "{{ jenkins_api_user }}"
    url_password: "{{ jenkins_api_password }}"
    force_basic_auth: true
    timeout: 120
  loop: "{{ jenkins_plugins_needed | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value }}"
  vars:
    aide_writes: [/mnt/jenkins/plugins/*.jpi]
  notify: Restart Jenkins
