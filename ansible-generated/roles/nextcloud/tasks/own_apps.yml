---
# The repository's own apps, each a directory with an appinfo/info.xml under
# files/<host>/<the apps volume's path>/, often a submodule, copied file by
# file into that volume beside the App Store's apps, without what is its
# repository's rather than the app's (nextcloud_own_apps_excluded). The App
# Store has none of them, so occ app:update leaves them alone.
- name: Read the apps volume's mountpoint
  ansible.builtin.command:
    argv: [podman, volume, inspect, --format, "{{ '{{' }}.Mountpoint{{ '}}' }}", "{{ nextcloud_apps_volume }}"]
  register: nextcloud_own_apps_mountpoint
  changed_when: false
  check_mode: false

- name: The repository's own apps, and what of each is the app's
  ansible.builtin.set_fact:
    nextcloud_own_apps_src: "{{ nextcloud_own_apps_dir }}"
    nextcloud_own_apps: "{{ nextcloud_own_apps_ids }}"
    nextcloud_own_apps_dirs: >-
      {{ nextcloud_own_apps_tree | selectattr('state', 'eq', 'directory') | map(attribute='path')
         | reject('search', '/') | sort }}
    nextcloud_own_apps_entries: >-
      {%- set out = [] -%}
      {%- for entry in nextcloud_own_apps_tree if entry.state in ['directory', 'file'] -%}
      {%- set parts = entry.path.split('/') -%}
      {%- if parts[0] in nextcloud_own_apps_ids
            and not (parts | length > 1 and parts[1] in nextcloud_own_apps_excluded) -%}
      {%- set _ = out.append({'path': entry.path, 'src': entry.root ~ '/' ~ entry.path, 'state': entry.state}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  vars:
    nextcloud_own_apps_dir: "{{ nextcloud_files_dir }}{{ nextcloud_own_apps_mountpoint.stdout }}"
    nextcloud_own_apps_tree: "{{ query('community.general.filetree', nextcloud_own_apps_dir) }}"
    nextcloud_own_apps_ids: >-
      {{ nextcloud_own_apps_tree | selectattr('state', 'eq', 'file') | map(attribute='path')
         | select('match', '^[^/]+/appinfo/info\.xml$') | map('split', '/') | map('first') | sort }}

# A submodule not checked out is an empty directory, which would leave the app
# missing for apps.yml to seek in the App Store.
- name: Every directory there is an app
  ansible.builtin.assert:
    that: nextcloud_own_apps_missing | length == 0
    fail_msg: >-
      {{ nextcloud_own_apps_missing | join(', ') }} in {{ nextcloud_own_apps_src }} has no appinfo/info.xml.
      A submodule is to be checked out first: git submodule update --init.
    quiet: true
  vars:
    nextcloud_own_apps_missing: "{{ nextcloud_own_apps_dirs | difference(nextcloud_own_apps) }}"

- name: Their directories
  ansible.builtin.file:
    path: "{{ nextcloud_own_apps_mountpoint.stdout }}/{{ item.path }}"
    state: directory
    owner: "33"
    group: "33"
    mode: "0755"
  loop: "{{ nextcloud_own_apps_entries | selectattr('state', 'eq', 'directory') | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Their files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ nextcloud_own_apps_mountpoint.stdout }}/{{ item.path }}"
    owner: "33"
    group: "33"
    mode: "0644"
  loop: "{{ nextcloud_own_apps_entries | selectattr('state', 'eq', 'file') | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Find what their copies hold
  ansible.builtin.find:
    paths: "{{ nextcloud_own_apps | map('regex_replace', '^', nextcloud_own_apps_mountpoint.stdout ~ '/') | list }}"
    recurse: true
    hidden: true
    file_type: any
  register: nextcloud_own_apps_found
  when: nextcloud_own_apps | length > 0

- name: Remove what is not the app's
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ nextcloud_own_apps_found.files | default([]) | map(attribute='path') | difference(nextcloud_own_apps_wanted) | sort }}"
  loop_control:
    label: "{{ item | relpath(nextcloud_own_apps_mountpoint.stdout) }}"
  vars:
    nextcloud_own_apps_wanted: >-
      {{ nextcloud_own_apps_entries | map(attribute='path')
         | map('regex_replace', '^', nextcloud_own_apps_mountpoint.stdout ~ '/') | list }}

# A newer version of an enabled app leaves Nextcloud needing occ upgrade, which
# runs its migrations and registers its background jobs anew; until then,
# Nextcloud serves only its update page.
- name: Read whether Nextcloud needs an upgrade
  ansible.builtin.command:
    argv: "{{ nextcloud_occ + ['status', '--exit-code'] }}"
  register: nextcloud_own_apps_status
  changed_when: false
  failed_when: nextcloud_own_apps_status.rc not in [0, 2]
  check_mode: false

- name: Upgrade it
  ansible.builtin.command:
    argv: "{{ nextcloud_occ + ['upgrade', '--no-interaction'] }}"
  when: nextcloud_own_apps_status.rc == 2
  changed_when: true
