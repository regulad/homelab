---
# The Syncthing hub. The user's Syncthing, the syncthing package's user unit,
# keeps its identity from SOPS and takes its REST API key from it too.
# syncthing-join, a user unit beside it, accepts the devices the tailnet
# vouches for and shares the hub's folders with them. Everything else in the
# user's home, such as the folders, their paths and .stignore, is dotfiles'.
- name: Check the identity, API key, owner and folders are set
  ansible.builtin.assert:
    that:
      - syncthing_hub_cert_pem is search('BEGIN CERTIFICATE')
      - syncthing_hub_key_pem is search('PRIVATE KEY')
      - syncthing_hub_api_key | length >= 32
      - syncthing_hub_owner | length > 0
      - syncthing_hub_folders | length > 0
      - syncthing_hub_folders | rejectattr('id', 'defined') | list | length == 0
      - syncthing_hub_folders | rejectattr('label', 'defined') | list | length == 0
      - syncthing_hub_folders | rejectattr('path', 'defined') | list | length == 0
    quiet: true
  no_log: true

- name: Package
  ansible.builtin.apt:
    name: syncthing
    state: present
    update_cache: true
    cache_valid_time: 86400

- name: The user
  ansible.builtin.getent:
    database: passwd
    key: "{{ syncthing_hub_user }}"

# getent_passwd's fields: password, UID, GID, GECOS, home, shell.
- name: Its home and runtime directory
  ansible.builtin.set_fact:
    syncthing_hub_home: "{{ getent_passwd[syncthing_hub_user][4] }}"
    syncthing_hub_runtime_dir: /run/user/{{ getent_passwd[syncthing_hub_user][1] }}

# Its user units run from boot, without a login.
- name: Lingering
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ syncthing_hub_user }}
    creates: /var/lib/systemd/linger/{{ syncthing_hub_user }}
  vars:
    aide_writes: [/var/lib/systemd/linger/*]

- name: State directory
  ansible.builtin.file:
    path: "{{ syncthing_hub_home }}/.local/state/syncthing"
    state: directory
    owner: "{{ syncthing_hub_user }}"
    group: "{{ syncthing_hub_user }}"
    mode: "0700"

# The device ID is the SHA-256 of cert.pem, so a rebuilt hub keeps it.
- name: Identity
  ansible.builtin.copy:
    dest: "{{ syncthing_hub_home }}/.local/state/syncthing/{{ item.name }}"
    content: "{{ item.content }}"
    owner: "{{ syncthing_hub_user }}"
    group: "{{ syncthing_hub_user }}"
    mode: "{{ item.mode }}"
  loop:
    - {name: cert.pem, content: "{{ syncthing_hub_cert_pem }}", mode: "0664"}
    - {name: key.pem, content: "{{ syncthing_hub_key_pem }}", mode: "0600"}
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart syncthing

- name: Folder directories
  ansible.builtin.file:
    path: "{{ syncthing_hub_home }}/{{ item.path }}"
    state: directory
    owner: "{{ syncthing_hub_user }}"
    group: "{{ syncthing_hub_user }}"
    mode: "{{ item.mode | default(omit) }}"
  loop: "{{ syncthing_hub_folders }}"
  loop_control:
    label: "{{ item.id }}"

# Written before Syncthing has the folder, so that nothing else is ever
# scanned. A .stignore is never synced: each node keeps its own.
- name: Folder ignores
  ansible.builtin.copy:
    dest: "{{ syncthing_hub_home }}/{{ item.path }}/.stignore"
    content: "{{ (item.ignores | default(syncthing_hub_ignores)) | map('regex_replace', '$', '\n') | join }}"
    owner: "{{ syncthing_hub_user }}"
    group: "{{ syncthing_hub_user }}"
    mode: "0644"
  loop: "{{ syncthing_hub_folders }}"
  loop_control:
    label: "{{ item.id }}"

- name: API key directory
  ansible.builtin.file:
    path: /etc/syncthing-hub
    state: directory
    owner: root
    group: root
    mode: "0755"

# Read by the user's manager for both units, so the user's group reads it.
- name: API key
  ansible.builtin.copy:
    dest: /etc/syncthing-hub/api-key.env
    content: "STGUIAPIKEY={{ syncthing_hub_api_key }}\n"
    owner: root
    group: "{{ syncthing_hub_user }}"
    mode: "0640"
  register: syncthing_hub_env
  no_log: true
  notify: [Restart syncthing, Restart syncthing-join]

- name: Drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/user/syncthing.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Syncthing's API key from the environment
  ansible.builtin.template:
    src: syncthing-hub.conf.j2
    dest: /etc/systemd/user/syncthing.service.d/syncthing-hub.conf
    owner: root
    group: root
    mode: "0644"
  register: syncthing_hub_dropin
  notify: Restart syncthing

- name: Joining service directory
  ansible.builtin.file:
    path: /usr/local/lib/syncthing-hub
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Joining service
  ansible.builtin.copy:
    src: syncthing-join
    dest: /usr/local/lib/syncthing-hub/syncthing-join
    owner: root
    group: root
    mode: "0755"
  notify: Restart syncthing-join

- name: Joining service unit
  ansible.builtin.template:
    src: syncthing-join.service.j2
    dest: /etc/systemd/user/syncthing-join.service
    owner: root
    group: root
    mode: "0644"
  register: syncthing_hub_unit
  notify: Restart syncthing-join

# Enabled for every user's manager, as `systemctl --global enable` would, with
# its link in /etc/systemd/user rather than the user's home; ConditionUser=
# leaves it to the hub's user alone. systemd_service cannot query the global
# scope, so the link is made directly.
- name: Joining service enabled
  ansible.builtin.file:
    src: /etc/systemd/user/syncthing-join.service
    dest: /etc/systemd/user/default.target.wants/syncthing-join.service
    state: link
    force: "{{ ansible_check_mode }}"

# The package's user unit, enabled the same way, for the hub's user alone by
# its ConditionUser= drop-in.
- name: Syncthing for the hub's user alone
  ansible.builtin.copy:
    dest: /etc/systemd/user/syncthing.service.d/syncthing-hub-user.conf
    content: |
      # syncthing_hub: the hub's Syncthing, enabled for every user's manager,
      # runs for {{ syncthing_hub_user }} alone.
      [Unit]
      ConditionUser={{ syncthing_hub_user }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart syncthing

- name: Syncthing enabled
  ansible.builtin.file:
    src: /usr/lib/systemd/user/syncthing.service
    dest: /etc/systemd/user/default.target.wants/syncthing.service
    state: link
    force: "{{ ansible_check_mode }}"

- name: Syncthing running
  ansible.builtin.systemd_service:
    name: syncthing.service
    scope: user
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ syncthing_hub_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ syncthing_hub_runtime_dir }}"

# A check run cannot start a unit its unit file isn't written for yet.
- name: Joining service running
  when: not (ansible_check_mode and syncthing_hub_unit is changed)
  ansible.builtin.systemd_service:
    name: syncthing-join.service
    scope: user
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ syncthing_hub_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ syncthing_hub_runtime_dir }}"

# Syncthing's own config keeps the key STGUIAPIKEY overrides it with, so a
# tool that reads config.xml, such as dotfiles' `syncthing cli`, authenticates
# too. Read and set through the REST API once Syncthing runs with the key.
- name: Restarts before the API key is read through the API
  ansible.builtin.meta: flush_handlers

- name: The API key in Syncthing's config
  when: not (ansible_check_mode and (syncthing_hub_env is changed or syncthing_hub_dropin is changed))
  block:
    - name: Read the API key in Syncthing's config
      ansible.builtin.uri:
        url: http://127.0.0.1:8384/rest/config/gui
        headers:
          X-API-Key: "{{ syncthing_hub_api_key }}"
      register: syncthing_hub_gui
      check_mode: false
      no_log: true

    - name: Set it to the key in SOPS
      ansible.builtin.uri:
        url: http://127.0.0.1:8384/rest/config/gui
        method: PATCH
        headers:
          X-API-Key: "{{ syncthing_hub_api_key }}"
        body_format: json
        body:
          apiKey: "{{ syncthing_hub_api_key }}"
      when: syncthing_hub_gui.json.apiKey != syncthing_hub_api_key
      changed_when: true
      no_log: true

# The hub's folders and options, through the REST API: each folder is added
# from Syncthing's folder defaults where it is missing, shared with no device,
# as the joining service does the sharing; a folder's label is kept to its
# declared one, and its path, which Syncthing cannot move, only checked. Paths
# are written as Syncthing keeps them, from ~, which it expands.
- name: Folders and options in Syncthing's config
  when: not (ansible_check_mode and (syncthing_hub_env is changed or syncthing_hub_dropin is changed))
  block:
    - name: Read the folders
      ansible.builtin.uri:
        url: http://127.0.0.1:8384/rest/config/folders/{{ item.id | urlencode }}
        headers:
          X-API-Key: "{{ syncthing_hub_api_key }}"
        status_code: [200, 404]
      loop: "{{ syncthing_hub_folders }}"
      loop_control:
        label: "{{ item.id }}"
      register: syncthing_hub_current_folders
      check_mode: false
      no_log: true

    - name: Read the folder defaults
      ansible.builtin.uri:
        url: http://127.0.0.1:8384/rest/config/defaults/folder
        headers:
          X-API-Key: "{{ syncthing_hub_api_key }}"
      register: syncthing_hub_folder_defaults
      check_mode: false
      no_log: true

    - name: Check each folder is at its declared path
      ansible.builtin.assert:
        that: >-
          item.status == 404 or
          (item.json.path | regex_replace('/+$', ''))
            in ['~/' ~ item.item.path, syncthing_hub_home ~ '/' ~ item.item.path]
        fail_msg: >-
          Syncthing has folder {{ item.item.id }} at {{ item.json.path | default('') }}, not
          ~/{{ item.item.path }}; Syncthing cannot move a folder.
        quiet: true
      loop: "{{ syncthing_hub_current_folders.results }}"
      loop_control:
        label: "{{ item.item.id }}"

    - name: Add the missing folders
      ansible.builtin.uri:
        url: http://127.0.0.1:8384/rest/config/folders
        method: POST
        headers:
          X-API-Key: "{{ syncthing_hub_api_key }}"
        body_format: json
        body: >-
          {{ syncthing_hub_folder_defaults.json | combine({
               'id': item.item.id,
               'label': item.item.label,
               'path': '~/' ~ item.item.path,
               'devices': syncthing_hub_folder_defaults.json.devices | default([], true) | selectattr('deviceID') | list,
             }) }}
      when: item.status == 404
      changed_when: true
      loop: "{{ syncthing_hub_current_folders.results }}"
      loop_control:
        label: "{{ item.item.id }}"
      no_log: true

    - name: Set each folder's label
      ansible.builtin.uri:
        url: http://127.0.0.1:8384/rest/config/folders/{{ item.item.id | urlencode }}
        method: PATCH
        headers:
          X-API-Key: "{{ syncthing_hub_api_key }}"
        body_format: json
        body:
          label: "{{ item.item.label }}"
      when: item.status == 200 and item.json.label != item.item.label
      changed_when: true
      loop: "{{ syncthing_hub_current_folders.results }}"
      loop_control:
        label: "{{ item.item.id }}"
      no_log: true

    - name: Read the options
      ansible.builtin.uri:
        url: http://127.0.0.1:8384/rest/config/options
        headers:
          X-API-Key: "{{ syncthing_hub_api_key }}"
      register: syncthing_hub_current_options
      check_mode: false
      no_log: true

    - name: Set the options
      ansible.builtin.uri:
        url: http://127.0.0.1:8384/rest/config/options
        method: PATCH
        headers:
          X-API-Key: "{{ syncthing_hub_api_key }}"
        body_format: json
        body: "{{ syncthing_hub_options }}"
      when: syncthing_hub_current_options.json | combine(syncthing_hub_options) != syncthing_hub_current_options.json
      changed_when: true
      no_log: true
