---
- name: Restart syncthing
  ansible.builtin.systemd_service:
    name: syncthing.service
    scope: user
    state: restarted
    daemon_reload: true
  become: true
  become_user: "{{ syncthing_hub_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ syncthing_hub_runtime_dir }}"

# A check run cannot restart a unit its unit file isn't written for yet.
- name: Restart syncthing-join
  when: not (ansible_check_mode and syncthing_hub_unit is changed)
  ansible.builtin.systemd_service:
    name: syncthing-join.service
    scope: user
    state: restarted
    daemon_reload: true
  become: true
  become_user: "{{ syncthing_hub_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ syncthing_hub_runtime_dir }}"
