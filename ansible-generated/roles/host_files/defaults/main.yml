---
# Files a host needs outside any other role, such as native systemd units and
# their configuration. Each file has a path on the host, a mode, optionally an
# owner and group (default root), and either src, relative to host_files_dir
# (default: the same path), or content; template: true renders src (default:
# the path plus .j2) instead, with this host's variables and every host's
# hostvars, and the reverse_zone and ip_network filters. Content or a template
# using secrets.sops.yml sets secret: true, which keeps it out of logs and
# diffs. restarts lists the units restarted when the file changes, reloads
# those reloaded instead, and validate, a command run on the new file (%s)
# before it replaces the old one.
host_files_directories: []
# System users the host's services run as, by name: no login shell and no home
# directory created.
host_files_users: []
# Packages those files or units need, from the host's own repositories, through
# APT or, on Enterprise Linux, dnf.
host_files_packages: []
# Symbolic links, each with a path and its target, and optionally restarts
# or reloads as for files.
host_files_links: []
# Release files fetched over HTTPS, each with a path, its url, its checksum
# (sha256:<hex>), a mode, and optionally restarts or reloads as for files. A new
# checksum fetches the file again.
host_files_downloads: []
# pipx applications, as pinned specifiers such as vpn-slice==0.16.1.
host_files_pipx: []
# Release archives fetched over HTTPS and kept in /var/cache/host_files, each
# with its url, its checksum (sha256:<hex>), the files extracted from it into
# dest (a directory), a mode, optionally an owner and group (default root), and
# restarts or reloads as for files.
host_files_archives: []
# Virtual environments, each a path and its packages as pinned specifiers,
# created with python3 -m venv.
host_files_venvs: []
# SELinux booleans set persistently, each a name mapped to true or false.
host_files_selinux_booleans: {}
host_files_list: []
# Directories that hold exactly the files directly in a directory here, each
# with its path on the host, optionally src (relative to host_files_dir;
# default: the same path), a mode for its files and directory_mode for itself
# (default 0755), an owner and group (default root), restarts or reloads as
# for files, and check, a command run whenever the tree changed, before those
# units restart or reload, such as a check of the whole configuration it is
# part of. Any other file in the directory is removed.
host_files_trees: []
host_files_dir: "{{ inventory_dir }}/../files/{{ inventory_hostname }}"
# Files several hosts share, for an item's shared_src (relative to this
# directory), such as those a group's group_vars place.
host_files_shared_dir: "{{ inventory_dir }}/../files/shared"

# systemd units kept enabled and running, such as ones host_files installs.
host_files_units: []
