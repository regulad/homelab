---
# Reload units, then restart the ones whose files changed.
- name: Restart changed host units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: >-
    {{ (host_files_written.results | default([]) + host_files_templated.results | default([])
        + host_files_linked.results | default([]) + host_files_downloaded.results | default([])
        + host_files_extracted.results | default([]) + host_files_tree_written.results | default([])
        + host_files_tree_removed.results | default([])) | selectattr('changed')
       | map(attribute='item') | map(attribute='restarts', default=[]) | flatten | unique | list }}
  register: host_files_units_restarted
  # A unit another role creates later in the run, such as a Quadlet, does not
  # exist yet on its first run; it starts with the new files.
  failed_when:
    - host_files_units_restarted.failed | default(false)
    - "'Could not find the requested service' not in host_files_units_restarted.msg | default('')"

# Reload, without restarting, the units whose files list them in reloads.
- name: Reload changed host units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: reloaded
  loop: >-
    {{ (host_files_written.results | default([]) + host_files_templated.results | default([])
        + host_files_linked.results | default([]) + host_files_downloaded.results | default([])
        + host_files_extracted.results | default([]) + host_files_tree_written.results | default([])
        + host_files_tree_removed.results | default([])) | selectattr('changed')
       | map(attribute='item') | map(attribute='reloads', default=[]) | flatten | unique | list }}
  register: host_files_units_reloaded
  failed_when:
    - host_files_units_reloaded.failed | default(false)
    - "'Could not find the requested service' not in host_files_units_reloaded.msg | default('')"
