---
# Reload units, then restart the ones whose files changed.
- name: Restart changed host units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: >-
    {{ host_files_written.results | default([]) | selectattr('changed')
       | map(attribute='item') | map(attribute='restarts', default=[]) | flatten | unique | list }}
  register: host_files_units_restarted
  # In check mode a new unit is not written, so systemd cannot find it.
  failed_when:
    - host_files_units_restarted.failed | default(false)
    - not (ansible_check_mode and 'Could not find the requested service' in host_files_units_restarted.msg | default(''))
