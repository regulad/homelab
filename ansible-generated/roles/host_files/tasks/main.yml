---
# Place each host's own files and keep its native units running. Runs on
# generated Linux hosts (Phase 4).
- name: Host directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_files_directories }}"
  loop_control:
    label: "{{ item.path }}"

- name: Host files
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    src: >-
      {{ omit if item.content is defined
         else host_files_shared_dir ~ '/' ~ item.shared_src if item.shared_src is defined
         else host_files_dir ~ (item.src | default(item.path)) }}
    content: "{{ item.content | default(omit) }}"
    validate: "{{ item.validate | default(omit) }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_files_list | rejectattr('template', 'defined') | list }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: "{{ item.secret | default(false) }}"
  diff: "{{ not (item.secret | default(false)) }}"
  register: host_files_written
  notify: [Restart changed host units, Reload changed host units]

- name: Host templates
  ansible.builtin.template:
    dest: "{{ item.path }}"
    src: "{{ host_files_dir ~ (item.src | default(item.path ~ '.j2')) }}"
    validate: "{{ item.validate | default(omit) }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_files_list | selectattr('template', 'defined') | selectattr('template') | list }}"
  loop_control:
    label: "{{ item.path }}"
  register: host_files_templated
  notify: [Restart changed host units, Reload changed host units]

- name: Host links
  ansible.builtin.file:
    path: "{{ item.path }}"
    src: "{{ item.target }}"
    state: link
  loop: "{{ host_files_links }}"
  loop_control:
    label: "{{ item.path }}"
  notify: [Restart changed host units, Reload changed host units]
  register: host_files_linked

# After the files, which can include an apt source a package comes from.
- name: Host packages
  ansible.builtin.apt:
    name: "{{ host_files_packages }}"
    state: present
    update_cache: "{{ host_files_written is changed }}"
  when: host_files_packages | length > 0

# Python applications no distribution package provides, through pipx's
# global install (/opt/pipx, commands in /usr/local/bin), each pinned.
- name: Host pipx applications
  community.general.pipx:
    name: "{{ item }}"
    state: present
    global: true
  loop: "{{ host_files_pipx }}"

- name: Host units running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: "{{ host_files_written is changed or host_files_templated is changed }}"
  loop: "{{ host_files_units }}"
  register: host_files_units_started
  # In check mode a new unit is not written, so systemd cannot find it.
  failed_when:
    - host_files_units_started.failed | default(false)
    - not (ansible_check_mode and 'Could not find the requested service' in host_files_units_started.msg | default(''))
