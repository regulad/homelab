---
# Place each host's own files and keep its native units running. Runs on
# generated Linux hosts (Phase 4).
# The system users the host's services run as, ahead of the files they own.
- name: Host system users
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    shell: /sbin/nologin
    create_home: false
  loop: "{{ host_files_users }}"

- name: Host directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_files_directories }}"
  loop_control:
    label: "{{ item.path }}"

- name: Host files
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    src: >-
      {{ omit if item.content is defined
         else host_files_shared_dir ~ '/' ~ item.shared_src if item.shared_src is defined
         else host_files_dir ~ (item.src | default(item.path)) }}
    content: "{{ item.content | default(omit) }}"
    validate: "{{ item.validate | default(omit) }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_files_list | rejectattr('template', 'defined') | list }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: "{{ item.secret | default(false) }}"
  diff: "{{ not (item.secret | default(false)) }}"
  register: host_files_written
  notify: [Restart changed host units, Reload changed host units]

- name: Host templates
  ansible.builtin.template:
    dest: "{{ item.path }}"
    src: "{{ host_files_dir ~ (item.src | default(item.path ~ '.j2')) }}"
    validate: "{{ item.validate | default(omit) }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_files_list | selectattr('template', 'defined') | selectattr('template') | list }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: "{{ item.secret | default(false) }}"
  diff: "{{ not (item.secret | default(false)) }}"
  register: host_files_templated
  notify: [Restart changed host units, Reload changed host units]

- name: Host links
  ansible.builtin.file:
    path: "{{ item.path }}"
    src: "{{ item.target }}"
    state: link
  loop: "{{ host_files_links }}"
  loop_control:
    label: "{{ item.path }}"
  notify: [Restart changed host units, Reload changed host units]
  register: host_files_linked

- name: Host downloads
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.path }}"
    checksum: "{{ item.checksum }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_files_downloads }}"
  loop_control:
    label: "{{ item.path }}"
  register: host_files_downloaded
  notify: [Restart changed host units, Reload changed host units]

# The cache keeps each archive, so that its files are extracted again only when
# they differ from it.
- name: Host archive cache
  ansible.builtin.file:
    path: /var/cache/host_files
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: host_files_archives | length > 0
  register: host_files_archive_cache

- name: Host archives
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: /var/cache/host_files/{{ item.url | basename }}
    checksum: "{{ item.checksum }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ host_files_archives }}"
  loop_control:
    label: "{{ item.url | basename }}"
  register: host_files_archives_fetched
  # A check run cannot fetch into a cache it has not created.
  when: not (ansible_check_mode and host_files_archive_cache is changed)

- name: Host archives' files
  ansible.builtin.unarchive:
    src: /var/cache/host_files/{{ item.url | basename }}
    remote_src: true
    dest: "{{ item.dest }}"
    include: "{{ item.files }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop: "{{ host_files_archives }}"
  loop_control:
    label: "{{ item.url | basename }}"
    index_var: host_files_archive_index
  register: host_files_extracted
  notify: [Restart changed host units, Reload changed host units]
  # A check run cannot extract an archive it has not fetched.
  when: >-
    not (ansible_check_mode
         and (host_files_archive_cache is changed
              or host_files_archives_fetched.results[host_files_archive_index] is changed))

# After the files, which can include an apt source or a dnf repository a
# package comes from.
- name: Host packages (APT)
  ansible.builtin.apt:
    name: "{{ host_files_packages }}"
    state: present
    update_cache: "{{ host_files_written is changed }}"
  when:
    - host_files_packages | length > 0
    - "'rhel' not in group_names"

- name: Host packages (dnf)
  ansible.builtin.dnf:
    name: "{{ host_files_packages }}"
    state: present
    update_cache: "{{ host_files_written is changed }}"
  when:
    - host_files_packages | length > 0
    - "'rhel' in group_names"

# Python applications no distribution package provides, through pipx's
# global install (/opt/pipx, commands in /usr/local/bin), each pinned.
- name: Host pipx applications
  community.general.pipx:
    name: "{{ item }}"
    state: present
    global: true
  loop: "{{ host_files_pipx }}"

# Python applications in a virtual environment of their own, with every
# package pinned, after the packages that build them.
- name: Host virtual environments
  ansible.builtin.pip:
    name: "{{ item.packages }}"
    virtualenv: "{{ item.path }}"
    virtualenv_command: python3 -m venv
  loop: "{{ host_files_venvs }}"
  loop_control:
    label: "{{ item.path }}"

- name: Host SELinux booleans
  ansible.posix.seboolean:
    name: "{{ item.key }}"
    state: "{{ item.value }}"
    persistent: true
  loop: "{{ host_files_selinux_booleans | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Host units running
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: "{{ host_files_written is changed or host_files_templated is changed }}"
  loop: "{{ host_files_units }}"
  register: host_files_units_started
  # In check mode a new unit is not written, so systemd cannot find it.
  failed_when:
    - host_files_units_started.failed | default(false)
    - not (ansible_check_mode and 'Could not find the requested service' in host_files_units_started.msg | default(''))
