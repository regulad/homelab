---
# Nexus's repositories this role creates where missing and converges, each
# with:
#   format, type, name   the repository, as its REST API addresses it:
#                        /v1/repositories/<format>/<type>/<name>
#   settings             a new repository's settings, as that API takes them;
#                        for one Nexus has, those to merge into what it has,
#                        and those not listed are left as they are
#   signing              the OpenPGP key Nexus signs the repository's metadata
#                        with, an APT hosted repository's (aptSigning) or a YUM
#                        group's (yumSigning): its armored private key,
#                        keypair, and the passphrase that encrypts it
#   login                a proxy's upstream login, a username and a password
# Repositories not listed are left as they are. Nexus's API never returns a
# stored password or passphrase, and a repository is written whole, so a
# repository whose upstream login or signing key is stored in Nexus lists it
# here.
nexus_repositories_managed: []

# Files this role keeps in Nexus's raw hosted repositories, each with:
#   repository, path   where Nexus serves it:
#                      <nexus_url>/repository/<repository>/<path>
#   content            what it holds
# Each is uploaded where Nexus lacks it or holds something else. Other files
# are left as they are.
nexus_repositories_raw_files: []

# Whether to write each listed repository even where Nexus already has its
# settings: Nexus never returns a password, so a run sends a changed one only
# this way. maintenance.yml's nexus-proxy-logins sets it.
nexus_repositories_force: false
