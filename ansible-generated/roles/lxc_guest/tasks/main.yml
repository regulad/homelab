---
# What a Proxmox container needs from inside. A privileged one must run without
# AppArmor, so its package is purged; dpkg leaves the profile stubs that other
# packages put in /etc/apparmor.d. An Ubuntu one runs netplan's unit without its
# udev steps. Runs on the generated hosts in proxmox_containers (Phase 4),
# before Podman and the services.
- name: Read the container's user ID map
  ansible.builtin.slurp:
    src: /proc/self/uid_map
  register: lxc_guest_uid_map

# A privileged container maps every ID to itself; an unprivileged one maps its
# IDs onto the node's from 100000.
- name: No AppArmor in a privileged container
  ansible.builtin.apt:
    name: apparmor
    state: absent
    purge: true
  when: (lxc_guest_uid_map.content | b64decode).split() == ['0', '0', '4294967295']
  notify: Forget AppArmor's failed unit

# netplan-configure.service, from Ubuntu 26.04's netplan, finishes with udevadm,
# which fails in a container, where there is no udev: systemd then reports the
# container degraded at every boot. Proxmox's 26.04 template clears those steps
# with a drop-in of its own in /usr/lib, which no package owns, so a container
# upgraded from an older template lacks it. This one does the same for every
# Ubuntu container; before 26.04 it applies to no unit.
- name: Netplan's unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/netplan-configure.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: "'ubuntu' in group_names"

- name: Netplan's udev steps cleared
  ansible.builtin.copy:
    dest: /etc/systemd/system/netplan-configure.service.d/container.conf
    content: |
      # Managed by Ansible (lxc_guest). A container has no udev.
      [Service]
      ExecStartPost=
    owner: root
    group: root
    mode: "0644"
  when: "'ubuntu' in group_names"
  notify: Reload systemd
