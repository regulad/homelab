---
# lime's release to install, as its tag names it without the v
# (https://github.com/regulad/lime/releases), and the SHA-256 of each
# architecture's archive, from the .sha256 published beside it. amd64's archive
# is built for x86-64-v3.
lime_version: 2026.11.25_1
lime_sha256:
  amd64-v3: 74e1881e04a73a3fe36a42f87feff7744ddb7f98ddd6c7fe423df1a4bd897bf4
  arm64: 1649f3d375502e1821b81385cc645ad8e47cd4d6c077adedb365f54abe38f002

# Where archives are downloaded and unpacked, below /var/cache, which AIDE
# leaves out.
lime_cache_dir: /var/cache/lime

# Interfaces lime browses mDNS on, each on the Macs' own network with mDNS on
# in systemd-resolved.
lime_interfaces: []

# The Macs lime unlocks, each a name (a label for logs, which names its
# credential, lime.<name>), its unlock_user (the hidden FileVault account that
# answers the pre-boot unlock, referenced from SOPS) and every one of its
# host_keys, by which lime identifies it.
lime_macs: []

# Each Mac's unlock password, by name, from SOPS, without a trailing newline.
lime_passwords: {}
