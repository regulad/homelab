---
# Install lime's release lime_version, from the archive for this host's
# architecture, checked against its pinned SHA-256, and run it under systemd to
# unlock each Mac in lime_macs at macOS's pre-boot SSH unlock. Each Mac's
# password is a systemd credential sealed to this host's TPM. Runs on the
# generated Ubuntu hosts in the lime group.
- name: Check every Mac has a password
  ansible.builtin.assert:
    that: item.name in lime_passwords
    fail_msg: lime_passwords has no password for {{ item.name }}.
    quiet: true
  loop: "{{ lime_macs }}"
  loop_control:
    label: "{{ item.name }}"

# The play gathers no facts.
- name: Read the architecture
  ansible.builtin.command:
    argv: [uname, -m]
  register: lime_machine
  changed_when: false
  check_mode: false

# amd64's archive is built for x86-64-v3, as the dynamic loader reports it.
- name: Read the CPU's x86-64 levels from the dynamic loader
  ansible.builtin.command:
    argv: [/lib64/ld-linux-x86-64.so.2, --help]
  register: lime_loader
  changed_when: false
  check_mode: false
  when: lime_machine.stdout == 'x86_64'

- name: Check there's an archive for this host
  ansible.builtin.assert:
    that:
      - lime_machine.stdout in ['x86_64', 'aarch64']
      - lime_machine.stdout != 'x86_64' or lime_loader.stdout is search('(?m)^\s+x86-64-v3 \(supported')
    fail_msg: lime's releases are built for x86-64-v3 and arm64; this host is {{ lime_machine.stdout }}, without x86-64-v3.
    quiet: true

- name: Pick this host's archive
  ansible.builtin.set_fact:
    lime_suffix: "{{ lime_machine_suffix }}"
    lime_archive: lime-{{ lime_version }}-linux-{{ lime_machine_suffix }}
  vars:
    lime_machine_suffix: "{{ 'amd64-v3' if lime_machine.stdout == 'x86_64' else 'arm64' }}"

- name: Cache directory
  ansible.builtin.file:
    path: "{{ lime_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Archive
  ansible.builtin.get_url:
    url: https://github.com/regulad/lime/releases/download/v{{ lime_version }}/{{ lime_archive }}.tar.gz
    dest: "{{ lime_cache_dir }}/{{ lime_archive }}.tar.gz"
    checksum: sha256:{{ lime_sha256[lime_suffix] }}
    owner: root
    group: root
    mode: "0644"
  register: lime_downloaded

# A check run neither downloads an archive nor unpacks one, so it can't unpack
# or install from one that isn't there yet.
- name: Unpack it
  ansible.builtin.unarchive:
    src: "{{ lime_cache_dir }}/{{ lime_archive }}.tar.gz"
    dest: "{{ lime_cache_dir }}"
    remote_src: true
    creates: "{{ lime_cache_dir }}/{{ lime_archive }}/lime"
  register: lime_unpacked
  when: not (ansible_check_mode and lime_downloaded is changed)

- name: Install
  when: not (ansible_check_mode and (lime_downloaded is changed or lime_unpacked is changed))
  block:
    - name: Binary
      ansible.builtin.copy:
        src: "{{ lime_cache_dir }}/{{ lime_archive }}/lime"
        dest: /usr/local/bin/lime
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart lime

    - name: Unit
      ansible.builtin.copy:
        src: "{{ lime_cache_dir }}/{{ lime_archive }}/lime.service"
        dest: /etc/systemd/system/lime.service
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart lime

    # The unit's Documentation=, and the archive's other documents.
    - name: Documentation directory
      ansible.builtin.file:
        path: /usr/local/share/doc/lime
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Documentation
      ansible.builtin.copy:
        src: "{{ lime_cache_dir }}/{{ lime_archive }}/{{ item }}"
        dest: /usr/local/share/doc/lime/{{ item }}
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: [README.md, PRIVACY.md, THIRD-PARTY-NOTICES.txt, LICENSE.md]

# What earlier versions of this role kept to build lime from source.
- name: No source build
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/src/lime
    - "{{ lime_cache_dir }}/cargo"

# Earlier releases' archives and their unpacked directories.
- name: Find older archives
  ansible.builtin.find:
    paths: "{{ lime_cache_dir }}"
    patterns: lime-*
    file_type: any
    excludes: ["{{ lime_archive }}", "{{ lime_archive }}.tar.gz"]
  register: lime_old_archives

- name: No older archives
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ lime_old_archives.files | map(attribute='path') }}"

- name: Configuration directory
  ansible.builtin.file:
    path: /etc/lime
    state: directory
    owner: root
    group: root
    mode: "0755"

# Kept out of logs and diffs, as it names each Mac's unlock account.
- name: Configuration
  ansible.builtin.template:
    src: lime.toml.j2
    dest: /etc/lime/lime.toml
    owner: root
    group: root
    mode: "0644"
  diff: false
  no_log: true
  notify: Restart lime

- name: Credential store
  ansible.builtin.file:
    path: /etc/credstore.encrypted
    state: directory
    owner: root
    group: root
    mode: "0700"

# Encryption is not deterministic, so each credential is compared by
# decrypting it, and encrypted again where it is missing, holds another
# password, or no longer decrypts, as after losing the TPM.
- name: Read the credentials
  ansible.builtin.command:
    cmd: systemd-creds decrypt --name=lime.{{ item.name }} /etc/credstore.encrypted/lime.{{ item.name }} -
  loop: "{{ lime_macs }}"
  loop_control:
    label: "{{ item.name }}"
  register: lime_credentials
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

# host+tpm2: a copied file is useless without this host's TPM and its
# credential secret.
- name: Credentials
  ansible.builtin.command:
    cmd: systemd-creds encrypt --with-key=host+tpm2 --name=lime.{{ item.item.name }} - /etc/credstore.encrypted/lime.{{ item.item.name }}
    stdin: "{{ lime_passwords[item.item.name] }}"
    stdin_add_newline: false
  loop: "{{ lime_credentials.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0 or item.stdout != lime_passwords[item.item.name]
  changed_when: true
  notify: Restart lime
  no_log: true

# The unit imports every lime.* credential.
- name: Find the credentials
  ansible.builtin.find:
    paths: /etc/credstore.encrypted
    patterns: lime.*
  register: lime_credential_files

- name: No credentials for Macs no longer listed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ lime_credential_files.files | map(attribute='path') | difference(lime_credential_paths) }}"
  vars:
    lime_credential_paths: "{{ lime_macs | map(attribute='name') | map('regex_replace', '^', '/etc/credstore.encrypted/lime.') }}"
  notify: Restart lime

- name: The lime service
  ansible.builtin.systemd_service:
    name: lime
    enabled: true
    state: started
    daemon_reload: true
