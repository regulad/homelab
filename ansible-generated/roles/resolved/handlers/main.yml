---
# Ahead of resolved's restart, so that NetworkManager has stopped handing it
# the links' DNS before resolved forgets what it was handed.
- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: reloaded
  when: not ansible_check_mode

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  # A check run before the package is installed has no unit to look at.
  ignore_errors: "{{ ansible_check_mode }}"

# networkd reconfigures each link whose .network file, or a drop-in of it,
# changed.
- name: Reload networkd
  ansible.builtin.command:
    argv: [networkctl, reload]
  changed_when: true
  when: not ansible_check_mode
