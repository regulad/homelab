---
# systemd-resolved's mDNS on the host and on its networks' links, and in a
# Proxmox container resolved's stub as the resolver. Runs on the generated
# homelab hosts that run resolved (Phase 4).
- name: Check what manages the links
  ansible.builtin.assert:
    that: resolved_mode in ['networkd', 'networkmanager']
    fail_msg: "Set resolved_mode to networkd or networkmanager through the host's OS group."
    quiet: true

# Part of systemd on Ubuntu, a package of its own on Enterprise Linux.
- name: Install systemd-resolved
  ansible.builtin.package:
    name: systemd-resolved
    state: present

- name: Resolved's drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Named to follow the 00-disable-mdns.conf Ubuntu 26.04's systemd ships.
- name: Resolved's mDNS
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/mdns.conf
    content: |
      # Managed by Ansible (resolved).
      [Resolve]
      MulticastDNS={{ resolved_mdns }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved

- name: The host's own settings
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/host.conf
    content: |
      # Managed by Ansible (resolved): the host's resolved_settings_host.
      [Resolve]
      {% for name, value in resolved_settings_host.items() %}
      {{ name }}={{ value }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: resolved_settings_host | length > 0
  notify: Restart systemd-resolved

- name: No settings of the host's own
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d/host.conf
    state: absent
  when: resolved_settings_host | length == 0
  notify: Restart systemd-resolved

# Started once its settings are in place.
- name: Resolved running
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: true
    state: started
  # A check run before the package is installed has no unit to look at.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Links by networkd
  when: resolved_mode == 'networkd'
  block:
    - name: The links' drop-in directories
      ansible.builtin.file:
        path: /etc/systemd/network/{{ item }}.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ resolved_networks }}"

    - name: Each link's mDNS
      ansible.builtin.copy:
        dest: /etc/systemd/network/{{ item }}.d/mdns.conf
        content: |
          # Managed by Ansible (resolved).
          [Network]
          MulticastDNS={{ resolved_mdns }}
        owner: root
        group: root
        mode: "0644"
      loop: "{{ resolved_networks }}"
      notify: Reload networkd

    - name: Each link's DNS, as Proxmox's resolv.conf gave it
      ansible.builtin.copy:
        dest: /etc/systemd/network/{{ item }}.d/dns.conf
        content: |
          # Managed by Ansible (resolved): arawi, IPv6 first, and its domain, not
          # the DNS servers router advertisements carry.
          [Network]
          {% for server in resolved_dns %}
          DNS={{ server }}
          {% endfor %}
          Domains={{ resolved_domains | join(' ') }}

          [IPv6AcceptRA]
          UseDNS=false
        owner: root
        group: root
        mode: "0644"
      loop: "{{ resolved_networks }}"
      when: resolved_stub
      notify: Reload networkd

# NetworkManager's plugin for resolved (RHEL 10's networking guide, 19.2)
# hands each link's DNS to resolved, and leaves each link's mDNS, while its
# profile's connection.mdns is the default, to resolved's own MulticastDNS.
# Proxmox rewrites a container's profile at each start, so nothing is set
# there: the global DNS overrides what the profile, DHCP and router
# advertisements carry.
- name: Links by NetworkManager
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/resolved.conf
    content: |
      # Managed by Ansible (resolved): resolved as NetworkManager's DNS{{ ',' if resolved_stub }}
      {% if resolved_stub %}
      # with arawi, IPv6 first, and its domain for every link, not the DNS
      # servers the profiles, DHCP and router advertisements carry.
      {% endif %}
      [main]
      dns=systemd-resolved
      {% if resolved_stub %}

      [global-dns]
      searches={{ resolved_domains | join(',') }}

      [global-dns-domain-*]
      servers={{ resolved_dns | join(',') }}
      {% endif %}
    owner: root
    group: root
    mode: "0644"
  when: resolved_mode == 'networkmanager'
  notify: Reload NetworkManager

# The links carry their DNS before the stub becomes the resolver.
- name: Apply the links' settings
  ansible.builtin.meta: flush_handlers

- name: Proxmox told to leave resolv.conf alone
  ansible.builtin.copy:
    dest: /etc/.pve-ignore.resolv.conf
    content: ""
    force: false
    owner: root
    group: root
    mode: "0644"
  when: resolved_stub

- name: Resolved's stub as the resolver
  ansible.builtin.file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/stub-resolv.conf
    state: link
    force: true
  when: resolved_stub
