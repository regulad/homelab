---
# Packages that make up Podman on this host.
podman_packages: [podman]

# Podman's storage for root (graphroot in storage.conf), which the role makes
# no-COW on btrfs.
podman_storage_root: /var/lib/containers/storage
# The directories under it, besides itself, whose attribute everything Podman
# then creates in them inherits: its volumes and its overlay layers, the
# containers' writable layers among them.
podman_nocow_subdirs: [volumes, overlay]
# Its volatile stores under podman_storage_root, which it never syncs to disk:
# its --rm containers and their writable layers. maintenance.yml's
# podman-volatile play moves aside any that no longer parse.
podman_volatile_stores:
  - overlay-containers/volatile-containers.json
  - overlay-layers/volatile-layers.json

# Whether Podman's database here recorded no storage driver, as on a host
# where Podman first ran without a storage.conf: Ubuntu 24.04's Podman, which
# does not depend on containers-storage. Podman checks the record at every
# command and refuses a driver that differs, so where this is true the role
# writes /etc/containers/storage.conf without one. containers-storage's own
# storage.conf names the overlay driver: the aide role installs the package
# beside Podman before 5.2, and Ubuntu 26.04's Podman depends on it.
podman_storage_driver_unnamed: false
