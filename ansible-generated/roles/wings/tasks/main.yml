---
# Install Wings where none exists, by Pterodactyl's documented installation,
# on the distribution's Docker from the docker role, rather than Docker CE. Upgrades are
# playbooks/maintenance.yml. /etc/pterodactyl/config.yml is the panel's: it
# comes from the node's Configuration tab or `wings configure`, by hand, and
# Ansible never writes it.
- name: Check the declared Wings release
  ansible.builtin.assert:
    that:
      - wings_version | length > 0
      - wings_sha256 | length == 64
    fail_msg: Declare wings_version and the sha256 of its wings_linux_{{ wings_arch }} asset.
    quiet: true

- name: Install curl
  ansible.builtin.package:
    name: curl
    state: present

# Wings supports Ubuntu up to 24.04, so the release upgrader never offers a
# newer one.
- name: No release upgrades
  ansible.builtin.lineinfile:
    path: /etc/update-manager/release-upgrades
    regexp: '^Prompt='
    line: Prompt=never

- name: Configuration directory
  ansible.builtin.file:
    path: /etc/pterodactyl
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Find an installed Wings
  ansible.builtin.stat:
    path: /usr/local/bin/wings
  register: wings_binary

- name: Install the declared Wings release
  ansible.builtin.get_url:
    url: "{{ wings_url }}"
    dest: /usr/local/bin/wings
    checksum: sha256:{{ wings_sha256 }}
    owner: root
    group: root
    mode: "0744"
  when: not wings_binary.stat.exists
  notify: Restart Wings

- name: Wings unit
  ansible.builtin.copy:
    src: wings.service
    dest: /etc/systemd/system/wings.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Wings

- name: Wings running
  ansible.builtin.systemd_service:
    name: wings
    enabled: true
    state: started
    daemon_reload: true
  # A check run cannot start a binary a pending install would download.
  when: not (ansible_check_mode and not wings_binary.stat.exists)
