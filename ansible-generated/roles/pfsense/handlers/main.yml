---
# Re-read the zonefiles that changed in pfsense_files. Unbound keeps running,
# and keeps its cache. Handlers run after the sections, so a zone added by the
# dns_resolver section in the same run already exists.
- name: Reload Unbound zones
  ansible.builtin.command: >-
    /usr/local/sbin/unbound-control -c /var/unbound/unbound.conf
    auth_zone_reload {{ item.item.unbound_zone }}
  loop: "{{ pfsense_files_result.results | selectattr('changed') | selectattr('item.unbound_zone', 'defined') }}"
  loop_control:
    label: "{{ item.item.unbound_zone }}"
  changed_when: true

# Restart php-fpm once when a file PHP reads changed in pfsense_files, through
# pfSense's own script, which also regenerates php.ini. The web GUI drops for a
# few seconds.
- name: Restart PHP-FPM
  ansible.builtin.command: /etc/rc.php-fpm_restart
  when: pfsense_files_result.results | selectattr('changed') | selectattr('item.restarts_php_fpm', 'defined') | list | length > 0
  changed_when: true
