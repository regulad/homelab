    destination: any
    destination_port: '80'
    in_queue: guest_up
    out_queue: guest_down
  - name: Allow GUEST HTTPS
    action: pass
    interface: GUEST
    ipprotocol: inet46
    protocol: tcp/udp
    source: NET:GUEST
    destination: any
    destination_port: '443'
    in_queue: guest_up
    out_queue: guest_down
  - name: Allow GUEST NTP
    action: pass
    interface: GUEST
    ipprotocol: inet46
    protocol: udp
    source: NET:GUEST
    destination: any
    destination_port: '123'
    in_queue: guest_up
    out_queue: guest_down
  - name: Allow GUEST IKE
    action: pass
    interface: GUEST
    ipprotocol: inet46
    protocol: udp
    source: NET:GUEST
    destination: any
    destination_port: '500'
    in_queue: guest_up
    out_queue: guest_down
  - name: Allow GUEST IPsec NAT-T
    action: pass
    interface: GUEST
    ipprotocol: inet46
    protocol: udp
    source: NET:GUEST
    destination: any
    destination_port: '4500'
    in_queue: guest_up
    out_queue: guest_down
  - name: Allow LAN2 to LAN2 address
    action: pass
    interface: LAN2
    ipprotocol: inet6
    protocol: any
    source: NET:LAN2
    destination: IP:LAN2
  - name: Allow LAN2 to any
    action: pass
    interface: LAN2
    ipprotocol: inet6
    protocol: any
    source: NET:LAN2
    destination: any
  - name: Allow LAN to any via LAN2
    action: pass
    interface: LAN2
    ipprotocol: inet6
    protocol: any
    source: NET:LAN
    destination: any
  - name: Allow tailnet subnet to LAN2 address
    action: pass
    interface: LAN2
    ipprotocol: inet6
    protocol: any
    source: tailnet_subnet_ipv6
    destination: IP:LAN2
  - name: Allow ping to U5G_GRE address
    action: pass
    interface: U5G_GRE
    ipprotocol: inet46
    protocol: icmp
    source: NET:U5G_GRE
    destination: IP:U5G_GRE
    icmptype: echoreq
  - name: Allow tailnet subnet to LAN2 address
    action: pass
    interface: LAN
    ipprotocol: inet6
    protocol: any
    source: tailnet_subnet_ipv6
    destination: IP:LAN2
