pfsense_log_settings:
  filterdescriptions: 1

# Files outside config.xml, from ../../../files/arawi.regulad.internal/.
pfsense_directories:
  - path: /root/.ssh
    mode: "0700"
pfsense_files:
  # Run by cron every 2 minutes; rewrites the GRE tunnel's IPv6 addresses.
  - path: /usr/local/bin/u5g-gre6-sync.php
    mode: "0700"
    src: usr/local/bin/u5g-gre6-sync.php
  # The watchdogd health check started by afterbootupshellcmd.
  - path: /usr/local/bin/tmpfscheck.sh
    mode: "0755"
    src: usr/local/bin/tmpfscheck.sh
  - path: /usr/local/etc/rc.d/qemu-agent.sh
    mode: "0755"
    src: usr/local/etc/rc.d/qemu-agent.sh
  - path: /etc/rc.conf.local
    mode: "0644"
    src: etc/rc.conf.local
  # The key u5g-gre6-sync.php reads the U5G modem with, and the modem's host key.
  # Templating drops the key's final newline, so it is written back here.
  - path: /root/.ssh/u5g
    mode: "0600"
    content: "{{ arawi_u5g_ssh_private_key | trim }}\n"
  - path: /root/.ssh/u5g.pub
    mode: "0644"
    src: root/.ssh/u5g.pub
  - path: /root/.ssh/known_hosts
    mode: "0644"
    src: root/.ssh/known_hosts

# Parts of config.xml with no pfsensible module, replaced whole from config/.
pfsense_config_sections:
  - name: wireguard
    parent: installedpackages
    select:
      - wireguard
    template: wireguard.xml.j2
    reload: wireguard
  - name: gre
    select:
      - gres
    ignore:
      - gre/tunnel-local-addr6
