---
# ClamAV, from upstream's image as a Quadlet: clamd, which the homelab's hosts
# and OCI's stream files to at clamd.regulad.internal on clamd_port, and
# freshclam, which keeps its signatures current. This configuration replaces the
# one the image carries.

# The largest file clamd scans whole, in MiB, as a stream or otherwise: whole
# files from qb's torrents (qb-clamav, which reads it from here), up to
# libclamav's own limit of INT_MAX - 2 bytes. And how long one scan may take,
# in milliseconds: 10 minutes for such a file and what it unpacks.
clamd_max_file_mib: 2047
clamd_max_scan_time_ms: 600000

host_files_directories:
  - path: /etc/clamav
    mode: "0755"
host_files_list:
  # Options left out keep clamd's defaults. The image starts clamd in the
  # foreground, where it logs to stdout, so it writes no log file.
  - path: /etc/clamav/clamd.conf
    mode: "0644"
    content: |
      User clamav
      # Every address, both families; lxc-clamd.tf admits the homelab, OCI's
      # pubsub subnet and the tailnet.
      TCPSocket {{ clamd_port }}
      # The image's entrypoint reports clamd started once this socket exists,
      # and freshclam asks clamd through it to load new signatures.
      LocalSocket /tmp/clamd.sock
      # clamd spools each stream into /tmp, the image's tmpfs, which
      # lxc-clamd.tf's memory allows for. AlertExceedsMax stays off, so data
      # past a limit passes unscanned: clamonacc would otherwise quarantine
      # every small archive that unpacks past them.
      StreamMaxLength {{ clamd_max_file_mib }}M
      MaxFileSize {{ clamd_max_file_mib }}M
      MaxScanSize 4000M
      MaxScanTime {{ clamd_max_scan_time_ms }}
    restarts: [clamav.service]
  # Options left out keep freshclam's defaults. The image runs it as a daemon in
  # the foreground, as the clamav user, logging to stdout.
  - path: /etc/clamav/freshclam.conf
    mode: "0644"
    content: |
      DatabaseMirror database.clamav.net
      NotifyClamd /etc/clamav/clamd.conf
    restarts: [clamav.service]
  # Signatures clamd ignores, mounted into its database directory, each pinned
  # to the MD5 of its database entry, so that the ignore lapses once Talos
  # changes the signature. Ps1.Trojan.LNKBuilder-10060627-0, from daily.ldb,
  # is overzealous: it matches any archive of Ansible with its Windows
  # collections as a whole, from CreateShortcut and .IconLocation in
  # community.windows's win_shortcut.ps1, MpCmdRun in ansible.windows's
  # win_updates.ps1 and -DownloadFile in its win_get_url.ps1. Homebrew's
  # ansible bottles, which Nexus's ghcr-io repository caches, and the layer of
  # kasmweb/terminal that installs Ubuntu's ansible package are such archives.
  # Mounted writable and owned by the image's clamav user, 100, and group, 101:
  # the image's entrypoint chowns the database directory at each start, and
  # exits when a file there is read-only.
  - path: /etc/clamav/ignored.ign2
    owner: "100"
    group: "101"
    mode: "0644"
    content: |
      Ps1.Trojan.LNKBuilder-10060627-0:2b42ffa81f43a5f2297f312006bbb597
    restarts: [clamav.service]
