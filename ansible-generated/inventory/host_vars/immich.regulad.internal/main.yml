---
# Immich: its release compose stack in /opt/immich, run by podman-compose, with
# uploads on CephFS and the .env (immich_env) from secrets.sops.yml.
host_files_directories:
  - path: /opt/immich
    mode: "0755"
host_files_list:
  - path: /etc/systemd/system/podman-compose@.service
    mode: "0644"
    shared_src: etc/systemd/system/podman-compose@.service
    restarts: [podman-compose@immich.service]
  - path: /opt/immich/docker-compose.yml
    mode: "0644"
    restarts: [podman-compose@immich.service]
  - path: /opt/immich/.env
    mode: "0600"
    content: "{{ immich_env }}\n"
    secret: true
    restarts: [podman-compose@immich.service]
host_files_packages: [podman-compose]
host_files_units: [podman-compose@immich.service, podman-auto-update.timer]

# ClamAV's on-access scanner, over the baseline directories alone.
clamav_onaccess_enabled: true

# Not checked by AIDE: Immich's PostgreSQL data, DB_DATA_LOCATION in its .env;
# and the network Podman makes anew, with a new ID and creation time, each time
# podman-compose brings the stack up, from its compose file, which stays
# watched.
aide_exclude_paths_host: [/opt/immich/postgres, /etc/containers/networks/immich_default.json]
