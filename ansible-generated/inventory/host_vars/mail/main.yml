---
# docker-mailserver's three data directories on its volume, each owned as the
# image sets it: /var/mail by its vmail user (5000), /var/mail-state by root,
# and /var/log/mail by its syslog user (113).
host_files_directories:
  - path: /etc/systemd/system/podman-restart.service.d
    mode: "0755"
  # docker-mailserver's compose project and its configuration.
  - path: /root/mailserver
    mode: "0755"
  - path: /root/mailserver/docker-data
    mode: "0755"
  - path: "{{ mail_dms_dir }}"
    mode: "0755"
  - path: "{{ mail_dms_dir }}/config"
    mode: "0755"
  - path: "{{ mail_dms_dir }}/config/rspamd"
    mode: "0755"
  - path: "{{ mail_dms_dir }}/config/rspamd/dkim"
    owner: "111"
    group: "114"
    mode: "0755"
  - path: "{{ mail_dms_dir }}/config/rspamd/override.d"
    mode: "0755"
  - path: "{{ mail_dms_dir }}/rspamd-dqs"
    mode: "0755"
  - path: /mnt/mailserver/mail
    owner: "5000"
    group: "5000"
    mode: "0755"
  - path: /mnt/mailserver/state
    mode: "0755"
  - path: /mnt/mailserver/log
    owner: "113"
    group: "0"
    mode: "0755"

# The data volume labelled for containers, which docker-mailserver's
# directories are bound into: a rule, which a relabel keeps, rather than
# Podman's :Z, which a relabel undoes.
host_files_selinux_fcontexts:
  - target: /mnt/mailserver(/.*)?
    setype: container_file_t
    path: /mnt/mailserver
# FIXME: permissive, not the oci group's enforcing: docker-mailserver still
# writes to bind mounts under /root, labelled admin_home_t, which containers may
# not write. Revisit at its Quadlet cutover to /mnt/mailserver.
host_files_selinux_state: permissive

# firewalld as the image and later hand edits left it. The default zone admits
# SSH, DHCPv6, HTTP, on which nothing listens today, and webhookd; the image's
# cockpit service is gone from it. Netavark adds the Podman networks to the
# trusted zone itself.
firewalld_zones:
  public:
    services: [ssh, dhcpv6-client, http]
    ports:
      - 8108/tcp  # webhookd

host_files_list:
  # A hand-written policy accepting traffic from the default zone into any zone.
  - path: /etc/firewalld/policies/allow-mail-out.xml
    mode: "0644"
    reloads: [firewalld]
  # Oracle's passthroughs for the instance's own services, shared by the OCI
  # instances.
  - path: /etc/firewalld/direct.xml
    mode: "0644"
    shared_src: oci/direct.xml
    reloads: [firewalld]
  # The package's, with compress uncommented.
  - path: /etc/logrotate.conf
    mode: "0644"
  - path: /etc/letsencrypt/renewal-hooks/deploy/mailserver
    mode: "0755"
  # docker-mailserver's mailboxes, state and logs on their own block volume,
  # tofu/oracle's mail_data, at its consistent device path. _netdev and nofail,
  # as Oracle's guide sets for every attached volume: the mount waits for the
  # network, and a missing volume does not hold up the boot.
  - path: /etc/systemd/system/mnt-mailserver.mount
    mode: "0644"
    content: |
      [Unit]
      Description=/mnt/mailserver: docker-mailserver's data, on its own block volume

      [Mount]
      What=/dev/oracleoci/oraclevdb
      Where=/mnt/mailserver
      Type=xfs
      Options=defaults,_netdev,nofail

      [Install]
      WantedBy=remote-fs.target
  # podman-restart.service starts docker-mailserver at boot, which binds its
  # directories on the volume, so it starts after the mount: without it, the
  # container would fail to find them. A change applies at the next boot, as
  # the unit is not restarted for it.
  # FIXME: in place of the Quadlet's own RequiresMountsFor. Revisit at its
  # cutover.
  - path: /etc/systemd/system/podman-restart.service.d/mounts.conf
    mode: "0644"
    content: |
      [Unit]
      RequiresMountsFor=/mnt/mailserver
  # docker-mailserver's own configuration, each file as it was imported, at the
  # paths its compose project binds. A change applies when the container next
  # starts; nothing restarts it. The files that hold secrets are templates or
  # content, their secrets from secrets.sops.yml.
  - path: /root/mailserver/mailserver.env
    template: true
    secret: true
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/fail2ban-fail2ban.cf"
    mode: "0644"
  # Its own subnet's /64 from the instance's address in OpenTofu's state.
  - path: "{{ mail_dms_dir }}/config/fail2ban-jail.cf"
    template: true
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/postfix-generic.regexp"
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/postfix-main.cf"
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/postfix-relaymap.cf"
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/postfix-reply-filter.regexp"
    mode: "0644"
  # The relays' logins: OCI Email Delivery and Gmail.
  - path: "{{ mail_dms_dir }}/config/postfix-sasl-password.cf"
    content: "{{ mailserver_postfix_sasl_password }}"
    secret: true
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/postfix-tls-policy.cf"
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/postfix-virtual.cf"
    mode: "0644"
  # Rspamd's DKIM keys, owned by its user in the container (111:114).
  - path: "{{ mail_dms_dir }}/config/rspamd/dkim/rsa-2048-mail-regulad.xyz.private.txt"
    content: "{{ mailserver_dkim_private_keys['regulad.xyz'] }}"
    secret: true
    owner: "111"
    group: "114"
    mode: "0600"
  - path: "{{ mail_dms_dir }}/config/rspamd/dkim/rsa-2048-mail-regulad.xyz.public.txt"
    owner: "111"
    group: "114"
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/rspamd/dkim/rsa-2048-mail-regulad.xyz.public.dns.txt"
    owner: "111"
    group: "114"
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/rspamd/dkim/rsa-2048-mail-nefumllc.com.private.txt"
    content: "{{ mailserver_dkim_private_keys['nefumllc.com'] }}"
    secret: true
    owner: "111"
    group: "114"
    mode: "0600"
  - path: "{{ mail_dms_dir }}/config/rspamd/dkim/rsa-2048-mail-nefumllc.com.public.txt"
    owner: "111"
    group: "114"
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/rspamd/dkim/rsa-2048-mail-nefumllc.com.public.dns.txt"
    owner: "111"
    group: "114"
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/rspamd/override.d/arc.conf"
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/rspamd/override.d/dkim_signing.conf"
    owner: "111"
    group: "114"
    mode: "0644"
  - path: "{{ mail_dms_dir }}/config/rspamd/override.d/settings.conf"
    mode: "0644"
  # Run by docker-mailserver at each start: trusts the old HOME.ARPA CA, which
  # the compose project binds from /root/ipa-ca.crt.
  - path: "{{ mail_dms_dir }}/config/user-patches.sh"
    mode: "0755"
  # Spamhaus's DQS lists, its key from secrets.sops.yml.
  - path: "{{ mail_dms_dir }}/rspamd-dqs/rbl.conf"
    template: true
    secret: true
    mode: "0644"
  - path: "{{ mail_dms_dir }}/rspamd-dqs/rbl_group.conf"
    mode: "0644"

# Mounted now and at each boot.
host_files_units: [mnt-mailserver.mount]

# webhookd, which restarts docker-mailserver when its monitor reports it down,
# at upstream's release in place of the unversioned build it replaced.
host_files_archives:
  - url: https://github.com/ncarlier/webhookd/releases/download/v1.22.1/webhookd-linux-arm64.tgz
    checksum: sha256:06c0632d0ca3c88740d0b9027e4d3d91c7093d9977dac328e111392354c0c780
    dest: /usr/local/bin
    files: [webhookd]
    owner: root
    group: root
    mode: "0755"
    restarts: [webhookd]

# docker-mailserver's certificate, which certbot renews by Cloudflare DNS-01
# with the token from secrets.sops.yml, the hook above restarting Postfix and
# Dovecot after each renewal.
certbot_certificates:
  - name: mail.regulad.xyz
    domains: [mail.regulad.xyz]
certbot_cloudflare_api_token: "{{ cloudflare_api_token }}"

# docker-mailserver's configuration, bind-mounted into its container; its data
# is on /mnt/mailserver.
mail_dms_dir: /root/mailserver/docker-data/dms

# ClamAV's on-access scanner, over the baseline directories alone, and its
# weekly scan, both but for docker-mailserver's directory: its own ClamAV scans
# each message as Postfix accepts it, and its state holds that ClamAV's
# signatures. Neither reaches /mnt/mailserver, another filesystem, unlisted.
clamav_onaccess_enabled: true
clamav_exclude_paths: ["{{ mail_dms_dir }}"]

# The Unified Monitoring Agent's sockets (oci group): bound over themselves
# noexec, and so not checked by AIDE.
noexec_paths_host: ["{{ oci_monitoring_agent_sockets }}"]

# Not checked by AIDE: the noexec paths. docker-mailserver's configuration
# stays watched; its data on /mnt/mailserver, another filesystem, AIDE does not
# walk.
aide_exclude_paths_host: "{{ noexec_paths_host }}"
