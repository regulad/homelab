---
host_files_directories:
  # docker-mailserver's configuration, which its Quadlet binds. Only root may
  # enter it: mailserver.env and other files in it hold secrets, and the
  # container binds what it reads directly, past this directory.
  - path: "{{ mailserver_dir }}"
    mode: "0700"
  - path: "{{ mailserver_dir }}/config"
    mode: "0755"
  - path: "{{ mailserver_dir }}/config/rspamd"
    mode: "0755"
  # Rspamd's, as docker-mailserver's setup leaves it: its _rspamd user in the
  # container, 112:114 from 16 (111 was its user in 15, and is redis's now).
  - path: "{{ mailserver_dir }}/config/rspamd/dkim"
    owner: "112"
    group: "114"
    mode: "0755"
  - path: "{{ mailserver_dir }}/config/rspamd/override.d"
    mode: "0755"
  - path: "{{ mailserver_dir }}/rspamd-dqs"
    mode: "0755"
  # docker-mailserver's three data directories on its volume, each owned as the
  # image sets it: /var/mail by its vmail user (5000), /var/mail-state by root,
  # and /var/log/mail by its syslog user (113).
  - path: /mnt/mailserver/mail
    owner: "5000"
    group: "5000"
    mode: "0755"
  - path: /mnt/mailserver/state
    mode: "0755"
  - path: /mnt/mailserver/log
    owner: "113"
    group: "0"
    mode: "0755"

# The data volume and the configuration labelled for containers, which
# docker-mailserver's directories are bound into: a rule, which a relabel keeps,
# rather than Podman's :Z, which a relabel undoes.
host_files_selinux_fcontexts:
  - target: /mnt/mailserver(/.*)?
    setype: container_file_t
    path: /mnt/mailserver
  - target: "{{ mailserver_dir }}(/.*)?"
    setype: container_file_t
    path: "{{ mailserver_dir }}"
# docker-mailserver reads its certificate from /etc/letsencrypt (cert_t), and
# the FreeIPA CA from ca_trust's anchors.
host_files_selinux_booleans:
  container_read_certs: true

# firewalld as the image and later hand edits left it. The default zone admits
# SSH, DHCPv6, HTTP, on which nothing listens today, and webhookd; the image's
# cockpit service is gone from it. Netavark adds the Podman networks to the
# trusted zone itself.
firewalld_zones:
  public:
    services: [ssh, dhcpv6-client, http]
    ports:
      - 8108/tcp  # webhookd

host_files_list:
  # A hand-written policy accepting traffic from the default zone into any zone.
  - path: /etc/firewalld/policies/allow-mail-out.xml
    mode: "0644"
    reloads: [firewalld]
  # Oracle's passthroughs for the instance's own services, shared by the OCI
  # instances.
  - path: /etc/firewalld/direct.xml
    mode: "0644"
    shared_src: oci/direct.xml
    reloads: [firewalld]
  # The package's, with compress uncommented.
  - path: /etc/logrotate.conf
    mode: "0644"
  - path: /etc/letsencrypt/renewal-hooks/deploy/mailserver
    mode: "0755"
  # docker-mailserver's mailboxes, state and logs on their own block volume,
  # tofu/oracle's mail_data, at its consistent device path. _netdev and nofail,
  # as Oracle's guide sets for every attached volume: the mount waits for the
  # network, and a missing volume does not hold up the boot.
  - path: /etc/systemd/system/mnt-mailserver.mount
    mode: "0644"
    content: |
      [Unit]
      Description=/mnt/mailserver: docker-mailserver's data, on its own block volume

      [Mount]
      What=/dev/oracleoci/oraclevdb
      Where=/mnt/mailserver
      Type=xfs
      Options=defaults,_netdev,nofail

      [Install]
      WantedBy=remote-fs.target
  # docker-mailserver's own configuration, each file as it was imported. The
  # files that hold secrets are templates or content, their secrets from
  # secrets.sops.yml. docker-mailserver applies its configuration and runs
  # user-patches.sh only when its container is created: start-mailserver.sh
  # skips its setup when the same container restarts (its /CONTAINER_START
  # marker), so podman restart applies none of a change. A start of
  # mailserver.service creates the container anew, as the Quadlet runs it with
  # --rm and --replace, so each file restarts the service.
  - path: "{{ mailserver_dir }}/mailserver.env"
    template: true
    secret: true
    mode: "0644"
    restarts: [mailserver]
  # Dovecot's settings over docker-mailserver's: the Sieve extensions users'
  # scripts and its own global scripts may require.
  - path: "{{ mailserver_dir }}/config/dovecot.cf"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/fail2ban-fail2ban.cf"
    mode: "0644"
    restarts: [mailserver]
  # The alias map, which maps each address to its owner's mailbox.
  - path: "{{ mailserver_dir }}/config/ldap-aliases.cf"
    template: true
    mode: "0644"
    restarts: [mailserver]
  # Its own subnet's /64 from the instance's address in OpenTofu's state.
  - path: "{{ mailserver_dir }}/config/fail2ban-jail.cf"
    template: true
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/postfix-generic.regexp"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/postfix-main.cf"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/postfix-relaymap.cf"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/postfix-reply-filter.regexp"
    mode: "0644"
    restarts: [mailserver]
  # The relays' logins: OCI Email Delivery and Gmail.
  - path: "{{ mailserver_dir }}/config/postfix-sasl-password.cf"
    content: "{{ mailserver_postfix_sasl_password }}"
    secret: true
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/postfix-tls-policy.cf"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/postfix-virtual.cf"
    mode: "0644"
    restarts: [mailserver]
  # Rspamd's DKIM keys, owned by its user in the container (112:114).
  - path: "{{ mailserver_dir }}/config/rspamd/dkim/rsa-2048-mail-regulad.xyz.private.txt"
    content: "{{ mailserver_dkim_private_keys['regulad.xyz'] }}"
    secret: true
    owner: "112"
    group: "114"
    mode: "0600"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/dkim/rsa-2048-mail-regulad.xyz.public.txt"
    owner: "112"
    group: "114"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/dkim/rsa-2048-mail-regulad.xyz.public.dns.txt"
    owner: "112"
    group: "114"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/dkim/rsa-2048-mail-nefumllc.com.private.txt"
    content: "{{ mailserver_dkim_private_keys['nefumllc.com'] }}"
    secret: true
    owner: "112"
    group: "114"
    mode: "0600"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/dkim/rsa-2048-mail-nefumllc.com.public.txt"
    owner: "112"
    group: "114"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/dkim/rsa-2048-mail-nefumllc.com.public.dns.txt"
    owner: "112"
    group: "114"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/dkim/rsa-2048-mail-regulad.net.private.txt"
    content: "{{ mailserver_dkim_private_keys['regulad.net'] }}"
    secret: true
    owner: "112"
    group: "114"
    mode: "0600"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/dkim/rsa-2048-mail-regulad.net.public.txt"
    owner: "112"
    group: "114"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/dkim/rsa-2048-mail-regulad.net.public.dns.txt"
    owner: "112"
    group: "114"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/override.d/arc.conf"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/override.d/dkim_signing.conf"
    owner: "112"
    group: "114"
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/config/rspamd/override.d/settings.conf"
    mode: "0644"
    restarts: [mailserver]
  # Run by docker-mailserver as it sets up a new container: completes the
  # host's trust store, which the Quadlet binds over the image's.
  - path: "{{ mailserver_dir }}/config/user-patches.sh"
    mode: "0755"
    restarts: [mailserver]
  # Spamhaus's DQS lists, its key from secrets.sops.yml.
  - path: "{{ mailserver_dir }}/rspamd-dqs/rbl.conf"
    template: true
    secret: true
    mode: "0644"
    restarts: [mailserver]
  - path: "{{ mailserver_dir }}/rspamd-dqs/rbl_group.conf"
    mode: "0644"
    restarts: [mailserver]
  # webhookd's hook, which its sudo rule lets it run as root.
  - path: /usr/local/sbin/restart-mailserver.sh
    mode: "0755"

# Mounted now and at each boot.
host_files_units: [mnt-mailserver.mount]

# webhookd, which restarts docker-mailserver when its monitor reports it down,
# at upstream's release in place of the unversioned build it replaced.
host_files_archives:
  - url: https://github.com/ncarlier/webhookd/releases/download/v1.22.1/webhookd-linux-arm64.tgz
    checksum: sha256:06c0632d0ca3c88740d0b9027e4d3d91c7093d9977dac328e111392354c0c780
    dest: /usr/local/bin
    files: [webhookd]
    owner: root
    group: root
    mode: "0755"
    restarts: [webhookd]

# docker-mailserver's certificate, which certbot renews by Cloudflare DNS-01
# with the token from secrets.sops.yml, the hook above restarting Postfix and
# Dovecot after each renewal.
certbot_certificates:
  - name: mail.regulad.xyz
    domains: [mail.regulad.xyz]
    # The key DANE's TLSA record for mail.regulad.xyz pins, in tofu/cloudflare;
    # changing it means publishing the new key's record first.
    reuse_key: true
certbot_cloudflare_api_token: "{{ cloudflare_api_token }}"

# docker-mailserver's configuration, bound into its container; its data is on
# /mnt/mailserver.
mailserver_dir: /etc/mailserver
# The suffix of wako's directory, where docker-mailserver looks up and
# authenticates its users, binding as svc-mail.
mailserver_ldap_suffix: "{{ freeipa_server.domain | split('.') | map('regex_replace', '^', 'dc=') | join(',') }}"
# The domain of the address each user logs in with, <uid>@ it, and which LMTP
# delivers each of their addresses to: Dovecot keeps the mailbox under it.
mailserver_mailbox_domain: regulad.xyz

# ClamAV's on-access scanner, over the baseline directories alone. Neither it
# nor the weekly scan reaches /mnt/mailserver, another filesystem, unlisted:
# docker-mailserver's own ClamAV scans each message as Postfix accepts it.
clamav_onaccess_enabled: true

# The Unified Monitoring Agent's sockets (oci group): bound over themselves
# noexec, and so not checked by AIDE.
noexec_paths_host: ["{{ oci_monitoring_agent_sockets }}"]

# Not checked by AIDE: the noexec paths. docker-mailserver's configuration
# stays watched; its data on /mnt/mailserver, another filesystem, AIDE does not
# walk.
aide_exclude_paths_host: "{{ noexec_paths_host }}"
