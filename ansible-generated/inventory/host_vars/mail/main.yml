---
# docker-mailserver's three data directories on its volume, each owned as the
# image sets it: /var/mail by its vmail user (5000), /var/mail-state by root,
# and /var/log/mail by its syslog user (113).
host_files_directories:
  - path: /mnt/mailserver/mail
    owner: "5000"
    group: "5000"
    mode: "0755"
  - path: /mnt/mailserver/state
    mode: "0755"
  - path: /mnt/mailserver/log
    owner: "113"
    group: "0"
    mode: "0755"

# firewalld as the image and later hand edits left it. The default zone admits
# SSH, DHCPv6, HTTP, on which nothing listens today, and webhookd; the image's
# cockpit service is gone from it. Netavark adds the Podman networks to the
# trusted zone itself.
firewalld_zones:
  public:
    services: [ssh, dhcpv6-client, http]
    ports:
      - 8108/tcp  # webhookd

host_files_list:
  # A hand-written policy accepting traffic from the default zone into any zone.
  - path: /etc/firewalld/policies/allow-mail-out.xml
    mode: "0644"
    reloads: [firewalld]
  # Oracle's passthroughs for the instance's own services, shared by the OCI
  # instances.
  - path: /etc/firewalld/direct.xml
    mode: "0644"
    shared_src: oci/direct.xml
    reloads: [firewalld]
  # The package's, with compress uncommented.
  - path: /etc/logrotate.conf
    mode: "0644"
  - path: /etc/letsencrypt/renewal-hooks/deploy/mailserver
    mode: "0755"
  # docker-mailserver's mailboxes, state and logs on their own block volume,
  # tofu/oracle's mail_data, at its consistent device path. _netdev and nofail,
  # as Oracle's guide sets for every attached volume: the mount waits for the
  # network, and a missing volume does not hold up the boot.
  - path: /etc/systemd/system/mnt-mailserver.mount
    mode: "0644"
    content: |
      [Unit]
      Description=/mnt/mailserver: docker-mailserver's data, on its own block volume

      [Mount]
      What=/dev/oracleoci/oraclevdb
      Where=/mnt/mailserver
      Type=xfs
      Options=defaults,_netdev,nofail

      [Install]
      WantedBy=remote-fs.target

# Mounted now and at each boot.
host_files_units: [mnt-mailserver.mount]

# webhookd, which restarts docker-mailserver when its monitor reports it down,
# at upstream's release in place of the unversioned build it replaced.
host_files_archives:
  - url: https://github.com/ncarlier/webhookd/releases/download/v1.22.1/webhookd-linux-arm64.tgz
    checksum: sha256:06c0632d0ca3c88740d0b9027e4d3d91c7093d9977dac328e111392354c0c780
    dest: /usr/local/bin
    files: [webhookd]
    owner: root
    group: root
    mode: "0755"
    restarts: [webhookd]

# docker-mailserver's certificate, which certbot renews by Cloudflare DNS-01
# with the token from secrets.sops.yml, the hook above restarting Postfix and
# Dovecot after each renewal.
certbot_certificates:
  - name: mail.regulad.xyz
    domains: [mail.regulad.xyz]
certbot_cloudflare_api_token: "{{ cloudflare_api_token }}"

# docker-mailserver's configuration and data, bind-mounted into its container.
mail_dms_dir: /root/mailserver/docker-data/dms

# ClamAV's on-access scanner, over the baseline directories alone, and its
# weekly scan, both but for docker-mailserver's data: its own ClamAV scans each
# message as Postfix accepts it, and its state holds that ClamAV's signatures.
clamav_onaccess_enabled: true
clamav_exclude_paths: ["{{ mail_dms_dir }}"]

# The Unified Monitoring Agent's sockets (oci group): bound over themselves
# noexec, and so not checked by AIDE.
noexec_paths_host: ["{{ oci_monitoring_agent_sockets }}"]

# Not checked by AIDE: docker-mailserver's mailboxes, its services' state and
# its logs, and the noexec paths. Its configuration stays watched.
aide_exclude_paths_host: >-
  {{ (['mail-data', 'mail-state', 'mail-logs'] | map('regex_replace', '^', mail_dms_dir ~ '/') | list)
     + noexec_paths_host }}
