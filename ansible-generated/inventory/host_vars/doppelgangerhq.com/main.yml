---
# A special case: its network configuration, hostname and /etc/hosts included,
# is Oracle's, as written at install, and is left as it is.

# The Android container's kernel settings, moved out of /etc/sysctl.conf.
# Android's own init, sharing the kernel, also writes kernel.pid_max. zram is
# the host's only swap, so it may swap as readily as it drops cache.
kernel_params_sysctl_files:
  99-android:
    vm.swappiness: 100
    fs.file-max: 2097152
    kernel.pid_max: 4194304

# The CPUs, split in two: the first two take the web app's stack, Caddy, the
# host's own services and logins, and every hard IRQ that can move; the
# devices' containers take the rest, however many tofu/oracle's shape gives.
# Counted from /proc/cpuinfo (processor_vcpus), not from the CPUs the gathering
# process may run on (processor_nproc), which this split narrows to the first
# two.
doppelganger_web_cpus: "0-1"
doppelganger_device_cpus: "2-{{ ansible_processor_vcpus - 1 }}"

# Hard IRQs on the web's CPUs from boot, as on prodingus, until irqbalance
# starts, which keeps them there: virtio_net sets its queues' affinity itself,
# over irqaffinity's default. Two kinds stay where the kernel puts them: each
# CPU's own timer, and the disks' virtio-scsi request queues, one per CPU,
# whose affinity the kernel manages.
kernel_params_grub_dropins:
  99-cpu-isolation:
    - irqaffinity={{ doppelganger_web_cpus }}

# A legacy host: no admin login beside its image's own, ubuntu.
ansible_user: ubuntu
base_admin_user: ""
# ubuntu sudoes through the agent; the image's opc logs in only to be told to
# use ubuntu, and has no sudo.
pam_rssh_users: ["{{ ansible_user }}"]

# No ubuntu_release: it stays on Ubuntu 24.04 until it is retired at 24.04's
# end of standard support, and is never release-upgraded.

# The web app's settings: web.env, one KEY=value line for each, in this order.
# Its secrets are doppelganger_web_secrets, in SOPS; the Supabase project's
# values, the Google client ID and the Stripe, Sentry and OneSignal API key
# values come from their OpenTofu roots' outputs.
doppelganger_web_env:
  # Supabase: the project's URL and its anon key, which ship to the browser,
  # and its service role key, from tofu/supabase's output.
  NEXT_PUBLIC_SUPABASE_URL: "{{ doppelganger_supabase.url }}"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "{{ doppelganger_supabase.anon_key }}"
  SUPABASE_SERVICE_ROLE_KEY: "{{ doppelganger_supabase.service_role_key }}"
  SUPABASE_JWT_SECRET: "{{ doppelganger_web_secrets.SUPABASE_JWT_SECRET }}"
  # Google: sign-in with Google's doppelganger client, whose ID the browser
  # gets. The image's build also has it, from the app's .env.local.public.
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: "{{ doppelganger_google_client_ids.doppelganger }}"
  # Postgres, for Prisma.
  DATABASE_URL: "{{ doppelganger_web_secrets.DATABASE_URL }}"
  DIRECT_URL: "{{ doppelganger_web_secrets.DIRECT_URL }}"
  # Where the Android images extract onto the disk.
  ANDROID_RUNTIME_BASEDIR: /opt/doppelganger
  DOCKER_HOST: unix:///var/run/docker.sock
  EXTERNAL_NETWORK_NAME: doppelganger
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  # OneSignal: the Doppelganger app, and its API key doppelgangerhq.com, usable
  # only from this host's IPv4 and IPv6 addresses, from tofu/onesignal's output.
  ONESIGNAL_APP_ID: 5ac065a9-c76c-4c31-8159-85a260832ee6
  ONESIGNAL_API_KEY: "{{ doppelganger_onesignal_api_key }}"
  # Stripe: the account regulad.xyz's live publishable key and the live webhook
  # endpoint's signing secret, from tofu/stripe's live workspace, and the app's
  # restricted key, made in the Dashboard: Customers and Checkout Sessions to
  # Write, Subscriptions and Prices to Read, usable only from this host's public
  # IPv4 address, from tofu/oracle's public_addresses output: Stripe's API is
  # IPv4-only, and so is a key's allowlist. Were the address to change, the
  # key's allowed IPs would need the new one, by hand.
  NEXT_PUBLIC_STRIPE_PUBLISHABLE: "{{ doppelganger_stripe_outputs.publishable_key.value }}"
  STRIPE_SECRET: "{{ doppelganger_web_secrets.STRIPE_SECRET }}"
  STRIPE_WEBHOOK_SECRET: "{{ doppelganger_stripe_outputs.doppelganger_webhook_secret.value }}"
  # The live customer portal configuration the app opens the portal with.
  STRIPE_PORTAL_CONFIGURATION: "{{ doppelganger_stripe_outputs.doppelganger_portal_configuration.value }}"
  # The doppelganger project's DSN, from tofu/sentry's output.
  NEXT_PUBLIC_SENTRY_DSN: "{{ sentry_dsns.doppelganger }}"
# tofu/stripe's outputs in its live workspace, each as {sensitive, type, value},
# read on the operator's machine, which needs tofu/stripe/prepare.sh sourced.
doppelganger_stripe_outputs: >-
  {{ lookup('cloud.terraform.tf_output',
            project_path=inventory_dir ~ '/../../tofu/stripe', workspace='live',
            binary_path=lookup('ansible.builtin.pipe', 'command -v tofu')) }}
# tofu/supabase's doppelganger output: the project's URL, anon key and service
# role key, read on the operator's machine, which needs tofu/supabase/prepare.sh
# sourced.
doppelganger_supabase: >-
  {{ lookup('cloud.terraform.tf_output', 'doppelganger',
            project_path=inventory_dir ~ '/../../tofu/supabase',
            binary_path=lookup('ansible.builtin.pipe', 'command -v tofu')) }}
# The OAuth client IDs of Google's project pure-toolbox-429813-a4, by slug,
# from tofu/gcp's oauth_client_ids output, read on the operator's machine,
# which needs tofu/gcp/prepare.sh sourced.
doppelganger_google_client_ids: >-
  {{ lookup('cloud.terraform.tf_output', 'oauth_client_ids',
            project_path=inventory_dir ~ '/../../tofu/gcp',
            binary_path=lookup('ansible.builtin.pipe', 'command -v tofu'))['pure-toolbox-429813-a4'] }}
# The app's OneSignal API key, tofu/onesignal's doppelganger_api_key output,
# read on the operator's machine, which needs tofu/onesignal/prepare.sh sourced.
doppelganger_onesignal_api_key: >-
  {{ lookup('cloud.terraform.tf_output', 'doppelganger_api_key',
            project_path=inventory_dir ~ '/../../tofu/onesignal',
            binary_path=lookup('ansible.builtin.pipe', 'command -v tofu')) }}

# The cron container's settings: cron.env, rendered as web.env is. It calls
# the web app's cron endpoint every minute, on the stack's network.
doppelganger_cron_env:
  CRON_SCHEDULE: "* * * * *"
  ENDPOINT: http://doppelganger:3000/api/cron

# webhookd's own user (webhookd.service below).
host_files_users: [webhookd]

# binder_linux, the one kernel module the Redroid devices need, which Ubuntu's
# generic kernels ship in linux-modules-extra. linux-image-generic depends on
# its kernel's, so each generic kernel it brings has binder. A new kernel leaves
# /var/run/reboot-required, which unattended-upgrades' next run, through
# Automatic-Reboot, reboots for. rsync copies the devices' data between
# volumes, keeping hard links, ACLs and extended attributes. Docker's Compose
# and buildx plugins come from Ubuntu's archive, as Docker itself does through
# the docker role, and as Caddy, which serves the website, does. irqbalance
# keeps every hard IRQ that can move off the devices' CPUs.
host_files_packages:
  - linux-image-generic
  - rsync
  - docker-compose-v2
  - docker-buildx
  - caddy
  - irqbalance

# root's Docker logins (registry_auth role), each this host's own: Docker Hub,
# for redis, and ghcr.io, for the app's and cron's images, as regulad with the
# tokens issued for this host (tofu/dockerhub's secrets.sops.yaml and
# tofu/github-user's personal.sops.yaml); and cr.regulad.xyz, Nexus's cr repository, for the
# devices' images, as svc-doppelganger, which nexus_servers'
# nexus_security_users declares.
registry_auth_logins:
  - registry: docker.io
    username: regulad
    password: >-
      {{ lookup('community.sops.sops', inventory_dir ~ '/../../tofu/dockerhub/secrets.sops.yaml',
                extract='["dockerhub_pats"]["terraform-doppelgangerhq--dockerhub"]') }}
  - registry: ghcr.io
    username: regulad
    password: >-
      {{ lookup('community.sops.sops', inventory_dir ~ '/../../tofu/github-user/personal.sops.yaml',
                extract='["pat"]["terraform-doppelgangerhq--ghcr"]') }}
  - registry: cr.regulad.xyz
    username: svc-doppelganger
    password: "{{ hostvars[groups['nexus_servers'] | first].nexus_svc_doppelganger_password }}"

# Every container starts in the devices' slice unless it names one of its own,
# as the app's stack does: the devices are compose projects the app writes.
docker_daemon_settings:
  cgroup-parent: doppelganger-devices.slice

# The app's stack, from host_files_list's compose file. Its external network,
# doppelganger (bridge, 172.18.0.0/16 and fd7b:250b:b33c::/64), which the
# devices' projects join too, was created by hand in 2025 and stays Docker's
# state: the host is never rebuilt.
docker_compose_projects:
  - name: doppelganger
    files: [/etc/doppelganger/compose.yml]

host_files_directories:
  - path: /etc/systemd/system/docker.service.d
    mode: "0755"
  - path: /etc/systemd/system/system.slice.d
    mode: "0755"
  - path: /etc/systemd/system/user.slice.d
    mode: "0755"
  - path: /etc/systemd/network/10-netplan-enp0s6.link.d
    mode: "0755"
  - path: /etc/systemd/system/irqbalance.service.d
    mode: "0755"
  - path: /etc/doppelganger
    mode: "0755"
  - path: /etc/webhookd
    mode: "0755"
  - path: /etc/webhookd/scripts
    mode: "0755"

host_files_list:
  # The devices' data on its own block volume, tofu/oracle's web_data, at its
  # consistent device path. _netdev and nofail, as Oracle's guide sets for every
  # attached volume: the mount waits for the network, and a missing volume does
  # not hold up the boot. Docker, which requires the mount, then stays down
  # rather than starting the devices over the empty mount point. A change
  # applies at the next mount, as Docker is not restarted for it.
  - path: /etc/systemd/system/opt-doppelganger.mount
    mode: "0644"
    content: |
      [Unit]
      Description=/opt/doppelganger: the devices' data, on its own block volume

      [Mount]
      What=/dev/oracleoci/oraclevdb
      Where=/opt/doppelganger
      Type=ext4
      Options=defaults,_netdev,nofail

      [Install]
      WantedBy=remote-fs.target
  # The web container binds /opt/doppelganger and starts the devices, which
  # bind their data from it, so Docker starts after the mount and stops before
  # it is unmounted.
  - path: /etc/systemd/system/docker.service.d/mounts.conf
    mode: "0644"
    content: |
      [Unit]
      RequiresMountsFor=/opt/doppelganger
  # The CPU split, by slice: Docker starts every container in
  # doppelganger-devices.slice but the app's stack, whose compose file names
  # doppelganger-web.slice; system.slice and user.slice, the host's own
  # services and logins, share the web's CPUs.
  - path: /etc/systemd/system/doppelganger-web.slice
    mode: "0644"
    content: |
      [Unit]
      Description=The web app's stack, on the web's CPUs

      [Slice]
      AllowedCPUs={{ doppelganger_web_cpus }}
  - path: /etc/systemd/system/doppelganger-devices.slice
    mode: "0644"
    content: |
      [Unit]
      Description=The devices' containers, on the CPUs the web leaves

      [Slice]
      AllowedCPUs={{ doppelganger_device_cpus }}
  - path: /etc/systemd/system/system.slice.d/cpus.conf
    mode: "0644"
    content: |
      [Slice]
      AllowedCPUs={{ doppelganger_web_cpus }}
  - path: /etc/systemd/system/user.slice.d/cpus.conf
    mode: "0644"
    content: |
      [Slice]
      AllowedCPUs={{ doppelganger_web_cpus }}
  # One queue pair on the NIC, plenty for the website. A drop-in for the link
  # file netplan writes from Oracle's configuration, which udev applies as the
  # NIC appears, at boot. Setting it, virtio_net spreads the online CPUs over
  # its active pairs and sets each pair's affinity to its share, all four for
  # one pair, over irqaffinity's default; irqbalance moves them back.
  - path: /etc/systemd/network/10-netplan-enp0s6.link.d/channels.conf
    mode: "0644"
    content: |
      [Link]
      CombinedChannels=1
  # irqbalance never assigns an interrupt to the devices' CPUs, and rebalances
  # every ten seconds, so an affinity a driver sets is moved back.
  - path: /etc/systemd/system/irqbalance.service.d/banned.conf
    mode: "0644"
    content: |
      [Service]
      Environment=IRQBALANCE_BANNED_CPULIST={{ doppelganger_device_cpus }}
    restarts: [irqbalance.service]
  # The dangling images each newer pull leaves, removed daily at a time drawn
  # afresh for each run in the hour after 04:00, when root's crontab ran it. A
  # fixed offset as well would need systemd 258's RandomizedOffsetSec=; Ubuntu
  # 24.04 has 255. Only while Docker runs: the timer never starts Docker, and
  # with it the devices.
  - path: /etc/systemd/system/docker-image-prune.service
    mode: "0644"
    content: |
      [Unit]
      Description=Remove dangling Docker images
      Requisite=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker image prune --force
  - path: /etc/systemd/system/docker-image-prune.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Daily trigger for docker-image-prune.service

      [Timer]
      OnCalendar=*-*-* 04:00:00
      RandomizedDelaySec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target
    restarts: [docker-image-prune.timer]
  # The app's stack, which the docker role's compose entry point brings up, with
  # its environment rendered from doppelganger_web_env and doppelganger_cron_env.
  # The compose file is checked with the env files in place, so they come first.
  - path: /etc/doppelganger/web.env
    mode: "0600"
    content: "{% for name, value in doppelganger_web_env.items() %}{{ name }}={{ value }}\n{% endfor %}"
    secret: true
  - path: /etc/doppelganger/cron.env
    mode: "0600"
    content: "{% for name, value in doppelganger_cron_env.items() %}{{ name }}={{ value }}\n{% endfor %}"
  - path: /etc/doppelganger/compose.yml
    mode: "0644"
    validate: /usr/bin/docker compose --file %s config --quiet
  # The stack's newer images, pulled daily at a time drawn afresh for each run in
  # the hour after 03:00, ahead of the prune, and the services they change
  # recreated, as podman-auto-update does on the Podman hosts. The devices,
  # compose projects of their own, are left alone. Only while Docker runs.
  - path: /etc/systemd/system/doppelganger-update.service
    mode: "0644"
    content: |
      [Unit]
      Description=Pull the app stack's newer images and recreate the services they change
      Requisite=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker compose --file /etc/doppelganger/compose.yml pull --quiet
      ExecStart=/usr/bin/docker compose --file /etc/doppelganger/compose.yml up --detach --remove-orphans --wait
  - path: /etc/systemd/system/doppelganger-update.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Daily trigger for doppelganger-update.service

      [Timer]
      OnCalendar=*-*-* 03:00:00
      RandomizedDelaySec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target
    restarts: [doppelganger-update.timer]
  # webhookd, from upstream's release archive, on loopback alone; Tailscale
  # Serve publishes it on the tailnet with HTTPS (tailscale_serve below). Its
  # one hook, auto-update, which doppelganger's pipeline calls after each web
  # image it publishes, starts doppelganger-update at once, as its daily timer
  # would, through a sudo rule for that command alone.
  - path: /etc/systemd/system/webhookd.service
    mode: "0644"
    content: |
      [Unit]
      Description=webhookd, doppelganger's pipeline's hooks
      After=network.target

      [Service]
      User=webhookd
      # Loopback alone, behind Tailscale Serve on the same port.
      Environment=WHD_LISTEN_ADDR={{ doppelganger_webhookd_listen }}
      Environment=WHD_HOOK_SCRIPTS=/etc/webhookd/scripts
      # Each request blocks until its hook ends, which maps the hook's exit
      # status to the response's (0 to 200, 1 to 99 to 500).
      Environment=WHD_HOOK_DEFAULT_MODE=buffered
      # Requests and each hook's output, in the journal.
      Environment=WHD_LOG_MODULES=http,hook
      ExecStart=/usr/local/bin/webhookd
      # Hook logs, in webhookd's default, the temporary directory.
      PrivateTmp=true
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    restarts: [webhookd.service]
  # webhookd passes a request's query parameters and headers to the hook as
  # environment variables, so the hook names each command by its path.
  - path: /etc/webhookd/scripts/auto-update.sh
    mode: "0755"
    content: |
      #!/bin/sh
      # Starts doppelganger-update without waiting for it, whatever was sent.
      exec /usr/bin/sudo -n /usr/bin/systemctl start --no-block doppelganger-update.service
  - path: /etc/sudoers.d/webhookd
    mode: "0440"
    content: |
      webhookd ALL=(root) NOPASSWD: /usr/bin/systemctl start --no-block doppelganger-update.service
    validate: visudo -cf %s
  # binder_linux at boot, before Docker starts the devices. Ubuntu builds
  # binderfs with no default devices (CONFIG_ANDROID_BINDER_DEVICES=""), so
  # devices= names the ones each binderfs mount, one per Redroid container,
  # starts with. An option changes only when the module next loads, at a boot.
  - path: /etc/modules-load.d/binder.conf
    mode: "0644"
    content: |
      binder_linux
    restarts: [systemd-modules-load.service]
  - path: /etc/modprobe.d/binder.conf
    mode: "0644"
    content: |
      options binder_linux devices=binder,hwbinder,vndbinder
  # The Android containers' init writes an empty /proc/sys/kernel/modprobe ("so
  # disable it by setting modprobe to the empty string"), and the setting is the
  # whole kernel's, so no module loads on demand and nftables cannot load the
  # expressions firewalld's rules use. systemd-modules-load loads them at boot
  # without it. A zone that masquerades, logs or rate-limits needs nft_masq,
  # nft_log or nft_limit here too.
  - path: /etc/modules-load.d/firewalld.conf
    mode: "0644"
    content: |
      nft_ct
      nft_fib_inet
      nft_reject_inet
      nft_chain_nat
    restarts: [systemd-modules-load.service]
  # Oracle's rules for the instance's own services, at 169.254.0.0/16 and its
  # IPv6 counterpart fd00:c1::a9fe:0/112 (a9fe is 169.254): only root reaches
  # the iSCSI endpoints and 169.254.0.3, and other TCP and UDP to them is
  # refused. They replace the image's iptables-persistent save, which
  # firewalld's unit keeps from loading.
  - path: /etc/firewalld/direct.xml
    mode: "0644"
    shared_src: oci/direct.xml
    reloads: [firewalld]
  # Caddy's configuration, laid out as ingress's: the Caddyfile's global options,
  # importing each site's file from config.d. Caddy gets and renews the site's
  # certificate itself.
  - path: /etc/caddy/Caddyfile
    mode: "0644"
    # Run as root, Caddy makes ~/.step for its CA's trust store; HOME points it
    # to a scratch directory instead of /root, which AIDE watches.
    validate: env HOME=/run/caddy-validate /usr/bin/caddy validate --adapter caddyfile --config %s
    reloads: [caddy.service]
# Each site's Caddyfile, checked whole with Caddy's own validation before Caddy
# reloads.
host_files_trees:
  - path: /etc/caddy/config.d
    mode: "0644"
    check: env HOME=/run/caddy-validate /usr/bin/caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
    reloads: [caddy.service]

# webhookd's binary, the arm64 build for the A1 shape.
host_files_archives:
  - url: https://github.com/ncarlier/webhookd/releases/download/v1.22.1/webhookd-linux-arm64.tgz
    checksum: sha256:06c0632d0ca3c88740d0b9027e4d3d91c7093d9977dac328e111392354c0c780
    dest: /usr/local/bin
    files: [webhookd]
    mode: "0755"
    restarts: [webhookd.service]

# Mounted now and at each boot, the prune and the stack's updates scheduled,
# and Caddy, irqbalance and webhookd running.
host_files_units: [opt-doppelganger.mount, docker-image-prune.timer, doppelganger-update.timer, caddy.service, irqbalance.service, webhookd.service]

# webhookd's port, on loopback and, through Serve, on the tailnet, which the
# tailnet's policy opens to tag:ci-client-doppelganger alone.
doppelganger_webhookd_port: 8108
doppelganger_webhookd_listen: 127.0.0.1:{{ doppelganger_webhookd_port }}

# On the tailnet as tag:ci-server-doppelganger, which doppelganger's pipeline
# (tag:ci-client-doppelganger) may reach on webhookd's port alone. The
# tailnet's policy, in regulad/tailscale-acls, gives the tag no grant of its
# own, so the host reaches only what every node gets. tailscale0 is in
# firewalld's trusted zone, the firewalld role's default.
tailscale_enabled: true
tailscale_join: true
tailscale_tags: [ci-server-doppelganger]
tailscale_settings:
  # The host's own name, doppelgangerhq.com, is not one DNS label; on the
  # tailnet its dot is a dash, as in OCI's hostname_label.
  hostname: doppelgangerhq-com
  # Off: the host is outside the homelab, and keeps Oracle's resolver, from
  # DHCP, rather than the tailnet's pihole and pihole2.
  accept_dns: false
  # Off: nothing on the host needs the homelab's or the VCN's subnets.
  accept_routes: false
# webhookd, as HTTPS with the node's Tailscale certificate.
tailscale_serve:
  - port: "{{ doppelganger_webhookd_port }}"
    target: http://{{ doppelganger_webhookd_listen }}

# The website, which Caddy serves natively, outside Docker.
firewalld_zones:
  public:
    services: [http, https]

# ClamAV's on-access scanner, over the baseline directories alone, through a
# clamd of its own: the host is outside the homelab, so its files stay on it.
clamav_onaccess_enabled: true
clamav_clamd_local: true
# The devices' data, their compose files and their Android images, in the
# weekly scan alone.
clamav_scan_paths_host:
  - /opt/doppelganger

# Not checked by AIDE: what Caddy rewrites as it runs, as on ingress (its
# certificates at each renewal, its locks, and its storage cleaner's last run),
# and the copy of its configuration it saves at each load, which Caddy 2.6 has
# no persist_config to turn off.
aide_exclude_paths_host: >-
  {{ ['certificates', 'locks', 'last_clean.json'] | map('regex_replace', '^', '/var/lib/caddy/.local/share/caddy/') | list
     + ['/var/lib/caddy/.config/caddy/autosave.json'] }}
