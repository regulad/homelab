---
# The Android container's kernel settings, moved out of /etc/sysctl.conf.
# Android's own init, sharing the kernel, also writes kernel.pid_max. zram is
# the host's only swap, so it may swap as readily as it drops cache.
kernel_params_sysctl_files:
  99-android:
    vm.swappiness: 100
    fs.file-max: 2097152
    kernel.pid_max: 4194304

# A legacy host: no admin login beside its image's own.
base_admin_user: ""

# No ubuntu_release: it stays on Ubuntu 24.04 until it is retired at 24.04's
# end of standard support, and is never release-upgraded.

# binder_linux, the one kernel module the Redroid devices need, which Ubuntu's
# generic kernels ship in linux-modules-extra. linux-image-generic depends on
# its kernel's, so each generic kernel it brings has binder. A new kernel leaves
# /var/run/reboot-required, which unattended-upgrades' next run, through
# Automatic-Reboot, reboots for.
host_files_packages:
  - linux-image-generic

host_files_list:
  # binder_linux at boot, before Docker starts the devices. Ubuntu builds
  # binderfs with no default devices (CONFIG_ANDROID_BINDER_DEVICES=""), so
  # devices= names the ones each binderfs mount, one per Redroid container,
  # starts with. An option changes only when the module next loads, at a boot.
  - path: /etc/modules-load.d/binder.conf
    mode: "0644"
    content: |
      binder_linux
    restarts: [systemd-modules-load.service]
  - path: /etc/modprobe.d/binder.conf
    mode: "0644"
    content: |
      options binder_linux devices=binder,hwbinder,vndbinder
  # The Android containers' init writes an empty /proc/sys/kernel/modprobe ("so
  # disable it by setting modprobe to the empty string"), and the setting is the
  # whole kernel's, so no module loads on demand and nftables cannot load the
  # expressions firewalld's rules use. systemd-modules-load loads them at boot
  # without it. A zone that masquerades, logs or rate-limits needs nft_masq,
  # nft_log or nft_limit here too.
  - path: /etc/modules-load.d/firewalld.conf
    mode: "0644"
    content: |
      nft_ct
      nft_fib_inet
      nft_reject_inet
      nft_chain_nat
    restarts: [systemd-modules-load.service]

# The website, which nginx serves natively, outside Docker.
firewalld_zones:
  public:
    services: [http, https]

# ClamAV's on-access scanner, over the baseline directories alone, through a
# clamd of its own: the host is outside the homelab, so its files stay on it.
clamav_onaccess_enabled: true
clamav_clamd_local: true
# The devices' data, their compose files and their Android images, in the
# weekly scan alone.
clamav_scan_paths_host:
  - /opt/doppelganger

# Not checked by AIDE: certbot's renewal configuration, which its twice-daily
# check rewrites with the ACME server's next renewal-information time
# (ari_retry_after). The renewal settings in it, and any hook added to it, go
# unwatched with it; the hook directories and the certificates stay watched.
aide_exclude_paths_host: [/etc/letsencrypt/renewal/doppelgangerhq.com.conf]
