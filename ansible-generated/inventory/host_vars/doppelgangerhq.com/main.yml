---
# The Android container's kernel settings, moved out of /etc/sysctl.conf.
# Android's own init, sharing the kernel, also writes kernel.pid_max. zram is
# the host's only swap, so it may swap as readily as it drops cache.
kernel_params_sysctl_files:
  99-android:
    vm.swappiness: 100
    fs.file-max: 2097152
    kernel.pid_max: 4194304

# A legacy host: no admin login beside its image's own.
base_admin_user: ""

# No ubuntu_release: it stays on Ubuntu 24.04 until it is retired at 24.04's
# end of standard support, and is never release-upgraded.

# binder_linux, the one kernel module the Redroid devices need, which Ubuntu's
# generic kernels ship in linux-modules-extra. linux-image-generic depends on
# its kernel's, so each generic kernel it brings has binder. A new kernel leaves
# /var/run/reboot-required, which unattended-upgrades' next run, through
# Automatic-Reboot, reboots for. rsync copies the devices' data between
# volumes, keeping hard links, ACLs and extended attributes. Docker, with its
# Compose and buildx plugins, comes from Ubuntu's archive, not Docker's own.
host_files_packages:
  - linux-image-generic
  - rsync
  - docker.io
  - docker-compose-v2
  - docker-buildx

host_files_directories:
  - path: /etc/systemd/system/docker.service.d
    mode: "0755"

host_files_list:
  # The devices' data on its own block volume, tofu/oracle's web_data, at its
  # consistent device path. _netdev and nofail, as Oracle's guide sets for every
  # attached volume: the mount waits for the network, and a missing volume does
  # not hold up the boot. Docker, which requires the mount, then stays down
  # rather than starting the devices over the empty mount point. A change
  # applies at the next mount, as Docker is not restarted for it.
  - path: /etc/systemd/system/opt-doppelganger.mount
    mode: "0644"
    content: |
      [Unit]
      Description=/opt/doppelganger: the devices' data, on its own block volume

      [Mount]
      What=/dev/oracleoci/oraclevdb
      Where=/opt/doppelganger
      Type=ext4
      Options=defaults,_netdev,nofail

      [Install]
      WantedBy=remote-fs.target
  # The web container binds /opt/doppelganger and starts the devices, which
  # bind their data from it, so Docker starts after the mount and stops before
  # it is unmounted.
  - path: /etc/systemd/system/docker.service.d/mounts.conf
    mode: "0644"
    content: |
      [Unit]
      RequiresMountsFor=/opt/doppelganger
  # The dangling images each newer pull leaves, removed daily at a time drawn
  # afresh for each run in the hour after 04:00, when root's crontab ran it. A
  # fixed offset as well would need systemd 258's RandomizedOffsetSec=; Ubuntu
  # 24.04 has 255. Only while Docker runs: the timer never starts Docker, and
  # with it the devices.
  - path: /etc/systemd/system/docker-image-prune.service
    mode: "0644"
    content: |
      [Unit]
      Description=Remove dangling Docker images
      Requisite=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker image prune --force
  - path: /etc/systemd/system/docker-image-prune.timer
    mode: "0644"
    content: |
      [Unit]
      Description=Daily trigger for docker-image-prune.service

      [Timer]
      OnCalendar=*-*-* 04:00:00
      RandomizedDelaySec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target
    restarts: [docker-image-prune.timer]
  # binder_linux at boot, before Docker starts the devices. Ubuntu builds
  # binderfs with no default devices (CONFIG_ANDROID_BINDER_DEVICES=""), so
  # devices= names the ones each binderfs mount, one per Redroid container,
  # starts with. An option changes only when the module next loads, at a boot.
  - path: /etc/modules-load.d/binder.conf
    mode: "0644"
    content: |
      binder_linux
    restarts: [systemd-modules-load.service]
  - path: /etc/modprobe.d/binder.conf
    mode: "0644"
    content: |
      options binder_linux devices=binder,hwbinder,vndbinder
  # The Android containers' init writes an empty /proc/sys/kernel/modprobe ("so
  # disable it by setting modprobe to the empty string"), and the setting is the
  # whole kernel's, so no module loads on demand and nftables cannot load the
  # expressions firewalld's rules use. systemd-modules-load loads them at boot
  # without it. A zone that masquerades, logs or rate-limits needs nft_masq,
  # nft_log or nft_limit here too.
  - path: /etc/modules-load.d/firewalld.conf
    mode: "0644"
    content: |
      nft_ct
      nft_fib_inet
      nft_reject_inet
      nft_chain_nat
    restarts: [systemd-modules-load.service]
  # Oracle's rules for the instance's own services, at 169.254.0.0/16 and its
  # IPv6 counterpart fd00:c1::a9fe:0/112 (a9fe is 169.254): only root reaches
  # the iSCSI endpoints and 169.254.0.3, and other TCP and UDP to them is
  # refused. They replace the image's iptables-persistent save, which
  # firewalld's unit keeps from loading.
  - path: /etc/firewalld/direct.xml
    mode: "0644"
    shared_src: oci/direct.xml
    reloads: [firewalld]

# Mounted now and at each boot, and the prune scheduled.
host_files_units: [opt-doppelganger.mount, docker-image-prune.timer]

# The website, which nginx serves natively, outside Docker.
firewalld_zones:
  public:
    services: [http, https]

# ClamAV's on-access scanner, over the baseline directories alone, through a
# clamd of its own: the host is outside the homelab, so its files stay on it.
clamav_onaccess_enabled: true
clamav_clamd_local: true
# The devices' data, their compose files and their Android images, in the
# weekly scan alone.
clamav_scan_paths_host:
  - /opt/doppelganger

# The Unified Monitoring Agent's sockets (oci group): bound over themselves
# noexec, and so not checked by AIDE.
noexec_paths_host: ["{{ oci_monitoring_agent_sockets }}"]

# Not checked by AIDE: certbot's renewal configuration, which its twice-daily
# check rewrites with the ACME server's next renewal-information time
# (ari_retry_after), and the noexec paths. The renewal settings in it, and any
# hook added to it, go unwatched with it; the hook directories and the
# certificates stay watched.
aide_exclude_paths_host: "{{ ['/etc/letsencrypt/renewal/doppelgangerhq.com.conf'] + noexec_paths_host }}"
