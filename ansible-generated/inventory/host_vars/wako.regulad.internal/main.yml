---
# The deployment's domain, declared once with the server in group_vars.
freeipa_server_domain: "{{ freeipa_server.domain }}"

# The Admins sudo rule asks its members to authenticate: on riko through the
# pam_rssh role, and elsewhere, as on wako, with their FreeIPA password.
freeipa_server_sudorule_options_absent:
  Admins: ["!authenticate"]

# FreeIPA for regulad.internal. Proxmox writes 127.0.1.1 for the hostname into
# a DHCP container's /etc/hosts, which FreeIPA's installer rejects, so
# .pve-ignore.hosts keeps Proxmox out and /etc/hosts names the address arawi's
# static mapping fixes.
host_files_directories:
  - path: /etc/systemd/system/ipa.service.d
    mode: "0755"
host_files_list:
  - path: /etc/.pve-ignore.hosts
    content: ""
    mode: "0644"
  - path: /etc/hosts
    template: true
    mode: "0644"
  # getaddrinfo ignores that address until an interface carries IPv4
  # (AI_ADDRCONFIG). Without it, httpd names itself by its link-local address
  # and finds no passphrase for its key, and ipactl stops every service. When
  # the whole cluster boots, arawi's lease can come minutes late, after
  # network-online.target, so ipa.service waits for the address itself. It
  # applies at ipa.service's next start, not restarting FreeIPA.
  - path: /etc/systemd/system/ipa.service.d/wait-for-address.conf
    mode: "0644"
    content: |
      # FreeIPA finds this host by its /etc/hosts address; wait for DHCP to assign it.
      [Service]
      ExecStartPre=/bin/sh -c 'until ip -4 -o address show to {{ freeipa_server.ipv4 }} | grep -q .; do sleep 2; done'

# RADIUS for softether, checking each password by binding to this directory as
# the user, as svc-freeradius finds them. svc-freeradius's password and
# softether's secret are in secrets.sops.yml.
freeradius_clients:
  # From anywhere on the LAN's ULA /64, as the old server allowed it anywhere on
  # the LAN. Its RadiusServerName is this server's ULA: SoftEther tries a name's
  # IPv4 address first.
  softether:
    address: fd83:b84c:aa57:1::/64
    secret: "{{ freeradius_softether_secret }}"
freeradius_ldap_uri: ldaps://{{ inventory_hostname }}
freeradius_ldap_base_dn: "{{ freeipa_server_domain | split('.') | map('regex_replace', '^', 'dc=') | join(',') }}"
freeradius_ldap_identity: uid=svc-freeradius,cn=users,cn=accounts,{{ freeradius_ldap_base_dn }}
freeradius_ldap_ca_file: /etc/ipa/ca.crt

# FreeIPA's declared accounts (freeipa_users role), merged with
# freeipa_users_private in secrets.sops.yml, which holds what the public
# repository must not show. Each email list is the account's whole list.
# tofu/oracle/bin/email-senders builds Email Delivery's approved senders from
# both lists.
freeipa_users_public:
  # Doppelganger's Supabase project, whose Auth signs in to mail's SMTP to
  # send as noreply@doppelgangerhq.com. Postfix lets a login send as an
  # address only when the account's addresses include the login,
  # <uid>@regulad.xyz, so it holds that too. Its password is tofu/supabase's
  # smtp_password; it expires at 2038-01-19 03:14:07 UTC, FreeIPA's latest.
  - name: svc-doppelganger-supabase
    first: Doppelganger Supabase
    last: Service
    email:
      - noreply@doppelgangerhq.com
      - svc-doppelganger-supabase@regulad.xyz
    password: >-
      {{ lookup('community.sops.sops', inventory_dir ~ '/../../tofu/supabase/secrets.sops.yaml',
                extract='["smtp_password"]') }}
    passwordexpiration: "20380119031407Z"
  # regubot, Parker's GitHub machine account (tofu/github-user): its mailbox,
  # which receives GitHub's mail to the account and is read by logging in to
  # mail as regubot@regulad.xyz. It only receives: holding no address at
  # regulad.xyz, it may send as none. Its password, generated, is in
  # freeipa_users_private; it expires at 2038-01-19 03:14:07 UTC, FreeIPA's
  # latest.
  - name: regubot
    first: regubot
    last: Bot
    email:
      - bot@regulad.net
    passwordexpiration: "20380119031407Z"
  # Parker's public addresses, pw@nefumllc.com first, which LDAP clients take
  # as the account's address.
  - name: regulad
    email:
      - pw@nefumllc.com
      - regulad@regulad.xyz
      - pw@regulad.net
      - contact@doppelgangerhq.com
# ipauser signs in as svc-ansible, with its password from group_vars.
freeipa_users_admin_password: "{{ mail_relay_freeipa_password }}"
