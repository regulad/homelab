---
quadlet_services:
  - name: rsshub
    description: RSSHub
    after: [network-online.target]
    wants: [network-online.target]
    # Upstream publishes only latest, chromium-bundled, dated and per-commit
    # builds.
    image: docker.io/diygod/rsshub:latest
    container_name: rsshub
    auto_update: registry
    # Listens on 1200 on every address, IPv6 included; caches in memory, its
    # default. None of the routes it serves needs a browser.
    network: host
    # npm, which the image starts RSSHub through, writes its own logs here.
    tmpfs: [/root/.npm]
    environment:
      NODE_ENV: production
      # Its log files would repeat what the journal already has from stdout.
      NO_LOGFILES: "true"
    # ACCESS_KEY, below.
    env_file: true
    restart: always
    wanted_by: [multi-user.target, default.target]

# The access key, from secrets.sops.yml. RSSHub then serves a route, /healthz
# included, only to a query carrying key=<the key> or code=<the MD5 of the
# route's path followed by the key>.
quadlet_env_files:
  rsshub: "ACCESS_KEY={{ rsshub_access_key }}"
