---
# A special case: a self-contained VM image from Kasm, which carries its own
# installation and configuration. Ansible applies the shared baseline only and
# leaves the rest, its hostname, /etc/hosts and swap included, to the image.
swap_enabled: false

# vkasm's login user. The operator's SSH configuration sets it only for the
# short name, and Ansible connects by the DNS name.
ansible_user: kasm_admin

# Kasm's installation, as the image laid it out. An upgrade installs to a new
# directory named for its version.
kasm_dir: /opt/kasm/1.19.0

# Not checked by AIDE: what Kasm writes in its installation as it runs, its
# logs, health checks and scratch files, and the configurations of its agent
# and gateways, which it writes anew every 30 to 100 seconds with what they
# held, too often for AIDE to hash them between finding and reading them; and
# Open vSwitch's database, which ovsdb-server rewrites as it compacts it.
aide_exclude_paths_host: >-
  {{ ['log', 'healthcheck', 'tmp',
      'conf/app/agent/agent.app.config.yaml', 'conf/app/guac/kasmguac.app.config.yaml',
      'conf/app/rdp_gateway/passthrough.app.config.yaml',
      'conf/app/rdp_https_gateway/rdp_https_gateway.app.config.yaml']
     | map('regex_replace', '^', kasm_dir ~ '/') | list
     + ['/var/lib/openvswitch'] }}

# mDNS by systemd-resolved on ens18 (resolved role), which firewalld admits
# beside its default zone's services.
resolved_networks: [10-netplan-ens18.network]
firewalld_zones:
  public:
    services: [mdns]
