---
# The old FreeIPA server's stand-in while its consumers move to wako: LDAP and
# LDAPS rewritten between the old suffix and wako's, with the old server's own
# certificate, so clients that verify its name and CA see no change. The
# certificate's key is in secrets.sops.yml.
ldap_proxy_suffix: dc=home,dc=arpa
ldap_proxy_uri: ldaps://{{ freeipa_server.fqdn }}
ldap_proxy_remote_suffix: "{{ freeipa_server.domain | split('.') | map('regex_replace', '^', 'dc=') | join(',') }}"
ldap_proxy_certificate: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/../files/' ~ inventory_hostname ~ '/etc/ldap/tls/proxy.crt') }}"
ldap_proxy_key: "{{ ldap_proxy_tls_key }}"
ldap_proxy_remote_ca: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/../../ansible-common/roles/ca_trust/files/trusted/freeipa-regulad.internal.crt') }}"
ldap_proxy_schema_host: "{{ freeipa_server.fqdn }}"
ldap_proxy_schema_uri: ldapi://%2Frun%2Fslapd-{{ freeipa_server.domain | upper | replace('.', '-') }}.socket

# Its DHCP requests carry no hostname, so arawi registers no name for it, and
# the VM's client identifier, so it keeps the VM's address.
host_files_directories:
  - {path: /etc/systemd/network/eth0.network.d, mode: "0755"}
host_files_list:
  - path: /etc/systemd/network/eth0.network.d/50-dhcp.conf
    mode: "0644"
    restarts: [systemd-networkd]
