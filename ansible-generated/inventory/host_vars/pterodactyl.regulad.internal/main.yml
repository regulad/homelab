---
php_fpm_version: "8.3"
# PHP2Shell (CVE-2026-109618, CVE-2026-109619) stopgaps, each closing a known
# attack path: session upload progress off and no memory limit. USN-8948-1
# fixes noble's php8.3 in 8.3.6-0ubuntu0.24.04.13, after which the role removes
# them; the pool's admin settings keep a .user.ini from undoing them meanwhile.
php_fpm_stopgap_until: 8.3.6-0ubuntu0.24.04.13
php_fpm_stopgap_conf_d:
  - 99-php2shell.ini
php_fpm_stopgap_pool_admin_flags:
  - pool: www
    name: session.upload_progress.enabled
    value: "off"
php_fpm_stopgap_pool_admin_values:
  - pool: www
    name: memory_limit
    value: "-1"

# The Pterodactyl panel: nginx serving it through PHP-FPM, MariaDB and Redis on
# loopback, the queue worker, and the scheduler from root's crontab. The panel
# code in /var/www/pterodactyl and its database are data, upgraded by hand.
host_files_list:
  - path: /etc/nginx/sites-available/pterodactyl.conf
    mode: "0644"
    reloads: [nginx.service]
  - path: /etc/systemd/system/pteroq.service
    mode: "0644"
    restarts: [pteroq.service]
  - path: /var/spool/cron/crontabs/root
    group: crontab
    mode: "0600"
  # The panel's secrets; readable by www-data, which runs PHP-FPM and pteroq.
  - path: /var/www/pterodactyl/.env
    group: www-data
    mode: "0640"
    content: "{{ pterodactyl_env }}"
    secret: true
    restarts: [pteroq.service]
host_files_links:
  - path: /etc/nginx/sites-enabled/pterodactyl.conf
    target: /etc/nginx/sites-available/pterodactyl.conf
    reloads: [nginx.service]
host_files_packages:
  - nginx
  - mariadb-server
  - redis-server
  - composer
  - php8.3-bcmath
  - php8.3-cli
  - php8.3-curl
  - php8.3-fpm
  - php8.3-gd
  - php8.3-intl
  - php8.3-mbstring
  - php8.3-mysql
  - php8.3-opcache
  - php8.3-xml
  - php8.3-zip
host_files_units: [nginx.service, php8.3-fpm.service, mariadb.service, redis-server.service, pteroq.service]
