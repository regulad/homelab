---
# Caddy, built with its plugins by xcaddy each week by caddy-build.timer, and
# cydia-sync, which mirrors and signs the iOS repository Caddy serves on
# ios.regulad.xyz.
host_files_directories:
  - path: /etc/caddy
    mode: "0755"
  - path: /etc/caddy/coraza
    mode: "0755"
  - path: /etc/systemd/system/caddy.service.d
    mode: "0755"
  - path: /opt/cydia
    mode: "0755"
  - path: /etc/cydia
    mode: "0400"
  - path: /srv/cydia
    mode: "0755"
host_files_list:
  # xcaddy's apt repository.
  - path: /usr/share/keyrings/caddy-xcaddy-archive-keyring.gpg
    mode: "0644"
  - path: /etc/apt/sources.list.d/caddy-xcaddy.list
    mode: "0644"
  - path: /etc/caddy/cloudflare.env
    mode: "0600"
    # The SOPS value loses its final newline on the way in.
    content: "{{ caddy_cloudflare_env }}\n"
    secret: true
    restarts: [caddy.service]
  # svc-ingress's password, which archive.regulad.xyz's forward_auth passes to
  # ldap-auth through a {file.*} placeholder, read per request: it never enters
  # Caddy's configuration, and a change needs no restart. No final newline.
  - path: /etc/caddy/ldap-bind-password
    mode: "0600"
    content: "{{ ingress_ldap_bind_password }}"
    secret: true
  # Coraza rules the php2shell snippet includes; before the Caddyfile, whose
  # validation reads them.
  - path: /etc/caddy/coraza/php2shell.conf
    mode: "0644"
    reloads: [caddy.service]
  - path: /etc/caddy/Caddyfile
    mode: "0644"
    # Caddy's own check, with the token its DNS provider needs.
    validate: >-
      sh -c 'set -a; . /etc/caddy/cloudflare.env; exec /usr/local/bin/caddy validate --adapter caddyfile --config "$1"' validate %s
    reloads: [caddy.service]
  - path: /etc/systemd/system/caddy.service
    mode: "0644"
    restarts: [caddy.service]
  - path: /etc/systemd/system/caddy.service.d/override.conf
    mode: "0644"
    restarts: [caddy.service]
  # A change to the build runs it at once.
  - path: /usr/local/sbin/caddy-build
    mode: "0755"
    restarts: [caddy-build.service]
  - path: /etc/systemd/system/caddy-build.service
    mode: "0644"
    restarts: [caddy-build.service]
  - path: /etc/systemd/system/caddy-build.timer
    mode: "0644"
    restarts: [caddy-build.timer]
  - path: /opt/cydia/sync
    mode: "0755"
  - path: /etc/cydia/ios.asc
    mode: "0400"
    content: "{{ cydia_signing_key }}\n"
    secret: true
  - path: /etc/cydia/ios.txt
    mode: "0400"
    content: "{{ cydia_signing_passphrase }}\n"
    secret: true
  - path: /etc/systemd/system/cydia-sync.service
    mode: "0644"
  - path: /etc/systemd/system/cydia-sync.timer
    mode: "0644"
    restarts: [cydia-sync.timer]
  # eth0's IPv6 default routes, the upstream router's first; networkd
  # reconfigures eth0 when it reloads.
  - path: /etc/systemd/network/eth0.network.d/ra.conf
    mode: "0644"
    template: true
    reloads: [systemd-networkd.service]
# xcaddy builds Caddy with Go; cydia-sync signs with gpg and draws the icon
# with ImageMagick.
# Each site's Caddyfile, which the Caddyfile imports, checked whole with
# Caddy's own validation before Caddy reloads.
host_files_trees:
  - path: /etc/caddy/config.d
    mode: "0644"
    check: >-
      sh -c 'set -a; . /etc/caddy/cloudflare.env; exec /usr/local/bin/caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile'
    reloads: [caddy.service]
host_files_packages: [xcaddy, golang-go, gnupg, imagemagick, bzip2, curl]
host_files_units: [caddy.service, caddy-build.timer, cydia-sync.timer]

# Podman first ran here on Ubuntu 24.04 without a storage.conf, so its database
# recorded no storage driver; it still does after the release upgrade.
podman_storage_driver_unnamed: true

# The Ubuntu release maintenance.yml's release-upgrade play upgrades it to.
ubuntu_release: "26.04"

# Not checked by AIDE: the cydia mirror cydia-sync rewrites, and Caddy's
# certificates, with the locks and cleanup record of the certificate manager
# that renews them. Caddy keeps its data in /caddy, as its unit runs it as root
# with no HOME set; its ACME account stays watched.
aide_exclude_paths_host: [/srv/cydia, /caddy/certificates, /caddy/locks, /caddy/last_clean.json]
