---
quadlet_services:
  - name: jenkins
    description: Jenkins
    # After jenkins-agents's user manager, which lingering starts at boot, so
    # that its API socket is there to mount.
    after: [network-online.target, user@1001.service]
    wants: [network-online.target, user@1001.service]
    image: docker.io/jenkins/jenkins:lts-jdk21
    container_name: jenkins
    auto_update: registry
    # The web UI on 8080, on every address, IPv6 included, for Caddy on ingress.
    network: host
    volumes:
      - /mnt/jenkins:/var/jenkins_home
      # The host's trust store, which the ca_trust role maintains, with the Java
      # keystore that ca-certificates-java builds from it.
      - /etc/ssl/certs:/etc/ssl/certs:ro
      # Its configuration as code, and the secrets that configuration names,
      # where Configuration as Code looks for them (host_vars main.yml).
      - /etc/jenkins/casc.d:/etc/jenkins/casc.d:ro
      - /etc/jenkins/secrets:/run/secrets:ro
      # The Podman API of jenkins-agents (host_vars main.yml), for the cloud
      # that starts the agents, its directory rather than its socket so that
      # a socket made anew is seen. A socket's connect is unaffected by :ro.
      - /run/user/1001/podman:/run/podman-agents:ro
    # jenkins-agents's group, which may write to that socket.
    group_add: ["1001"]
    tmpfs:
      - /tmp
    environment:
      CASC_JENKINS_CONFIG: /etc/jenkins/casc.d
      # The image's JDK keeps its own keystore, without the homelab's CAs.
      JAVA_OPTS: -Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts
      # The controller's heap. Inside Podman inside the container, the JVM sees
      # no memory limit and the node's whole RAM.
      JENKINS_JAVA_OPTS: -Xmx1g
    restart: always
    wanted_by: [multi-user.target, default.target]
