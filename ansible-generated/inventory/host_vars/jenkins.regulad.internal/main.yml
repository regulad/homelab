---
# The Jenkins controller, moved here from aboriginal. jenkins_home is the
# container's own mount point, owned by the image's jenkins user (1000).
# /etc/jenkins holds its configuration as code, casc.d, and the secrets that
# configuration names, which the container mounts read-only at /run/secrets,
# where Configuration as Code looks for ${name} as a file name.
host_files_directories:
  - {path: /mnt/jenkins, owner: "1000", group: "1000", mode: "0755"}
  - {path: /etc/jenkins, mode: "0755"}
  - {path: /etc/jenkins/casc.d, mode: "0755"}
  - {path: /etc/jenkins/secrets, owner: "1000", group: "1000", mode: "0500"}

# Jenkins applies its configuration as code at its start, so a change to it or
# to a secret restarts Jenkins. Each secret is a file without a final newline,
# as Configuration as Code reads a file's content as it is.
host_files_list:
  - path: /etc/jenkins/casc.d/jenkins.yaml
    template: true
    mode: "0644"
    restarts: [jenkins.service]
  - path: /etc/jenkins/secrets/ldap_manager_password
    owner: "1000"
    group: "1000"
    mode: "0400"
    content: "{{ jenkins_ldap_manager_password }}"
    secret: true
    restarts: [jenkins.service]
  # The App's key is kept on one line, each newline written as \n, which the
  # file gets back.
  - path: /etc/jenkins/secrets/github_app_private_key
    owner: "1000"
    group: "1000"
    mode: "0400"
    content: >-
      {{ lookup('community.sops.sops', inventory_dir ~ '/host_vars/jenkins.regulad.internal/github-app.sops.env',
                input_type='dotenv', extract='["JENKINS_GITHUB_APP_PRIVATE_KEY"]') | replace('\\n', '\n') }}
    secret: true
    restarts: [jenkins.service]
  - path: /etc/jenkins/secrets/github_webhook_secret
    owner: "1000"
    group: "1000"
    mode: "0400"
    content: >-
      {{ lookup('community.sops.sops', inventory_dir ~ '/host_vars/jenkins.regulad.internal/github-app.sops.env',
                input_type='dotenv', extract='["JENKINS_GITHUB_APP_WEBHOOK_SECRET"]') }}
    secret: true
    restarts: [jenkins.service]
  # svc-pam-rssh-ci's Nexus password, from the file nexus_security sets it from.
  - path: /etc/jenkins/secrets/nexus_svc_pam_rssh_ci_password
    owner: "1000"
    group: "1000"
    mode: "0400"
    content: >-
      {{ lookup('community.sops.sops', inventory_dir ~ '/group_vars/nexus_servers.sops.yml',
                extract='["nexus_svc_pam_rssh_ci_password"]') }}
    secret: true
    restarts: [jenkins.service]
  # The age key that opens regulad/jobs's SOPS files, such as winget.sops.yaml,
  # regubot's signing key.
  - path: /etc/jenkins/secrets/jobs_sops_age_key
    owner: "1000"
    group: "1000"
    mode: "0400"
    content: "{{ jenkins_jobs_sops_age_key | trim }}"
    secret: true
    restarts: [jenkins.service]
  # regubot's token for its fork of winget-pkgs and the pull requests from it,
  # from tofu/github-user's bot.sops.yaml, its only copy.
  - path: /etc/jenkins/secrets/winget_token
    owner: "1000"
    group: "1000"
    mode: "0400"
    content: >-
      {{ lookup('community.sops.sops', inventory_dir ~ '/../../tofu/github-user/bot.sops.yaml',
                extract='["github_pats"]["terraform-jenkins--winget"]') }}
    secret: true
    restarts: [jenkins.service]
  # regulad's token for his notifications alone, with which regulad/jobs's
  # winget jobs subscribe him to the pull requests regubot opens, from
  # tofu/github-user's personal.sops.yaml, its only copy.
  - path: /etc/jenkins/secrets/regulad_notifications_token
    owner: "1000"
    group: "1000"
    mode: "0400"
    content: >-
      {{ lookup('community.sops.sops', inventory_dir ~ '/../../tofu/github-user/personal.sops.yaml',
                extract='["github_pats"]["terraform-jenkins--notifications"]') }}
    secret: true
    restarts: [jenkins.service]

# Jenkins's agents: containers of rootless Podman as jenkins-agents, which
# Jenkins's Podman cloud starts through that user's API socket, mounted into
# the controller with the user's group (services.yml). The agents run as a user
# of their own, not as the controller's 1000, so one escaping its container
# cannot read the controller's secrets. Their user namespaces map onto the rest
# of this container's 65,536 IDs, short of nobody's 65534; their storage is
# runtime data, kept from AIDE. Each agent has its own network namespace from
# pasta, whose AppArmor profile breaks it here.
podman_rootless_users:
  - name: jenkins-agents
    uid: 1001
    subids: {start: 1002, count: 64532}
podman_pasta_apparmor_disabled: true
aide_exclude_paths_host: [/home/jenkins-agents/.local/share/containers]
# The agents' image, docker.io/jenkins/inbound-agent, at its JDK 21 build of
# remoting 3395 published 2026-11-12. The cloud pulls it once, through the LAN's
# mirror of Docker Hub; a new tag here is how it updates.
jenkins_agent_image_tag: 3395.v6e5377b_0fb_3c-5-jdk21

# Java's copy of the system trust store, /etc/ssl/certs/java/cacerts, which the
# Jenkins container reads for its LDAP server's certificate.
ca_trust_java: true

# ClamAV's weekly scan also reads the container's data disk, its RBD mount
# point (tofu/gonkputer's lxc-jenkins.tf).
clamav_scan_paths_host: [/mnt/jenkins]

# Jenkins's GitHub App, regulad-jenkins, and its installation on regulad's
# account, which covers all of its repositories. Neither ID is secret; the
# App's private key and its webhook's secret are in github-app.sops.env, with
# the App's permissions and events.
jenkins_github_app_id: "5826423"
jenkins_github_app_installation_id: "183530243"

# The jenkins role. jenkinsusers is the group the LDAP realm admits, and every
# member administers Jenkins: regulad, and svc-ansible, as which the role signs
# in for the plugin manager, with the FreeIPA password that mail_relay also
# uses (group_vars/all.sops.yml). FreeIPA's API is called on its server, which
# trusts its own CA, as for mail_relay (group_vars/all.yml).
jenkins_api_user: svc-ansible
jenkins_api_password: "{{ mail_relay_freeipa_password }}"
jenkins_freeipa_members: [regulad, svc-ansible]
jenkins_freeipa_host: "{{ freeipa_server.fqdn }}"
jenkins_freeipa_delegate: "{{ freeipa_server.fqdn }}"
jenkins_freeipa_password: "{{ mail_relay_freeipa_password }}"

