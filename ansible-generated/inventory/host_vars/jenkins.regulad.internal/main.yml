---
# The Jenkins controller, moved here from aboriginal. jenkins_home is the
# container's own mount point, owned by the image's jenkins user (1000).
host_files_directories:
  - {path: /mnt/jenkins, owner: "1000", group: "1000", mode: "0755"}

# Java's copy of the system trust store, /etc/ssl/certs/java/cacerts, which the
# Jenkins container reads for its LDAP server's certificate.
ca_trust_java: true

# ClamAV's weekly scan also reads the container's data disk, its RBD mount
# point (tofu/gonkputer's lxc-jenkins.tf).
clamav_scan_paths_host: [/mnt/jenkins]

# Jenkins's GitHub App, regulad-jenkins, and its installation on regulad's
# account, which covers all of its repositories. Neither ID is secret; the
# App's private key and its webhook's secret are in github-app.sops.env, with
# the App's permissions and events.
jenkins_github_app_id: "5826423"
jenkins_github_app_installation_id: "183530243"
