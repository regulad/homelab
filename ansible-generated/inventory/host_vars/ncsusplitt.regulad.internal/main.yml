---
tailscale_enabled: true
tailscale_tags: [edge-ncstate--net]
# NC State's edge router: the tunnel's routes, which the tailnet policy
# auto-approves for this tag, with the tailnet's traffic SNATed to the tunnel's
# address, the only one NC State routes back.
tailscale_settings:
  accept_dns: false
  stateful_filtering: false
  advertise_routes: "{{ ncsu_tun_routes }}"
  snat_subnet_routes: true
# Forwarding for those routes, IPv4 only, like the tunnel. IPv6 forwarding,
# which kernel_params_ip_forwarding would add, stops systemd-networkd accepting
# router advertisements on eth0.
kernel_params_sysctl_files:
  99-router:
    net.ipv4.ip_forward: 1

# The split tunnel to NCSU: openconnect, with vpn-slice routing only these of
# NCSU's networks, and a keepalive query through it. The VPN carries no IPv6.
ncsu_tun_routes: [152.1.0.0/16, 152.7.0.0/16, 152.14.0.0/16]
# The secret of the Duo Mobile device whose TOTP codes are its second password,
# at the path ncsu-tun.service loads it from: state of this host, which
# maintenance.yml --tags ncsu-duo writes and nothing else keeps.
ncsu_duo_totp_file: /var/lib/ncsu-tun/totp

# Unbound for NC State's names, which dns.json5's split DNS covers, and the
# reverse zones of ncsu_tun_routes, from NC State's resolvers through the
# tunnel: vrd2, vrd1 and rdd42.ddi.ncsu.edu.
ncsu_domains: [ncsu.edu, ncstate.net]
ncsu_resolvers: [152.1.14.12, 152.1.14.14, 152.1.14.78]

host_files_directories:
  - path: /etc/openconnect
    mode: "0755"
  - path: "{{ ncsu_duo_totp_file | dirname }}"
    mode: "0700"
  - path: /etc/systemd/system/tpm-udev.path.d
    mode: "0755"
  - path: /etc/systemd/system/tpm-udev.service.d
    mode: "0755"
  - path: /etc/unbound/unbound.conf.d
    mode: "0755"
  - path: /etc/systemd/system/unbound.service.d
    mode: "0755"
host_files_list:
  - path: /etc/openconnect/ncsu.pass
    mode: "0600"
    # The SOPS value loses its final newline on the way in.
    content: "{{ ncsu_vpn_password }}\n"
    secret: true
  # Not restarted on change: each start is an NCSU login, of the 3 the unit
  # allows in 10 minutes. The new unit applies from the tunnel's next start.
  - path: /etc/systemd/system/ncsu-tun.service
    template: true
    mode: "0644"
  - path: /etc/systemd/system/ncsu-keepalive.service
    mode: "0644"
  - path: /etc/systemd/system/ncsu-keepalive.timer
    mode: "0644"
    restarts: [ncsu-keepalive.timer]
  # tpm-udev, a dependency of openconnect's TPM libraries, skipped here.
  - path: /etc/systemd/system/tpm-udev.path.d/no-container.conf
    mode: "0644"
  - path: /etc/systemd/system/tpm-udev.service.d/no-container.conf
    mode: "0644"
  # Unbound's settings beside the package's own, which include these.
  - path: /etc/unbound/unbound.conf.d/access-control.conf
    mode: "0644"
    restarts: [unbound.service]
  - path: /etc/unbound/unbound.conf.d/ncsu.conf
    template: true
    mode: "0644"
    restarts: [unbound.service]
  - path: /etc/unbound/unbound.conf.d/rfc8767.conf
    mode: "0644"
    restarts: [unbound.service]
  - path: /etc/systemd/system/unbound.service.d/tailscale.conf
    mode: "0644"
    restarts: [unbound.service]
host_files_packages: [openconnect, pipx, bind9-dnsutils, unbound]
host_files_pipx: [vpn-slice==0.16.1]
host_files_units: [ncsu-tun.service, ncsu-keepalive.timer, unbound.service]
