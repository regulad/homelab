---
# Forgejo and its Cloudflare tunnel, moved here from the git VM. app.ini is
# rendered with forgejo_secrets from secrets.sops.yml, readable only by the
# rootless image's user (1000).
host_files_directories:
  - path: /etc/forgejo
    mode: "0755"
host_files_list:
  - path: /etc/forgejo/app.ini
    owner: "1000"
    group: "1000"
    mode: "0600"
    template: true
    restarts: [forgejo.service]

quadlet_env_files:
  cloudflared: "TUNNEL_TOKEN={{ cloudflared_tunnel_token }}"

# Forgejo's local administrator, which maintenance.yml's forgejo-upgrade logs
# in as through the API; its password, forgejo_admin_password, is in
# secrets.sops.yml. Created by hand with forgejo admin user create.
forgejo_admin_user: svc-ansible
