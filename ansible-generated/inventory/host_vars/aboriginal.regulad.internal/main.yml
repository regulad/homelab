---
# Its FreeIPA null- account predates the null-<short hostname> convention.
mail_relay_account: null-dingus-server

tailscale_enabled: true
# Never joined, re-authenticated or logged out by Ansible.
tailscale_protected: true
tailscale_tags: [server]
tailscale_settings:
  # Off: the tailnet's split DNS sends NC State's domains to its own
  # resolvers, which this host cannot reach, so every failed lookup waited
  # on them. arawi resolves the tailnet's names in its stead.
  accept_dns: false

# The ubuntu group's settings, but never rebooting itself: VM 100's
# passed-through GPU does not survive the VM restarting on its own.
auto_updates_unattended_upgrade:
  AutoFixInterruptedDpkg: "true"
  MinimalSteps: "true"
  Mail: "{{ auto_updates_mail_to }}"
  MailReport: only-on-error
  Remove-Unused-Kernel-Packages: "true"
  Remove-New-Unused-Dependencies: "true"
  Remove-Unused-Dependencies: "true"
  Automatic-Reboot: "false"
  Sender: "{{ auto_updates_mail_from }}"

# FIXME: running out of memory kills a process instead of panicking, which
# leaves the VM in a non-deterministic state; every other host panics, dumps
# and reboots. It is set only because VM 100 cannot reliably restart on its
# own: its passed-through GPU does not reset. Revisit if the GPU resets.
kdump_sysctls_host:
  vm.panic_on_oom: 0

# Firmware for its passed-through hardware: no task needs it, but devices such
# as the GPU initialize only with it. Then the mounts' FUSE filesystems.
host_files_packages: [linux-firmware, fuse-overlayfs, bindfs, rclone, podman-compose]

# The mounts under /mnt, beside /mnt/ssd and /mnt/cephfs from fstab: the
# restic repository, its nas archive, the two overlays of that archive under
# CephFS, /mnt/media remapped for Nextcloud, and the Ceph RGW through rclone.
# Mount units are not restarted on change: Docker, and so every container,
# restarts with them; a change applies at the next mount.
host_files_directories:
  - path: /etc/systemd/system/docker.service.d
    mode: "0755"
  - path: /etc/systemd/system/smbd.service.d
    mode: "0755"
  - path: /etc/systemd/resolved.conf.d
    mode: "0755"
  - path: /etc/mosquitto
    mode: "0755"
  - path: /etc/ring-mqtt
    mode: "0755"
  - path: /opt/jellyfin
    mode: "0755"
  - path: /etc/systemd/system/podman-compose@jellyfin.service.d
    mode: "0755"
host_files_list:
  - path: /usr/local/bin/restic-mount-helper
    mode: "0755"
  - path: /etc/systemd/system/mnt-restic.service
    mode: "0644"
  - path: /etc/systemd/system/mnt-nas.mount
    mode: "0644"
  - path: /etc/systemd/system/mnt-media.mount
    mode: "0644"
  - path: /etc/systemd/system/mnt-nextcloud.mount
    mode: "0644"
  - path: /etc/systemd/system/mnt-media_nextcloud.mount
    mode: "0644"
  - path: /etc/systemd/system/mnt-rgw.service
    mode: "0644"
    restarts: [mnt-rgw.service]
  # rgw is svc-aboriginal, from the shared rgw_keys, which reads every bucket
  # and writes none. S3 lists a user only the buckets it owns, so rgw-buckets
  # names them: those prodingus's bucket policies grant svc-aboriginal.
  - path: /root/.config/rclone/rclone.conf
    mode: "0600"
    content: |
      [rgw]
      type = s3
      no_check_bucket = false
      provider = Ceph
      endpoint = https://s3.regulad.xyz
      access_key_id = {{ (rgw_keys['svc-aboriginal'] | first).access_key }}
      secret_access_key = {{ (rgw_keys['svc-aboriginal'] | first).secret_key }}

      [rgw-buckets]
      type = combine
      upstreams = {{ rgw_backup_buckets | zip(rgw_backup_buckets | map('regex_replace', '^', 'rgw:')) | map('join', '=') | join(' ') }}
    secret: true
    restarts: [mnt-rgw.service]
  - path: /etc/systemd/system/docker.service.d/override.conf
    mode: "0644"
  - path: /etc/systemd/system/smbd.service.d/override.conf
    mode: "0644"
  # mDNS in systemd-resolved, which lime browses; the netplan drop-in below
  # turns it on for eth0.
  - path: /etc/systemd/resolved.conf.d/mdns.conf
    mode: "0644"
    content: |
      [Resolve]
      MulticastDNS = yes
    restarts: [systemd-resolved.service]
  # mosquitto's configuration, its whole /mosquitto/config (services.yml).
  - path: /etc/mosquitto/mosquitto.conf
    mode: "0644"
    content: |
      # Both families on every address, as Docker published it; logins only.
      listener 1883
      allow_anonymous false
      password_file /mosquitto/config/mosquitto.passwd
    restarts: [mosquitto.service]
  # Home Assistant's and ring-mqtt's logins, owned by the image's mosquitto
  # user as they were in Docker's volume.
  - path: /etc/mosquitto/mosquitto.passwd
    mode: "0600"
    owner: "1883"
    group: "1883"
    content: "{{ mosquitto_passwd }}"
    secret: true
    restarts: [mosquitto.service]
  - path: /etc/ring-mqtt/config.json
    mode: "0600"
    content: "{{ ring_mqtt_config | to_nice_json }}\n"
    secret: true
    restarts: [ring-mqtt.service]
  # Compose stacks, each in /opt/<name> and run by podman-compose@<name>.service.
  - path: /etc/systemd/system/podman-compose@.service
    mode: "0644"
    shared_src: etc/systemd/system/podman-compose@.service
    restarts: [podman-compose@jellyfin.service]
  - path: /opt/jellyfin/docker-compose.yml
    template: true
    mode: "0644"
    restarts: [podman-compose@jellyfin.service]
  # Its containers bind these mounts, so the stack starts after them and
  # restarts with them, as docker.service does.
  - path: /etc/systemd/system/podman-compose@jellyfin.service.d/mounts.conf
    mode: "0644"
    content: |
      [Unit]
      RequiresMountsFor=/mnt/media /mnt/ssd /mnt/cephfs/application/jellyfin_dvr
    restarts: [podman-compose@jellyfin.service]
rgw_backup_buckets: [synapse-media, mastodon-media]

# Jellyfin's major release, which its image tag follows. To move to the next,
# bump it and run maintenance.yml's jellyfin-upgrade, not site.yml: site.yml
# would restart onto it with no copy to return to, and with plugins built for
# the old release.
jellyfin_major: 12
# Its config and data directory, on the SSD.
jellyfin_config_dir: /mnt/ssd/jellyfin/config

# ring-mqtt's config.json, which it reads and never writes; outside Home
# Assistant's add-on it reads no MQTT or Ring settings from its environment.
# mqtt_url holds ring's mosquitto login.
ring_mqtt_config:
  mqtt_url: "{{ ring_mqtt_url }}"
  mqtt_options: ""
  livestream_user: ring_rtsp
  livestream_pass: "{{ ring_mqtt_livestream_pass }}"
  disarm_code: ""
  enable_cameras: true
  enable_modes: false
  enable_panic: false
  hass_topic: homeassistant/status
  ring_topic: ring
  location_ids: "{{ ring_mqtt_location_ids }}"
host_files_units:
  - mnt-media.mount
  - mnt-nextcloud.mount
  - mnt-media_nextcloud.mount
  - podman-compose@jellyfin.service
  - mnt-rgw.service

# mnt-restic.service mounts the repository with /etc/restic-env, so it
# restarts when that or the password changes, and the mounts above it with it.
restic_env_units: [mnt-restic.service]

# IPv4 and IPv6 forwarding, as it had by hand.
kernel_params_ip_forwarding: true

# A hardware install, named after its inventory name.
base_hostname_managed: true

# Both LAN interfaces are trusted, so firewalld filters nothing here: Home
# Assistant and the Matter server take traffic on ports chosen at run time (UPnP
# event callbacks, SSDP replies, Matter subscription reports), which no zone can
# list. The default zone holds only what the package ships. Docker keeps its
# own zone and policy.
firewalld_zones:
  public:
    services: [ssh, dhcpv6-client]
    remove:
      services: [samba]  # Added by hand; both interfaces are trusted now
  trusted:
    interfaces: [eth0, wlan0]

# Netplan is aboriginal's only network configuration; cloud-init's networking
# is disabled. eth0 (networkd) carries the default route on its lower metric;
# wlan0, the passed-through Intel AX200 (NetworkManager), stays up beside it.
# DNS is arawi's, IPv6 first. The Wi-Fi password makes the file secret.
netplan_no_log: true
netplan_config:
  version: 2
  ethernets:
    eth0:
      match:
        macaddress: "{{ eth0_mac_address }}"
      set-name: eth0
      renderer: networkd
      dhcp4: true
      dhcp4-overrides:
        send-hostname: true
        use-domains: true
      dhcp6-overrides:
        use-dns: false
      accept-ra: true
      ra-overrides:
        use-dns: false
      nameservers:
        addresses:
          - "{{ lan_arawi.ipv6 }}"
  wifis:
    wlan0:
      # The AX200's own address: passed through, it is not in OpenTofu.
      match:
        macaddress: 9c:fc:e8:b8:62:5d
      set-name: wlan0
      renderer: NetworkManager
      dhcp4: true
      dhcp4-overrides:
        send-hostname: false
      # IPv6 by router advertisements and DHCPv6 as they direct: netplan gives
      # NetworkManager ipv6.method=auto only for dhcp6, and NetworkManager
      # rejects the manual method it writes otherwise, having no address.
      dhcp6: true
      dhcp6-overrides:
        use-dns: false
      accept-ra: true
      # NetworkManager would take router advertisements' DNS, the upstream
      # router's, without ignore-auto-dns.
      networkmanager:
        passthrough:
          ipv6.ignore-auto-dns: "true"
      nameservers:
        addresses:
          - "{{ lan_arawi.ipv6 }}"
      access-points:
        WahleNet:
          auth:
            key-management: psk
            password: "{{ wifi_psks.WahleNet }}"
netplan_networkd_dropins:
  10-netplan-eth0.network.d/mdns.conf: |
    # This drop-in exists because netplan has no multicast DNS setting.
    [Network]
    MulticastDNS=yes

# Swap: zram at half the RAM, then a swapfile on the root's btrfs, on the SATA
# SSD passed through to this VM.
swap_files:
  - path: /swap/swapfile
    size_mib: 16384
    priority: 10
    discard: true

# Backups: the btrfs subvolumes @ and @ssd, from snapshots, with /boot and
# /boot/efi beside them; and the Ceph RGW's buckets, through mnt-rgw.service's
# rclone mount.
restic_jobs:
  snapshot:
    on_calendar: "*-*-* 05:35"
    paths: [/, /boot, /boot/efi, /mnt/ssd]
  rgw:
    on_calendar: "Sat *-*-* 04:30"
    path: /mnt/rgw
    mount_service: mnt-rgw.service
    tag: rgw
  # The repository's only forget, for every host's snapshots.
  forget:
    on_calendar: "Thu *-*-* 12:30"
    policies:
      # Each host's own backups, untagged: as the guests' weekly vzdump job to
      # CephFS keeps its (tofu/gonkputer/backup.tf's prune_backups).
      - tag: ""
        keep: {weekly: 2}
      # prodingus's CephFS and urbackup image, and the RGW: the latest only.
      - tag: cephfs
        keep: {last: 1}
      - tag: urbackup
        keep: {last: 1}
      - tag: rgw
        keep: {last: 1}
      # nas, prodingus's one-off archive of 2026-05-09, is never forgotten.
restic_retired_scripts:
  - /root/backup.sh
  - /root/forget.sh
  - /root/backup_rgw.sh

# lime unlocks overture's FileVault at its pre-boot SSH unlock, finding it by
# mDNS on eth0. Its unlock account and password are in secrets.sops.yml.
lime_interfaces: [eth0]
lime_macs:
  - name: overture
    unlock_user: "{{ lime_unlock_users.overture }}"
    host_keys:
      # yamllint disable-line rule:line-length
      - ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCLQT50ghsr6xjwQ23l6P3SngzAxFRzkFO9t2WuuahN8tVvK5Uhceln/K4Yw35rf7KyMVu3NYCPKUSofx73+u3M=
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKLO8lBBQnXIv5q1jUvzZuFylziJ8ucltk+vKmySrsMW
      # yamllint disable-line rule:line-length
      - ssh-rsa 
