---
# Its FreeIPA null- account carries pelican, dodo's legacy name.
mail_relay_account: null-pelican

# Reached over SSH as regulad, unlike the Podman containers reached through pct
# as root, so plays written for those, such as Podman's, escalate here.
ansible_become: true

# Firmware for hardware the kernel initializes; no task needs it.
host_files_packages: [linux-firmware]

host_files_list:
  # Restarts Wings, if running, when certbot renews its certificate.
  - path: /etc/letsencrypt/renewal-hooks/deploy/wings
    mode: "0755"

# The certificate Wings serves its API and SFTP with, through the token
# cloudflare-ddns also uses.
certbot_certificates:
  - name: dodo.regulad.xyz
    domains: [dodo.regulad.xyz]
certbot_cloudflare_api_token: "{{ cloudflare_api_token }}"

# IPv6 on Docker's default bridge network.
docker_ula_prefix: fdb9:b6f2:d6e1::/64

# What the Pterodactyl panel's dodo node serves, as the panel defines it: Wings'
# API and SFTP, which run outside Docker, and the node's allocations. Wings runs
# game servers with host networking, so their ports are the host's own, outside
# Docker's firewalld zone, on both protocols.
firewalld_zones:
  public:
    ports:
      - 8080/tcp  # Wings API
      - 2022/tcp  # Wings SFTP
      - 45500-45599/tcp  # The node's allocations
      - 45500-45599/udp

# Wings v1.13.4; the sha256 is its wings_linux_amd64 asset's. Bump both, then
# run playbooks/maintenance.yml --tags wings.
wings_version: 1.13.4
wings_sha256: 7e763389bb5d386a7d32ccdd46cffcf1ab9ed697e5c2aca7fe44183b527cd4c0

# A hardware install, named after its inventory name.
base_hostname_managed: true

# Netplan is dodo's only network configuration; cloud-init is disabled. dodo
# routes through the upstream router, for the port forwards that reach it,
# while taking its addresses and DNS from arawi, IPv6 first. Router
# advertisements' DNS, the upstream router's, is dropped: it cannot resolve
# regulad.internal.
netplan_config:
  version: 2
  ethernets:
    eth0:
      match:
        macaddress: "{{ eth0_mac_address }}"
      set-name: eth0
      renderer: networkd
      dhcp4: true
      dhcp4-overrides:
        use-routes: false
      dhcp6: true
      dhcp6-overrides:
        use-routes: false
      accept-ra: true
      ra-overrides:
        use-dns: false
      nameservers:
        addresses:
          - "{{ lan_arawi.ipv6 }}"
      routes:
        - to: default
          via: "{{ lan_upstream_router.ipv4 }}"
        - to: "::/0"
          via: "{{ lan_upstream_router.ipv6_link_local }}"
          metric: 1024
          on-link: true
        - to: "::/0"
          via: "{{ lan_arawi.ipv6_link_local }}"
          metric: 2048
          on-link: true
netplan_networkd_dropins:
  10-netplan-eth0.network.d/ra.conf: |
    # This drop-in exists because netplan cannot be assertive about ignoring
    # router advertisements' gateways: it has no setting for networkd's
    # UseGateway. The default routes themselves are netplan's.
    [IPv6AcceptRA]
    UseGateway=no

# Swap: zram at half the RAM, then a swapfile on the root's btrfs, on the SATA
# SSD passed through to this VM.
swap_files:
  - path: /swap/swapfile
    size_mib: 16384
    priority: 10
    discard: true

# Backups: the root's btrfs, its top-level subvolume, from a snapshot.
# aboriginal's forget is the only one.
restic_jobs:
  snapshot:
    on_calendar: "*-*-* 05:15"
    paths: [/, /boot/efi]
restic_retired_scripts:
  - /root/backup.sh
