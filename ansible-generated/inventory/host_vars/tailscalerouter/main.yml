---
# Two hosts are named tailscalerouter; this one is the OCI instance in pubsub.
mail_relay_account: null-tailscalerouter-pubsub

tailscale_enabled: true
tailscale_tags: [edge-pubsub--wahlecloud--oraclevcn--com, relay]
# The Oracle VCN's subnet router and peer relay, with SNAT off. Its IPv6 /64 and
# the relay's static endpoints, which include public addresses, are in
# secrets.sops.yml.
tailscale_settings:
  hostname: pubsub-wahlecloud-oraclevcn-com
  advertise_routes: [10.131.80.0/24, "{{ tailscale_vcn_ipv6_route }}"]
  snat_subnet_routes: false
  accept_routes: true
  accept_dns: false
  stateful_filtering: false
  operator: regulad
  auto_update: true
  relay_server_port: 39127
  relay_server_static_endpoints: "{{ tailscale_relay_static_endpoints | split(',') }}"

# Forwarding for the subnet routes, and TCP Fast Open off, as set by hand while
# debugging dnsmasq.
kernel_params_ip_forwarding: true
kernel_params_sysctl_files:
  90-no-tfo:
    net.ipv4.tcp_fastopen: 0

# The resolver's and the peer relay's ports, and forwarding from the VCN to the
# homelab's and the tailnet's ranges: the allow-peering-fwd policy, a host file
# below.
firewalld_zones:
  public:
    services: [ssh, dhcpv6-client, dns]
    ports: [39127/udp]
    forward: true

host_files_packages: [dnsmasq]
host_files_list:
  # The VCN's resolver, which the subnet's DHCP options give every instance:
  # dnsmasq on the instance's addresses, its GUA from OpenTofu state.
  - path: /etc/dnsmasq.conf
    template: true
    group: dnsmasq
    mode: "0644"
    restarts: [dnsmasq]
  - path: /etc/default/tailscaled
    mode: "0444"
    restarts: [tailscaled]
  # UDP GRO forwarding on, and GRO lists off, on each interface udev adds.
  - path: /usr/local/libexec/tailscale-gro-tune
    mode: "0755"
  - path: /etc/systemd/system/tailscale-gro@.service
    mode: "0644"
  - path: /etc/udev/rules.d/99-tailscale-gro.rules
    mode: "0644"
  - path: /etc/firewalld/policies/allow-peering-fwd.xml
    mode: "0644"
    reloads: [firewalld]
host_files_units: [dnsmasq]

# ClamAV's on-access scanner, over the baseline directories alone.
clamonacc_enabled: true
