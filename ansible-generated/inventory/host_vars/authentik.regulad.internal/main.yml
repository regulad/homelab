---
# authentik: its upstream compose stack in /opt/authentik, run by
# podman-compose, with the .env (authentik_env) from secrets.sops.yml. Caddy on
# ingress serves it as authentik.regulad.xyz.
host_files_directories:
  - path: /opt/authentik
    mode: "0755"
host_files_list:
  - path: /etc/systemd/system/podman-compose@.service
    mode: "0644"
    shared_src: etc/systemd/system/podman-compose@.service
    restarts: [podman-compose@authentik.service]
  - path: /opt/authentik/docker-compose.yml
    mode: "0644"
    restarts: [podman-compose@authentik.service]
  - path: /opt/authentik/.env
    mode: "0600"
    content: "{{ authentik_env }}\n"
    secret: true
    restarts: [podman-compose@authentik.service]
host_files_packages: [podman-compose]
host_files_units: [podman-compose@authentik.service, podman-auto-update.timer]
