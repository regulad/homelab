---
quadlet_services:
  - name: uptime-kuma
    description: Uptime Kuma
    after: [network-online.target]
    wants: [network-online.target]
    image: docker.io/louislam/uptime-kuma:2
    container_name: uptime-kuma
    auto_update: registry
    # Listens on 3001 on every address, and probes the LAN and tailnet directly.
    network: host
    # The image runs nscd, whose host cache is the only file it writes outside
    # its volume.
    tmpfs: [/var/cache/nscd]
    volumes:
      - uptime-kuma_data:/app/data
      # The host's trust store, which the ca_trust role maintains.
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
      # libuv runs at most half its pool's threads on DNS lookups, so Node's
      # default of 4 leaves Kuma 2 lookups at once. A monitor whose name does
      # not resolve holds one for 20 seconds, as glibc times out on each
      # search domain whose resolvers don't answer, and port monitors, whose
      # 5-second timeout counts the lookup, failed waiting behind two. 16
      # threads leave 8.
      UV_THREADPOOL_SIZE: "16"
    restart: always
    wanted_by: [multi-user.target, default.target]
