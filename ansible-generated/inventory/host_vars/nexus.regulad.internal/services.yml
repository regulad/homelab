---
quadlet_services:
  - name: nexus
    description: Sonatype Nexus Repository
    after: [network-online.target]
    wants: [network-online.target]
    # A release, bumped by hand: Sonatype tags only releases and latest. After
    # a bump, maintenance.yml --tags nexus-upgrade upgrades to it with a copy
    # to roll back to; site.yml would restart onto it with none. Auto-update
    # still brings in Sonatype's rebuilds of the same release.
    image: docker.io/sonatype/nexus3:3.97.3
    container_name: nexus
    auto_update: registry
    # The web UI and every repository on 8081; Caddy serves cr's Docker API
    # from its path there.
    network: host
    volumes:
      - /mnt/nexus/data:/nexus-data
    restart: always
    wanted_by: [multi-user.target, default.target]
