---
# Sonatype Nexus Repository, moved here from aboriginal's compose project.
# Caddy on ingress serves it as repo.regulad.xyz, and as cr.regulad.xyz the cr
# repository's path, /repository/cr/. Its data directory is on the container's
# RBD mount point, owned by the image's nexus user: 200 here, 100200 on the
# node.
host_files_directories:
  - path: /mnt/nexus/data
    owner: "200"
    group: "200"
    mode: "0755"
