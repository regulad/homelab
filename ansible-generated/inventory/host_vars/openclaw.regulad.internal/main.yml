---
# Not checked by AIDE: OpenClaw's received media, with what its workspace
# receives, its main agent's sessions and the catalogues of models it fetches
# from each provider, its state database and its workspace attestations. Its
# configuration stays watched.
aide_exclude_paths_host:
  - /root/.openclaw/media
  - /root/.openclaw/workspace/media/inbound
  - /root/.openclaw/agents/main/agent/models.json
  - /root/.openclaw/agents/main/agent/plugins
  - /root/.openclaw/agents/main/sessions
  - /root/.openclaw/state
  - /root/.openclaw/workspace-attestations
