---
tailscale_enabled: true
tailscale_tags: [autoexit]
tailscale_settings:
  advertise_exit_node: true
  accept_dns: false
  stateful_filtering: false
  operator: regulad

# Forwarding for the exit node.
host_files_list:
  - path: /etc/sysctl.d/99-tailscale.conf
    mode: "0644"
    restarts: [systemd-sysctl.service]
