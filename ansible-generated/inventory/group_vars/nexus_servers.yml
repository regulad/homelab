---
# Nexus's API, as svc-ansible (nx-admin), whose password is in
# nexus_servers.sops.yml. The public URL reaches Nexus wherever it runs.
nexus_url: https://repo.regulad.xyz
nexus_api_user: svc-ansible

# Nexus's secrets file, as Sonatype's runtime configuration documents it, in
# place of the encryption defaults every Nexus shares: active names the key that
# encrypts the secrets table (the LDAP bind password, proxy logins, API keys'
# secrets), and fixedEncryption, with its own key id so that a new active key
# leaves it as it is, encrypts the API keys' principals. The host's files
# deliver it (host_vars main.yml), and Nexus reads it at start; existing data
# moves to it through maintenance.yml's nexus-reencrypt. It sits beside the
# database on the container's root disk, so each weekly backup holds both.
nexus_secrets_file:
  active: "2026-11-09"
  keys: "{{ nexus_secrets_keys | dict2items(key_name='id', value_name='key') }}"
  fixedEncryption:
    keyId: "2026-11-09"
    salt: "{{ nexus_fixed_encryption_salt }}"
    iv: "{{ nexus_fixed_encryption_iv }}"

# Nexus's own roles and users that the nexus_security role converges; the
# others are left as they are. Each service user has a role of its own name:
# - svc-doppelganger, with which doppelgangerhq.com's Docker pulls from
#   cr.regulad.xyz, may read and browse the cr repository and nothing else.
# - svc-redroid, with which regulad/redroid-script's CI pushes its images,
#   administers the cr repository.
# - nx-aaoracled, with which regulad/aaoracled's CI uploads its packages from
#   the nexus-ios environment, may read, add and edit in the ios apt repository.
# - svc-doppelganger-ci, with which regulad/doppelganger's Gradle jobs fetch
#   through the maven-central proxy, may read and browse that repository and
#   nothing else.
# - svc-homelab, the user the LAN's hosts pull as without credentials from
#   cr.regulad.xyz, docker-cr.regulad.xyz and ghcr-cr.regulad.xyz, through the
#   Rut Auth realm (below), may read and browse the cr repository and the
#   docker-io and ghcr-io proxies behind them, and nothing else. Its password
#   exists only because Nexus wants one for a local user.
# tofu/github reads the CI users' names here, and their passwords from
# nexus_servers.sops.yml, to set them as those repositories' secrets.
nexus_security_roles:
  - id: svc-doppelganger
    name: svc-doppelganger
    description: Pulls from the cr Docker repository
    privileges: [nx-repository-view-docker-cr-browse, nx-repository-view-docker-cr-read]
    roles: []
  - id: svc-redroid
    name: svc-redroid
    description: ""
    privileges: [nx-repository-admin-docker-cr-*, nx-repository-view-docker-cr-*]
    roles: []
  - id: nx-aaoracled
    name: nx-aaoracled
    description: ""
    privileges: [nx-repository-view-apt-ios-read, nx-repository-view-apt-ios-add, nx-repository-view-apt-ios-edit]
    roles: []
  - id: svc-doppelganger-ci
    name: svc-doppelganger-ci
    description: Reads the maven-central proxy
    privileges: [nx-repository-view-maven2-maven-central-browse, nx-repository-view-maven2-maven-central-read]
    roles: []
  - id: svc-homelab
    name: svc-homelab
    description: The LAN's hosts, pulling from the cr Docker repository and the docker-io and ghcr-io proxies
    privileges:
      - nx-repository-view-docker-cr-browse
      - nx-repository-view-docker-cr-read
      - nx-repository-view-docker-docker-io-browse
      - nx-repository-view-docker-docker-io-read
      - nx-repository-view-docker-ghcr-io-browse
      - nx-repository-view-docker-ghcr-io-read
    roles: []
nexus_security_users:
  - userId: svc-doppelganger
    firstName: Doppelganger
    lastName: Service
    emailAddress: regulad@regulad.xyz
    password: "{{ nexus_svc_doppelganger_password }}"
    status: active
    roles: [svc-doppelganger]
  - userId: svc-redroid
    firstName: Service
    lastName: Redroid
    emailAddress: svc-redroid@regulad.xyz
    password: "{{ nexus_svc_redroid_password }}"
    status: active
    roles: [svc-redroid]
  - userId: nx-aaoracled
    firstName: Nexus
    lastName: aaoracled
    emailAddress: nobody@example.com
    password: "{{ nexus_nx_aaoracled_password }}"
    status: active
    roles: [nx-aaoracled]
  - userId: svc-doppelganger-ci
    firstName: Doppelganger
    lastName: CI
    emailAddress: svc-doppelganger-ci@regulad.xyz
    password: "{{ nexus_svc_doppelganger_ci_password }}"
    status: active
    roles: [svc-doppelganger-ci]
  - userId: svc-homelab
    firstName: Homelab
    lastName: Hosts
    emailAddress: svc-homelab@regulad.xyz
    password: "{{ nexus_svc_homelab_password }}"
    status: active
    roles: [svc-homelab]

# Rut Auth: Nexus takes the user that the X-Homelab-Peer header names as
# authenticated. Caddy on ingress sets it to svc-homelab on Docker API requests
# to cr.regulad.xyz, docker-cr.regulad.xyz and ghcr-cr.regulad.xyz from the LAN
# that carry no credentials (its nexus_docker snippet), and drops any copy a
# client sends on every site in front of Nexus; Nexus's firewall admits
# ingress alone (tofu/gonkputer's lxc-nexus.tf). Enabling the capability adds
# the realm to the active ones; Sonatype's guide puts it first.
nexus_security_capabilities:
  - type: rutauth
    enabled: true
    properties:
      httpHeader: X-Homelab-Peer
nexus_security_realms:
  - rutauth-realm
  - NexusAuthenticatingRealm
  - DockerToken
  - NpmToken
  - NuGetApiKey
  - LdapRealm

# The upstream logins of Nexus's proxies, which the nexus_repositories role
# sets, each with a personal access token of its own as regulad. Docker Hub and
# GitHub issue none through an API to an account with two-factor
# authentication, so they are issued by hand, each under its name there,
# terraform-<word>--<word>, and kept with the others each service issued: in
# tofu/dockerhub's and tofu/github's secrets.sops.yaml, their only copies.
# - docker-io signs in to Docker Hub with a Public Repo Read-only token, which
#   reaches no private repository.
# - ghcr-io signs in to ghcr.io with a classic token, the only kind ghcr.io
#   takes, with read:packages alone. A classic token reads every package
#   regulad can, private ones and regulad's organizations' included, so
#   whoever reads ghcr-io through Nexus, anonymous users and knownguest among
#   them, can too.
# To rotate one, issue a new token under the same name, put it in its file, and
# run maintenance.yml --tags nexus-proxy-logins: Nexus never returns a stored
# password, so site.yml cannot tell it changed.
nexus_repositories_managed:
  - format: docker
    type: proxy
    name: docker-io
    login:
      username: regulad
      password: >-
        {{ lookup('community.sops.sops', inventory_dir ~ '/../../tofu/dockerhub/secrets.sops.yaml',
                  extract='["dockerhub_pats"]["terraform-nexus--dockerhub"]') }}
  - format: docker
    type: proxy
    name: ghcr-io
    login:
      username: regulad
      password: >-
        {{ lookup('community.sops.sops', inventory_dir ~ '/../../tofu/github/secrets.sops.yaml',
                  extract='["github_pats"]["terraform-nexus--ghcr"]') }}
