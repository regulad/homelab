---
# Every OCI instance, from tofu/oracle's state.

# The login every instance shares, beside its image's own (opc, ubuntu).
base_admin_user: regulad

# Not checked by AIDE: the status of the Unified Monitoring Agent's
# configuration downloads, which its downloader rewrites every 15 to 25
# minutes; its configuration, in conf.d, stays watched. Enterprise Linux's
# AIDE rule for /etc records no contents there (AGENTS.md), so it is left out
# only on instances of other systems.
aide_exclude_paths_group: "{{ [] if 'rhel' in group_names else ['/etc/unified-monitoring-agent/unified_monitoring.json'] }}"

# SELinux enforcing on the Enterprise Linux instances, as their images ship it;
# the others have none.
host_files_selinux_state: "{{ 'enforcing' if 'rhel' in group_names else '' }}"

# No NFS client: the images ship one, nfs-utils on Oracle Linux and nfs-common
# on Ubuntu, each with rpcbind, which listens on port 111 on every address, but
# no instance mounts or exports NFS. Oracle Linux's also brings gssproxy, which
# serves only the NFS client's Kerberos. A host that needs NFS sets its own
# host_files_removed_packages in its host_vars, without them.
host_files_removed_packages: >-
  {{ ['nfs-utils', 'rpcbind', 'gssproxy'] if 'rhel' in group_names else ['nfs-common', 'rpcbind'] }}
