---
# LXC containers are reached through their Proxmox node, not SSH of their own:
# Mitogen connects to the node, proxmox_node (group_vars/proxmox_nodes.yml),
# and runs lxc-attach --clear-env there for the container's VMID, its
# ansible_host; both come from tofu/gonkputer's state, through compose in
# gonkputer.terraform_state.yml. Every container on a node shares Mitogen's one
# connection to it. The lxc connection works only under Mitogen's strategies
# (ansible.cfg): without them it is community.general.lxc, which looks for the
# container on the controller.
ansible_connection: lxc
mitogen_via: "{{ proxmox_node }}"
# lxc-attach already runs as root inside the container, so plays that become
# root do not wrap their commands in the container's sudo.
ansible_become: false
# Ubuntu's amd64v3 builds only on containers tagged amd64v3, which HA keeps on
# nodes with x86-64-v3; the tag reaches Ansible as a group of the same name.
# Elsewhere the role removes the variant.
apt_amd64v3_enabled: "{{ 'amd64v3' in group_names }}"
