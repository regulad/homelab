---
# LXC containers are reached through their Proxmox node, not SSH of their own:
# proxmox_pct_remote connects to ansible_host (the node) as root over SSH and runs
# pct for proxmox_vmid. Both come from each container's ansible_host in
# tofu/gonkputer, through compose in gonkputer.terraform_state.yml.
ansible_connection: community.proxmox.proxmox_pct_remote
ansible_user: root
# pct already runs as root inside the container, so plays that become root do
# not wrap their commands in the container's sudo.
ansible_become: false
# Ubuntu's amd64v3 builds only on containers tagged amd64v3, which HA keeps on
# nodes with x86-64-v3; the tag reaches Ansible as a group of the same name.
# Elsewhere the role removes the variant.
apt_amd64v3_enabled: "{{ 'amd64v3' in group_names }}"
