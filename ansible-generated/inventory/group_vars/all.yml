---
# OpenSSH reads no configuration file, the operator's or the system's (-F), so
# each host connects at its ansible_host, its full hostname, as the user this
# inventory names, from any controller. For ssh, sftp and scp alike.
#
# Host keys: OpenSSH accepts only each host's keys in this stage's known_hosts,
# under its inventory name, and reads or writes no other file, so a key missing
# there or changed fails the connection instead of being trusted. Containers
# are reached through their Proxmox node by proxmox_pct_remote, whose paramiko
# reads only ~/.ssh/known_hosts. Where sudo goes through pam_rssh, the agent
# is forwarded too, for its become to sign with: on the hosts that enable the
# pam_rssh role, and on the Macs, where regulad/dotfiles sets it up.
ansible_ssh_common_args: >-
  -F /dev/null
  -o HostKeyAlias={{ inventory_hostname }}
  -o UserKnownHostsFile={{ inventory_dir }}/../known_hosts
  -o GlobalKnownHostsFile=/dev/null
  -o StrictHostKeyChecking=yes
  {{ '-o ForwardAgent=yes' if pam_rssh_enabled | default(false) or 'macos' in group_names else '' }}
# The login on every host, but where a group or host names another: root on
# the containers' Proxmox node, kasm_admin on vkasm, ubuntu on
# doppelgangerhq.com.
ansible_user: regulad

# pam_rssh's repositories on Nexus, and their public keys, as nexus_servers'
# group_vars declare them.
pam_rssh_nexus_url: "{{ hostvars[groups['nexus_servers'] | first]['nexus_url'] }}"
pam_rssh_public_keys: "{{ hostvars[groups['nexus_servers'] | first]['nexus_public_keys'] }}"

# Each host's FreeIPA mail account, null-<short hostname> by convention; a
# host_vars mail_relay_account overrides it where two hosts share a name.
mail_relay_account: null-{{ inventory_hostname | split('.') | first }}
# The updaters mail their reports from that account's address, the only sender
# mail.regulad.xyz accepts from its login.
auto_updates_mail_from: "{{ mail_relay_account }}@regulad.xyz"

# The LAN's routers. arawi (pfSense) is the homelab's gateway, DHCP server and
# resolver; hosts with port forwards, such as dodo and ingress, route through
# the upstream router directly while keeping arawi's addresses and DNS.
lan_arawi:
  ipv4: 10.23.0.254
  ipv6: fd83:b84c:aa57:1:be24:11ff:fe08:e4e8
  ipv6_link_local: fe80::be24:11ff:fe08:e4e8
lan_upstream_router:
  ipv4: 10.23.0.1
  ipv6_link_local: fe80::1ef4:3fff:fe14:4bee

# FreeIPA's server for regulad.internal, at the address its static mapping on
# arawi fixes for it.
freeipa_server:
  fqdn: wako.regulad.internal
  ipv4: 10.23.2.34
  domain: regulad.internal
# mail_relay manages each host's null- account on it, through FreeIPA's API on
# the server itself, which trusts its own CA.
mail_relay_freeipa_host: "{{ freeipa_server.fqdn }}"
mail_relay_freeipa_delegate: "{{ freeipa_server.fqdn }}"

# The old FreeIPA server's address, which its stand-in, the freeipa container,
# keeps by DHCP while consumers move to wako. Its one name is the CR1000B's
# freeipa.regulad-verizon-livingston.internal (A and PTR); arawi registers none.
freeipa_legacy:
  ipv4: 10.23.2.32

# Each Sentry project's DSN, by project slug: tofu/sentry's dsn output, read
# on the operator's machine wherever a host's configuration uses it, which
# needs tofu/sentry/prepare.sh sourced. The lookup's binary_path is a path
# option, which takes a bare name as relative to the working directory, so
# tofu is resolved on PATH.
sentry_dsns: >-
  {{ lookup('cloud.terraform.tf_output', 'dsn',
            project_path=inventory_dir ~ '/../../tofu/sentry',
            binary_path=lookup('ansible.builtin.pipe', 'command -v tofu')) }}
