---
# Each host's FreeIPA mail account, null-<short hostname> by convention; a
# host_vars mail_relay_account overrides it where two hosts share a name.
mail_relay_account: null-{{ inventory_hostname | split('.') | first }}
# The updaters mail their reports from that account's address, the only sender
# mail.regulad.xyz accepts from its login.
auto_updates_mail_from: "{{ mail_relay_account }}@regulad.xyz"

# The LAN's routers. arawi (pfSense) is the homelab's gateway, DHCP server and
# resolver; hosts with port forwards, such as dodo and ingress, route through
# the upstream router directly while keeping arawi's addresses and DNS.
lan_arawi:
  ipv4: 10.23.0.254
  ipv6: fd83:b84c:aa57:1:be24:11ff:fe08:e4e8
  ipv6_link_local: fe80::be24:11ff:fe08:e4e8
lan_upstream_router:
  ipv4: 10.23.0.1
  ipv6_link_local: fe80::1ef4:3fff:fe14:4bee

# FreeIPA's server for regulad.internal, at the address its static mapping on
# arawi fixes for it.
freeipa_server:
  fqdn: wako.regulad.internal
  ipv4: 10.23.2.34
  domain: regulad.internal
# mail_relay manages each host's null- account on it, through FreeIPA's API on
# the server itself, which trusts its own CA.
mail_relay_freeipa_host: "{{ freeipa_server.fqdn }}"
mail_relay_freeipa_delegate: "{{ freeipa_server.fqdn }}"

# The old FreeIPA server's address, which its stand-in, the freeipa container,
# keeps by DHCP while consumers move to wako. Its one name is the CR1000B's
# freeipa.regulad-verizon-livingston.internal (A and PTR); arawi registers none.
freeipa_legacy:
  ipv4: 10.23.2.32
