---
# Every gonkputer guest, from tofu/gonkputer's state: the homelab's own, on its
# LAN.

# Podman pulls Docker Hub's and ghcr.io's images through Nexus's docker-io and
# ghcr-io proxies, which Caddy on ingress serves at the roots of
# docker-cr.regulad.xyz and ghcr-cr.regulad.xyz. From the LAN, Caddy there
# names svc-homelab to Nexus's Rut Auth realm, so no host needs a login of its
# own; Nexus signs in upstream with tokens of its own (nexus_servers.yml).
# Podman falls back to the registry itself when Nexus cannot serve an image.
podman_registry_mirrors:
  docker.io: docker-cr.regulad.xyz
  ghcr.io: ghcr-cr.regulad.xyz

# Docker, which mirrors Docker Hub alone, the same: the docker role's daemon
# settings on dodo, and vkasm's own daemon.json (its host_vars).
docker_registry_mirrors: ["https://{{ podman_registry_mirrors['docker.io'] }}"]

# cargo fetches crates.io's index and crates through Nexus's crates-io proxy
# (nexus_servers.yml), which anonymous users read, by source replacement in
# the config.toml of each cargo home a role builds in. Lockfiles still name
# crates.io, and cargo checks each crate against the checksum its index gives.
# Unlike Podman, cargo has no fallback: while Nexus is down, a build that must
# fetch fails.
cargo_crates_io_mirror: "sparse+{{ hostvars[groups['nexus_servers'] | first]['nexus_url'] }}/repository/crates-io/"
lime_crates_io_mirror: "{{ cargo_crates_io_mirror }}"
matrix_crates_io_mirror: "{{ cargo_crates_io_mirror }}"
