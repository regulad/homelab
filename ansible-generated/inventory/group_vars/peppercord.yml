---
# The PepperCord mirrors (cordpepperer, peppercord): one podman-compose stack
# in /opt/peppercord, its compose file shared and each host's .env
# (peppercord_env) from its own secrets.sops.yml.
#
# webhookd, from upstream's release archive (azlux's repository has no Ubuntu
# suites), on loopback alone; Tailscale Serve publishes it on the tailnet with
# HTTPS (tailscale_serve below). Its one hook, auto-update, which PepperCord's
# pipeline calls after each image it publishes, starts podman-auto-update at
# once, as its daily timer would, through a sudo rule for that command alone.
host_files_users: [webhookd]
host_files_directories:
  - path: /opt/peppercord
    mode: "0755"
  - path: /etc/webhookd
    mode: "0755"
  - path: /etc/webhookd/scripts
    mode: "0755"
host_files_list:
  - path: /etc/systemd/system/podman-compose@.service
    mode: "0644"
    shared_src: etc/systemd/system/podman-compose@.service
    restarts: [podman-compose@peppercord.service]
  - path: /opt/peppercord/docker-compose.yml
    mode: "0644"
    shared_src: peppercord/docker-compose.yml
    restarts: [podman-compose@peppercord.service]
  - path: /opt/peppercord/.env
    mode: "0600"
    content: "{{ peppercord_env }}\n"
    secret: true
    restarts: [podman-compose@peppercord.service]
  - path: /etc/systemd/system/webhookd.service
    mode: "0644"
    content: |
      [Unit]
      Description=webhookd, PepperCord's pipeline's hooks
      After=network.target

      [Service]
      User=webhookd
      # Loopback alone, behind Tailscale Serve on the same port.
      Environment=WHD_LISTEN_ADDR={{ peppercord_webhookd_listen }}
      Environment=WHD_HOOK_SCRIPTS=/etc/webhookd/scripts
      # Each request blocks until its hook ends, which maps the hook's exit
      # status to the response's (0 to 200, 1 to 99 to 500).
      Environment=WHD_HOOK_DEFAULT_MODE=buffered
      # Requests and each hook's output, in the journal.
      Environment=WHD_LOG_MODULES=http,hook
      ExecStart=/usr/local/bin/webhookd
      # Hook logs, in webhookd's default, the temporary directory.
      PrivateTmp=true
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    restarts: [webhookd.service]
  # webhookd passes a request's query parameters and headers to the hook as
  # environment variables, so the hook names each command by its path.
  - path: /etc/webhookd/scripts/auto-update.sh
    mode: "0755"
    content: |
      #!/bin/sh
      # Starts podman-auto-update without waiting for it, whatever was sent.
      exec /usr/bin/sudo -n /usr/bin/systemctl start --no-block podman-auto-update.service
  - path: /etc/sudoers.d/webhookd
    mode: "0440"
    content: |
      webhookd ALL=(root) NOPASSWD: /usr/bin/systemctl start --no-block podman-auto-update.service
    validate: visudo -cf %s
host_files_archives:
  - url: https://github.com/ncarlier/webhookd/releases/download/v1.22.1/webhookd-linux-amd64.tgz
    checksum: sha256:7a1f4edd1e47c93851074e39ed5f2634c0b0734e8d9d4200d570ec04df0bee29
    dest: /usr/local/bin
    files: [webhookd]
    mode: "0755"
    restarts: [webhookd.service]
host_files_packages: [podman-compose]
host_files_units: [podman-compose@peppercord.service, podman-auto-update.timer, webhookd.service]

# webhookd's port, on loopback and, through Serve, on the tailnet, which the
# tailnet's policy opens to tag:ci-client-peppercord alone.
peppercord_webhookd_port: 8108
peppercord_webhookd_listen: 127.0.0.1:{{ peppercord_webhookd_port }}

# On the tailnet as tag:ci-server-peppercord, which PepperCord's pipeline
# (tag:ci-client-peppercord) may reach on webhookd's port alone. The tailnet's
# policy, in regulad/tailscale-acls, gives the tag no grant of its own, so
# nothing on the tailnet is open to the bot through it; the internet-only
# firewall group sees Tailscale's traffic only encapsulated.
tailscale_enabled: true
tailscale_join: true
tailscale_tags: [ci-server-peppercord]
tailscale_settings:
  # Off: the internet-only group lets these hosts query arawi alone, and the
  # tailnet's DNS would send their lookups to pihole and pihole2, and NC
  # State's domains to its own resolvers. arawi resolves the tailnet's names in
  # its stead.
  accept_dns: false
  # Off: the routes would carry the bot's connections to the homelab's and the
  # VCN's addresses through their edge routers, past the internet-only group,
  # to what the tailnet opens to every node, such as ingress's web.
  accept_routes: false
# webhookd, as HTTPS with the node's Tailscale certificate.
tailscale_serve:
  - port: "{{ peppercord_webhookd_port }}"
    target: http://{{ peppercord_webhookd_listen }}
