---
# The PepperCord mirrors (cordpepperer, peppercord): one podman-compose stack
# in /opt/peppercord, its compose file shared and each host's .env
# (peppercord_env) from its own secrets.sops.yml.
host_files_directories:
  - path: /opt/peppercord
    mode: "0755"
host_files_list:
  - path: /etc/systemd/system/podman-compose@.service
    mode: "0644"
    shared_src: etc/systemd/system/podman-compose@.service
    restarts: [podman-compose@peppercord.service]
  - path: /opt/peppercord/docker-compose.yml
    mode: "0644"
    shared_src: peppercord/docker-compose.yml
    restarts: [podman-compose@peppercord.service]
  - path: /opt/peppercord/.env
    mode: "0600"
    content: "{{ peppercord_env }}\n"
    secret: true
    restarts: [podman-compose@peppercord.service]
host_files_packages: [podman-compose]
host_files_units: [podman-compose@peppercord.service, podman-auto-update.timer]

# On the tailnet as tag:ci-server--peppercord, which PepperCord's pipeline
# (tag:ci-client--peppercord) may reach on webhookd's port alone. The tailnet's
# policy, in regulad/tailscale-acls, gives the tag no grant of its own, so
# nothing on the tailnet is open to the bot through it; the internet-only
# firewall group sees Tailscale's traffic only encapsulated.
tailscale_enabled: true
tailscale_join: true
tailscale_tags: [ci-server--peppercord]
tailscale_settings:
  # Off: the internet-only group lets these hosts query arawi alone, and the
  # tailnet's DNS would send their lookups to pihole and pihole2, and NC
  # State's domains to its own resolvers. arawi resolves the tailnet's names in
  # its stead.
  accept_dns: false
  # Off: the routes would carry the bot's connections to the homelab's and the
  # VCN's addresses through their edge routers, past the internet-only group,
  # to what the tailnet opens to every node, such as ingress's web.
  accept_routes: false
