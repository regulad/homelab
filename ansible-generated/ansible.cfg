# Ansible reads this file when run from this directory. Relative paths resolve
# from here. The shared roles in ../ansible-common sit after this stage's own.
[defaults]
# Hosts in parallel, kept at prodingus's sshd MaxStartups (10:30:100): every
# container connects through prodingus, and above 10 unauthenticated
# connections sshd starts dropping new ones.
forks = 10
# Every *.terraform_state.yml in inventory/ reads one OpenTofu root's state.
inventory = inventory
roles_path = roles:../ansible-common/roles
collections_path = collections
# Also load the SOPS-encrypted *.sops.yml files in host_vars and group_vars.
vars_plugins_enabled = ansible.builtin.host_group_vars,community.sops.sops
# Records the files each host's tasks wrote, in ~/.cache/ansible/aide_written
# until the aide role's refresh play, the last in site.yml and maintenance.yml,
# consumes them.
callback_plugins = ../ansible-common/plugins/callback
callbacks_enabled = aide_written
# host_files' network filters, which templates outside that role use too, such
# as arawi's pfSense sections and the files maintenance.yml writes: in every
# play, not only those that load the role.
filter_plugins = roles/host_files/filter_plugins
# Each task's result carries its module's arguments, from which aide_written
# reads the paths a module wrote and the units it enabled or masked:
# ansible-core 2.21 stopped adding them by default, and lineinfile,
# blockinfile and systemd_service's masked return none of them themselves.
inject_invocation = true

[inventory]
# Fail instead of skipping a source that cannot be parsed.
any_unparsed_is_failed = True
# The terraform_state sources cache what they select from state for an hour,
# so a load skips tofu init and state pull; run with --flush-cache after an
# apply. The cache holds the hosts' variables in plaintext, values the state
# marks sensitive included, so it lives outside the repository.
cache = True
cache_plugin = ansible.builtin.jsonfile
cache_connection = ~/.cache/ansible/terraform_state
cache_timeout = 3600
