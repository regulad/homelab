# Coraza rules for PHP2Shell (CVE-2026-109619) and rawkey (CVE-2026-109618),
# after Abstract Security's published ModSecurity rules, with their rule IDs:
# https://www.abstract.security/blog/php2shell-critical-php-rce-vulnerabilities-cve-2026-109618-and-cve-2026-109619
# Imported only by sites that front PHP. Blocking from the start, because
# both are exploited in the wild; rules 3201004 and 3101009 only log.
SecRuleEngine On

# Inspect form bodies. Larger bodies, such as uploads, are inspected up to the
# limit and passed on rather than rejected.
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction ProcessPartial
SecResponseBodyAccess Off

# --- php2shell: CVE-2026-109619 ---------------------------------------------

# A session ID as a multipart form field; real clients send it as a cookie.
SecRule REQBODY_PROCESSOR "@streq MULTIPART" \
    "id:3201001,phase:2,deny,status:403,log,msg:'PHP2Shell: PHPSESSID in a multipart form field',chain"
    SecRule ARGS_POST_NAMES "@streq PHPSESSID" "t:none"

# A PHP open tag in an upload's filename (headers only, never file contents).
SecRule FILES "@rx <\?(?:php\b|=)" \
    "id:3201002,phase:2,deny,status:403,log,t:none,msg:'PHP2Shell: PHP open tag in an upload filename'"

# Serialized PHP syntax in an upload's filename.
SecRule FILES "@rx (?:^|[|;{])\s*(?:[oOcC]\s*:\s*\d{1,10}\s*:\s*[\x22\x27]|[aA]\s*:\s*\d{1,10}\s*:\s*\{|[sS]\s*:\s*\d{1,10}\s*:\s*[\x22\x27]|[rR]\s*:\s*\d{1,10}\s*;)" \
    "id:3201003,phase:2,deny,status:403,log,t:none,msg:'PHP2Shell: serialized PHP syntax in an upload filename'"

# The legitimate progress-bar field: logged for correlation, never blocked.
SecRule ARGS_POST_NAMES "@streq PHP_SESSION_UPLOAD_PROGRESS" \
    "id:3201004,phase:2,pass,log,t:none,msg:'PHP2Shell: PHP_SESSION_UPLOAD_PROGRESS field (correlation only)'"

# --- rawkey: CVE-2026-109618 ------------------------------------------------

# Form field names of 1,000 or more characters, after parsing.
SecRule ARGS_POST_NAMES|FILES_NAMES "@gt 999" \
    "id:3101004,phase:2,deny,status:403,log,t:none,t:length,msg:'rawkey: oversized form field name'"

# The same in a raw urlencoded body: a long key, not a long value.
SecRule REQUEST_BODY "@rx (?:^|&)[^&=]{1000,}" \
    "id:3101005,phase:2,deny,status:403,log,t:none,msg:'rawkey: oversized urlencoded field name'"

# The same in a multipart part's name (\bname does not match filename).
SecRule MULTIPART_PART_HEADERS "@rx (?i)\bname\s*=[^\r\n]{1000,}" \
    "id:3101007,phase:2,deny,status:403,log,t:none,msg:'rawkey: oversized multipart part name'"

# Bodies that could not be parsed would bypass the checks above.
SecRule REQBODY_ERROR "!@eq 0" \
    "id:3101008,phase:2,deny,status:400,log,t:none,msg:'rawkey: request body could not be parsed'"

# Strict multipart validation: logged only, as unusual clients trip it.
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:3101009,phase:2,pass,log,t:none,msg:'rawkey: multipart strict validation failed (log only)'"
