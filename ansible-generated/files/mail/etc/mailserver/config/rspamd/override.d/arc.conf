enabled = true;
sign_local = true;
sign_authenticated = true;
use_domain = "envelope";
use_esld = true;
try_fallback = false;
check_pubkey = true;

domain {
    regulad.xyz {
        path = "/tmp/docker-mailserver/rspamd/dkim/rsa-2048-mail-regulad.xyz.private.txt";
        selector = "mail";
    }
}

sign_inbound = true;
use_domain_sign_inbound = "recipient";
