# documentation: https://rspamd.com/doc/modules/dkim_signing.html

enabled = true;

sign_authenticated = true;
sign_local = true;
try_fallback = false;

use_domain = "header";
use_redis = false; # don't change unless Redis also provides the DKIM keys
use_esld = true;
allow_username_mismatch = true;

check_pubkey = true; # you want to use this in the beginning

domain {
    regulad.xyz {
        path = "/tmp/docker-mailserver/rspamd/dkim/rsa-2048-mail-regulad.xyz.private.txt";
        selector = "mail";
    }
    nefumllc.com {
        path = "/tmp/docker-mailserver/rspamd/dkim/rsa-2048-mail-nefumllc.com.private.txt";
        selector = "mail";
    }
    regulad.net {
        path = "/tmp/docker-mailserver/rspamd/dkim/rsa-2048-mail-regulad.net.private.txt";
        selector = "mail";
    }
}

