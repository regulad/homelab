# Serve-stale (RFC 8767): while the tunnel is down, answers stay servable for a
# day past their TTL, and each failed refresh starts that day again, so names
# already looked up keep resolving through a lapse. A query waits 1.8 s for NC
# State before taking a stale answer, which says so in an Extended DNS Error.
server:
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-ttl-reset: yes
    serve-expired-reply-ttl: 30
    serve-expired-client-timeout: 1800
    ede: yes
    ede-serve-expired: yes
    prefetch: yes
