# Listening on the LAN and the tailnet: the addresses eth0 and tailscale0 have
# when Unbound starts (unbound.service.d/tailscale.conf waits for
# tailscale0's), answering any client there. ncsu.conf limits what it answers.
server:
    interface: eth0
    interface: tailscale0

    access-control: 0.0.0.0/0 allow
    access-control: ::/0 allow
