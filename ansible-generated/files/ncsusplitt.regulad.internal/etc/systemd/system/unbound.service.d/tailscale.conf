# Unbound binds tailscale0's addresses as they are when it starts, so it waits
# up to a minute for tailscaled to give the interface its own.
[Unit]
After=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 60); do ip -o address show dev tailscale0 scope global | grep -q inet && exit 0; sleep 1; done; exit 0'
