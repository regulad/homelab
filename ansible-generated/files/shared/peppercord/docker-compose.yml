# PepperCord, from regulad/PepperCord's docker-compose.yml at d5d7ce9, run by
# podman-compose through podman-compose@peppercord.service. Changed from
# upstream: MongoDB and Redis publish on loopback only, every service carries
# podman-auto-update's label (which needs fully qualified image names), there
# is no build context, and the stack is not a pod, so its two networks stay
# separate.
x-podman:
  in_pod: false

services:
  mongo:
    image: "docker.io/library/mongo:5"
    labels:
      io.containers.autoupdate: registry
    ports:
      - "127.0.0.1:27017:27017/tcp"
      - "[::1]:27017:27017/tcp"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "512M"
        reservations:
          cpus: "0.10"
          memory: "128M"
    hostname: "mongo"
    restart: "always"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend
    volumes:
      - "db:/data/db"
  redis:
    image: "docker.io/library/redis:8.4-alpine3.22"
    labels:
      io.containers.autoupdate: registry
    ports:
      - "127.0.0.1:6379:6379/tcp"
      - "[::1]:6379:6379/tcp"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "256M"
        reservations:
          cpus: "0.01"
          memory: "64M"
    hostname: "redis"
    restart: "always"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend
    volumes:
      - redis:/data
  peppercord:
    # Rolling: PepperCord has to keep up with Discord's API changes.
    image: "ghcr.io/regulad/peppercord:latest"
    labels:
      io.containers.autoupdate: registry
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "4G"
        reservations:
          cpus: "1"
          memory: "1G"
    dns:
      # Discord uses rapidly-reconfigured domain names to direct traffic to its WS and RTC gateways.
      # With PepperCord in production, I've had the best experience with the Google DNS servers
      # I suspect this is because Discord uses GCP and updates propagate the fastest internally.
      - "8.8.8.8"
      - "8.8.4.4"
      # These will go unused with the default configuration, unless the daemon is configured to allocate IPv6 subnets to all docker networks
      - "2001:4860:4860::8888"
      - "2001:4860:4860::8844"
    env_file: ".env"
    ports:
      # Health check endpoint.
      - "8080:8080"
    restart: "always"
    read_only: true
    depends_on:
      - "mongo"
      - "redis"
    tmpfs:
      - /tmp
    networks:
      - backend
      - frontend
    volumes:
      - "/etc/default/locale:/etc/default/locale:ro"
      - "/usr/share/locale:/usr/share/locale:ro"
      - "/usr/lib/locale:/usr/lib/locale:ro"
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
volumes:
  db:
  redis:
networks:
  backend:
    internal: true  # databases are fine without internet
  frontend:
    internal: false
