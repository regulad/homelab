; Interim, partial mitigations for PHP2Shell (CVE-2026-109618, CVE-2026-109619),
; each closing a known attack path, while pfSense's PHP is older than the fix;
; the pfsense role removes this file once it is not. /etc/rc.php_ini_setup
; rewrites php.ini on every php-fpm restart, but leaves this scan directory
; alone, and PHP reads it after php.ini.
session.upload_progress.enabled = Off
memory_limit = -1
