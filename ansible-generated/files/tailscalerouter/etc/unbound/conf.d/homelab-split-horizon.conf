# Managed by Ansible (host_files). arawi's split horizon, for every client of
# the VCN's resolver: regulad.xyz names the homelab and the VCN reach from
# inside are answered with their internal names, from the RPZ arawi applies to
# its "lan" clients, this VCN among them. Its CNAME targets resolve through the
# forwarders in homelab-forward.conf.
server:
    # RPZ needs the respip module, in place of the package's ipsecmod, which it
    # ships turned off.
    module-config: "respip validator iterator"

rpz:
    name: "split-horizon.rpz."
    zonefile: "/etc/unbound/split-horizon.rpz"

# RPZ rewrites only while resolving, never on a cache hit, so a public chain
# held in the cache would skip the rewrite. Nothing under regulad.xyz is
# cached, as on arawi.
stub-zone:
    name: "regulad.xyz."
    stub-host: "art.ns.cloudflare.com."
    stub-host: "zainab.ns.cloudflare.com."
    stub-no-cache: yes
