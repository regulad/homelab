[Service]
# The backend token, MEMORY_BACKEND_TOKEN, which the Caddyfile reads as
# {env.MEMORY_BACKEND_TOKEN}. Required: without the file, Caddy does not start.
EnvironmentFile=/etc/caddy/memory.env
# The package's ExecStart passes --environ, which prints every environment
# variable, the token among them, to the journal as Caddy starts.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
