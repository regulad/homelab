name: authentik

# From authentik 2026.8's compose.yml (lifecycle/container/compose.yml), run by
# podman-compose through podman-compose@authentik.service. Changed from
# upstream: every service carries podman-auto-update's label, the server tracks
# its release's tag (2026.8) instead of a patch release, /data and /templates
# are named volumes, the worker has no Docker socket (only the embedded outpost
# runs, with no service connection) or /certs, the stack is not a pod, and every
# container is read-only; only the worker's entrypoint writes outside the
# volumes, to /certs, now a tmpfs. The worker also reads the homelab's own
# blueprints, from ./blueprints, at /blueprints/homelab beside the shipped ones.
# PostgreSQL is 18, not upstream's 16, its volume mounted at /var/lib/postgresql,
# under which 18's image keeps its data directory.
# authentik upgrades one release at a time and cannot downgrade: move the tag
# to the next release, then run maintenance.yml's authentik-upgrade. A new
# PostgreSQL major is maintenance.yml's authentik-postgres-upgrade.
x-podman:
  in_pod: false

services:
  postgresql:
    env_file:
    - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      timeout: 5s
    image: docker.io/library/postgres:18-alpine
    labels:
      io.containers.autoupdate: registry
    read_only: true
    restart: unless-stopped
    volumes:
    - database:/var/lib/postgresql
  server:
    command: server
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
    - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8}
    labels:
      io.containers.autoupdate: registry
    ports:
    - ${COMPOSE_PORT_HTTP:-9000}:9000
    - ${COMPOSE_PORT_HTTPS:-9443}:9443
    read_only: true
    restart: unless-stopped
    shm_size: 512mb
    volumes:
    - data:/data
    - templates:/templates
  worker:
    command: worker
    depends_on:
      postgresql:
        condition: service_healthy
    env_file:
    - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8}
    labels:
      io.containers.autoupdate: registry
    read_only: true
    restart: unless-stopped
    shm_size: 512mb
    # Its entrypoint, as root, chowns /certs, which this stack does not mount,
    # and exits if it cannot.
    tmpfs:
    - /certs
    user: root
    volumes:
    - data:/data
    - templates:/templates
    - ./blueprints:/blueprints/homelab:ro
volumes:
  database:
    driver: local
  data:
    driver: local
  templates:
    driver: local
