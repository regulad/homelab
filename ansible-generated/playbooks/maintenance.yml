---
# Maintenance that cannot be automated: each play here is a deliberate
# operation, run by hand after its declared version or setting is bumped. Run a
# single one with --tags.

- name: Maintenance both stages share
  ansible.builtin.import_playbook: ../../ansible-common/playbooks/maintenance.yml

# The Pterodactyl panel cannot update itself; bump pterodactyl_version, then
# run this play to upgrade by the panel's documented procedure.
- name: Pterodactyl panel upgrade
  hosts: pterodactyl
  gather_facts: false
  become: true
  tags: [pterodactyl]
  tasks:
    - name: Upgrade to the declared release
      ansible.builtin.include_role:
        name: pterodactyl
        tasks_from: update

# Wings is pinned; bump wings_version and wings_sha256, then run this play to
# upgrade by Wings' documented procedure.
- name: Pterodactyl Wings upgrade
  hosts: wings
  gather_facts: false
  become: true
  tags: [wings]
  tasks:
    - name: Upgrade to the declared release
      ansible.builtin.include_role:
        name: wings
        tasks_from: update

# Set zram up again to its configuration where what it holds fits back into
# RAM; elsewhere, and on the hardware hosts, it changes at the next boot.
- name: Zram to its configuration
  hosts: debian:ubuntu:!proxmox_containers
  gather_facts: false
  become: true
  tags: [zram]
  tasks:
    - name: Set zram up again
      ansible.builtin.include_role:
        name: swap
        tasks_from: resize

# Compact each of Nexus's blob stores, reclaiming the space of soft-deleted
# blobs, such as Docker's abandoned upload chunks, which Nexus keeps until a
# compaction. Nexus 3.70's REST API runs and polls tasks but cannot create
# them, so a missing compaction task is created through ExtDirect, as Nexus's
# own UI does, with a manual schedule. Basic authentication skips Nexus's
# anti-CSRF check, which applies to UI sessions only.
- name: Nexus blob store compaction
  hosts: nexus_servers
  gather_facts: false
  tags: [nexus-compact]
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ nexus_api_user }}"
      url_password: "{{ nexus_api_password }}"
      force_basic_auth: true
  tasks:
    - name: Blob stores
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/blobstores"
      register: nexus_blobstores
      check_mode: false
      no_log: true

    - name: Compaction tasks
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks?type=blobstore.compact"
      register: nexus_compact_tasks
      check_mode: false
      no_log: true

    - name: Create a compaction task for each blob store without one
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/extdirect"
        method: POST
        body_format: json
        body:
          action: coreui_Task
          method: create
          type: rpc
          tid: 1
          data:
            - enabled: true
              name: Compact blob store {{ item }}
              typeId: blobstore.compact
              schedule: manual
              notificationCondition: FAILURE
              properties:
                blobstoreName: "{{ item }}"
      register: nexus_compact_created
      # ExtDirect answers 200 whatever happened; its result says.
      failed_when: not (nexus_compact_created.json.result.success | default(false))
      changed_when: true
      loop: >-
        {{ nexus_blobstores.json | map(attribute='name')
           | reject('in', nexus_compact_tasks.json['items'] | map(attribute='name')
                          | map('regex_replace', '^Compact blob store ', '') | list)
           | list }}
      no_log: true

    - name: Compaction tasks, created ones included
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks?type=blobstore.compact"
      register: nexus_compact_tasks
      check_mode: false
      no_log: true

    - name: Run each compaction task
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks/{{ item.id }}/run"
        method: POST
        status_code: 204
      changed_when: true
      loop: "{{ nexus_compact_tasks.json['items'] }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Wait for each compaction to finish
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks/{{ item.id }}"
      register: nexus_compact_status
      until: nexus_compact_status.json.currentState == 'WAITING'
      retries: 240
      delay: 15
      failed_when: >-
        nexus_compact_status.json.currentState == 'WAITING'
        and nexus_compact_status.json.lastRunResult != 'OK'
      loop: "{{ nexus_compact_tasks.json['items'] }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode
      no_log: true

# Move Nexus off OrientDB, which 3.70.x is the last release to run, to H2, by
# Sonatype's Database Migrator procedure: export the databases, stop Nexus,
# migrate the export with the migrator of the 3.70.5 release it runs, put
# nexus.mv.db in place, enable the datastore, and start it again on 3.70.5.
# services.yml then moves the image to a current release. Rerunning is safe:
# a host already on H2 is skipped, and an unfinished run starts over from a
# fresh export. The OrientDB files stay in place until removed by hand.
- name: Nexus database from OrientDB to H2
  hosts: nexus_servers
  gather_facts: false
  tags: [nexus-h2]
  vars:
    nexus_h2_data: /mnt/nexus/data
    # On the data volume, as the export task writes it from inside Nexus's
    # container, where the volume is /nexus-data.
    nexus_h2_work: "{{ nexus_h2_data }}/h2-migration"
    nexus_h2_migrator_url: https://download.sonatype.com/nexus/nxrm3-migrator/nexus-db-migrator-3.70.5-02.jar
    nexus_h2_migrator_checksum: sha256:b026493c5dd331523d61bc39a54fcef7e1b3efe7f9d6409fd44a8345e01f0492
    # The migrator runs on the Java 8 of the release it belongs to.
    nexus_h2_migrator_image: docker.io/sonatype/nexus3:3.70.5
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ nexus_api_user }}"
      url_password: "{{ nexus_api_password }}"
      force_basic_auth: true
  tasks:
    - name: Nexus's properties
      ansible.builtin.slurp:
        src: "{{ nexus_h2_data }}/etc/nexus.properties"
      register: nexus_h2_properties

    - name: Stop here where Nexus already runs on H2
      ansible.builtin.meta: end_host
      when: >-
        nexus_h2_properties.content | b64decode
        is search('(?m)^nexus\.datastore\.enabled\s*=\s*true')

    - name: Work directory, and the migrator's temporary directory in it
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "200"
        group: "200"
        mode: "0755"
      loop:
        - "{{ nexus_h2_work }}"
        - "{{ nexus_h2_work }}/tmp"

    - name: Earlier runs' exports and output
      ansible.builtin.find:
        paths: "{{ nexus_h2_work }}"
        patterns: ["*.bak", "nexus.mv.db", "nexus.trace.db"]
      register: nexus_h2_stale

    - name: No earlier runs' exports or output
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ nexus_h2_stale.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: The 3.70.5 Database Migrator
      ansible.builtin.get_url:
        url: "{{ nexus_h2_migrator_url }}"
        checksum: "{{ nexus_h2_migrator_checksum }}"
        dest: "{{ nexus_h2_work }}/nexus-db-migrator.jar"
        owner: "200"
        group: "200"
        mode: "0644"
      when: not ansible_check_mode

    - name: Nexus running, for the export
      ansible.builtin.systemd_service:
        name: nexus
        state: started

    - name: Wait for Nexus to accept writes
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/status/writable"
      register: nexus_h2_writable
      until: nexus_h2_writable.status == 200
      retries: 60
      delay: 10
      when: not ansible_check_mode
      no_log: true

    - name: Export tasks
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks?type=db.backup"
      register: nexus_h2_export_tasks
      check_mode: false
      no_log: true

    - name: Create the export task where there is none
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/extdirect"
        method: POST
        body_format: json
        body:
          action: coreui_Task
          method: create
          type: rpc
          tid: 1
          data:
            - enabled: true
              name: Export databases for the H2 migration
              typeId: db.backup
              schedule: manual
              notificationCondition: FAILURE
              properties:
                location: /nexus-data/h2-migration
      register: nexus_h2_export_created
      # ExtDirect answers 200 whatever happened; its result says.
      failed_when: not (nexus_h2_export_created.json.result.success | default(false))
      changed_when: true
      when: nexus_h2_export_tasks.json['items'] | length == 0
      no_log: true

    - name: Export tasks, a created one included
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks?type=db.backup"
      register: nexus_h2_export_tasks
      check_mode: false
      no_log: true

    - name: Run the export
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks/{{ nexus_h2_export_tasks.json['items'][0].id }}/run"
        method: POST
        status_code: 204
      changed_when: true
      when: not ansible_check_mode
      no_log: true

    - name: Wait for the export to finish
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks/{{ nexus_h2_export_tasks.json['items'][0].id }}"
      register: nexus_h2_export_status
      until: nexus_h2_export_status.json.currentState == 'WAITING'
      retries: 120
      delay: 10
      failed_when: >-
        nexus_h2_export_status.json.currentState == 'WAITING'
        and nexus_h2_export_status.json.lastRunResult != 'OK'
      when: not ansible_check_mode
      no_log: true

    - name: The export's files
      ansible.builtin.find:
        paths: "{{ nexus_h2_work }}"
        patterns: ["component-*.bak", "config-*.bak", "security-*.bak"]
      register: nexus_h2_exports

    - name: One export of each database the migrator reads
      ansible.builtin.assert:
        that: >-
          nexus_h2_exports.files | map(attribute='path') | map('basename')
          | map('regex_replace', '-.*$', '') | sort | list
          == ['component', 'config', 'security']
        quiet: true
      when: not ansible_check_mode

    - name: Nexus stopped, for the migration
      ansible.builtin.systemd_service:
        name: nexus
        state: stopped

    # Sonatype documents a 16 GB heap; a 4 GB one is plenty for this
    # instance's database of under 1 GB, and fits in the container with
    # Nexus stopped.
    - name: Migrate the export to H2
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - --network=none
          - --user=200:200
          - --volume={{ nexus_h2_work }}:/work
          - --workdir=/work
          - --entrypoint=java
          - "{{ nexus_h2_migrator_image }}"
          - -Xmx4g
          - -XX:+UseG1GC
          - -XX:MaxDirectMemorySize=1g
          - -Djava.io.tmpdir=/work/tmp
          - -jar
          - /work/nexus-db-migrator.jar
          - --migration_type=h2
          - --yes
      changed_when: true

    - name: The migrated database
      ansible.builtin.copy:
        src: "{{ nexus_h2_work }}/nexus.mv.db"
        dest: "{{ nexus_h2_data }}/db/nexus.mv.db"
        remote_src: true
        owner: "200"
        group: "200"
        mode: "0644"
      when: not ansible_check_mode

    - name: Nexus on its datastore
      ansible.builtin.lineinfile:
        path: "{{ nexus_h2_data }}/etc/nexus.properties"
        regexp: '^#?\s*nexus\.datastore\.enabled\s*='
        line: nexus.datastore.enabled=true

    - name: Nexus running again, on H2
      ansible.builtin.systemd_service:
        name: nexus
        state: started

    - name: Wait for Nexus to accept writes on H2
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/status/writable"
      register: nexus_h2_writable
      until: nexus_h2_writable.status == 200
      retries: 60
      delay: 10
      when: not ansible_check_mode
      no_log: true

    # Nexus rebuilds its browse and search indexes after a migration, and
    # must not restart until they finish.
    - name: Wait for the post-migration tasks to finish
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks"
      register: nexus_h2_tasks
      until: >-
        nexus_h2_tasks.json['items'] | selectattr('currentState', 'equalto', 'RUNNING') | list | length == 0
      retries: 240
      delay: 15
      when: not ansible_check_mode
      no_log: true

# Nexus's newest release, beside the one services.yml declares, so a bump to it
# is a one-line edit before the upgrade below. Docker Hub tags each release
# with its version and, for the newest, latest too: the version tag with
# latest's digest names it. A play of its own, so Nexus's credentials never
# reach Docker Hub.
- name: Nexus's newest release
  hosts: nexus_servers
  gather_facts: false
  tags: [nexus-upgrade]
  tasks:
    - name: The latest tag
      ansible.builtin.uri:
        url: https://hub.docker.com/v2/repositories/sonatype/nexus3/tags/latest
      register: nexus_newest_latest
      check_mode: false

    - name: The most recently pushed tags
      ansible.builtin.uri:
        url: https://hub.docker.com/v2/repositories/sonatype/nexus3/tags?page_size=100&ordering=last_updated
      register: nexus_newest_tags
      check_mode: false

    - name: Report the newest release
      ansible.builtin.debug:
        msg: >-
          Newest release: {{ nexus_newest_tags.json.results
          | selectattr('digest', 'equalto', nexus_newest_latest.json.digest)
          | map(attribute='name') | select('match', '^[0-9]+\.[0-9]+\.[0-9]+$')
          | first | default('not among the 100 most recently pushed tags') }}.
          services.yml declares {{ (quadlet_services | selectattr('name', 'eq', 'nexus') | first).image }}.

# Upgrade Nexus to the release services.yml declares: bump the image there, then
# run this play rather than site.yml, which would restart onto it with no copy
# to return to. With Nexus stopped, it copies everything but blob content and
# logs, and the Quadlet unit; then it starts the new release once, from the
# quadlet role's own template, and waits for it to accept writes, report the
# declared version, and finish its upgrade tasks. If any of that fails, it puts
# the copy and the old unit back, when the copy was complete, and starts the old
# release again, then fails: revert services.yml before the next site.yml. It refuses a downgrade, which
# a migrated database cannot take, and does nothing where the declared release
# already runs. A short nexus_upgrade_timeout forces the rollback, for a test.
- name: Nexus upgrade to its declared release
  hosts: nexus_servers
  gather_facts: false
  tags: [nexus-upgrade]
  vars:
    nexus_upgrade_service: "{{ quadlet_services | selectattr('name', 'eq', 'nexus') | first }}"
    # The tag's release, without a variant suffix such as -ubi.
    nexus_upgrade_release: "{{ nexus_upgrade_service.image.split(':')[-1] | regex_replace('-.*$', '') }}"
    nexus_upgrade_data: /mnt/nexus/data
    nexus_upgrade_backup: /mnt/nexus/upgrade-backup
    nexus_upgrade_unit: /etc/containers/systemd/nexus.container
    # What a rollback leaves alone: blob content, which an upgrade does not
    # rewrite, logs, and scratch space.
    nexus_upgrade_excludes: [/blobs/*/content/, /log/, /tmp/, /h2-migration/]
    # Seconds the new release has to accept writes.
    nexus_upgrade_timeout: 1800
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ nexus_api_user }}"
      url_password: "{{ nexus_api_password }}"
      force_basic_auth: true
  tasks:
    - name: The running container
      ansible.builtin.command:
        argv: [podman, container, inspect, nexus]
      register: nexus_upgrade_container
      changed_when: false
      check_mode: false

    - name: The running release
      ansible.builtin.set_fact:
        nexus_upgrade_running: >-
          {{ (nexus_upgrade_container.stdout | from_json)[0].Config.Labels.version | regex_replace('-.*$', '') }}

    - name: No downgrade, which a migrated database cannot take
      ansible.builtin.assert:
        that: nexus_upgrade_release is version(nexus_upgrade_running, '>=')
        fail_msg: services.yml declares {{ nexus_upgrade_release }}, older than the running {{ nexus_upgrade_running }}.
        quiet: true

    - name: Stop here where the declared release already runs
      ansible.builtin.meta: end_host
      when: nexus_upgrade_release == nexus_upgrade_running

    - name: Whether the declared image is here
      ansible.builtin.command:
        argv: [podman, image, exists, "{{ nexus_upgrade_service.image }}"]
      register: nexus_upgrade_image
      changed_when: false
      failed_when: nexus_upgrade_image.rc not in [0, 1]
      check_mode: false

    - name: The declared image, pulled while the old release still serves
      ansible.builtin.command:
        argv: [podman, pull, "{{ nexus_upgrade_service.image }}"]
      changed_when: true
      when: nexus_upgrade_image.rc == 1

    - name: Directory for the copy, which holds Nexus's keystores
      ansible.builtin.file:
        path: "{{ nexus_upgrade_backup }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Upgrade, or roll back
      block:
        - name: Nexus stopped, for a consistent copy
          ansible.builtin.systemd_service:
            name: nexus
            state: stopped

        - name: Copy of Nexus's data, blob content and logs aside
          ansible.builtin.command:
            argv: >-
              {{ ['rsync', '-a', '--delete']
                 + nexus_upgrade_excludes | map('regex_replace', '^', '--exclude=') | list
                 + [nexus_upgrade_data ~ '/', nexus_upgrade_backup ~ '/data/'] }}
          changed_when: true

        - name: Copy of the Quadlet unit
          ansible.builtin.copy:
            src: "{{ nexus_upgrade_unit }}"
            dest: "{{ nexus_upgrade_backup }}/nexus.container"
            remote_src: true
            mode: "0644"
          when: not ansible_check_mode

        # Only a complete copy is put back; before this, nothing has changed.
        - name: The copy is complete
          ansible.builtin.set_fact:
            nexus_upgrade_copied: true

        - name: The unit with the declared release
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/quadlet/templates/service.container.j2"
            dest: "{{ nexus_upgrade_unit }}"
            owner: root
            group: root
            mode: "0644"
          vars:
            quadlet_dir: "{{ nexus_upgrade_unit | dirname }}"
          loop: "{{ [nexus_upgrade_service] }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Nexus started on the declared release
          ansible.builtin.systemd_service:
            name: nexus
            state: started
            daemon_reload: true

        - name: Wait for the declared release to accept writes
          ansible.builtin.uri:
            url: "{{ nexus_url }}/service/rest/v1/status/writable"
          register: nexus_upgrade_writable
          until: nexus_upgrade_writable.status == 200
          retries: "{{ [(nexus_upgrade_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode
          no_log: true

        - name: The declared release is the one serving
          ansible.builtin.assert:
            that: >-
              (nexus_upgrade_writable.server | default('')) is search('^Nexus/' ~ (nexus_upgrade_release | regex_escape) ~ '-')
            fail_msg: Nexus answers as {{ nexus_upgrade_writable.server | default('nothing') }}, not {{ nexus_upgrade_release }}.
            quiet: true
          when: not ansible_check_mode

        # A restart before they finish can damage the browse and search indexes.
        - name: Wait for the upgrade tasks to finish
          ansible.builtin.uri:
            url: "{{ nexus_url }}/service/rest/v1/tasks"
          register: nexus_upgrade_tasks
          until: >-
            nexus_upgrade_tasks.json['items'] | selectattr('currentState', 'equalto', 'RUNNING') | list | length == 0
          retries: 240
          delay: 15
          when: not ansible_check_mode
          no_log: true

      rescue:
        - name: Nexus stopped, for the rollback
          ansible.builtin.systemd_service:
            name: nexus
            state: stopped

        - name: Nexus's data put back from the copy
          ansible.builtin.command:
            argv: >-
              {{ ['rsync', '-a', '--delete']
                 + nexus_upgrade_excludes | map('regex_replace', '^', '--exclude=') | list
                 + [nexus_upgrade_backup ~ '/data/', nexus_upgrade_data ~ '/'] }}
          changed_when: true
          when: nexus_upgrade_copied | default(false)

        - name: The old unit put back
          ansible.builtin.copy:
            src: "{{ nexus_upgrade_backup }}/nexus.container"
            dest: "{{ nexus_upgrade_unit }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: nexus_upgrade_copied | default(false)

        - name: Nexus started on the old release
          ansible.builtin.systemd_service:
            name: nexus
            state: started
            daemon_reload: true

        - name: Wait for the old release to accept writes
          ansible.builtin.uri:
            url: "{{ nexus_url }}/service/rest/v1/status/writable"
          register: nexus_upgrade_rolled_back
          until: nexus_upgrade_rolled_back.status == 200
          retries: 60
          delay: 10
          no_log: true

        - name: Report the rollback
          ansible.builtin.fail:
            msg: >-
              The upgrade to {{ nexus_upgrade_release }} failed, and Nexus runs
              {{ nexus_upgrade_running }} again{{ ' from the copy' if nexus_upgrade_copied | default(false) else '' }}.
              Revert the image in services.yml to
              {{ (nexus_upgrade_container.stdout | from_json)[0].ImageName }} before the next site.yml.

# Upgrade Jellyfin to the major release jellyfin_major declares: bump it, then
# run this play rather than site.yml, with --limit <host> so alock locks that
# host alone. A major release migrates the database in a way only a full
# restore undoes, and needs its plugins rebuilt for it, so, as Jellyfin's
# release notes direct, with Jellyfin stopped it copies the config directory (a
# reflink copy on the SSD's btrfs, sharing its blocks until they change) and
# the compose file, and removes the repository plugins. It then starts the new
# release once, migrating the database without them; adds back each plugin's
# newest build for that release, from the stable plugin repository, verified by
# its checksum; and starts it again, checking each loads. It refuses to begin
# while a plugin has no such build, refuses a downgrade, and does nothing where
# the declared major release already runs. If anything fails after the copy,
# it puts the copy and the old compose file back, starts the old release again,
# then fails: revert jellyfin_major before the next site.yml. What a release's
# notes ask for afterwards, such as 12.0's full library scan, is left to the
# dashboard.
- name: Jellyfin upgrade to its declared major release
  hosts: podman_hosts
  gather_facts: false
  become: true
  tags: [jellyfin-upgrade]
  vars:
    jellyfin_upgrade_image: docker.io/jellyfin/jellyfin:{{ jellyfin_major }}
    jellyfin_upgrade_unit: podman-compose@jellyfin.service
    jellyfin_upgrade_compose: /opt/jellyfin/docker-compose.yml
    jellyfin_upgrade_plugins_dir: "{{ jellyfin_config_dir }}/plugins"
    jellyfin_upgrade_backup: "{{ jellyfin_config_dir | dirname }}/upgrade-backup"
    jellyfin_upgrade_downloads: /var/cache/jellyfin-upgrade
    jellyfin_upgrade_repository: https://repo.jellyfin.org/files/plugin/manifest.json
    jellyfin_upgrade_url: http://127.0.0.1:8096
    # Seconds each start has to report itself healthy; the first one runs the
    # migrations, which on a large library take a while.
    jellyfin_upgrade_timeout: 3600
  tasks:
    - name: Only where Jellyfin is declared
      ansible.builtin.meta: end_host
      when: jellyfin_major is not defined

    - name: Jellyfin's newest release
      ansible.builtin.uri:
        url: https://api.github.com/repos/jellyfin/jellyfin/releases/latest
      register: jellyfin_upgrade_newest
      check_mode: false

    - name: Report the newest release
      ansible.builtin.debug:
        msg: >-
          Newest release: {{ jellyfin_upgrade_newest.json.tag_name | regex_replace('^v', '') }}.
          jellyfin_major declares {{ jellyfin_major }}.

    - name: The running container
      ansible.builtin.command:
        argv: [podman, container, inspect, jellyfin]
      register: jellyfin_upgrade_container
      changed_when: false
      check_mode: false

    - name: The running release
      ansible.builtin.set_fact:
        jellyfin_upgrade_running: >-
          {{ (jellyfin_upgrade_container.stdout | from_json)[0].Config.Labels['org.opencontainers.image.version'] }}

    - name: No downgrade, which a migrated database cannot take
      ansible.builtin.assert:
        that: jellyfin_major | int >= jellyfin_upgrade_running.split('.') | first | int
        fail_msg: jellyfin_major declares {{ jellyfin_major }}, older than the running {{ jellyfin_upgrade_running }}.
        quiet: true

    - name: Stop here where the declared major release already runs
      ansible.builtin.meta: end_host
      when: jellyfin_major | int == jellyfin_upgrade_running.split('.') | first | int

    - name: The declared major release, pulled while the old one still serves
      ansible.builtin.command:
        argv: [podman, pull, --quiet, "{{ jellyfin_upgrade_image }}"]
      changed_when: true

    - name: The pulled image
      ansible.builtin.command:
        argv: [podman, image, inspect, "{{ jellyfin_upgrade_image }}"]
      register: jellyfin_upgrade_pulled
      changed_when: false
      # A check run pulls nothing, so the image may not be here yet.
      failed_when: false
      check_mode: false

    - name: The release to upgrade to, as four parts like a plugin's targetAbi
      ansible.builtin.set_fact:
        jellyfin_upgrade_target: >-
          {{ ((((jellyfin_upgrade_pulled.stdout | from_json)[0].Labels['org.opencontainers.image.version'])
               if jellyfin_upgrade_pulled.rc == 0 else jellyfin_major ~ '.0').split('.') + ['0', '0', '0'])[:4] | join('.') }}

    - name: The pulled image is the declared major release
      ansible.builtin.assert:
        that: jellyfin_upgrade_target.split('.') | first | int == jellyfin_major | int
        fail_msg: "{{ jellyfin_upgrade_image }} is release {{ jellyfin_upgrade_target }}."
        quiet: true

    - name: The config directory's owner, whom the plugins' files belong to
      ansible.builtin.stat:
        path: "{{ jellyfin_config_dir }}"
      register: jellyfin_upgrade_owner

    - name: The repository plugins' metadata
      ansible.builtin.find:
        paths: "{{ jellyfin_upgrade_plugins_dir }}"
        patterns: [meta.json]
        recurse: true
        depth: 2
      register: jellyfin_upgrade_meta_files

    - name: Read each plugin's metadata
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ jellyfin_upgrade_meta_files.files }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"
      register: jellyfin_upgrade_meta

    - name: The stable plugin repository
      ansible.builtin.uri:
        url: "{{ jellyfin_upgrade_repository }}"
      register: jellyfin_upgrade_manifest
      check_mode: false

    # Each plugin's newest build whose targetAbi is the declared major release,
    # and no newer than the release pulled. Plugins are matched by GUID.
    - name: Each plugin's build for the declared release
      ansible.builtin.set_fact:
        jellyfin_upgrade_plugins: >-
          {{ jellyfin_upgrade_plugins | default([])
             + [{'installed': item.source | dirname, 'guid': plugin_meta.guid,
                 'name': plugin_entry.name | default(plugin_meta.name),
                 'build': plugin_builds | first | default({})}] }}
      vars:
        plugin_meta: "{{ item.content | b64decode | from_json }}"
        plugin_entry: "{{ jellyfin_upgrade_manifest.json | selectattr('guid', 'equalto', plugin_meta.guid) | first | default({}) }}"
        plugin_builds: >-
          {{ plugin_entry.versions | default([])
             | selectattr('targetAbi', 'version', jellyfin_major ~ '.0.0.0', '>=')
             | selectattr('targetAbi', 'version', jellyfin_upgrade_target, '<=')
             | sort(attribute='timestamp', reverse=true) }}
      loop: "{{ jellyfin_upgrade_meta.results }}"
      loop_control:
        label: "{{ item.source | dirname | basename }}"

    - name: Every plugin has a build for the declared release
      ansible.builtin.assert:
        that: jellyfin_upgrade_plugins | default([]) | map(attribute='build') | reject | list | length == 0
        fail_msg: >-
          No build for Jellyfin {{ jellyfin_upgrade_target }} in the stable plugin repository of:
          {{ jellyfin_upgrade_plugins | selectattr('build', 'equalto', {}) | map(attribute='name') | join(', ') }}.
          Remove those plugins from the dashboard first, or wait for their builds.
        quiet: true

    - name: Directory for the plugins' downloads
      ansible.builtin.file:
        path: "{{ jellyfin_upgrade_downloads }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: The plugins' builds, fetched while the old release still serves
      ansible.builtin.get_url:
        url: "{{ item.build.sourceUrl }}"
        dest: "{{ jellyfin_upgrade_downloads }}/{{ item.guid }}_{{ item.build.version }}.zip"
        checksum: "md5:{{ item.build.checksum }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ jellyfin_upgrade_plugins | default([]) }}"
      loop_control:
        label: "{{ item.name }} {{ item.build.version }}"
      # A check run creates no directory to download into.
      when: not ansible_check_mode

    - name: Directory for the copy
      ansible.builtin.file:
        path: "{{ jellyfin_upgrade_backup }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Upgrade, or roll back
      block:
        - name: Jellyfin stopped, for a consistent copy
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: stopped

        - name: The previous upgrade's copy removed
          ansible.builtin.file:
            path: "{{ jellyfin_upgrade_backup }}/config"
            state: absent

        - name: Copy of the config directory
          ansible.builtin.command:
            argv: [cp, -a, --reflink=always, "{{ jellyfin_config_dir }}", "{{ jellyfin_upgrade_backup }}/config"]
          changed_when: true

        - name: Copy of the compose file
          ansible.builtin.copy:
            src: "{{ jellyfin_upgrade_compose }}"
            dest: "{{ jellyfin_upgrade_backup }}/docker-compose.yml"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: not ansible_check_mode

        # Only a complete copy is put back; before this, nothing has changed.
        - name: The copy is complete
          ansible.builtin.set_fact:
            jellyfin_upgrade_copied: true

        - name: The plugins built for the old release removed
          ansible.builtin.file:
            path: "{{ item.installed }}"
            state: absent
          loop: "{{ jellyfin_upgrade_plugins | default([]) }}"
          loop_control:
            label: "{{ item.installed | basename }}"

        - name: The compose file with the declared release
          ansible.builtin.template:
            src: "{{ inventory_dir }}/../files/{{ inventory_hostname }}{{ jellyfin_upgrade_compose }}.j2"
            dest: "{{ jellyfin_upgrade_compose }}"
            owner: root
            group: root
            mode: "0644"

        - name: Jellyfin started, to migrate its database without plugins
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: started

        - name: Wait for the migration and startup
          ansible.builtin.uri:
            url: "{{ jellyfin_upgrade_url }}/health"
            return_content: true
          register: jellyfin_upgrade_health
          until: jellyfin_upgrade_health.content | default('') == 'Healthy'
          retries: "{{ [(jellyfin_upgrade_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode

        - name: The declared release is the one serving
          ansible.builtin.uri:
            url: "{{ jellyfin_upgrade_url }}/System/Info/Public"
          register: jellyfin_upgrade_info
          failed_when: not ((jellyfin_upgrade_info.json | default({})).Version | default('')).startswith(jellyfin_major ~ '.')
          when: not ansible_check_mode

        - name: Jellyfin stopped, to add the plugins
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: stopped

        # Named <name>_<version>, as Jellyfin's own installer names them.
        - name: Directories for the plugins' builds
          ansible.builtin.file:
            path: "{{ jellyfin_upgrade_plugins_dir }}/{{ item.name }}_{{ item.build.version }}"
            state: directory
            owner: "{{ jellyfin_upgrade_owner.stat.uid }}"
            group: "{{ jellyfin_upgrade_owner.stat.gid }}"
            mode: "0755"
          loop: "{{ jellyfin_upgrade_plugins | default([]) }}"
          loop_control:
            label: "{{ item.name }} {{ item.build.version }}"

        - name: Each plugin's build for the declared release
          ansible.builtin.unarchive:
            src: "{{ jellyfin_upgrade_downloads }}/{{ item.guid }}_{{ item.build.version }}.zip"
            dest: "{{ jellyfin_upgrade_plugins_dir }}/{{ item.name }}_{{ item.build.version }}"
            remote_src: true
            owner: "{{ jellyfin_upgrade_owner.stat.uid }}"
            group: "{{ jellyfin_upgrade_owner.stat.gid }}"
          loop: "{{ jellyfin_upgrade_plugins | default([]) }}"
          loop_control:
            label: "{{ item.name }} {{ item.build.version }}"
          when: not ansible_check_mode

        - name: Jellyfin started with its plugins
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: started

        - name: Wait for the startup
          ansible.builtin.uri:
            url: "{{ jellyfin_upgrade_url }}/health"
            return_content: true
          register: jellyfin_upgrade_health
          until: jellyfin_upgrade_health.content | default('') == 'Healthy'
          retries: "{{ [(jellyfin_upgrade_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode

        # podman-compose recreates the container at each start, so its log is
        # this start's.
        - name: The container's log
          ansible.builtin.command:
            argv: [podman, logs, jellyfin]
          register: jellyfin_upgrade_log
          changed_when: false
          when: not ansible_check_mode

        - name: Every plugin's build loaded
          ansible.builtin.assert:
            that: >-
              (jellyfin_upgrade_log.stdout ~ jellyfin_upgrade_log.stderr)
              is search('Loaded plugin: .+ ' ~ (item.build.version | regex_escape))
            fail_msg: "{{ item.name }} {{ item.build.version }} did not load."
            quiet: true
          loop: "{{ jellyfin_upgrade_plugins | default([]) }}"
          loop_control:
            label: "{{ item.name }} {{ item.build.version }}"
          when: not ansible_check_mode

        - name: Report the upgrade
          ansible.builtin.debug:
            msg: >-
              Jellyfin runs {{ (jellyfin_upgrade_info.json | default({})).Version | default(jellyfin_upgrade_target) }}, from
              {{ jellyfin_upgrade_running }}, with
              {{ jellyfin_upgrade_plugins | default([]) | map(attribute='name') | zip(jellyfin_upgrade_plugins | default([])
                 | map(attribute='build') | map(attribute='version')) | map('join', ' ') | join(', ') }}.
              The copy to return to is in {{ jellyfin_upgrade_backup }}. Do what its release notes ask for
              after an upgrade, such as 12.0's full library scan, from the dashboard.

      rescue:
        - name: Jellyfin stopped, for the rollback
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: stopped

        - name: The config directory put back from the copy
          ansible.builtin.command:
            argv: [rsync, -a, --delete, "{{ jellyfin_upgrade_backup }}/config/", "{{ jellyfin_config_dir }}/"]
          changed_when: true
          when: jellyfin_upgrade_copied | default(false)

        - name: The old compose file put back
          ansible.builtin.copy:
            src: "{{ jellyfin_upgrade_backup }}/docker-compose.yml"
            dest: "{{ jellyfin_upgrade_compose }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: jellyfin_upgrade_copied | default(false)

        - name: Jellyfin started on the old release
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: started

        - name: Wait for the old release
          ansible.builtin.uri:
            url: "{{ jellyfin_upgrade_url }}/health"
            return_content: true
          register: jellyfin_upgrade_rolled_back
          until: jellyfin_upgrade_rolled_back.content | default('') == 'Healthy'
          retries: 60
          delay: 10
          when: not ansible_check_mode

        - name: Report the rollback
          ansible.builtin.fail:
            msg: >-
              The upgrade to Jellyfin {{ jellyfin_major }} failed, and it runs {{ jellyfin_upgrade_running }}
              again{{ ' from the copy' if jellyfin_upgrade_copied | default(false) else '' }}.
              Revert jellyfin_major to {{ jellyfin_upgrade_running.split('.') | first }} before the next site.yml.
