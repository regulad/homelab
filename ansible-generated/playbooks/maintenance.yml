---
# Maintenance that cannot be automated: each play here is a deliberate
# operation, run by hand after its declared version or setting is bumped. Run a
# single one with --tags.

- name: Maintenance both stages share
  ansible.builtin.import_playbook: ../../ansible-common/playbooks/maintenance.yml

# The Pterodactyl panel cannot update itself; bump pterodactyl_version, then
# run this play to upgrade by the panel's documented procedure.
- name: Pterodactyl panel upgrade
  hosts: pterodactyl
  gather_facts: false
  become: true
  tags: [pterodactyl]
  tasks:
    - name: Upgrade to the declared release
      ansible.builtin.include_role:
        name: pterodactyl
        tasks_from: update

# Wings is pinned; bump wings_version and wings_sha256, then run this play to
# upgrade by Wings' documented procedure.
- name: Pterodactyl Wings upgrade
  hosts: wings
  gather_facts: false
  become: true
  tags: [wings]
  tasks:
    - name: Upgrade to the declared release
      ansible.builtin.include_role:
        name: wings
        tasks_from: update

# Set zram up again to its configuration where what it holds fits back into
# RAM; elsewhere, and on the hardware hosts, it changes at the next boot.
- name: Zram to its configuration
  hosts: debian:ubuntu:!proxmox_containers
  gather_facts: false
  become: true
  tags: [zram]
  tasks:
    - name: Set zram up again
      ansible.builtin.include_role:
        name: swap
        tasks_from: resize

# After a host was stopped uncleanly: move aside Podman's volatile stores that
# came back unreadable, which otherwise keep every Quadlet from starting, and
# start the Quadlets that failed. Hosts whose stores are whole are left alone.
- name: Podman's volatile stores
  hosts: podman_hosts
  gather_facts: false
  become: true
  tags: [podman-volatile]
  tasks:
    - name: Repair the unreadable ones
      ansible.builtin.include_role:
        name: podman
        tasks_from: repair_volatile

# Upgrade a Proxmox container running Ubuntu to the release its host_vars
# declare in ubuntu_release, by Ubuntu's own do-release-upgrade, one host at a
# time: bump ubuntu_release, then run this play with --limit. Hosts that declare
# none, or run it already, are left alone. VMs are refused: their inventory
# carries no VMID for the snapshot.
#
# Before the upgrade the container is snapshotted on its node as
# pre-release-upgrade: `pct rollback <vmid> pre-release-upgrade` undoes the
# upgrade, and `pct delsnapshot <vmid> pre-release-upgrade` removes it once the
# host is verified. The non-interactive frontend keeps a changed configuration
# file's old version at each prompt and answers yes to its own questions. It
# disables third-party apt sources, which the host's next site.yml restores, so
# afterwards run site.yml on the host, then maintenance.yml --tags aide-accept.
# A run cut short after the upgrade has started picks up where it was, at the
# wait for it.
- name: Ubuntu release upgrade to its declared release
  hosts: ubuntu
  gather_facts: true
  serial: 1
  become: true
  tags: [release-upgrade]
  vars:
    # The upgrade removes the old release's versioned Python, which Ansible
    # would otherwise discover and keep using; the unversioned one stays.
    ansible_python_interpreter: /usr/bin/python3
    # A container shares its node's kernel, whose boot ID, which the reboot
    # module compares by default, does not change; systemd's own start does.
    release_upgrade_boot_time: systemctl show --property=UserspaceTimestampMonotonic --value
  tasks:
    - name: Only where a release is declared
      ansible.builtin.meta: end_host
      when: ubuntu_release is not defined

    # The upgrade runs in a unit of its own, as it restarts services and can
    # outlast a connection, and the unit stays until the reboot after it. Its
    # state is read without Python, which the upgrade replaces as it goes.
    - name: Read the upgrade's unit
      ansible.builtin.raw: systemctl show release-upgrade.service --property=LoadState --value
      register: release_upgrade_unit
      changed_when: false
      check_mode: false

    - name: Whether an upgrade has started since the last boot
      ansible.builtin.set_fact:
        release_upgrade_started: "{{ (release_upgrade_unit.stdout | trim) == 'loaded' }}"

    - name: No downgrade
      ansible.builtin.assert:
        that: ubuntu_release is version(ansible_facts.distribution_version, '>=')
        fail_msg: ubuntu_release declares {{ ubuntu_release }}, older than the running {{ ansible_facts.distribution_version }}.
        quiet: true

    - name: Stop here where the declared release runs
      ansible.builtin.meta: end_host
      when:
        - ansible_facts.distribution_version is version(ubuntu_release, '==')
        - not release_upgrade_started

    - name: A Proxmox container
      ansible.builtin.assert:
        that: proxmox_vmid | default(none) is not none
        fail_msg: >-
          {{ inventory_hostname }} is not a Proxmox container: the play snapshots
          a container on its node first, and has been tested on containers alone.
        quiet: true

    - name: One that may reboot on its own
      ansible.builtin.assert:
        that: auto_updates_unattended_upgrade['Automatic-Reboot'] | default('true') != 'false'
        fail_msg: "{{ inventory_hostname }} is never rebooted on its own, and the upgrade ends in a reboot."
        quiet: true

    - name: Read Podman's storage settings
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop: [/usr/bin/podman, /etc/containers/storage.conf, /usr/share/containers/storage.conf]
      register: release_upgrade_podman

    # A Podman that runs without any storage.conf recorded no storage driver,
    # and the new release's Podman depends on containers-storage, whose
    # storage.conf names one; Podman then refuses to run.
    - name: Podman keeps the storage driver it recorded
      ansible.builtin.assert:
        that: >-
          not release_upgrade_podman.results[0].stat.exists
          or release_upgrade_podman.results[1].stat.exists
          or release_upgrade_podman.results[2].stat.exists
        fail_msg: >-
          Podman on {{ inventory_hostname }} runs without a storage.conf: set
          podman_storage_driver_unnamed in its host_vars and run site.yml --tags
          podman on it first.
        quiet: true

    # Netplan's unit among what a container needs, before the new release's
    # first boot.
    - name: What a container needs from inside
      ansible.builtin.include_role:
        name: lxc_guest

    - name: Its settings in effect
      ansible.builtin.meta: flush_handlers

    - name: Before the upgrade
      when: not release_upgrade_started
      block:
        - name: The running release's updates, which the upgrade requires first
          ansible.builtin.apt:
            update_cache: true
            upgrade: dist

        - name: Read whether they need a reboot
          ansible.builtin.stat:
            path: /run/reboot-required
            get_checksum: false
          register: release_upgrade_reboot_required

        - name: Reboot into them
          ansible.builtin.reboot:
            boot_time_command: "{{ release_upgrade_boot_time }}"
          when: release_upgrade_reboot_required.stat.exists

        - name: Ubuntu's release upgrader
          ansible.builtin.apt:
            name: ubuntu-release-upgrader-core
            state: present

        - name: The release it offers
          ansible.builtin.command:
            argv: [do-release-upgrade, --check-dist-upgrade-only]
          register: release_upgrade_offer
          changed_when: false
          failed_when: false
          check_mode: false

        - name: It offers the declared release
          ansible.builtin.assert:
            that: ("New release '" ~ ubuntu_release) in release_upgrade_offer.stdout
            fail_msg: "do-release-upgrade offers: {{ release_upgrade_offer.stdout_lines | last | default('nothing') }}"
            quiet: true

        - name: The container's snapshot on its node
          ansible.builtin.command:
            argv:
              - pct
              - snapshot
              - "{{ proxmox_vmid }}"
              - pre-release-upgrade
              - --description
              - Before the upgrade to Ubuntu {{ ubuntu_release }}.
          delegate_to: "{{ ansible_host }}"
          vars:
            ansible_connection: ssh
            ansible_user: root
            ansible_become: false
          changed_when: true

        - name: The upgrade
          ansible.builtin.command:
            argv:
              - systemd-run
              - --unit=release-upgrade
              - --remain-after-exit
              - --property=Type=exec
              - --setenv=DEBIAN_FRONTEND=noninteractive
              - /usr/bin/do-release-upgrade
              - --frontend=DistUpgradeViewNonInteractive
          changed_when: true

    # A read that fails while packages change counts as one more wait.
    - name: Wait for it
      ansible.builtin.raw: systemctl show release-upgrade.service --property=SubState --value
      register: release_upgrade_state
      until: (release_upgrade_state.stdout | default('') | trim) not in ['start', 'running', '']
      retries: 240
      delay: 30
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read how it ended
      ansible.builtin.raw: systemctl show release-upgrade.service --property=Result --property=ExecMainStatus
      register: release_upgrade_result
      changed_when: false
      check_mode: false

    - name: It succeeded
      ansible.builtin.assert:
        that:
          - "'Result=success' in release_upgrade_result.stdout"
          - "'ExecMainStatus=0' in release_upgrade_result.stdout"
        fail_msg: >-
          The upgrade ended {{ release_upgrade_result.stdout | trim | replace('\n', ', ') }}: see
          /var/log/dist-upgrade/main.log and journalctl -u release-upgrade on
          {{ inventory_hostname }}, or roll back to the snapshot.
        quiet: true
      when: not ansible_check_mode

    - name: Reboot into the new release
      ansible.builtin.reboot:
        boot_time_command: "{{ release_upgrade_boot_time }}"

    - name: The new release's facts
      ansible.builtin.setup:
        gather_subset: [min]

    - name: The declared release runs
      ansible.builtin.assert:
        that: ansible_facts.distribution_version is version(ubuntu_release, '==')
        fail_msg: "{{ inventory_hostname }} runs Ubuntu {{ ansible_facts.distribution_version }}, not {{ ubuntu_release }}."
        quiet: true
      when: not ansible_check_mode

    - name: Read systemd's state once it has booted
      ansible.builtin.command:
        argv: [systemctl, is-system-running, --wait]
      register: release_upgrade_systemd
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read its failed units
      ansible.builtin.command:
        argv: [systemctl, --failed, --plain, --no-legend]
      register: release_upgrade_failed
      changed_when: false
      check_mode: false

    - name: It runs with no failed unit
      ansible.builtin.assert:
        that: release_upgrade_systemd.stdout == 'running'
        fail_msg: "systemd is {{ release_upgrade_systemd.stdout }}: {{ release_upgrade_failed.stdout_lines | join('; ') }}"
        quiet: true
      when: not ansible_check_mode

    - name: What remains
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} runs Ubuntu {{ ubuntu_release }}. Run site.yml
          on it, which restores the third-party apt sources the upgrade disabled,
          then maintenance.yml --tags aide-accept; once it is verified, run
          `pct delsnapshot {{ proxmox_vmid }} pre-release-upgrade` on {{ ansible_host }}.

# Compact each of Nexus's blob stores, reclaiming the space of soft-deleted
# blobs, such as Docker's abandoned upload chunks, which Nexus keeps until a
# compaction. Nexus 3.70's REST API runs and polls tasks but cannot create
# them, so a missing compaction task is created through ExtDirect, as Nexus's
# own UI does, with a manual schedule. Basic authentication skips Nexus's
# anti-CSRF check, which applies to UI sessions only.
- name: Nexus blob store compaction
  hosts: nexus_servers
  gather_facts: false
  tags: [nexus-compact]
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ nexus_api_user }}"
      url_password: "{{ nexus_api_password }}"
      force_basic_auth: true
  tasks:
    - name: Blob stores
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/blobstores"
      register: nexus_blobstores
      check_mode: false
      no_log: true

    - name: Compaction tasks
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks?type=blobstore.compact"
      register: nexus_compact_tasks
      check_mode: false
      no_log: true

    - name: Create a compaction task for each blob store without one
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/extdirect"
        method: POST
        body_format: json
        body:
          action: coreui_Task
          method: create
          type: rpc
          tid: 1
          data:
            - enabled: true
              name: Compact blob store {{ item }}
              typeId: blobstore.compact
              schedule: manual
              notificationCondition: FAILURE
              properties:
                blobstoreName: "{{ item }}"
      register: nexus_compact_created
      # ExtDirect answers 200 whatever happened; its result says.
      failed_when: not (nexus_compact_created.json.result.success | default(false))
      changed_when: true
      loop: >-
        {{ nexus_blobstores.json | map(attribute='name')
           | reject('in', nexus_compact_tasks.json['items'] | map(attribute='name')
                          | map('regex_replace', '^Compact blob store ', '') | list)
           | list }}
      no_log: true

    - name: Compaction tasks, created ones included
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks?type=blobstore.compact"
      register: nexus_compact_tasks
      check_mode: false
      no_log: true

    - name: Run each compaction task
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks/{{ item.id }}/run"
        method: POST
        status_code: 204
      changed_when: true
      loop: "{{ nexus_compact_tasks.json['items'] }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Wait for each compaction to finish
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks/{{ item.id }}"
      register: nexus_compact_status
      until: nexus_compact_status.json.currentState == 'WAITING'
      retries: 240
      delay: 15
      failed_when: >-
        nexus_compact_status.json.currentState == 'WAITING'
        and nexus_compact_status.json.lastRunResult != 'OK'
      loop: "{{ nexus_compact_tasks.json['items'] }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode
      no_log: true

# Move Nexus off OrientDB, which 3.70.x is the last release to run, to H2, by
# Sonatype's Database Migrator procedure: export the databases, stop Nexus,
# migrate the export with the migrator of the 3.70.5 release it runs, put
# nexus.mv.db in place, enable the datastore, and start it again on 3.70.5.
# services.yml then moves the image to a current release. Rerunning is safe:
# a host already on H2 is skipped, and an unfinished run starts over from a
# fresh export. The OrientDB files stay in place until removed by hand.
- name: Nexus database from OrientDB to H2
  hosts: nexus_servers
  gather_facts: false
  tags: [nexus-h2]
  vars:
    nexus_h2_data: /mnt/nexus/data
    # On the data volume, as the export task writes it from inside Nexus's
    # container, where the volume is /nexus-data.
    nexus_h2_work: "{{ nexus_h2_data }}/h2-migration"
    nexus_h2_migrator_url: https://download.sonatype.com/nexus/nxrm3-migrator/nexus-db-migrator-3.70.5-02.jar
    nexus_h2_migrator_checksum: sha256:b026493c5dd331523d61bc39a54fcef7e1b3efe7f9d6409fd44a8345e01f0492
    # The migrator runs on the Java 8 of the release it belongs to.
    nexus_h2_migrator_image: docker.io/sonatype/nexus3:3.70.5
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ nexus_api_user }}"
      url_password: "{{ nexus_api_password }}"
      force_basic_auth: true
  tasks:
    - name: Nexus's properties
      ansible.builtin.slurp:
        src: "{{ nexus_h2_data }}/etc/nexus.properties"
      register: nexus_h2_properties

    - name: Stop here where Nexus already runs on H2
      ansible.builtin.meta: end_host
      when: >-
        nexus_h2_properties.content | b64decode
        is search('(?m)^nexus\.datastore\.enabled\s*=\s*true')

    - name: Work directory, and the migrator's temporary directory in it
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "200"
        group: "200"
        mode: "0755"
      loop:
        - "{{ nexus_h2_work }}"
        - "{{ nexus_h2_work }}/tmp"

    - name: Earlier runs' exports and output
      ansible.builtin.find:
        paths: "{{ nexus_h2_work }}"
        patterns: ["*.bak", "nexus.mv.db", "nexus.trace.db"]
      register: nexus_h2_stale

    - name: No earlier runs' exports or output
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ nexus_h2_stale.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: The 3.70.5 Database Migrator
      ansible.builtin.get_url:
        url: "{{ nexus_h2_migrator_url }}"
        checksum: "{{ nexus_h2_migrator_checksum }}"
        dest: "{{ nexus_h2_work }}/nexus-db-migrator.jar"
        owner: "200"
        group: "200"
        mode: "0644"
      when: not ansible_check_mode

    - name: Nexus running, for the export
      ansible.builtin.systemd_service:
        name: nexus
        state: started

    - name: Wait for Nexus to accept writes
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/status/writable"
      register: nexus_h2_writable
      until: nexus_h2_writable.status == 200
      retries: 60
      delay: 10
      when: not ansible_check_mode
      no_log: true

    - name: Export tasks
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks?type=db.backup"
      register: nexus_h2_export_tasks
      check_mode: false
      no_log: true

    - name: Create the export task where there is none
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/extdirect"
        method: POST
        body_format: json
        body:
          action: coreui_Task
          method: create
          type: rpc
          tid: 1
          data:
            - enabled: true
              name: Export databases for the H2 migration
              typeId: db.backup
              schedule: manual
              notificationCondition: FAILURE
              properties:
                location: /nexus-data/h2-migration
      register: nexus_h2_export_created
      # ExtDirect answers 200 whatever happened; its result says.
      failed_when: not (nexus_h2_export_created.json.result.success | default(false))
      changed_when: true
      when: nexus_h2_export_tasks.json['items'] | length == 0
      no_log: true

    - name: Export tasks, a created one included
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks?type=db.backup"
      register: nexus_h2_export_tasks
      check_mode: false
      no_log: true

    - name: Run the export
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks/{{ nexus_h2_export_tasks.json['items'][0].id }}/run"
        method: POST
        status_code: 204
      changed_when: true
      when: not ansible_check_mode
      no_log: true

    - name: Wait for the export to finish
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks/{{ nexus_h2_export_tasks.json['items'][0].id }}"
      register: nexus_h2_export_status
      until: nexus_h2_export_status.json.currentState == 'WAITING'
      retries: 120
      delay: 10
      failed_when: >-
        nexus_h2_export_status.json.currentState == 'WAITING'
        and nexus_h2_export_status.json.lastRunResult != 'OK'
      when: not ansible_check_mode
      no_log: true

    - name: The export's files
      ansible.builtin.find:
        paths: "{{ nexus_h2_work }}"
        patterns: ["component-*.bak", "config-*.bak", "security-*.bak"]
      register: nexus_h2_exports

    - name: One export of each database the migrator reads
      ansible.builtin.assert:
        that: >-
          nexus_h2_exports.files | map(attribute='path') | map('basename')
          | map('regex_replace', '-.*$', '') | sort | list
          == ['component', 'config', 'security']
        quiet: true
      when: not ansible_check_mode

    - name: Nexus stopped, for the migration
      ansible.builtin.systemd_service:
        name: nexus
        state: stopped

    # Sonatype documents a 16 GB heap; a 4 GB one is plenty for this
    # instance's database of under 1 GB, and fits in the container with
    # Nexus stopped.
    - name: Migrate the export to H2
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - --network=none
          - --user=200:200
          - --volume={{ nexus_h2_work }}:/work
          - --workdir=/work
          - --entrypoint=java
          - "{{ nexus_h2_migrator_image }}"
          - -Xmx4g
          - -XX:+UseG1GC
          - -XX:MaxDirectMemorySize=1g
          - -Djava.io.tmpdir=/work/tmp
          - -jar
          - /work/nexus-db-migrator.jar
          - --migration_type=h2
          - --yes
      changed_when: true

    - name: The migrated database
      ansible.builtin.copy:
        src: "{{ nexus_h2_work }}/nexus.mv.db"
        dest: "{{ nexus_h2_data }}/db/nexus.mv.db"
        remote_src: true
        owner: "200"
        group: "200"
        mode: "0644"
      when: not ansible_check_mode

    - name: Nexus on its datastore
      ansible.builtin.lineinfile:
        path: "{{ nexus_h2_data }}/etc/nexus.properties"
        regexp: '^#?\s*nexus\.datastore\.enabled\s*='
        line: nexus.datastore.enabled=true

    - name: Nexus running again, on H2
      ansible.builtin.systemd_service:
        name: nexus
        state: started

    - name: Wait for Nexus to accept writes on H2
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/status/writable"
      register: nexus_h2_writable
      until: nexus_h2_writable.status == 200
      retries: 60
      delay: 10
      when: not ansible_check_mode
      no_log: true

    # Nexus rebuilds its browse and search indexes after a migration, and
    # must not restart until they finish.
    - name: Wait for the post-migration tasks to finish
      ansible.builtin.uri:
        url: "{{ nexus_url }}/service/rest/v1/tasks"
      register: nexus_h2_tasks
      until: >-
        nexus_h2_tasks.json['items'] | selectattr('currentState', 'equalto', 'RUNNING') | list | length == 0
      retries: 240
      delay: 15
      when: not ansible_check_mode
      no_log: true

# Nexus's newest release, beside the one services.yml declares, so a bump to it
# is a one-line edit before the upgrade below. Docker Hub tags each release
# with its version and, for the newest, latest too: the version tag with
# latest's digest names it. A play of its own, so Nexus's credentials never
# reach Docker Hub.
- name: Nexus's newest release
  hosts: nexus_servers
  gather_facts: false
  tags: [nexus-upgrade]
  tasks:
    - name: The latest tag
      ansible.builtin.uri:
        url: https://hub.docker.com/v2/repositories/sonatype/nexus3/tags/latest
      register: nexus_newest_latest
      check_mode: false

    - name: The most recently pushed tags
      ansible.builtin.uri:
        url: https://hub.docker.com/v2/repositories/sonatype/nexus3/tags?page_size=100&ordering=last_updated
      register: nexus_newest_tags
      check_mode: false

    - name: Report the newest release
      ansible.builtin.debug:
        msg: >-
          Newest release: {{ nexus_newest_tags.json.results
          | selectattr('digest', 'equalto', nexus_newest_latest.json.digest)
          | map(attribute='name') | select('match', '^[0-9]+\.[0-9]+\.[0-9]+$')
          | first | default('not among the 100 most recently pushed tags') }}.
          services.yml declares {{ (quadlet_services | selectattr('name', 'eq', 'nexus') | first).image }}.

# Upgrade Nexus to the release services.yml declares: bump the image there, then
# run this play rather than site.yml, which would restart onto it with no copy
# to return to. With Nexus stopped, it copies everything but blob content and
# logs, and the Quadlet unit; then it starts the new release once, from the
# quadlet role's own template, and waits for it to accept writes, report the
# declared version, and finish its upgrade tasks. If any of that fails, it puts
# the copy and the old unit back, when the copy was complete, and starts the old
# release again, then fails: revert services.yml before the next site.yml. It refuses a downgrade, which
# a migrated database cannot take, and does nothing where the declared release
# already runs. A short nexus_upgrade_timeout forces the rollback, for a test.
- name: Nexus upgrade to its declared release
  hosts: nexus_servers
  gather_facts: false
  tags: [nexus-upgrade]
  vars:
    nexus_upgrade_service: "{{ quadlet_services | selectattr('name', 'eq', 'nexus') | first }}"
    # The tag's release, without a variant suffix such as -ubi.
    nexus_upgrade_release: "{{ nexus_upgrade_service.image.split(':')[-1] | regex_replace('-.*$', '') }}"
    nexus_upgrade_data: /mnt/nexus/data
    nexus_upgrade_backup: /mnt/nexus/upgrade-backup
    nexus_upgrade_unit: /etc/containers/systemd/nexus.container
    # What a rollback leaves alone: blob content, which an upgrade does not
    # rewrite, logs, and scratch space.
    nexus_upgrade_excludes: [/blobs/*/content/, /log/, /tmp/, /h2-migration/]
    # Seconds the new release has to accept writes.
    nexus_upgrade_timeout: 1800
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ nexus_api_user }}"
      url_password: "{{ nexus_api_password }}"
      force_basic_auth: true
  tasks:
    - name: The running container
      ansible.builtin.command:
        argv: [podman, container, inspect, nexus]
      register: nexus_upgrade_container
      changed_when: false
      check_mode: false

    - name: The running release
      ansible.builtin.set_fact:
        nexus_upgrade_running: >-
          {{ (nexus_upgrade_container.stdout | from_json)[0].Config.Labels.version | regex_replace('-.*$', '') }}

    - name: No downgrade, which a migrated database cannot take
      ansible.builtin.assert:
        that: nexus_upgrade_release is version(nexus_upgrade_running, '>=')
        fail_msg: services.yml declares {{ nexus_upgrade_release }}, older than the running {{ nexus_upgrade_running }}.
        quiet: true

    - name: Stop here where the declared release already runs
      ansible.builtin.meta: end_host
      when: nexus_upgrade_release == nexus_upgrade_running

    - name: Whether the declared image is here
      ansible.builtin.command:
        argv: [podman, image, exists, "{{ nexus_upgrade_service.image }}"]
      register: nexus_upgrade_image
      changed_when: false
      failed_when: nexus_upgrade_image.rc not in [0, 1]
      check_mode: false

    - name: The declared image, pulled while the old release still serves
      ansible.builtin.command:
        argv: [podman, pull, "{{ nexus_upgrade_service.image }}"]
      changed_when: true
      when: nexus_upgrade_image.rc == 1

    - name: Directory for the copy, which holds Nexus's keystores
      ansible.builtin.file:
        path: "{{ nexus_upgrade_backup }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Upgrade, or roll back
      block:
        - name: Nexus stopped, for a consistent copy
          ansible.builtin.systemd_service:
            name: nexus
            state: stopped

        - name: Copy of Nexus's data, blob content and logs aside
          ansible.builtin.command:
            argv: >-
              {{ ['rsync', '-a', '--delete']
                 + nexus_upgrade_excludes | map('regex_replace', '^', '--exclude=') | list
                 + [nexus_upgrade_data ~ '/', nexus_upgrade_backup ~ '/data/'] }}
          changed_when: true

        - name: Copy of the Quadlet unit
          ansible.builtin.copy:
            src: "{{ nexus_upgrade_unit }}"
            dest: "{{ nexus_upgrade_backup }}/nexus.container"
            remote_src: true
            mode: "0644"
          when: not ansible_check_mode

        # Only a complete copy is put back; before this, nothing has changed.
        - name: The copy is complete
          ansible.builtin.set_fact:
            nexus_upgrade_copied: true

        - name: The unit with the declared release
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/quadlet/templates/service.container.j2"
            dest: "{{ nexus_upgrade_unit }}"
            owner: root
            group: root
            mode: "0644"
          vars:
            quadlet_dir: "{{ nexus_upgrade_unit | dirname }}"
          loop: "{{ [nexus_upgrade_service] }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Nexus started on the declared release
          ansible.builtin.systemd_service:
            name: nexus
            state: started
            daemon_reload: true

        - name: Wait for the declared release to accept writes
          ansible.builtin.uri:
            url: "{{ nexus_url }}/service/rest/v1/status/writable"
          register: nexus_upgrade_writable
          until: nexus_upgrade_writable.status == 200
          retries: "{{ [(nexus_upgrade_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode
          no_log: true

        - name: The declared release is the one serving
          ansible.builtin.assert:
            that: >-
              (nexus_upgrade_writable.server | default('')) is search('^Nexus/' ~ (nexus_upgrade_release | regex_escape) ~ '-')
            fail_msg: Nexus answers as {{ nexus_upgrade_writable.server | default('nothing') }}, not {{ nexus_upgrade_release }}.
            quiet: true
          when: not ansible_check_mode

        # A restart before they finish can damage the browse and search indexes.
        - name: Wait for the upgrade tasks to finish
          ansible.builtin.uri:
            url: "{{ nexus_url }}/service/rest/v1/tasks"
          register: nexus_upgrade_tasks
          until: >-
            nexus_upgrade_tasks.json['items'] | selectattr('currentState', 'equalto', 'RUNNING') | list | length == 0
          retries: 240
          delay: 15
          when: not ansible_check_mode
          no_log: true

      rescue:
        - name: Nexus stopped, for the rollback
          ansible.builtin.systemd_service:
            name: nexus
            state: stopped

        - name: Nexus's data put back from the copy
          ansible.builtin.command:
            argv: >-
              {{ ['rsync', '-a', '--delete']
                 + nexus_upgrade_excludes | map('regex_replace', '^', '--exclude=') | list
                 + [nexus_upgrade_backup ~ '/data/', nexus_upgrade_data ~ '/'] }}
          changed_when: true
          when: nexus_upgrade_copied | default(false)

        - name: The old unit put back
          ansible.builtin.copy:
            src: "{{ nexus_upgrade_backup }}/nexus.container"
            dest: "{{ nexus_upgrade_unit }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: nexus_upgrade_copied | default(false)

        - name: Nexus started on the old release
          ansible.builtin.systemd_service:
            name: nexus
            state: started
            daemon_reload: true

        - name: Wait for the old release to accept writes
          ansible.builtin.uri:
            url: "{{ nexus_url }}/service/rest/v1/status/writable"
          register: nexus_upgrade_rolled_back
          until: nexus_upgrade_rolled_back.status == 200
          retries: 60
          delay: 10
          no_log: true

        - name: Report the rollback
          ansible.builtin.fail:
            msg: >-
              The upgrade to {{ nexus_upgrade_release }} failed, and Nexus runs
              {{ nexus_upgrade_running }} again{{ ' from the copy' if nexus_upgrade_copied | default(false) else '' }}.
              Revert the image in services.yml to
              {{ (nexus_upgrade_container.stdout | from_json)[0].ImageName }} before the next site.yml.

# Upgrade Jellyfin to the major release jellyfin_major declares: bump it, then
# run this play rather than site.yml, with --limit <host> so alock locks that
# host alone. A major release migrates the database in a way only a full
# restore undoes, and needs its plugins rebuilt for it, so, as Jellyfin's
# release notes direct, with Jellyfin stopped it copies the config directory (a
# reflink copy on the SSD's btrfs where it can be, sharing its blocks until they
# change) and the compose file, and removes the repository plugins. It then
# starts the new release once, migrating the database without them; adds back
# each plugin's newest build for that release, from the stable plugin
# repository, verified by its checksum; and starts it again, checking each
# loads. It refuses to begin while a plugin has no such build, refuses a
# downgrade, and does nothing where the declared major release already runs.
# If anything fails after the copy, it puts the copy and the old compose file
# back, starts the old release again, then fails: revert jellyfin_major before the next site.yml. What a release's
# notes ask for afterwards, such as 12.0's full library scan, is left to the
# dashboard.
- name: Jellyfin upgrade to its declared major release
  hosts: podman_hosts
  gather_facts: false
  become: true
  tags: [jellyfin-upgrade]
  # Shared with the cleanup play below.
  vars: &jellyfin_upgrade_vars
    jellyfin_upgrade_image: docker.io/jellyfin/jellyfin:{{ jellyfin_major }}
    jellyfin_upgrade_unit: podman-compose@jellyfin.service
    jellyfin_upgrade_compose: /opt/jellyfin/docker-compose.yml
    jellyfin_upgrade_plugins_dir: "{{ jellyfin_config_dir }}/plugins"
    jellyfin_upgrade_backup: "{{ jellyfin_config_dir | dirname }}/upgrade-backup"
    jellyfin_upgrade_downloads: /var/cache/jellyfin-upgrade
    jellyfin_upgrade_repository: https://repo.jellyfin.org/files/plugin/manifest.json
    jellyfin_upgrade_url: http://127.0.0.1:8096
    # Seconds each start has to report itself healthy; the first one runs the
    # migrations, which on a large library take a while.
    jellyfin_upgrade_timeout: 3600
  tasks:
    - name: Only where Jellyfin is declared
      ansible.builtin.meta: end_host
      when: jellyfin_major is not defined

    - name: Jellyfin's newest release
      ansible.builtin.uri:
        url: https://api.github.com/repos/jellyfin/jellyfin/releases/latest
      register: jellyfin_upgrade_newest
      check_mode: false

    - name: Report the newest release
      ansible.builtin.debug:
        msg: >-
          Newest release: {{ jellyfin_upgrade_newest.json.tag_name | regex_replace('^v', '') }}.
          jellyfin_major declares {{ jellyfin_major }}.

    - name: The running container
      ansible.builtin.command:
        argv: [podman, container, inspect, jellyfin]
      register: jellyfin_upgrade_container
      changed_when: false
      check_mode: false

    - name: The running release
      ansible.builtin.set_fact:
        jellyfin_upgrade_running: >-
          {{ (jellyfin_upgrade_container.stdout | from_json)[0].Config.Labels['org.opencontainers.image.version'] }}

    - name: No downgrade, which a migrated database cannot take
      ansible.builtin.assert:
        that: jellyfin_major | int >= jellyfin_upgrade_running.split('.') | first | int
        fail_msg: jellyfin_major declares {{ jellyfin_major }}, older than the running {{ jellyfin_upgrade_running }}.
        quiet: true

    - name: Stop here where the declared major release already runs
      ansible.builtin.meta: end_host
      when: jellyfin_major | int == jellyfin_upgrade_running.split('.') | first | int

    - name: The declared major release, pulled while the old one still serves
      ansible.builtin.command:
        argv: [podman, pull, --quiet, "{{ jellyfin_upgrade_image }}"]
      changed_when: true

    - name: The pulled image
      ansible.builtin.command:
        argv: [podman, image, inspect, "{{ jellyfin_upgrade_image }}"]
      register: jellyfin_upgrade_pulled
      changed_when: false
      # A check run pulls nothing, so the image may not be here yet.
      failed_when: false
      check_mode: false

    - name: The release to upgrade to, as four parts like a plugin's targetAbi
      ansible.builtin.set_fact:
        jellyfin_upgrade_target: >-
          {{ ((((jellyfin_upgrade_pulled.stdout | from_json)[0].Labels['org.opencontainers.image.version'])
               if jellyfin_upgrade_pulled.rc == 0 else jellyfin_major ~ '.0').split('.') + ['0', '0', '0'])[:4] | join('.') }}

    - name: The pulled image is the declared major release
      ansible.builtin.assert:
        that: jellyfin_upgrade_target.split('.') | first | int == jellyfin_major | int
        fail_msg: "{{ jellyfin_upgrade_image }} is release {{ jellyfin_upgrade_target }}."
        quiet: true

    - name: The config directory's owner, whom the plugins' files belong to
      ansible.builtin.stat:
        path: "{{ jellyfin_config_dir }}"
      register: jellyfin_upgrade_owner

    - name: The repository plugins' metadata
      ansible.builtin.find:
        paths: "{{ jellyfin_upgrade_plugins_dir }}"
        patterns: [meta.json]
        recurse: true
        depth: 2
      register: jellyfin_upgrade_meta_files

    - name: Read each plugin's metadata
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ jellyfin_upgrade_meta_files.files }}"
      loop_control:
        label: "{{ item.path | dirname | basename }}"
      register: jellyfin_upgrade_meta

    - name: The stable plugin repository
      ansible.builtin.uri:
        url: "{{ jellyfin_upgrade_repository }}"
      register: jellyfin_upgrade_manifest
      check_mode: false

    # Each plugin's newest build whose targetAbi is the declared major release,
    # and no newer than the release pulled. Plugins are matched by GUID.
    - name: Each plugin's build for the declared release
      ansible.builtin.set_fact:
        jellyfin_upgrade_plugins: >-
          {{ jellyfin_upgrade_plugins | default([])
             + [{'installed': item.source | dirname, 'guid': plugin_meta.guid,
                 'name': plugin_entry.name | default(plugin_meta.name),
                 'build': plugin_builds | first | default({})}] }}
      vars:
        plugin_meta: "{{ item.content | b64decode | from_json }}"
        plugin_entry: "{{ jellyfin_upgrade_manifest.json | selectattr('guid', 'equalto', plugin_meta.guid) | first | default({}) }}"
        plugin_builds: >-
          {{ plugin_entry.versions | default([])
             | selectattr('targetAbi', 'version', jellyfin_major ~ '.0.0.0', '>=')
             | selectattr('targetAbi', 'version', jellyfin_upgrade_target, '<=')
             | sort(attribute='timestamp', reverse=true) }}
      loop: "{{ jellyfin_upgrade_meta.results }}"
      loop_control:
        label: "{{ item.source | dirname | basename }}"

    - name: Every plugin has a build for the declared release
      ansible.builtin.assert:
        that: jellyfin_upgrade_plugins | default([]) | map(attribute='build') | reject | list | length == 0
        fail_msg: >-
          No build for Jellyfin {{ jellyfin_upgrade_target }} in the stable plugin repository of:
          {{ jellyfin_upgrade_plugins | selectattr('build', 'equalto', {}) | map(attribute='name') | join(', ') }}.
          Remove those plugins from the dashboard first, or wait for their builds.
        quiet: true

    - name: Directory for the plugins' downloads
      ansible.builtin.file:
        path: "{{ jellyfin_upgrade_downloads }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: The plugins' builds, fetched while the old release still serves
      ansible.builtin.get_url:
        url: "{{ item.build.sourceUrl }}"
        dest: "{{ jellyfin_upgrade_downloads }}/{{ item.guid }}_{{ item.build.version }}.zip"
        checksum: "md5:{{ item.build.checksum }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ jellyfin_upgrade_plugins | default([]) }}"
      loop_control:
        label: "{{ item.name }} {{ item.build.version }}"
      # A check run creates no directory to download into.
      when: not ansible_check_mode

    - name: The config directory's attributes
      ansible.builtin.stat:
        path: "{{ jellyfin_config_dir }}"
      register: jellyfin_upgrade_config

    # The config directory is no-COW (chattr +C), sparing its writes COW's
    # amplification, and btrfs clones a file only into one of the same kind.
    # The copy's directory takes its attribute, which everything cp creates
    # in it inherits; a file from before the attribute is copied in full.
    - name: Directory for the copy
      ansible.builtin.file:
        path: "{{ jellyfin_upgrade_backup }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
        attributes: "{{ '+C' if 'C' in jellyfin_upgrade_config.stat.attr_flags else '-C' }}"

    - name: Upgrade, or roll back
      block:
        - name: Jellyfin stopped, for a consistent copy
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: stopped

        - name: The previous upgrade's copy removed
          ansible.builtin.file:
            path: "{{ jellyfin_upgrade_backup }}/config"
            state: absent

        - name: Copy of the config directory
          ansible.builtin.command:
            argv: [cp, -a, --reflink=auto, "{{ jellyfin_config_dir }}", "{{ jellyfin_upgrade_backup }}/config"]
          changed_when: true

        - name: Copy of the compose file
          ansible.builtin.copy:
            src: "{{ jellyfin_upgrade_compose }}"
            dest: "{{ jellyfin_upgrade_backup }}/docker-compose.yml"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: not ansible_check_mode

        # Only a complete copy is put back; before this, nothing has changed.
        - name: The copy is complete
          ansible.builtin.set_fact:
            jellyfin_upgrade_copied: true

        - name: The plugins built for the old release removed
          ansible.builtin.file:
            path: "{{ item.installed }}"
            state: absent
          loop: "{{ jellyfin_upgrade_plugins | default([]) }}"
          loop_control:
            label: "{{ item.installed | basename }}"

        - name: The compose file with the declared release
          ansible.builtin.template:
            src: "{{ inventory_dir }}/../files/{{ inventory_hostname }}{{ jellyfin_upgrade_compose }}.j2"
            dest: "{{ jellyfin_upgrade_compose }}"
            owner: root
            group: root
            mode: "0644"

        - name: Jellyfin started, to migrate its database without plugins
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: started

        - name: Wait for the migration and startup
          ansible.builtin.uri:
            url: "{{ jellyfin_upgrade_url }}/health"
            return_content: true
          register: jellyfin_upgrade_health
          until: jellyfin_upgrade_health.content | default('') == 'Healthy'
          retries: "{{ [(jellyfin_upgrade_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode

        - name: The declared release is the one serving
          ansible.builtin.uri:
            url: "{{ jellyfin_upgrade_url }}/System/Info/Public"
          register: jellyfin_upgrade_info
          failed_when: not ((jellyfin_upgrade_info.json | default({})).Version | default('')).startswith(jellyfin_major ~ '.')
          when: not ansible_check_mode

        - name: Jellyfin stopped, to add the plugins
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: stopped

        # Named <name>_<version>, as Jellyfin's own installer names them.
        - name: Directories for the plugins' builds
          ansible.builtin.file:
            path: "{{ jellyfin_upgrade_plugins_dir }}/{{ item.name }}_{{ item.build.version }}"
            state: directory
            owner: "{{ jellyfin_upgrade_owner.stat.uid }}"
            group: "{{ jellyfin_upgrade_owner.stat.gid }}"
            mode: "0755"
          loop: "{{ jellyfin_upgrade_plugins | default([]) }}"
          loop_control:
            label: "{{ item.name }} {{ item.build.version }}"

        - name: Each plugin's build for the declared release
          ansible.builtin.unarchive:
            src: "{{ jellyfin_upgrade_downloads }}/{{ item.guid }}_{{ item.build.version }}.zip"
            dest: "{{ jellyfin_upgrade_plugins_dir }}/{{ item.name }}_{{ item.build.version }}"
            remote_src: true
            owner: "{{ jellyfin_upgrade_owner.stat.uid }}"
            group: "{{ jellyfin_upgrade_owner.stat.gid }}"
          loop: "{{ jellyfin_upgrade_plugins | default([]) }}"
          loop_control:
            label: "{{ item.name }} {{ item.build.version }}"
          when: not ansible_check_mode

        - name: Jellyfin started with its plugins
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: started

        - name: Wait for the startup
          ansible.builtin.uri:
            url: "{{ jellyfin_upgrade_url }}/health"
            return_content: true
          register: jellyfin_upgrade_health
          until: jellyfin_upgrade_health.content | default('') == 'Healthy'
          retries: "{{ [(jellyfin_upgrade_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode

        # podman-compose recreates the container at each start, so its log is
        # this start's.
        - name: The container's log
          ansible.builtin.command:
            argv: [podman, logs, jellyfin]
          register: jellyfin_upgrade_log
          changed_when: false
          when: not ansible_check_mode

        - name: Every plugin's build loaded
          ansible.builtin.assert:
            that: >-
              (jellyfin_upgrade_log.stdout ~ jellyfin_upgrade_log.stderr)
              is search('Loaded plugin: .+ ' ~ (item.build.version | regex_escape))
            fail_msg: "{{ item.name }} {{ item.build.version }} did not load."
            quiet: true
          loop: "{{ jellyfin_upgrade_plugins | default([]) }}"
          loop_control:
            label: "{{ item.name }} {{ item.build.version }}"
          when: not ansible_check_mode

        - name: Report the upgrade
          ansible.builtin.debug:
            msg: >-
              Jellyfin runs {{ (jellyfin_upgrade_info.json | default({})).Version | default(jellyfin_upgrade_target) }}, from
              {{ jellyfin_upgrade_running }}, with
              {{ jellyfin_upgrade_plugins | default([]) | map(attribute='name') | zip(jellyfin_upgrade_plugins | default([])
                 | map(attribute='build') | map(attribute='version')) | map('join', ' ') | join(', ') }}.
              The copy to return to is in {{ jellyfin_upgrade_backup }}. Do what its release notes ask for
              after an upgrade, such as 12.0's full library scan, from the dashboard.

      rescue:
        - name: Jellyfin stopped, for the rollback
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: stopped

        - name: The config directory put back from the copy
          ansible.builtin.command:
            argv: [rsync, -a, --delete, "{{ jellyfin_upgrade_backup }}/config/", "{{ jellyfin_config_dir }}/"]
          changed_when: true
          when: jellyfin_upgrade_copied | default(false)

        - name: The old compose file put back
          ansible.builtin.copy:
            src: "{{ jellyfin_upgrade_backup }}/docker-compose.yml"
            dest: "{{ jellyfin_upgrade_compose }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: jellyfin_upgrade_copied | default(false)

        - name: Jellyfin started on the old release
          ansible.builtin.systemd_service:
            name: "{{ jellyfin_upgrade_unit }}"
            state: started

        - name: Wait for the old release
          ansible.builtin.uri:
            url: "{{ jellyfin_upgrade_url }}/health"
            return_content: true
          register: jellyfin_upgrade_rolled_back
          until: jellyfin_upgrade_rolled_back.content | default('') == 'Healthy'
          retries: 60
          delay: 10
          when: not ansible_check_mode

        - name: Report the rollback
          ansible.builtin.fail:
            msg: >-
              The upgrade to Jellyfin {{ jellyfin_major }} failed, and it runs {{ jellyfin_upgrade_running }}
              again{{ ' from the copy' if jellyfin_upgrade_copied | default(false) else '' }}.
              Revert jellyfin_major to {{ jellyfin_upgrade_running.split('.') | first }} before the next site.yml.

# Remove what jellyfin-upgrade leaves behind, once the new release has proven
# itself: the copy of the config directory to roll back to, the plugins'
# downloads, and the images of other major releases. It refuses while Jellyfin
# does not run, healthy, on the major release jellyfin_major declares, as the
# copy is then still the way back. Run it with --limit <host>, as the upgrade.
- name: Jellyfin upgrade's leftovers removed
  hosts: podman_hosts
  gather_facts: false
  become: true
  tags: [jellyfin-upgrade-cleanup]
  vars: *jellyfin_upgrade_vars
  tasks:
    - name: Only where Jellyfin is declared
      ansible.builtin.meta: end_host
      when: jellyfin_major is not defined

    - name: The running container
      ansible.builtin.command:
        argv: [podman, container, inspect, jellyfin]
      register: jellyfin_cleanup_container
      changed_when: false
      check_mode: false

    - name: The declared major release runs
      ansible.builtin.assert:
        that: >-
          (jellyfin_cleanup_container.stdout | from_json)[0].Config.Labels['org.opencontainers.image.version'].split('.')
          | first | int == jellyfin_major | int
        fail_msg: Jellyfin does not run release {{ jellyfin_major }}, so its copy may still be needed.
        quiet: true

    - name: It reports itself healthy
      ansible.builtin.uri:
        url: "{{ jellyfin_upgrade_url }}/health"
        return_content: true
      register: jellyfin_cleanup_health
      failed_when: jellyfin_cleanup_health.content | default('') != 'Healthy'
      check_mode: false

    - name: The copy and the plugins' downloads removed
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: ["{{ jellyfin_upgrade_backup }}", "{{ jellyfin_upgrade_downloads }}"]

    - name: Jellyfin's images
      ansible.builtin.command:
        argv: [podman, images, --format, json, --filter, "reference={{ jellyfin_upgrade_image.rsplit(':', 1) | first }}"]
      register: jellyfin_cleanup_images
      changed_when: false
      check_mode: false

    # The declared image stays, by any of its names; podman refuses to remove
    # an image a container uses.
    - name: The images of other major releases removed
      ansible.builtin.command:
        argv: [podman, image, rm, "{{ item.Id }}"]
      loop: >-
        {{ jellyfin_cleanup_images.stdout | from_json | selectattr('Names')
           | rejectattr('Names', 'contains', jellyfin_upgrade_image) | list }}
      loop_control:
        label: "{{ item.Names | default(['<untagged>']) | join(', ') }}"
      changed_when: true

# Upgrade Home Assistant to the monthly release homeassistant_release declares
# (YYYY.MM): bump it, then run this play rather than site.yml, with
# --limit <host> so alock locks that host alone. A release's first start
# migrates the config directory's storage and the recorder's database in ways
# only a restore undoes, so with Home Assistant stopped it copies the config
# directory (a reflink copy on the SSD's btrfs where it can be, sharing its
# blocks until they change) and the compose file, then starts the new
# release. It counts the release as up once its frontend answers, its
# .HA_VERSION names the pulled image's version, which Home Assistant writes as
# it upgrades the directory, and its log has not activated recovery mode, the
# mode a failed core integration or configuration starts it in. It refuses a
# downgrade, and does nothing where the declared release already runs. If
# anything fails after the copy, it puts the copy and the old compose file
# back, starts the old release again, then fails: revert homeassistant_release
# before the next site.yml.
# What a release's notes ask for afterwards is left to the UI.
- name: Home Assistant upgrade to its declared release
  hosts: podman_hosts
  gather_facts: false
  become: true
  tags: [homeassistant-upgrade]
  # Shared with the cleanup play below.
  vars: &homeassistant_upgrade_vars
    homeassistant_upgrade_image: docker.io/homeassistant/home-assistant:{{ homeassistant_release }}
    homeassistant_upgrade_unit: podman-compose@homeassistant.service
    homeassistant_upgrade_compose: /opt/homeassistant/docker-compose.yml
    homeassistant_upgrade_backup: "{{ homeassistant_config_dir }}-upgrade-backup"
    homeassistant_upgrade_url: http://127.0.0.1:8123
    # Seconds each start has to answer; its first start on aboriginal took
    # about eight minutes, reinstalling its integrations' packages.
    homeassistant_upgrade_timeout: 1800
  tasks:
    - name: Only where Home Assistant is declared
      ansible.builtin.meta: end_host
      when: homeassistant_release is not defined

    # The image's tag is the release, which podman-auto-update then follows
    # through its patches; a patch named here would stop it at that patch.
    - name: The declared release is a monthly one
      ansible.builtin.assert:
        that: homeassistant_release is string and homeassistant_release is match('^[0-9]{4}[.][0-9]{1,2}$')
        fail_msg: >-
          homeassistant_release declares {{ homeassistant_release }}; declare a monthly release, YYYY.MM,
          quoted, so podman-auto-update brings in its patches.
        quiet: true

    - name: Home Assistant's newest release
      ansible.builtin.uri:
        url: https://api.github.com/repos/home-assistant/core/releases/latest
      register: homeassistant_upgrade_newest
      check_mode: false

    - name: Report the newest release
      ansible.builtin.debug:
        msg: >-
          Newest release: {{ homeassistant_upgrade_newest.json.tag_name }}.
          homeassistant_release declares {{ homeassistant_release }}.

    - name: The running container
      ansible.builtin.command:
        argv: [podman, container, inspect, homeassistant]
      register: homeassistant_upgrade_container
      changed_when: false
      check_mode: false

    - name: The running release
      ansible.builtin.set_fact:
        homeassistant_upgrade_running: >-
          {{ (homeassistant_upgrade_container.stdout | from_json)[0].Config.Labels['org.opencontainers.image.version'] }}

    - name: No downgrade, which a migrated database cannot take
      ansible.builtin.assert:
        that: homeassistant_release is version(homeassistant_upgrade_running.split('.')[:2] | join('.'), '>=')
        fail_msg: homeassistant_release declares {{ homeassistant_release }}, older than the running {{ homeassistant_upgrade_running }}.
        quiet: true

    - name: Stop here where the declared release already runs
      ansible.builtin.meta: end_host
      when: homeassistant_release == homeassistant_upgrade_running.split('.')[:2] | join('.')

    - name: The declared release, pulled while the old one still serves
      ansible.builtin.command:
        argv: [podman, pull, --quiet, "{{ homeassistant_upgrade_image }}"]
      changed_when: true

    - name: The pulled image
      ansible.builtin.command:
        argv: [podman, image, inspect, "{{ homeassistant_upgrade_image }}"]
      register: homeassistant_upgrade_pulled
      changed_when: false
      # A check run pulls nothing, so the image may not be here yet.
      failed_when: false
      check_mode: false

    - name: The version to upgrade to
      ansible.builtin.set_fact:
        homeassistant_upgrade_target: >-
          {{ (homeassistant_upgrade_pulled.stdout | from_json)[0].Labels['org.opencontainers.image.version']
             if homeassistant_upgrade_pulled.rc == 0 else homeassistant_release ~ '.0' }}

    - name: The pulled image is the declared release
      ansible.builtin.assert:
        that: homeassistant_upgrade_target.startswith(homeassistant_release ~ '.')
        fail_msg: "{{ homeassistant_upgrade_image }} is release {{ homeassistant_upgrade_target }}."
        quiet: true

    - name: The config directory's attributes
      ansible.builtin.stat:
        path: "{{ homeassistant_config_dir }}"
      register: homeassistant_upgrade_config

    # The config directory is no-COW (chattr +C), sparing its writes COW's
    # amplification, and btrfs clones a file only into one of the same kind.
    # The copy's directory takes its attribute, which everything cp creates
    # in it inherits; a file from before the attribute is copied in full.
    - name: Directory for the copy
      ansible.builtin.file:
        path: "{{ homeassistant_upgrade_backup }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
        attributes: "{{ '+C' if 'C' in homeassistant_upgrade_config.stat.attr_flags else '-C' }}"

    - name: Upgrade, or roll back
      block:
        - name: Home Assistant stopped, for a consistent copy
          ansible.builtin.systemd_service:
            name: "{{ homeassistant_upgrade_unit }}"
            state: stopped

        - name: The previous upgrade's copy removed
          ansible.builtin.file:
            path: "{{ homeassistant_upgrade_backup }}/config"
            state: absent

        - name: Copy of the config directory
          ansible.builtin.command:
            argv: [cp, -a, --reflink=auto, "{{ homeassistant_config_dir }}", "{{ homeassistant_upgrade_backup }}/config"]
          changed_when: true

        - name: Copy of the compose file
          ansible.builtin.copy:
            src: "{{ homeassistant_upgrade_compose }}"
            dest: "{{ homeassistant_upgrade_backup }}/docker-compose.yml"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: not ansible_check_mode

        # Only a complete copy is put back; before this, nothing has changed.
        - name: The copy is complete
          ansible.builtin.set_fact:
            homeassistant_upgrade_copied: true

        - name: The compose file with the declared release
          ansible.builtin.template:
            src: "{{ inventory_dir }}/../files/{{ inventory_hostname }}{{ homeassistant_upgrade_compose }}.j2"
            dest: "{{ homeassistant_upgrade_compose }}"
            owner: root
            group: root
            mode: "0644"

        - name: Home Assistant started on the declared release, to migrate
          ansible.builtin.systemd_service:
            name: "{{ homeassistant_upgrade_unit }}"
            state: started

        - name: Wait for the migration and startup
          ansible.builtin.uri:
            url: "{{ homeassistant_upgrade_url }}/manifest.json"
          register: homeassistant_upgrade_health
          until: homeassistant_upgrade_health.status | default(0) == 200
          retries: "{{ [(homeassistant_upgrade_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode

        - name: The version the config directory was upgraded to
          ansible.builtin.slurp:
            src: "{{ homeassistant_config_dir }}/.HA_VERSION"
          register: homeassistant_upgrade_version
          when: not ansible_check_mode

        - name: The declared release is the one that started
          ansible.builtin.assert:
            that: homeassistant_upgrade_version.content | b64decode | trim == homeassistant_upgrade_target
            fail_msg: >-
              The config directory names {{ homeassistant_upgrade_version.content | b64decode | trim }},
              not {{ homeassistant_upgrade_target }}.
            quiet: true
          when: not ansible_check_mode

        # podman-compose recreates the container at each start, so its log is
        # this start's.
        - name: The container's log
          ansible.builtin.command:
            argv: [podman, logs, homeassistant]
          register: homeassistant_upgrade_log
          changed_when: false
          when: not ansible_check_mode

        - name: Not in recovery mode
          ansible.builtin.assert:
            that: >-
              not ((homeassistant_upgrade_log.stdout ~ homeassistant_upgrade_log.stderr)
              is search('(?i)activating recovery mode'))
            fail_msg: Home Assistant {{ homeassistant_upgrade_target }} started in recovery mode.
            quiet: true
          when: not ansible_check_mode

        - name: Report the upgrade
          ansible.builtin.debug:
            msg: >-
              Home Assistant runs {{ homeassistant_upgrade_target }}, from {{ homeassistant_upgrade_running }}.
              The copy to return to is in {{ homeassistant_upgrade_backup }}. Do what its release notes ask
              for after an upgrade from the UI, and check its repairs.

      rescue:
        - name: Home Assistant stopped, for the rollback
          ansible.builtin.systemd_service:
            name: "{{ homeassistant_upgrade_unit }}"
            state: stopped

        - name: The config directory put back from the copy
          ansible.builtin.command:
            argv: [rsync, -a, --delete, "{{ homeassistant_upgrade_backup }}/config/", "{{ homeassistant_config_dir }}/"]
          changed_when: true
          when: homeassistant_upgrade_copied | default(false)

        - name: The old compose file put back
          ansible.builtin.copy:
            src: "{{ homeassistant_upgrade_backup }}/docker-compose.yml"
            dest: "{{ homeassistant_upgrade_compose }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: homeassistant_upgrade_copied | default(false)

        - name: Home Assistant started on the old release
          ansible.builtin.systemd_service:
            name: "{{ homeassistant_upgrade_unit }}"
            state: started

        - name: Wait for the old release
          ansible.builtin.uri:
            url: "{{ homeassistant_upgrade_url }}/manifest.json"
          register: homeassistant_upgrade_rolled_back
          until: homeassistant_upgrade_rolled_back.status | default(0) == 200
          retries: "{{ [(homeassistant_upgrade_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode

        - name: Report the rollback
          ansible.builtin.fail:
            msg: >-
              The upgrade to Home Assistant {{ homeassistant_release }} failed, and it runs
              {{ homeassistant_upgrade_running }} again{{ ' from the copy' if homeassistant_upgrade_copied | default(false) else '' }}.
              Revert homeassistant_release to {{ homeassistant_upgrade_running.split('.')[:2] | join('.') }}
              before the next site.yml.

# Remove what homeassistant-upgrade leaves behind, once the new release has
# proven itself: the copy of the config directory to roll back to, and the
# images of other releases. It refuses while Home Assistant does not run, and
# answer, on the release homeassistant_release declares, as the copy is then
# still the way back. Run it with --limit <host>, as the upgrade.
- name: Home Assistant upgrade's leftovers removed
  hosts: podman_hosts
  gather_facts: false
  become: true
  tags: [homeassistant-upgrade-cleanup]
  vars: *homeassistant_upgrade_vars
  tasks:
    - name: Only where Home Assistant is declared
      ansible.builtin.meta: end_host
      when: homeassistant_release is not defined

    - name: The running container
      ansible.builtin.command:
        argv: [podman, container, inspect, homeassistant]
      register: homeassistant_cleanup_container
      changed_when: false
      check_mode: false

    - name: The declared release runs
      ansible.builtin.assert:
        that: homeassistant_cleanup_running.startswith(homeassistant_release ~ '.')
        fail_msg: Home Assistant does not run release {{ homeassistant_release }}, so its copy may still be needed.
        quiet: true
      vars:
        homeassistant_cleanup_running: >-
          {{ (homeassistant_cleanup_container.stdout | from_json)[0].Config.Labels['org.opencontainers.image.version'] }}

    - name: It answers
      ansible.builtin.uri:
        url: "{{ homeassistant_upgrade_url }}/manifest.json"
      check_mode: false

    - name: The copy removed
      ansible.builtin.file:
        path: "{{ homeassistant_upgrade_backup }}"
        state: absent

    - name: Home Assistant's images
      ansible.builtin.command:
        argv: [podman, images, --format, json, --filter, "reference={{ homeassistant_upgrade_image.rsplit(':', 1) | first }}"]
      register: homeassistant_cleanup_images
      changed_when: false
      check_mode: false

    # The declared image stays, by any of its names; podman refuses to remove
    # an image a container uses.
    - name: The images of other releases removed
      ansible.builtin.command:
        argv: [podman, image, rm, "{{ item.Id }}"]
      loop: >-
        {{ homeassistant_cleanup_images.stdout | from_json | selectattr('Names')
           | rejectattr('Names', 'contains', homeassistant_upgrade_image) | list }}
      loop_control:
        label: "{{ item.Names | default(['<untagged>']) | join(', ') }}"
      changed_when: true

# Upgrade Nextcloud to the major release nextcloud_release declares: bump it by
# one, then run this play rather than site.yml, with --limit <host> so alock
# locks that host alone. Nextcloud moves a single major at a time, from the
# newest patch of the one it runs (its manual's rule, which the image's
# entrypoint enforces), so the play refuses any other target, and a running
# release behind its major's newest patch. It refuses as well while an enabled
# app from the App Store has no stable release for the target major, which
# occ upgrade would disable; the app is to be disabled first. Then, with
# Nextcloud stopped, it copies its database, config, code and apps volumes (a
# reflink copy where btrfs allows, sharing their blocks until they change; the
# user data and Redis's cache stay out of it) and the compose file, and starts
# the new major, whose image's entrypoint runs occ upgrade. It counts the
# upgrade done once Nextcloud reports the new major, out of maintenance and
# needing no further database upgrade, with no app disabled on the way; then
# it adds the indices, columns and primary keys the release expects. If
# anything fails after the copy, it puts the copy and the old compose file
# back, starts the old release again, then fails: revert nextcloud_release
# before the next site.yml. It does nothing where the declared major runs.
- name: Nextcloud upgrade to its declared major release
  hosts: podman_hosts
  gather_facts: false
  become: true
  tags: [nextcloud-upgrade]
  # Shared with the cleanup play below.
  vars: &nextcloud_upgrade_vars
    nextcloud_upgrade_image: docker.io/library/nextcloud:{{ nextcloud_release }}-apache
    nextcloud_upgrade_unit: podman-compose@nextcloud.service
    nextcloud_upgrade_compose: /opt/nextcloud/docker-compose.yml
    nextcloud_upgrade_backup: /var/backups/nextcloud-upgrade
    # The volumes copied, by their names in the compose file.
    nextcloud_upgrade_volumes: [db, config, html, apps]
    # Published on IPv4 alone, as the compose file says.
    nextcloud_upgrade_url: http://127.0.0.1:12378
    # The App Store's apps with a release for the target major.
    nextcloud_upgrade_store: https://apps.nextcloud.com/api/v1/platform/{{ nextcloud_release }}.0.0/apps.json
    # Seconds each start has to answer, its upgrade included.
    nextcloud_upgrade_timeout: 1800
    # Seconds Nextcloud gives the App Store's listing, which occ upgrade fetches
    # to update the apps it would otherwise disable: some 16 MB, which took two
    # to three minutes to arrive on aboriginal, past its default of 120.
    nextcloud_upgrade_appstore_timeout: 600
  tasks:
    - name: Only where Nextcloud is declared
      ansible.builtin.meta: end_host
      when: nextcloud_release is not defined

    # The image's tag is the major, which podman-auto-update then follows
    # through its patches; a patch named here would stop it at that patch.
    - name: The declared release is a major one
      ansible.builtin.assert:
        that: nextcloud_release is string and nextcloud_release is match('^[0-9]+$')
        fail_msg: >-
          nextcloud_release declares {{ nextcloud_release }}; declare a major release, quoted, so
          podman-auto-update brings in its patches.
        quiet: true

    - name: The running release
      ansible.builtin.uri:
        url: "{{ nextcloud_upgrade_url }}/status.php"
      register: nextcloud_upgrade_status
      check_mode: false

    - name: Its major and the declared one
      ansible.builtin.set_fact:
        nextcloud_upgrade_running: "{{ nextcloud_upgrade_status.json.versionstring }}"
        nextcloud_upgrade_running_major: "{{ nextcloud_upgrade_status.json.versionstring.split('.') | first | int }}"
        nextcloud_upgrade_major: "{{ nextcloud_release | int }}"

    - name: No downgrade, which a migrated database cannot take
      ansible.builtin.assert:
        that: nextcloud_upgrade_major | int >= nextcloud_upgrade_running_major | int
        fail_msg: nextcloud_release declares {{ nextcloud_release }}, older than the running {{ nextcloud_upgrade_running }}.
        quiet: true

    - name: Stop here where the declared major already runs
      ansible.builtin.meta: end_host
      when: nextcloud_upgrade_major | int == nextcloud_upgrade_running_major | int

    - name: One major at a time
      ansible.builtin.assert:
        that: nextcloud_upgrade_major | int == nextcloud_upgrade_running_major | int + 1
        fail_msg: >-
          Nextcloud runs {{ nextcloud_upgrade_running }} and moves one major release at a time:
          set nextcloud_release to {{ nextcloud_upgrade_running_major | int + 1 }}, run this play and its
          cleanup, then go on to the next.
        quiet: true

    # Its manual has a major left only from that major's newest patch.
    - name: The running major's newest patch, pulled
      ansible.builtin.command:
        argv: [podman, pull, --quiet, "docker.io/library/nextcloud:{{ nextcloud_upgrade_running_major }}-apache"]
      changed_when: true

    - name: The running major's newest image
      ansible.builtin.command:
        argv: [podman, image, inspect, "docker.io/library/nextcloud:{{ nextcloud_upgrade_running_major }}-apache"]
      register: nextcloud_upgrade_latest_patch
      changed_when: false
      check_mode: false

    - name: The running release is its major's newest patch
      ansible.builtin.assert:
        that: nextcloud_upgrade_newest_patch == nextcloud_upgrade_running
        fail_msg: >-
          Nextcloud runs {{ nextcloud_upgrade_running }}, and {{ nextcloud_upgrade_running_major }}'s newest
          patch is {{ nextcloud_upgrade_newest_patch }}. Let podman-auto-update bring that in first.
        quiet: true
      vars:
        nextcloud_upgrade_newest_patch: >-
          {{ (nextcloud_upgrade_latest_patch.stdout | from_json)[0].Config.Env
             | select('match', '^NEXTCLOUD_VERSION=') | first | regex_replace('^NEXTCLOUD_VERSION=', '') }}

    - name: The enabled apps
      ansible.builtin.command:
        argv: [podman, exec, --user, www-data, nextcloud, php, occ, app:list, --shipped=false, --output=json]
      register: nextcloud_upgrade_apps
      changed_when: false
      check_mode: false

    # occ upgrade disables an app with no release for the new major, and
    # installs only stable releases. The App Store's listing runs to some
    # 16 MB, far more than Ansible handles quickly as a variable, so the host
    # reads it and prints only the enabled apps it has no stable release of.
    - name: The enabled apps the target major has no stable release of
      ansible.builtin.command:
        argv:
          - python3
          - -I
          - -c
          - |
            import json, sys, urllib.request
            with urllib.request.urlopen(sys.argv[1], timeout=120) as response:
                store = json.load(response)
            stable = {app["id"] for app in store for release in app.get("releases", [])
                      if not release.get("isNightly") and "-" not in release["version"]}
            print(json.dumps(sorted(set(json.loads(sys.argv[2])) - stable)))
          - "{{ nextcloud_upgrade_store }}"
          - "{{ (nextcloud_upgrade_apps.stdout | from_json).enabled.keys() | list | to_json }}"
      register: nextcloud_upgrade_store_check
      changed_when: false
      check_mode: false

    - name: Their names
      ansible.builtin.set_fact:
        nextcloud_upgrade_unsupported: "{{ nextcloud_upgrade_store_check.stdout | from_json }}"

    - name: Every enabled app has a release for the target major
      ansible.builtin.assert:
        that: nextcloud_upgrade_unsupported | length == 0
        fail_msg: >-
          Nextcloud {{ nextcloud_release }} has no stable release of {{ nextcloud_upgrade_unsupported | join(', ') }},
          which occ upgrade would disable. Disable {{ 'it' if nextcloud_upgrade_unsupported | length == 1 else 'them' }}
          first ({% for app in nextcloud_upgrade_unsupported %}occ app:disable {{ app }}{{ '; ' if not loop.last }}{% endfor %}),
          then run this play again.
        quiet: true

    - name: Nextcloud's App Store timeout
      ansible.builtin.command:
        argv: [podman, exec, --user, www-data, nextcloud, php, occ, config:app:get, settings, appstore-timeout]
      register: nextcloud_upgrade_appstore
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Nextcloud's App Store timeout, long enough for its listing
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - --user
          - www-data
          - nextcloud
          - php
          - occ
          - config:app:set
          - settings
          - appstore-timeout
          - --value={{ nextcloud_upgrade_appstore_timeout }}
      changed_when: true
      when: nextcloud_upgrade_appstore.stdout | trim != nextcloud_upgrade_appstore_timeout | string

    - name: The declared major, pulled while the old one still serves
      ansible.builtin.command:
        argv: [podman, pull, --quiet, "{{ nextcloud_upgrade_image }}"]
      changed_when: true

    - name: The pulled image
      ansible.builtin.command:
        argv: [podman, image, inspect, "{{ nextcloud_upgrade_image }}"]
      register: nextcloud_upgrade_pulled
      changed_when: false
      # A check run pulls nothing, so the image may not be here yet.
      failed_when: false
      check_mode: false

    - name: The version to upgrade to
      ansible.builtin.set_fact:
        nextcloud_upgrade_target: >-
          {{ (nextcloud_upgrade_pulled.stdout | from_json)[0].Config.Env
             | select('match', '^NEXTCLOUD_VERSION=') | first | regex_replace('^NEXTCLOUD_VERSION=', '')
             if nextcloud_upgrade_pulled.rc == 0 else nextcloud_release ~ '.0.0' }}

    - name: The pulled image is the declared major
      ansible.builtin.assert:
        that: nextcloud_upgrade_target.startswith(nextcloud_release ~ '.')
        fail_msg: "{{ nextcloud_upgrade_image }} is release {{ nextcloud_upgrade_target }}."
        quiet: true

    - name: The volumes' mountpoints
      ansible.builtin.command:
        argv: [podman, volume, inspect, --format, "{{ '{{' }}.Mountpoint{{ '}}' }}", "nextcloud_{{ item }}"]
      loop: "{{ nextcloud_upgrade_volumes }}"
      register: nextcloud_upgrade_mountpoints
      changed_when: false
      check_mode: false

    - name: The volumes' attributes
      ansible.builtin.stat:
        path: "{{ nextcloud_upgrade_mountpoints.results[0].stdout }}"
      register: nextcloud_upgrade_volume

    # The volumes are no-COW (chattr +C), as Podman's storage is on btrfs, and
    # btrfs clones a file only into one of the same kind. The copy's directory
    # takes their attribute, which everything cp creates in it inherits.
    - name: Directory for the copy
      ansible.builtin.file:
        path: "{{ nextcloud_upgrade_backup }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
        attributes: "{{ '+C' if 'C' in nextcloud_upgrade_volume.stat.attr_flags else '-C' }}"

    - name: Upgrade, or roll back
      block:
        - name: Nextcloud stopped, for a consistent copy
          ansible.builtin.systemd_service:
            name: "{{ nextcloud_upgrade_unit }}"
            state: stopped

        - name: The previous upgrade's copy removed
          ansible.builtin.file:
            path: "{{ nextcloud_upgrade_backup }}/{{ item }}"
            state: absent
          loop: "{{ nextcloud_upgrade_volumes }}"

        - name: Copy of the volumes
          ansible.builtin.command:
            argv: [cp, -a, --reflink=auto, "{{ item.stdout }}", "{{ nextcloud_upgrade_backup }}/{{ item.item }}"]
          loop: "{{ nextcloud_upgrade_mountpoints.results }}"
          loop_control:
            label: "{{ item.item }}"
          changed_when: true

        - name: Copy of the compose file
          ansible.builtin.copy:
            src: "{{ nextcloud_upgrade_compose }}"
            dest: "{{ nextcloud_upgrade_backup }}/docker-compose.yml"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: not ansible_check_mode

        # Only a complete copy is put back; before this, nothing has changed.
        - name: The copy is complete
          ansible.builtin.set_fact:
            nextcloud_upgrade_copied: true

        - name: The compose file with the declared major
          ansible.builtin.template:
            src: "{{ inventory_dir }}/../files/{{ inventory_hostname }}{{ nextcloud_upgrade_compose }}.j2"
            dest: "{{ nextcloud_upgrade_compose }}"
            owner: root
            group: root
            mode: "0644"

        - name: Nextcloud started on the declared major, to upgrade
          ansible.builtin.systemd_service:
            name: "{{ nextcloud_upgrade_unit }}"
            state: started

        # Apache starts only once the entrypoint's occ upgrade has finished.
        - name: Wait for the upgrade and startup
          ansible.builtin.uri:
            url: "{{ nextcloud_upgrade_url }}/status.php"
          register: nextcloud_upgrade_health
          until: >-
            nextcloud_upgrade_health.json is defined
            and nextcloud_upgrade_health.json.versionstring | default('') == nextcloud_upgrade_target
            and not nextcloud_upgrade_health.json.maintenance
            and not nextcloud_upgrade_health.json.needsDbUpgrade
          retries: "{{ [(nextcloud_upgrade_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode

        # The entrypoint's own list of the apps occ upgrade disabled is not
        # always printed (it was not when the upgrade to 35 disabled bookmarks),
        # so the enabled apps are compared with those before.
        - name: The apps enabled after the upgrade
          ansible.builtin.command:
            argv: [podman, exec, --user, www-data, nextcloud, php, occ, app:list, --shipped=false, --output=json]
          register: nextcloud_upgrade_apps_after
          changed_when: false
          when: not ansible_check_mode

        - name: No app disabled by the upgrade
          ansible.builtin.assert:
            that: nextcloud_upgrade_disabled | length == 0
            fail_msg: >-
              occ upgrade disabled {{ nextcloud_upgrade_disabled | join(', ') }} on the way to
              {{ nextcloud_upgrade_target }}. Where {{ nextcloud_release }} has no release of an app, disable it
              before the next attempt; where it has, occ upgrade could not fetch the App Store's listing within
              appstore-timeout.
            quiet: true
          vars:
            nextcloud_upgrade_disabled: >-
              {{ (nextcloud_upgrade_apps.stdout | from_json).enabled.keys() | list
                 | difference((nextcloud_upgrade_apps_after.stdout | from_json).enabled.keys() | list) | sort }}
          when: not ansible_check_mode

        - name: The database's missing indices, columns and primary keys added
          ansible.builtin.command:
            argv: [podman, exec, --user, www-data, nextcloud, php, occ, "db:add-missing-{{ item }}"]
          loop: [indices, columns, primary-keys]
          register: nextcloud_upgrade_db
          changed_when: nextcloud_upgrade_db.stdout is search('(?i)adding|updated successfully')

        - name: Report the upgrade
          ansible.builtin.debug:
            msg: >-
              Nextcloud runs {{ nextcloud_upgrade_target }}, from {{ nextcloud_upgrade_running }}. The copy to
              return to is in {{ nextcloud_upgrade_backup }}. Check its administration overview, then run
              nextcloud-upgrade-cleanup before the next major.

      rescue:
        - name: Nextcloud stopped, for the rollback
          ansible.builtin.systemd_service:
            name: "{{ nextcloud_upgrade_unit }}"
            state: stopped

        - name: The volumes put back from the copy
          ansible.builtin.command:
            argv: [rsync, -a, --delete, "{{ nextcloud_upgrade_backup }}/{{ item.item }}/", "{{ item.stdout }}/"]
          loop: "{{ nextcloud_upgrade_mountpoints.results }}"
          loop_control:
            label: "{{ item.item }}"
          changed_when: true
          when: nextcloud_upgrade_copied | default(false)

        - name: The old compose file put back
          ansible.builtin.copy:
            src: "{{ nextcloud_upgrade_backup }}/docker-compose.yml"
            dest: "{{ nextcloud_upgrade_compose }}"
            remote_src: true
            owner: root
            group: root
            mode: "0644"
          when: nextcloud_upgrade_copied | default(false)

        - name: Nextcloud started on the old release
          ansible.builtin.systemd_service:
            name: "{{ nextcloud_upgrade_unit }}"
            state: started

        - name: Wait for the old release
          ansible.builtin.uri:
            url: "{{ nextcloud_upgrade_url }}/status.php"
          register: nextcloud_upgrade_rolled_back
          until: (nextcloud_upgrade_rolled_back.json | default({})).versionstring | default('') == nextcloud_upgrade_running
          retries: "{{ [(nextcloud_upgrade_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode

        - name: Report the rollback
          ansible.builtin.fail:
            msg: >-
              The upgrade to Nextcloud {{ nextcloud_release }} failed, and it runs {{ nextcloud_upgrade_running }}
              again{{ ' from the copy' if nextcloud_upgrade_copied | default(false) else '' }}.
              Revert nextcloud_release to {{ nextcloud_upgrade_running_major }} before the next site.yml.

# Remove what nextcloud-upgrade leaves behind, once the new major has proven
# itself: the copy of its volumes to roll back to, and the images of other
# releases. It refuses while Nextcloud does not run, and answer, on the major
# nextcloud_release declares, as the copy is then still the way back. Run it
# with --limit <host>, as the upgrade.
- name: Nextcloud upgrade's leftovers removed
  hosts: podman_hosts
  gather_facts: false
  become: true
  tags: [nextcloud-upgrade-cleanup]
  vars: *nextcloud_upgrade_vars
  tasks:
    - name: Only where Nextcloud is declared
      ansible.builtin.meta: end_host
      when: nextcloud_release is not defined

    - name: The running release
      ansible.builtin.uri:
        url: "{{ nextcloud_upgrade_url }}/status.php"
      register: nextcloud_cleanup_status
      check_mode: false

    - name: The declared major runs, out of maintenance
      ansible.builtin.assert:
        that:
          - nextcloud_cleanup_status.json.versionstring.split('.') | first == nextcloud_release
          - not nextcloud_cleanup_status.json.maintenance
          - not nextcloud_cleanup_status.json.needsDbUpgrade
        fail_msg: >-
          Nextcloud runs {{ nextcloud_cleanup_status.json.versionstring }}, not major {{ nextcloud_release }}
          out of maintenance, so its copy may still be needed.
        quiet: true

    - name: The copy removed
      ansible.builtin.file:
        path: "{{ nextcloud_upgrade_backup }}"
        state: absent

    - name: Nextcloud's images
      ansible.builtin.command:
        argv: [podman, images, --format, json, --filter, "reference={{ nextcloud_upgrade_image.rsplit(':', 1) | first }}"]
      register: nextcloud_cleanup_images
      changed_when: false
      check_mode: false

    # The declared image stays, by any of its names; podman refuses to remove
    # an image a container uses.
    - name: The images of other releases removed
      ansible.builtin.command:
        argv: [podman, image, rm, "{{ item.Id }}"]
      loop: >-
        {{ nextcloud_cleanup_images.stdout | from_json | selectattr('Names')
           | rejectattr('Names', 'contains', nextcloud_upgrade_image) | list }}
      loop_control:
        label: "{{ item.Names | default(['<untagged>']) | join(', ') }}"
      changed_when: true

# Remove what the move from python-matter-server to matterjs-server leaves
# behind, once matterjs-server has migrated the fabric: the copy of the Python
# server's volume, made by hand before matterjs-server first started on it, the
# Python server's own files in the volume, and its images. matterjs-server reads
# chip.json only to migrate it, and keeps the Python server's node file current
# while chip.json is there, so it is stopped while they go and started again
# without them; the Python server then has no way back to the fabric. It refuses
# while matterjs-server does not run, and answer, on the volume. Run it with
# --limit <host>.
- name: Matter server migration's leftovers removed
  hosts: podman_hosts
  gather_facts: false
  become: true
  tags: [matter-server-migration-cleanup]
  vars:
    matter_server_cleanup_container: matter-server
    matter_server_cleanup_image: ghcr.io/matter-js/matterjs-server
    matter_server_cleanup_backup: /var/backups/matter-server-python
    matter_server_cleanup_url: http://[::1]:5580
    # The Python server's images: under its old name, which ran here, and the
    # one its final releases moved to.
    matter_server_cleanup_python_images:
      - ghcr.io/home-assistant-libs/python-matter-server
      - ghcr.io/matter-js/python-matter-server
    # The Python server's files: its fabric (chip.json), the CHIP SDK's own
    # settings, its node files, named for their fabric's compressed ID, with
    # their backups, and the PAA certificates it was given, which matter.js
    # fetches itself.
    matter_server_cleanup_python_files: '^(chip\.json|chip_[a-z]+\.ini(-.+)?|[0-9]+\.json(\.backup)?|credentials)$'
  tasks:
    - name: Only where Home Assistant's stack is declared
      ansible.builtin.meta: end_host
      when: homeassistant_release is not defined

    - name: The running container
      ansible.builtin.command:
        argv: [podman, container, inspect, "{{ matter_server_cleanup_container }}"]
      register: matter_server_cleanup_inspect
      changed_when: false
      check_mode: false

    - name: The container in use
      ansible.builtin.set_fact:
        matter_server_cleanup_info: "{{ (matter_server_cleanup_inspect.stdout | from_json)[0] }}"

    - name: The container runs matterjs-server
      ansible.builtin.assert:
        that:
          - matter_server_cleanup_info.State.Running
          - matter_server_cleanup_info.ImageName.startswith(matter_server_cleanup_image ~ ':')
        fail_msg: >-
          {{ matter_server_cleanup_container }} does not run matterjs-server, so the Python server's files
          may still be needed.
        quiet: true

    - name: It answers
      ansible.builtin.uri:
        url: "{{ matter_server_cleanup_url }}/health"
      check_mode: false

    - name: The Python server's files in the volume
      ansible.builtin.find:
        paths: >-
          {{ matter_server_cleanup_info.Mounts | selectattr('Destination', 'eq', '/data')
             | map(attribute='Source') | first }}
        patterns: ["{{ matter_server_cleanup_python_files }}"]
        use_regex: true
        file_type: any
      register: matter_server_cleanup_found

    - name: The Python server's files removed, with the server stopped
      when: matter_server_cleanup_found.files | length > 0
      block:
        - name: Stop the server
          ansible.builtin.command:
            argv: [podman, stop, "{{ matter_server_cleanup_container }}"]
          changed_when: true

        - name: Remove the files
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ matter_server_cleanup_found.files }}"
          loop_control:
            label: "{{ item.path | basename }}"

      always:
        - name: Start the server
          ansible.builtin.command:
            argv: [podman, start, "{{ matter_server_cleanup_container }}"]
          changed_when: true

        - name: Wait for it to answer
          ansible.builtin.uri:
            url: "{{ matter_server_cleanup_url }}/health"
          register: matter_server_cleanup_health
          until: matter_server_cleanup_health.status | default(0) == 200
          retries: 30
          delay: 2
          when: not ansible_check_mode

    - name: The copy removed
      ansible.builtin.file:
        path: "{{ matter_server_cleanup_backup }}"
        state: absent

    - name: The Python server's images
      ansible.builtin.command:
        argv: [podman, images, --format, json, --filter, "reference={{ item }}"]
      loop: "{{ matter_server_cleanup_python_images }}"
      register: matter_server_cleanup_images
      changed_when: false
      check_mode: false

    - name: The Python server's images removed
      ansible.builtin.command:
        argv: [podman, image, rm, "{{ item.Id }}"]
      loop: >-
        {{ matter_server_cleanup_images.results | map(attribute='stdout') | map('from_json') | flatten
           | unique(attribute='Id') | list }}
      loop_control:
        label: "{{ item.Names | default(['<untagged>']) | join(', ') }}"
      changed_when: true

# Give the NCSU tunnel its Duo passcodes. In NC State's Duo device management,
# add a tablet with Duo Mobile, then pass the activation code its QR code holds,
# <code>-<base64 of Duo's API host>, as -e ncsu_duo_activation=... after
# site.yml has installed the unit. The play activates a device as Duo Mobile
# would, writes the secret Duo returns to ncsu_duo_totp_file, and starts the
# tunnel on it. The secret is state of the host, kept nowhere else, and each
# activation code works once: a lost secret is replaced by activating another
# device, after which the old one is removed in Duo.
- name: NCSU tunnel's Duo device
  hosts: ncsusplitt.regulad.internal
  gather_facts: false
  become: true
  tags: [ncsu-duo]
  vars:
    ncsu_duo_code: "{{ ncsu_duo_activation.split('-', 1) | first }}"
    ncsu_duo_api: "{{ (ncsu_duo_activation.split('-', 1) | last ~ '==') | b64decode }}"
  tasks:
    - name: An activation code for Duo's API
      ansible.builtin.assert:
        that:
          - ncsu_duo_activation is defined
          - ncsu_duo_activation is match('^[A-Za-z0-9]+-[A-Za-z0-9+/]+=*$')
          - ncsu_duo_api is match('^api-[a-z0-9]+\.duosecurity\.com$')
        fail_msg: Pass the QR code's activation code, <code>-<base64 of api-*.duosecurity.com>, as ncsu_duo_activation.
        quiet: true

    # Before the code is spent, as it works only once.
    - name: The secret's directory, from site.yml
      ansible.builtin.stat:
        path: "{{ ncsu_duo_totp_file | dirname }}"
      register: ncsu_duo_directory

    - name: Site.yml has run
      ansible.builtin.assert:
        that: ncsu_duo_directory.stat.isdir | default(false)
        fail_msg: Run site.yml first, which creates {{ ncsu_duo_totp_file | dirname }}.
        quiet: true

    - name: Report a check run
      ansible.builtin.debug:
        msg: A run would activate a Duo Mobile device through {{ ncsu_duo_api }} and start ncsu-tun.service on its secret.
      when: ansible_check_mode

    - name: Activate, then start the tunnel on the secret
      when: not ansible_check_mode
      block:
        # Duo Mobile signs its answers to pushes with this key. This device
        # never answers one, so the private half is never kept.
        - name: A public key for the device
          ansible.builtin.shell:
            cmd: set -o pipefail && openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | openssl pkey -pubout
            executable: /bin/bash
          register: ncsu_duo_pubkey
          changed_when: false

        # The request Duo Mobile for Android sends, with the fields duolibre
        # (github.com/evan-goode/duolibre) sends; Duo refuses an old
        # app_version. model names the device in Duo's device list.
        - name: Activate a Duo Mobile device
          ansible.builtin.uri:
            url: https://{{ ncsu_duo_api }}/push/v2/activation/{{ ncsu_duo_code }}?customer_protocol=1
            method: POST
            http_agent: okhttp/4.0.0
            body_format: form-urlencoded
            body:
              touchid_status: not_supported
              jailbroken: "false"
              architecture: arm64
              region: US
              app_id: com.duosecurity.duomobile
              full_disk_encryption: "true"
              passcode_status: "true"
              platform: Android
              pkpush: rsa-sha512
              pubkey: "{{ ncsu_duo_pubkey.stdout }}"
              app_version: 4.115.0
              app_build_number: "411500"
              version: 9.0.0
              manufacturer: unknown
              language: en
              model: "{{ inventory_hostname_short }}"
              security_patch_level: "2019-07-05"
          register: ncsu_duo_activated
          changed_when: true
          # The next task reports a failure without the answer's secrets.
          failed_when: false
          no_log: true

        - name: Duo activated the device
          ansible.builtin.assert:
            that: ncsu_duo_activated.json.response.hotp_secret | default('') | length > 0
            fail_msg: >-
              Duo answered {{ ncsu_duo_activated.status | default('nothing') }}:
              {{ ncsu_duo_activated.json.message | default(ncsu_duo_activated.msg | default('no secret')) }}.
            quiet: true

        # Duo still calls it hotp_secret, but checks a current Duo Mobile's
        # passcodes as TOTP codes: 6 digits every 30 seconds, keyed by the
        # secret's own bytes. The file holds those in openconnect's hex form,
        # so that no character of the secret is read as syntax.
        - name: The secret
          ansible.builtin.copy:
            dest: "{{ ncsu_duo_totp_file }}"
            content: "0x{{ ncsu_duo_activated.json.response.hotp_secret.encode().hex() }}\n"
            owner: root
            group: root
            mode: "0600"
          no_log: true
          diff: false

        # A tunnel that gave up after its 3 starts refuses another for 10 minutes.
        - name: The tunnel's start limit reset
          ansible.builtin.command:
            argv: [systemctl, reset-failed, ncsu-tun.service]
          changed_when: false

        - name: The tunnel started on the secret
          ansible.builtin.systemd_service:
            name: ncsu-tun.service
            state: restarted

        # The keepalive's query is answered only through the tunnel.
        - name: Wait for the tunnel to carry the keepalive
          ansible.builtin.systemd_service:
            name: ncsu-keepalive.service
            state: started
          register: ncsu_duo_keepalive
          until: ncsu_duo_keepalive is succeeded
          retries: 18
          delay: 10

# Regenerate FreeIPA's memberOf attributes from its groups' members, where the
# memberOf plugin missed entries, as after a migration.
- name: FreeIPA memberOf fixup
  hosts: freeipa_servers
  gather_facts: false
  become: true
  tags: [memberof-fixup]
  tasks:
    - name: Regenerate memberOf
      ansible.builtin.include_role:
        name: freeipa_server
        tasks_from: memberof_fixup

# Build llama.cpp at the commit llama_cpp_commit declares, from llama_cpp_repo,
# and move llama-server to it: bump the commit, then run this play with
# --limit <host>. It checks the commit out in llama_cpp_dir and builds
# llama-server into a directory of its own, build-<commit>, while the running
# build keeps serving, and checks the new binary reports that commit. Then it
# points build, from which llama-server.service runs, at the new build,
# restarts llama-server and waits for it to report itself healthy; if it does
# not, it points build back, restarts the previous build and fails: revert
# llama_cpp_commit. A build finds its libraries through its own directory, or,
# for the first build made by hand in build itself, through build, so the
# previous build stays whole to return to; older ones are removed. It does
# nothing where build already points at the declared commit's build.
- name: Llama.cpp built at its declared commit
  hosts: generated
  gather_facts: false
  become: true
  tags: [llama-cpp-build]
  vars:
    llama_cpp_build: "{{ llama_cpp_dir }}/build-{{ llama_cpp_commit[:12] }}"
    llama_cpp_link: "{{ llama_cpp_dir }}/build"
    # llama-server's /health, which needs no API key.
    llama_cpp_health: http://127.0.0.1:{{ llama_server_port }}/health
    # Seconds the build may take, and llama-server to load its model.
    llama_cpp_build_timeout: 7200
    llama_cpp_start_timeout: 900
  tasks:
    - name: Only where llama.cpp is declared
      ansible.builtin.meta: end_host
      when: llama_cpp_commit is not defined

    - name: What build is now
      ansible.builtin.stat:
        path: "{{ llama_cpp_link }}"
      register: llama_cpp_link_stat

    - name: Stop here where build already points at the declared commit's build
      ansible.builtin.meta: end_host
      when:
        - llama_cpp_link_stat.stat.islnk | default(false)
        - llama_cpp_link_stat.stat.lnk_target == llama_cpp_build

    - name: Build packages
      ansible.builtin.apt:
        name: "{{ llama_cpp_build_packages }}"
        state: present

    - name: The commit checked out now
      ansible.builtin.command:
        argv: [git, -C, "{{ llama_cpp_dir }}", rev-parse, HEAD]
      register: llama_cpp_old_head
      changed_when: false
      check_mode: false

    # force discards local changes, such as the one the first build by hand
    # carried, which the declared commit now holds.
    - name: The declared commit checked out
      ansible.builtin.git:
        repo: "{{ llama_cpp_repo }}"
        dest: "{{ llama_cpp_dir }}"
        version: "{{ llama_cpp_commit }}"
        force: true
      # Upstream's whole diff between the commits says nothing useful here.
      diff: false

    - name: The HIP compiler's directory
      ansible.builtin.command:
        argv: [hipconfig, -l]
      register: llama_cpp_hip_bin
      changed_when: false
      check_mode: false

    - name: Configured in a directory of its own
      ansible.builtin.command:
        argv: >-
          {{ ['cmake', '-S', llama_cpp_dir, '-B', llama_cpp_build, '-G', 'Ninja',
              '-DCMAKE_HIP_COMPILER=' ~ llama_cpp_hip_bin.stdout ~ '/clang']
             + llama_cpp_cmake_defines.items() | map('join', '=') | map('regex_replace', '^', '-D') | list }}
        creates: "{{ llama_cpp_build }}/build.ninja"

    - name: Llama-server built, while the running build serves
      ansible.builtin.command:
        argv: [cmake, --build, "{{ llama_cpp_build }}", --target, llama-server]
        creates: "{{ llama_cpp_build }}/bin/llama-server"
      async: "{{ llama_cpp_build_timeout }}"
      poll: 30

    - name: The new build reports the declared commit
      ansible.builtin.command:
        argv: ["{{ llama_cpp_build }}/bin/llama-server", --version]
      register: llama_cpp_new
      changed_when: false
      failed_when: >-
        llama_cpp_new.rc != 0
        or (llama_cpp_new.stdout ~ llama_cpp_new.stderr) is not search('commit ' ~ llama_cpp_commit[:7])
      when: not ansible_check_mode

    - name: The build to return to
      ansible.builtin.set_fact:
        llama_cpp_previous: >-
          {{ llama_cpp_link_stat.stat.lnk_target if llama_cpp_link_stat.stat.islnk | default(false)
             else llama_cpp_dir ~ '/build-' ~ llama_cpp_old_head.stdout[:12] }}

    # The running process keeps the files it has open.
    - name: A build made in build itself moved to a directory of its own
      ansible.builtin.command:
        argv: [mv, "{{ llama_cpp_link }}", "{{ llama_cpp_previous }}"]
        creates: "{{ llama_cpp_previous }}"
      when:
        - llama_cpp_link_stat.stat.exists
        - not llama_cpp_link_stat.stat.islnk

    - name: Switch, or switch back
      block:
        - name: Build pointed at the new build
          ansible.builtin.file:
            src: "{{ llama_cpp_build }}"
            dest: "{{ llama_cpp_link }}"
            state: link
            force: true
          # A check run does not move a build made in build itself aside.
          when: not ansible_check_mode or llama_cpp_link_stat.stat.islnk | default(false)

        - name: Llama-server restarted on it
          ansible.builtin.systemd_service:
            name: llama-server.service
            state: restarted

        - name: Wait for llama-server to load its model
          ansible.builtin.uri:
            url: "{{ llama_cpp_health }}"
          register: llama_cpp_health_result
          until: llama_cpp_health_result.status | default(0) == 200
          retries: "{{ [(llama_cpp_start_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode

      rescue:
        - name: Build pointed back at the previous build
          ansible.builtin.file:
            src: "{{ llama_cpp_previous }}"
            dest: "{{ llama_cpp_link }}"
            state: link
            force: true
          # A check run does not move a build made in build itself aside.
          when: not ansible_check_mode or llama_cpp_link_stat.stat.islnk | default(false)

        - name: Llama-server restarted on the previous build
          ansible.builtin.systemd_service:
            name: llama-server.service
            state: restarted

        - name: Wait for the previous build
          ansible.builtin.uri:
            url: "{{ llama_cpp_health }}"
          register: llama_cpp_health_back
          until: llama_cpp_health_back.status | default(0) == 200
          retries: "{{ [(llama_cpp_start_timeout | int) // 10, 1] | max }}"
          delay: 10
          when: not ansible_check_mode

        - name: Report the rollback
          ansible.builtin.fail:
            msg: >-
              llama-server did not come up on {{ llama_cpp_build | basename }}, and runs
              {{ llama_cpp_previous | basename }} again. Revert llama_cpp_commit before the next run.

    # Only the play's own build directories, not the checkout's.
    - name: The builds kept
      ansible.builtin.find:
        paths: "{{ llama_cpp_dir }}"
        patterns: ['^build-[0-9a-f]{12}$']
        use_regex: true
        file_type: directory
      register: llama_cpp_builds

    - name: Builds older than the previous one removed
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ llama_cpp_builds.files | rejectattr('path', 'in', [llama_cpp_build, llama_cpp_previous]) | list }}"
      loop_control:
        label: "{{ item.path | basename }}"
