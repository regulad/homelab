---
# Phase 4: the only playbook for generated hosts, from OpenTofu state via the
# inventory/*.terraform_state.yml sources. Every play converges hosts to the
# declared state and is safe to rerun. Hardware hosts are configured from
# ../ansible-hardware.
- name: Generated host baseline
  hosts: generated:!arawi
  roles:
    - base
    - tailscale

# Hosts by OS group; ca_trust_family comes from each group's group_vars.
- name: Distrusted root certificates
  hosts: debian:ubuntu:rhel:freebsd
  gather_facts: false
  become: true
  roles:
    - ca_trust

# Each Linux host's mail, relayed through mail.regulad.xyz as its FreeIPA
# null- account, by OS group.
- name: Mail relay
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - mail_relay

# Each Linux host's own automatic updater, by OS group.
- name: Automatic updates
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - auto_updates

# arawi runs pfSense, whose config.xml the pfsense role converges through
# pfsensible.core; the baseline roles do not apply to it. Its group is its own,
# because another pfSense host would not share its configuration.
- name: Arawi
  hosts: arawi
  gather_facts: false
  become: true
  roles:
    - pfsense

# Hosts that serve PHP through their distribution's php-fpm; the group comes
# from each host's ansible_host in OpenTofu.
- name: PHP-FPM hosts
  hosts: php_fpm
  gather_facts: false
  roles:
    - php_fpm

# Native files and systemd units from host_vars and files/<host>/.
- name: Host files and units
  hosts: generated:!arawi
  gather_facts: false
  become: true
  roles:
    - host_files

- name: Podman hosts
  hosts: podman_hosts
  roles:
    - podman
    - avahi

# Rendered from host_vars/<host>/services.yml.
- name: Quadlet services
  hosts: podman_hosts
  roles:
    - quadlet
