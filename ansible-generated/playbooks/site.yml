---
# Phase 4: the only playbook for generated hosts, from OpenTofu state via the
# inventory/*.terraform_state.yml sources. Every play converges hosts to the
# declared state and is safe to rerun. Hardware hosts are configured from
# ../ansible-hardware. The plays both stages share come first.
- name: Plays both stages share
  ansible.builtin.import_playbook: ../../ansible-common/playbooks/site.yml

# Before Podman and the services: no AppArmor in a privileged container.
- name: Proxmox containers
  hosts: proxmox_containers
  gather_facts: false
  become: true
  tags: [lxc_guest]
  roles:
    - lxc_guest

# systemd-resolved, and its mDNS, on every homelab host that runs it; the OCI
# instances' networks carry no multicast.
- name: Name resolution and mDNS
  hosts: ubuntu:rhel:!oci
  gather_facts: false
  become: true
  tags: [resolved]
  roles:
    - role: resolved
      when: resolved_enabled

# Let's Encrypt certificates by Cloudflare DNS-01, ahead of the host files
# whose renewal hooks act on them.
- name: Certificates
  hosts: certbot
  gather_facts: false
  become: true
  tags: [certbot]
  roles:
    - certbot

# The distribution's Docker, ahead of Wings, which runs on it.
- name: Docker hosts
  hosts: docker_hosts
  gather_facts: false
  become: true
  tags: [docker]
  roles:
    - docker

# Pterodactyl Wings, which runs the panel's game servers.
- name: Pterodactyl Wings
  hosts: wings
  gather_facts: false
  become: true
  tags: [wings]
  roles:
    - wings

# The watchdog daemon, on VMs whose virtual watchdog device OpenTofu enables.
- name: Watchdog daemon
  hosts: watchdog
  gather_facts: false
  become: true
  tags: [watchdog]
  roles:
    - watchdog

# arawi runs pfSense, whose config.xml the pfsense role converges through
# pfsensible.core; the baseline roles do not apply to it. Its group is its own,
# because another pfSense host would not share its configuration.
- name: Arawi
  hosts: arawi
  gather_facts: false
  become: true
  tags: [pfsense]
  roles:
    - pfsense

# Hosts that serve PHP through their distribution's php-fpm; the group comes
# from each host's ansible_host in OpenTofu.
- name: PHP-FPM hosts
  hosts: php_fpm
  gather_facts: false
  tags: [php_fpm]
  roles:
    - php_fpm

# Synapse from matrix.org's repository, its modules, the bridges' users and
# the state compressor, ahead of the host files that configure them.
- name: Matrix homeserver
  hosts: matrix
  become: true
  tags: [matrix]
  roles:
    - matrix

# Native files and systemd units from host_vars and files/<host>/.
- name: Host files and units
  hosts: generated:!arawi
  gather_facts: false
  become: true
  tags: [host_files]
  roles:
    - host_files

# The Orchard controller's service accounts, through its API, once host_files
# runs the controller.
- name: Orchard controllers
  hosts: orchard_controllers
  gather_facts: false
  tags: [orchard_controller]
  roles:
    - orchard_controller

# Nextcloud's config.php, apps, app settings and Mail provisioning, through occ
# in its container, once host_files runs its stack.
- name: Nextcloud
  hosts: nextcloud
  gather_facts: false
  become: true
  tags: [nextcloud]
  roles:
    - nextcloud

# The docker role's compose projects, once host_files has placed their files and
# secrets.
- name: Docker Compose projects
  hosts: docker_hosts
  gather_facts: false
  become: true
  tags: [docker, docker_compose]
  tasks:
    - name: Compose projects
      ansible.builtin.include_role:
        name: docker
        tasks_from: compose

# FreeIPA's servers, after the host files that give them their /etc/hosts.
- name: FreeIPA servers
  hosts: freeipa_servers
  gather_facts: false
  become: true
  tags: [freeipa_server]
  roles:
    - freeipa_server

# The old FreeIPA server's stand-in, rewriting LDAP for wako.
- name: LDAP proxies
  hosts: ldap_proxies
  gather_facts: false
  become: true
  tags: [ldap_proxy]
  roles:
    - ldap_proxy

# RADIUS: wako against its own directory, and the stand-in's proxy to it.
- name: RADIUS servers
  hosts: freeradius_servers
  gather_facts: false
  become: true
  tags: [freeradius]
  roles:
    - freeradius

- name: SoftEther VPN servers
  hosts: softether_servers
  gather_facts: false
  become: true
  tags: [softether]
  roles:
    - softether

- name: FileVault unlocking (lime)
  hosts: lime
  gather_facts: false
  become: true
  tags: [lime]
  roles:
    - lime

# Installs the panel where none exists and keeps its .env; upgrades are
# playbooks/maintenance.yml.
- name: Pterodactyl panel
  hosts: pterodactyl
  gather_facts: false
  become: true
  tags: [pterodactyl]
  roles:
    - pterodactyl

- name: Podman hosts
  hosts: podman_hosts
  become: true
  roles:
    - role: podman
      tags: [podman]
    - role: avahi
      tags: [avahi]

# Rendered from host_vars/<host>/services.yml.
- name: Quadlet services
  hosts: podman_hosts
  become: true
  tags: [quadlet]
  roles:
    - quadlet

# qBittorrent's declared settings, through its Web API, once its Quadlet runs.
- name: BitTorrent clients
  hosts: qbittorrent
  gather_facts: false
  tags: [qbittorrent]
  roles:
    - qbittorrent

# Nexus's own roles and users, through its REST API as svc-ansible, once its
# Quadlet runs.
- name: Nexus security
  hosts: nexus_servers
  gather_facts: false
  tags: [nexus_security]
  roles:
    - nexus_security

# Last: AIDE's baseline moved for the files this run wrote.
- name: File integrity baseline for this run's files
  ansible.builtin.import_playbook: ../../ansible-common/playbooks/aide-refresh.yml
