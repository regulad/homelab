---
# Phase 4: the only playbook for generated hosts, from OpenTofu state via the
# inventory/*.terraform_state.yml sources. Every play converges hosts to the
# declared state and is safe to rerun. Hardware hosts are configured from
# ../ansible-hardware. The plays both stages share come first.
- name: Plays both stages share
  ansible.builtin.import_playbook: ../../ansible-common/playbooks/site.yml

# firewalld's zones on the Enterprise Linux hosts; their policies and direct
# rules are host files.
- name: Firewall zones
  hosts: rhel
  gather_facts: false
  become: true
  roles:
    - firewalld

# Let's Encrypt certificates by Cloudflare DNS-01, ahead of the host files
# whose renewal hooks act on them.
- name: Certificates
  hosts: certbot
  gather_facts: false
  become: true
  roles:
    - certbot

# The distribution's Docker, ahead of Wings, which runs on it.
- name: Docker hosts
  hosts: docker_hosts
  gather_facts: false
  become: true
  roles:
    - docker

# Pterodactyl Wings, which runs the panel's game servers.
- name: Pterodactyl Wings
  hosts: wings
  gather_facts: false
  become: true
  roles:
    - wings

# The watchdog daemon, on VMs whose virtual watchdog device OpenTofu enables.
- name: Watchdog daemon
  hosts: watchdog
  gather_facts: false
  become: true
  roles:
    - watchdog

# arawi runs pfSense, whose config.xml the pfsense role converges through
# pfsensible.core; the baseline roles do not apply to it. Its group is its own,
# because another pfSense host would not share its configuration.
- name: Arawi
  hosts: arawi
  gather_facts: false
  become: true
  roles:
    - pfsense

# Hosts that serve PHP through their distribution's php-fpm; the group comes
# from each host's ansible_host in OpenTofu.
- name: PHP-FPM hosts
  hosts: php_fpm
  gather_facts: false
  roles:
    - php_fpm

# Synapse from matrix.org's repository, its modules, the bridges' users and
# the state compressor, ahead of the host files that configure them.
- name: Matrix homeserver
  hosts: matrix
  become: true
  roles:
    - matrix

# Native files and systemd units from host_vars and files/<host>/.
- name: Host files and units
  hosts: generated:!arawi
  gather_facts: false
  become: true
  roles:
    - host_files

# FreeIPA's servers, after the host files that give them their /etc/hosts.
- name: FreeIPA servers
  hosts: freeipa_servers
  gather_facts: false
  become: true
  roles:
    - freeipa_server

# The old FreeIPA server's stand-in, rewriting LDAP for wako.
- name: LDAP proxies
  hosts: ldap_proxies
  gather_facts: false
  become: true
  roles:
    - ldap_proxy

# RADIUS: wako against its own directory, and the stand-in's proxy to it.
- name: RADIUS servers
  hosts: freeradius_servers
  gather_facts: false
  become: true
  roles:
    - freeradius

- name: SoftEther VPN servers
  hosts: softether_servers
  gather_facts: false
  become: true
  roles:
    - softether

- name: FileVault unlocking (lime)
  hosts: lime
  gather_facts: false
  become: true
  roles:
    - lime

# Installs the panel where none exists and keeps its .env; upgrades are
# playbooks/maintenance.yml.
- name: Pterodactyl panel
  hosts: pterodactyl
  gather_facts: false
  become: true
  roles:
    - pterodactyl

- name: Podman hosts
  hosts: podman_hosts
  roles:
    - podman
    - avahi

# Rendered from host_vars/<host>/services.yml.
- name: Quadlet services
  hosts: podman_hosts
  roles:
    - quadlet
