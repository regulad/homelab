---
# Phase 4: the only playbook for generated hosts, from OpenTofu outputs via
# inventory/inventory.py. Every play converges hosts to the declared state and
# is safe to rerun. Hardware hosts are configured from ../ansible-hardware.
- name: Generated host baseline
  hosts: generated
  roles:
    - base
    - tailscale

- name: Podman hosts
  hosts: podman_hosts
  roles:
    - podman
    - avahi

# Rendered from host_vars/<host>/services.yml.
- name: Quadlet services
  hosts: podman_hosts
  roles:
    - quadlet
