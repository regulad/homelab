---
# Phase 4: the only playbook for generated hosts, from OpenTofu state via the
# inventory/*.terraform_state.yml sources. Every play converges hosts to the
# declared state and is safe to rerun. Hardware hosts are configured from
# ../ansible-hardware.
- name: Generated host baseline
  hosts: generated:!arawi
  roles:
    - base
    - tailscale

# Hosts by OS group; ca_trust_family comes from each group's group_vars.
- name: Root certificates trusted and distrusted
  hosts: debian:ubuntu:rhel:freebsd
  gather_facts: false
  become: true
  roles:
    - ca_trust

# Each Linux host's mail, relayed through mail.regulad.xyz as its FreeIPA
# null- account, by OS group.
- name: Mail relay
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - mail_relay

# Each Linux host's own automatic updater, by OS group.
- name: Automatic updates
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - auto_updates

# Ubuntu's amd64v3 builds, where the release and the CPU support them.
- name: APT architecture variant
  hosts: ubuntu
  gather_facts: false
  become: true
  roles:
    - apt_amd64v3

# Sysctl and GRUB drop-ins each host declares.
- name: Kernel parameters
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - kernel_params

# zram, and disk swapfiles on real drives, on hosts with their own kernel.
- name: Swap
  hosts: debian:ubuntu:!proxmox_containers
  gather_facts: false
  become: true
  roles:
    - swap

# Access to the restic repository, and the host's backup jobs, on hosts with a
# key of their own.
- name: Restic repository access and backups
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - restic

# Netplan as the only network configuration, where a host declares it.
- name: Network configuration
  hosts: ubuntu
  gather_facts: false
  become: true
  roles:
    - netplan

# Kernel crash dumps through kdump-tools, on the hosts in the kdump group.
- name: Kernel crash dumps
  hosts: kdump
  gather_facts: false
  become: true
  roles:
    - kdump

# Let's Encrypt certificates by Cloudflare DNS-01, ahead of the host files
# whose renewal hooks act on them.
- name: Certificates
  hosts: certbot
  gather_facts: false
  become: true
  roles:
    - certbot

# The distribution's Docker, ahead of Wings, which runs on it.
- name: Docker hosts
  hosts: docker_hosts
  gather_facts: false
  become: true
  roles:
    - docker

# Pterodactyl Wings, which runs the panel's game servers.
- name: Pterodactyl Wings
  hosts: wings
  gather_facts: false
  become: true
  roles:
    - wings

# The watchdog daemon, on VMs whose virtual watchdog device OpenTofu enables.
- name: Watchdog daemon
  hosts: watchdog
  gather_facts: false
  become: true
  roles:
    - watchdog

# arawi runs pfSense, whose config.xml the pfsense role converges through
# pfsensible.core; the baseline roles do not apply to it. Its group is its own,
# because another pfSense host would not share its configuration.
- name: Arawi
  hosts: arawi
  gather_facts: false
  become: true
  roles:
    - pfsense

# Hosts that serve PHP through their distribution's php-fpm; the group comes
# from each host's ansible_host in OpenTofu.
- name: PHP-FPM hosts
  hosts: php_fpm
  gather_facts: false
  roles:
    - php_fpm

# Synapse from matrix.org's repository, its modules, the bridges' users and
# the state compressor, ahead of the host files that configure them.
- name: Matrix homeserver
  hosts: matrix
  become: true
  roles:
    - matrix

# Native files and systemd units from host_vars and files/<host>/.
- name: Host files and units
  hosts: generated:!arawi
  gather_facts: false
  become: true
  roles:
    - host_files

# Installs the panel where none exists and keeps its .env; upgrades are
# playbooks/maintenance.yml.
- name: Pterodactyl panel
  hosts: pterodactyl
  gather_facts: false
  become: true
  roles:
    - pterodactyl

- name: Podman hosts
  hosts: podman_hosts
  roles:
    - podman
    - avahi

# Rendered from host_vars/<host>/services.yml.
- name: Quadlet services
  hosts: podman_hosts
  roles:
    - quadlet
