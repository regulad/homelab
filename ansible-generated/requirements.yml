---
# Collections, each pinned to an exact version when a role first needs it.
collections:
  # The terraform_state inventory plugin, and the tf_output lookup the restic role reads
  # tofu/backblaze with.
  - name: cloud.terraform
    version: 4.0.0
  # The proxmox_pct_remote connection plugin, for LXC containers.
  - name: community.proxmox
    version: 2.1.0
  # The sops vars plugin, which decrypts *.sops.yml in host_vars and group_vars.
  - name: community.sops
    version: 2.5.0
  # Modules that edit pfSense's config.xml, for arawi.
  - name: pfsensible.core
    version: 0.7.1
  # ipa_user, which manages each host's FreeIPA mail account over the JSON-RPC API.
  - name: community.general
    version: 13.5.0
