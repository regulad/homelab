---
# Collections, each pinned to an exact version when a role first needs it.
collections:
  # The terraform_state inventory plugin, and the tf_output lookup the restic role reads
  # tofu/backblaze with: the head of regulad/cloud.terraform's terraform_state_inventory_cache
  # branch, which adds inventory caching, pending ansible-collections/cloud.terraform#220. It
  # installs as 5.0.0-dev0, the version in that commit's galaxy.yml; it is not a release.
  - name: https://github.com/regulad/cloud.terraform.git
    type: git
    version: 4d748cb61147f9c8ec8955f957885d59667429de
  # The proxmox_pct_remote connection plugin, for LXC containers: the head of
  # regulad/community.proxmox's feat/proxmox-pct-remote-pipelining branch, which adds
  # pipelining, pending ansible-collections/community.proxmox#549. It installs as 3.0.0,
  # the version in that commit's galaxy.yml; it is not the 3.0.0 release.
  - name: https://github.com/regulad/community.proxmox.git
    type: git
    version: a1deb178b147ff5abe8973c7837cba382a45f012
  # The sops vars plugin, which decrypts *.sops.yml in host_vars and group_vars.
  - name: community.sops
    version: 2.5.0
  # Modules that edit pfSense's config.xml, for arawi.
  - name: pfsensible.core
    version: 0.7.1
  # ipa_user, which manages each host's FreeIPA mail account over the JSON-RPC API, and
  # ldap_attrs, for the FreeIPA server's directory settings.
  - name: community.general
    version: 13.5.0
  # firewalld zones and SELinux booleans on the Enterprise Linux hosts.
  - name: ansible.posix
    version: 2.2.2
