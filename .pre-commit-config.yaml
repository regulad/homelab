# Local hooks use a tool from the operator's own (declarative) setup or pre-commit's
# built-in pygrep. Only pre-commit-hooks has a managed environment, which pre-commit
# builds in its cache on first run.
minimum_pre_commit_version: "4.4.0"

repos:
  # --- File hygiene ---------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: detect-private-key
      # Snippets and files/ are byte-exact copies of the files OpenTofu
      # uploads and Ansible places, so these hooks never rewrite them.
      - id: end-of-file-fixer
        exclude: ^(tofu/gonkputer/snippets|ansible-generated/files)/
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(tofu/gonkputer/snippets|ansible-generated/files)/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(tofu/gonkputer/snippets|ansible-generated/files)/

  # --- OpenTofu -------------------------------------------------------------
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt
        language: unsupported
        entry: tofu fmt
        files: \.(tf|tftest\.hcl)$

      # Needs `tofu init -backend=false` once per root; decrypted inputs are not required.
      # Add one hook per provider root.
      - id: tofu-validate-oracle
        name: tofu validate (oracle)
        language: unsupported
        entry: tofu -chdir=tofu/oracle validate -no-color
        files: ^tofu/(oracle|shared)/
        pass_filenames: false

      - id: tofu-validate-gonkputer
        name: tofu validate (gonkputer)
        language: unsupported
        entry: tofu -chdir=tofu/gonkputer validate -no-color
        files: ^tofu/(gonkputer|shared)/
        pass_filenames: false

      # Default `recommended` preset; there is no .tflint.hcl because recursive mode
      # resolves the config file per module directory. Recursing from tofu/ keeps the
      # ignored docs/snapshot/ drafts out of the lint.
      - id: tflint
        name: tflint
        language: unsupported
        entry: tflint --chdir=tofu --recursive
        files: ^tofu/.*\.tf$
        pass_filenames: false

  # --- Public-repository privacy (AGENTS.md § 2 and § 11) --------------------
  - repo: local
    hooks:
      - id: sops-encrypted
        name: SOPS files are encrypted
        language: pygrep
        entry: '"mac": "ENC\[AES256_GCM,|^\s+mac: ENC\[AES256_GCM,|^sops_mac=ENC\[AES256_GCM,'
        args: [--negate]
        files: \.sops\.(json|ya?ml|env)$
        exclude: ^\.sops\.yaml$

      - id: no-plaintext-ocids
        name: No plaintext OCIDs except images and backup policies
        language: pygrep
        entry: 'ocid1\.(?!image\.|volumebackuppolicy\.)[a-z0-9]+\.'
        types: [text]

      # Only verified Oracle-defined images and backup policies may be plaintext,
      # each as a map entry keyed by its exact quoted name.
      - id: oracle-ocids-named
        name: Image and backup-policy OCIDs are keyed by name
        language: pygrep
        entry: '^(?![ \t]*"[^"\n]+"[ \t]*=[ \t]*"ocid1\.)[^\n]*ocid1\.(image|volumebackuppolicy)\.'
        types: [text]

      # Our GUA prefixes stay in SOPS; ULA and Tailscale ranges (fc00::/7) do not match.
      # The lookbehind skips later hextets, such as the 3fff in fe80::1ef4:3fff:fe...
      # The lookahead exempts publicly known addresses, each matched whole:
      # Cloudflare DNS 2606:4700:4700::1111 and ::1001, and Quad9 2620:fe::fe.
      - id: no-gua-ipv6
        name: No global unicast IPv6 literals
        language: pygrep
        entry: '(?i)(?<![0-9a-f:])(?!(?:2606:4700:4700::1111|2606:4700:4700::1001|2620:fe::fe)(?![0-9a-f:]))[23][0-9a-f]{3}:[0-9a-f]{1,4}:'
        types: [text]
        exclude: \.sops\.
