# One Ansible step: a stage, or one host of it. The root Taskfile includes this
# with STAGE, and either EXCEPT, a host the stage leaves to a step of its own, or
# HOST and STEP, for that host's step; HOST and EXCEPT may name a group. WRAP
# runs each ansible-playbook inside a command of the stage's bin. AGENTS.md
# § Tasks is the manual.
version: "3"

vars:
  RUN: '{{if .WRAP}}WRAP={{.WRAP}} {{end}}{{if .CACHE}}CACHE={{.CACHE}} {{end}}tasks/ansible.sh {{.STAGE}} playbooks/site.yml'
  SIGNAL: '{{default .STAGE .STEP}}'
  # The hosts this step covers, as an Ansible pattern.
  HOSTS: '{{if .HOST}}{{.HOST}}{{else}}all{{if .EXCEPT}}{{range (splitList " " .EXCEPT)}}:!{{.}}{{end}}{{end}}{{end}}'
  # Where this step's reads of other steps are found: a host's step reads only
  # what applies to it, and a stage leaves out the hosts it excepts.
  SCAN: >-
    {{if .HOST}}ansible-common {{.STAGE}}/roles {{.STAGE}}/playbooks
    {{.STAGE}}/inventory/group_vars {{.STAGE}}/inventory/*.yml
    {{.STAGE}}/inventory/host_vars/{{.HOST}}{{else}}ansible-common {{.STAGE}}{{end}}

env:
  STEPS: '{{join " " .STEPS}}'
  TASK: '{{.TASK_EXE}}'
  SCAN_EXCLUDE: '{{.EXCEPT}}'

tasks:
  init:
    desc: Check out the stage's submodules, install its collections if requirements.yml changed or they are missing, then record the step's signal.
    cmds:
      - task: submodules
      - task: collections
      - task: python
      - task: outputs

  # The stage's submodules checked out, as a new worktree starts without their
  # contents (AGENTS.md § Parallel agents): a role that copies one, as the
  # nextcloud role does its apps, would otherwise find it empty.
  submodules:
    internal: true
    status:
      - test -z "$(git submodule status -- {{.STAGE}} | grep '^-')"
    cmds:
      - git submodule update --init -- {{.STAGE}}

  # Installing is an install under AGENTS.md rule 3; in a worktree, symlink
  # the main checkout's collections/ instead, which satisfies the check.
  collections:
    internal: true
    sources:
      - '{{.STAGE}}/requirements.yml'
    generates:
      - '{{.STAGE}}/collections/ansible_collections/*/*/MANIFEST.json'
    cmds:
      - cd {{.STAGE}} && ansible-galaxy collection install -r requirements.yml -p collections

  # The stage's Python packages (<stage>/python-requirements.txt), pinned by
  # hash, into .task/python, which tasks/ansible.sh puts on PYTHONPATH: an
  # install under AGENTS.md rule 3.
  python:
    internal: true
    sources:
      - '{{.STAGE}}/python-requirements.txt'
    status:
      - test ! -f {{.STAGE}}/python-requirements.txt -o -d .task/python
    cmds:
      - '[ ! -f {{.STAGE}}/python-requirements.txt ] || uv pip install --require-hashes --target .task/python -r {{.STAGE}}/python-requirements.txt'

  outputs:
    desc: Record the step's signal, a digest of alock's records of its hosts, which an apply from any worktree moves.
    cmds:
      - mkdir -p .task/signals
      - tasks/alock-signal.sh {{.STAGE}} '{{.HOSTS}}' > .task/signals/{{.SIGNAL}}.outputs

  upstream:
    internal: true
    cmds:
      - tasks/upstream.sh {{.SIGNAL}} ansible {{.SCAN}}

  references:
    desc: List what the step reads from other steps and roots, and where; tasks/dependents.sh reads it.
    silent: true
    cmds:
      - tasks/upstream.sh --list {{.SIGNAL}} ansible {{.SCAN}}

  plan:
    desc: Check every host of the step (site.yml --check), skipped while its inputs are unchanged and its last check was clean.
    deps: [submodules, upstream]
    sources:
      - ansible-common/**/*
      - '{{.STAGE}}/**/*'
      - exclude: '{{.STAGE}}/collections/**/*'
      - exclude: '{{.STAGE}}/inventory/host_vars/{ {{- join "," (splitList " " (default "" .EXCEPT)) -}} }/**/*'
      - .task/upstream/{{.SIGNAL}}
    # go-task skips the check only while this exists too: a check that found
    # a change, a failure or an unreachable host on any host removes it.
    generates:
      - '{{.CLEAN_DIR}}/{{default .STAGE .STEP}}'
    set: [pipefail]
    cmds:
      - |
        mkdir -p "$(dirname {{.CLEAN_DIR}}/{{default .STAGE .STEP}})"
        log=$(mktemp)
        status=0
        {{.RUN}} --check --limit '{{.HOSTS}}' 2>&1 | tee "$log" || status=$?
        if [ "$status" = 0 ] && awk '/ : ok=[0-9]/ { for (i = 3; i <= NF; i++) { split($i, f, "="); if ((f[1] == "changed" || f[1] == "unreachable" || f[1] == "failed") && f[2] > 0) dirty = 1 } } END { exit dirty }' "$log"; then
          touch {{.CLEAN_DIR}}/{{default .STAGE .STEP}}
        else
          rm -f {{.CLEAN_DIR}}/{{default .STAGE .STEP}}
        fi
        rm -f "$log"
        exit "$status"

  syntax:
    desc: Check the syntax of the stage's site.yml and maintenance.yml.
    deps: [submodules]
    cmds:
      - tasks/ansible.sh {{.STAGE}} playbooks/site.yml --syntax-check
      - tasks/ansible.sh {{.STAGE}} playbooks/maintenance.yml --syntax-check

  check:
    desc: 'Check part of the step, never skipped: LIMIT=<hosts> TAGS=<tags>, and anything after -- goes to ansible-playbook.'
    deps: [submodules]
    cmds:
      - "{{.RUN}} --check --limit '{{if .LIMIT}}{{.LIMIT}}:&{{end}}{{.HOSTS}}'{{if .TAGS}} --tags {{.TAGS}}{{end}} {{.CLI_ARGS}}"

  apply:
    desc: 'Apply the step, or part of it with LIMIT=<hosts> TAGS=<tags>; then record its signal, and plan or check each step that reads it.'
    deps: [submodules]
    preconditions:
      - sh: tasks/require-alock.sh ansible-playbook
        msg: alock's shim must run the apply (tasks/require-alock.sh says why).
    cmds:
      - "{{.RUN}} --limit '{{if .LIMIT}}{{.LIMIT}}:&{{end}}{{.HOSTS}}'{{if .TAGS}} --tags {{.TAGS}}{{end}} {{.CLI_ARGS}}"
      - task: outputs
      - tasks/dependents.sh {{.SIGNAL}} | while read -r dependent; do $TASK $dependent; done
