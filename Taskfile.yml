# The homelab's pipeline, for go-task. AGENTS.md § Tasks is its manual.
#
# A step is an OpenTofu root (with its workspace, as `stripe.live`) or an
# Ansible stage. Each step's tasks come from tasks/tofu.yml or tasks/ansible.yml:
# init, outputs, plan, apply, and for a stage, check. STEPS gives the order the
# pipeline plans them in; every include below is listed there.
version: "3"

vars:
  STEPS:
    - backblaze
    - ansible-hardware
    - ansible-hardware--switches
    - oracle
    - gonkputer
    - gcp
    - azure
    - aws
    - tailscale
    - cloudflare
    - onesignal
    - supabase
    - sentry
    - stripe.live
    - stripe.sandbox
    - vercel
    - github-user.personal
    - github-user.bot
    - github.personal
    - github.bot
    - ansible-generated--ansiblecache
    - ansible-generated
    - authentik
    - ansible-generated--memory

includes:
  backblaze: {taskfile: tasks/tofu.yml, vars: {ROOT: backblaze}}
  # The SG300s are a step of their own: their key is loaded by
  # bin/with-switch-keys into a throwaway agent, which holds no other host's.
  ansible-hardware: {taskfile: tasks/ansible.yml, vars: {STAGE: ansible-hardware, EXCEPT: ciscosmb}}
  ansible-hardware--switches: {taskfile: tasks/ansible.yml, vars: {STAGE: ansible-hardware, HOST: ciscosmb, STEP: ansible-hardware--switches, WRAP: with-switch-keys}}
  oracle: {taskfile: tasks/tofu.yml, vars: {ROOT: oracle}}
  gonkputer: {taskfile: tasks/tofu.yml, vars: {ROOT: gonkputer}}
  gcp: {taskfile: tasks/tofu.yml, vars: {ROOT: gcp}}
  azure: {taskfile: tasks/tofu.yml, vars: {ROOT: azure}}
  aws: {taskfile: tasks/tofu.yml, vars: {ROOT: aws}}
  tailscale: {taskfile: tasks/tofu.yml, vars: {ROOT: tailscale}}
  cloudflare: {taskfile: tasks/tofu.yml, vars: {ROOT: cloudflare}}
  onesignal: {taskfile: tasks/tofu.yml, vars: {ROOT: onesignal}}
  supabase: {taskfile: tasks/tofu.yml, vars: {ROOT: supabase}}
  sentry: {taskfile: tasks/tofu.yml, vars: {ROOT: sentry}}
  stripe.live: {taskfile: tasks/tofu.yml, vars: {ROOT: stripe, WORKSPACE: live}}
  stripe.sandbox: {taskfile: tasks/tofu.yml, vars: {ROOT: stripe, WORKSPACE: sandbox}}
  vercel: {taskfile: tasks/tofu.yml, vars: {ROOT: vercel}}
  github-user.personal: {taskfile: tasks/tofu.yml, vars: {ROOT: github-user, WORKSPACE: personal}}
  github-user.bot: {taskfile: tasks/tofu.yml, vars: {ROOT: github-user, WORKSPACE: bot}}
  github.personal: {taskfile: tasks/tofu.yml, vars: {ROOT: github, WORKSPACE: personal}}
  github.bot: {taskfile: tasks/tofu.yml, vars: {ROOT: github, WORKSPACE: bot}}
  # ansiblecache holds the rest of the stage's fact cache, so it is a step of
  # its own before them, on the local fact cache: the cache never depends on
  # itself.
  ansible-generated--ansiblecache: {taskfile: tasks/ansible.yml, vars: {STAGE: ansible-generated, HOST: ansiblecache.regulad.internal, STEP: ansible-generated--ansiblecache}}
  # memory signs in through authentik, so it reads tofu/authentik's outputs and
  # runs after it, as a step of its own.
  ansible-generated: {taskfile: tasks/ansible.yml, vars: {STAGE: ansible-generated, EXCEPT: memory.regulad.internal ansiblecache.regulad.internal, CACHE: ansiblecache}}
  # tofu/authentik signs in to the authentik that ansible-generated brings up,
  # which no file of the root names, so the dependency is declared here.
  authentik: {taskfile: tasks/tofu.yml, vars: {ROOT: authentik, EXTRA: ansible-generated}}
  ansible-generated--memory: {taskfile: tasks/ansible.yml, vars: {STAGE: ansible-generated, HOST: memory.regulad.internal, STEP: ansible-generated--memory, CACHE: ansiblecache}}

tasks:
  default:
    cmds:
      - "{{.TASK_EXE}} --list"

  init:
    desc: Run every step's init, in pipeline order.
    cmds:
      - for: {var: STEPS}
        task: "{{.ITEM}}:init"

  plan:
    desc: Plan or check every step in pipeline order, skipping each whose files and upstream signal are unchanged; then list what failed and what waits to be applied.
    # Read-only, so a step that fails does not stop the others; each failure is
    # listed at the end, and the task then fails.
    cmds:
      - rm -rf .task/failed
      - for: {var: STEPS}
        cmd: '{{.TASK_EXE}} {{.ITEM}}:plan || { mkdir -p .task/failed; touch .task/failed/{{.ITEM}}; }'
      - task: pending
      - '[ ! -d .task/failed ] || { echo "Failed: $(ls .task/failed | tr "\n" " ")"; exit 1; }'

  pending:
    desc: List the saved plans that show changes and wait to be applied.
    cmds:
      - for f in .task/pending/*; do if [ -e "$f" ]; then cat "$f"; fi; done
