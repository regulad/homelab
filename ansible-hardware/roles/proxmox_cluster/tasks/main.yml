---
# Proxmox and Ceph cluster-wide settings that Phase 1 assigned to Ansible, because
# bpg/proxmox cannot manage them, and the nodes' own settings. Adopt current
# values first with no changes; check-only until Parker confirms a LAN/console
# path to every node (Phase 2).

# The LAN's DHCP sends a domain search list (option 119), which dhclient renders
# with the root's trailing dot, so dhclient-script writes "search
# regulad.internal." into resolv.conf. Proxmox copies the node's search domain
# into each container's /etc/hosts at start, where the dotted name is one
# Postfix refuses. dhclient-script sources its enter hooks at every lease event,
# so the running dhclient picks this up at its next renewal, without a restart.
- name: DHCP search domains without the root's dot
  ansible.builtin.copy:
    dest: /etc/dhcp/dhclient-enter-hooks.d/search-without-root-dot
    content: |
      # Managed by Ansible (proxmox_cluster): drop the root's trailing dot from
      # each name in the DHCP domain search list before resolv.conf is written.
      if [ -n "${new_domain_search-}" ]; then
          new_domain_search=$(printf '%s\n' "$new_domain_search" | sed -e 's/\.$//' -e 's/\. / /g')
      fi
    owner: root
    group: root
    mode: "0644"

# Containers stop before the storage their disks are on. pve-container@.service
# leaves out systemd's default dependencies, so a shutdown stops no container
# itself: it leaves them to pve-guests and pve-ha-lrm, which give up on one that
# ignores its shutdown request, and then stops the storage beneath it. On
# 2026-11-16 Ceph stopped under timemachine's mounted root disk, the final sync
# hung on it, and the hung-task check panicked the node. With this drop-in, a
# shutdown waits for those two, then stops each container still running through
# the unit's own ExecStop: lxc-stop, which kills the container after its
# timeout, and systemd's kill after TimeoutStopSec at the latest. Only then
# does pve-storage.target, which Ceph's targets stop after, stop. Proxmox stops
# containers through their command sockets, never systemctl, so pve-guests and
# pve-ha-lrm never wait on these stop jobs.
- name: Directory of the container units' drop-ins
  ansible.builtin.file:
    path: /etc/systemd/system/pve-container@.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Containers stopped before their storage at shutdown
  ansible.builtin.copy:
    dest: /etc/systemd/system/pve-container@.service.d/50-shutdown-order.conf
    content: |
      # Managed by Ansible (proxmox_cluster): at shutdown, stop each container
      # still running after pve-guests and pve-ha-lrm, before the storage that
      # holds its disks.
      [Unit]
      Conflicts=shutdown.target
      Before=shutdown.target pve-guests.service pve-ha-lrm.service
      After=pve-storage.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for proxmox_cluster

# Guests start only once the storages they need are active. Proxmox activates
# the storage of a volume a guest uses, but not a storage that a mount point
# binds a path of or a hookscript lives on. At boot, the CephFS's first mount
# fails until Ceph serves it, and the HA manager started the containers that
# bind it before a later mount succeeded: they bound the empty directory
# beneath it, with the CephFS stacked over it afterwards. timemachine's
# service then could not start for ten days, and the stacked mount stalls
# systemd's shutdown in the container. Each storage in
# proxmox_cluster_guest_storages gets a pve-storage-active@ unit, which
# pve-storage.target, and so pve-ha-lrm, pve-guests and each container, waits
# for.
- name: Storage wait
  ansible.builtin.copy:
    src: pve-storage-active
    dest: /usr/local/sbin/pve-storage-active
    owner: root
    group: root
    mode: "0755"

- name: Local unit directory
  ansible.builtin.file:
    path: /usr/local/lib/systemd/system
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Storage wait's unit
  ansible.builtin.copy:
    src: pve-storage-active@.service
    dest: /usr/local/lib/systemd/system/pve-storage-active@.service
    owner: root
    group: root
    mode: "0644"
  register: proxmox_cluster_storage_unit

- name: Guests wait for their storages at boot
  ansible.builtin.systemd_service:
    name: pve-storage-active@{{ item }}.service
    enabled: true
    state: started
    daemon_reload: "{{ proxmox_cluster_storage_unit is changed }}"
  loop: "{{ proxmox_cluster_guest_storages }}"
  # A check run cannot read what an install still pending would create.
  when: not (ansible_check_mode and proxmox_cluster_storage_unit is changed)
