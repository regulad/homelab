---
# Converges the switch's running configuration to the declared one and saves
# it. The local cliconf works out the commands: first those adding the declared
# lines, then, from a fresh read, those removing the lines left over. It saves
# whenever the startup configuration differs from the declared one. The diff
# and the commands shown mask password hashes; tasks that carry them set no_log.
- name: Converge the running configuration
  vars:
    ciscosmb_hash_re: '(password encrypted )\S+'
    ciscosmb_declared: "{{ lookup('ansible.builtin.template', ciscosmb_running_config) | ciscosmb_normalize }}"
  block:
    - name: Read the running configuration
      ansible.netcommon.cli_command:
        command: show running-config
      register: ciscosmb_running
      check_mode: false
      changed_when: false

    - name: Running configuration matches the declared one
      ansible.utils.fact_diff:
        before: "{{ ciscosmb_running.stdout | ciscosmb_normalize | regex_replace(ciscosmb_hash_re, '\\1<hash>') }}"
        after: "{{ ciscosmb_declared | regex_replace(ciscosmb_hash_re, '\\1<hash>') }}"

    # Saving is converged separately: a run whose push failed after the switch
    # took its commands leaves the running configuration right but unsaved.
    - name: Read the startup configuration
      ansible.netcommon.cli_command:
        command: show startup-config
      register: ciscosmb_startup
      check_mode: false
      changed_when: false

    - name: Startup configuration matches the declared one
      ansible.utils.fact_diff:
        before: "{{ ciscosmb_startup.stdout | ciscosmb_normalize | regex_replace(ciscosmb_hash_re, '\\1<hash>') }}"
        after: "{{ ciscosmb_declared | regex_replace(ciscosmb_hash_re, '\\1<hash>') }}"

    - name: Add the declared lines the switch lacks
      ansible.netcommon.cli_config:
        config: "{{ ciscosmb_declared }}"
        diff_match: line
      register: ciscosmb_added
      when: ciscosmb_running.stdout | ciscosmb_normalize != ciscosmb_declared
      no_log: true

    - name: Show the commands that added them
      ansible.builtin.debug:
        msg: "{{ ciscosmb_added.commands | map('regex_replace', ciscosmb_hash_re, '\\1<hash>') }}"
      when: ciscosmb_added.commands is defined

    - name: Remove the lines the declared configuration lacks
      ansible.netcommon.cli_config:
        config: "{{ ciscosmb_declared }}"
        diff_match: exact
      register: ciscosmb_removed
      when: ciscosmb_added is changed and not ansible_check_mode
      no_log: true

    - name: Show the commands that removed them
      ansible.builtin.debug:
        msg: "{{ ciscosmb_removed.commands | map('regex_replace', ciscosmb_hash_re, '\\1<hash>') }}"
      when: ciscosmb_removed.commands is defined

    - name: Read the running configuration again
      ansible.netcommon.cli_command:
        command: show running-config
      register: ciscosmb_pushed
      when: ciscosmb_added is changed and not ansible_check_mode
      changed_when: false

    - name: Running configuration now matches the declared one
      ansible.builtin.assert:
        that: ciscosmb_pushed.stdout | ciscosmb_normalize == ciscosmb_declared
        fail_msg: >-
          The running configuration still differs after pushing, unsaved; the
          switch rejected or rewrote a command. Rerun with --check --diff.
        quiet: true
      when: ciscosmb_pushed.stdout is defined
      no_log: true

    - name: Save the running configuration
      ansible.netcommon.cli_command:
        command: write
        prompt: '\(Y/N\)'
        answer: "Y"
      # Reached only with the running configuration matching the declared one.
      when: >-
        not ansible_check_mode
        and (ciscosmb_added is changed or ciscosmb_startup.stdout | ciscosmb_normalize != ciscosmb_declared)
      changed_when: true
