# Ansible reads this file when run from this directory. Relative paths resolve
# from here. The shared roles in ../ansible-common sit after this stage's own.
[defaults]
inventory = inventory/hardware.yml
roles_path = roles:../ansible-common/roles
collections_path = collections
# Also load the SOPS-encrypted *.sops.yml files in host_vars and group_vars.
vars_plugins_enabled = ansible.builtin.host_group_vars,community.sops.sops

[inventory]
# Fail instead of skipping a source that cannot be parsed.
any_unparsed_is_failed = True
