# Ansible reads this file when run from this directory. Relative paths resolve
# from here. The shared roles in ../ansible-common sit after this stage's own.
[defaults]
# Mitogen's strategy: each host's tasks run in one Python process it keeps for
# the run, over one connection per host (one per node for every container on
# it), and each module and its imports are sent there once and cached, in
# place of an interpreter, a module upload and an SSH session per task.
# mitogen_free lets each host go on to its next task without waiting for the
# others; a play that needs a task done before any host goes on sets its own
# strategy (the restic play). Loaded from .task/python, which init installs.
strategy_plugins = ../.task/python/ansible_mitogen/plugins/strategy
strategy = mitogen_free
# Hosts in parallel: 4 GiB of the controller's memory for Ansible's workers,
# at ~100 MB a worker. Ansible starts no more workers than a play has hosts.
# Mitogen keeps one connection per node however many of its containers run at
# once, so prodingus's sshd limits no longer bound it.
forks = 40
# Seconds for a connection. Mitogen counts its whole setup against it, SSH,
# become (a signature through the agent for pam_rssh's sudo) and the target's
# Python starting, where Ansible's own SSH counts only the TCP connect: at a
# run's start, with every host connecting at once, bailout's took over the
# default 10 s (2026-11-26).
timeout = 30
# Facts are cached for two days and gathered only for a host with none, so
# checks gather each host's once in that time. A play whose tasks
# change what facts describe gathers them again itself; --flush-cache clears
# them. They hold no secrets, only what setup reports.
gathering = smart
fact_caching = ansible.builtin.jsonfile
fact_caching_connection = ~/.cache/regulad/homelab/facts/ansible-hardware
fact_caching_timeout = 172800
inventory = inventory/hardware.yml
roles_path = roles:../ansible-common/roles
collections_path = collections
# Local plugins: the fixed ciscosmb cliconf and terminal, and the filters.
cliconf_plugins = plugins/cliconf
terminal_plugins = plugins/terminal
filter_plugins = plugins/filter
# Also load the SOPS-encrypted *.sops.yml files in host_vars and group_vars.
vars_plugins_enabled = ansible.builtin.host_group_vars,community.sops.sops
# Records the files each host's tasks wrote, in ~/.cache/regulad/homelab/aide_written
# until the aide role's refresh play, the last in site.yml and maintenance.yml,
# consumes them.
callback_plugins = ../ansible-common/plugins/callback
# profile_tasks: each task's time, and the slowest at the end of the run.
callbacks_enabled = aide_written, ansible.posix.profile_tasks
# Each task's result carries its module's arguments, from which aide_written
# reads the paths a module wrote and the units it enabled or masked:
# ansible-core 2.21 stopped adding them by default, and lineinfile,
# blockinfile and systemd_service's masked return none of them themselves.
inject_invocation = true

[inventory]
# Fail instead of skipping a source that cannot be parsed.
any_unparsed_is_failed = True

[ssh_connection]
# One SSH command per task, with no temporary files copied first; no homelab
# host's sudoers sets requiretty, which would refuse it.
pipelining = True
# Ansible's own ssh_args, with masters kept 15 minutes after their last use, so
# that the steps of one pipeline pass reuse each host's connection instead of
# opening, and signing, a new one. Their sockets sit beside homelab's caches.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=15m
control_path_dir = ~/.cache/regulad/homelab/cp
