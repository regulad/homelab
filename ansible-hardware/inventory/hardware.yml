---
# Hardware hosts: the machines OpenTofu cannot create. Seeded from the hosts that
# ~/.ssh/config.d/99-hardware marks as hardware, each by its tailnet MagicDNS
# name. SSH settings, such as each host's user, come from that configuration.
hardware:
  hosts:
    turk:  # Ubuntu 24.04; VMware Workstation for Windows guests with accelerated graphics
    overture:  # macOS, from 99-osx
  children:
    proxmox_nodes:
      hosts:
        prodingus:  # gonkputer
    # One group per OS, as the generated hosts are grouped by OpenTofu.
    debian:
      hosts:
        prodingus:
    ubuntu:
      hosts:
        turk:
    macos:
      hosts:
        overture:

# Network switches: configured over SSH by Ansible's network modules, which run
# on the control node, through each platform's CLI. Kept outside the hardware
# group, whose baseline roles they cannot run; named by their SSH host.
switches:
  children:
    eos:
      hosts:
        JPE18280417:  # Arista DCS-7010T-48, EOS 4.28
