---
# Every repository except Proxmox's pve-test, which stays in prodingus's sources
# for testing (the node tests things such as the bpg/proxmox provider) but is
# never upgraded from unattended. Origins-Pattern cannot negate, so the first
# entry allows every component not starting with "p", and the second adds back
# pve-no-subscription; devel ("main") and Ceph ("no-subscription") are covered
# by the first. Where pve-test has a newer version, unattended-upgrades takes
# the newest version from an allowed repository instead.
auto_updates_unattended_upgrade_origins_pattern:
  - origin=*,component=[!p]*
  - origin=*,component=pve-no-subscription
# The debian group's settings, with reboots held to 02:00: a reboot during the
# guests' own morning updates cut off git's initramfs build on 2026-10-22.
auto_updates_unattended_upgrade:
  AutoFixInterruptedDpkg: "true"
  MinimalSteps: "true"
  Mail: "{{ auto_updates_mail_to }}"
  MailReport: only-on-error
  Remove-Unused-Kernel-Packages: "true"
  Remove-New-Unused-Dependencies: "true"
  Remove-Unused-Dependencies: "true"
  Automatic-Reboot: "true"
  Automatic-Reboot-Time: "02:00"
  Sender: "{{ auto_updates_mail_from }}"

tailscale_enabled: true
tailscale_tags: [server]
tailscale_settings:
  accept_dns: false
  stateful_filtering: false
  auto_update: true
# Serve takes 8006 on the tailnet address, so pveproxy must bind its wildcard
# listener first.
tailscale_after: [pveproxy.service]
# The Proxmox web UI on the tailnet, with a Tailscale certificate.
tailscale_serve:
  - port: 8006
    target: https+insecure://localhost:8006

# A fixed reservation rather than Ubuntu's sized one, and a panic on hard
# lockups, which the hardware's NMI watchdog detects.
kdump_crashkernel: 1024M
kdump_sysctls_host:
  kernel.hardlockup_panic: 1

# Memory and CPU topology: 64 boot-time 1 GB hugepages back the VMs'
# hugepages = "1024", and up to 2048 overcommitted 2 MB pages serve anonymous
# hugepages in containers, such as PostgreSQL's. CPUs 8-15 and 24-31 are
# isolated for the pinned VMs (OpenTofu's cpu.affinity: aboriginal 8-11,24-27,
# dodo 12-15,28-31); IRQs stay on 0-7 and 16-23.
kernel_params_sysctl_files:
  90-hugepages:
    vm.nr_overcommit_hugepages: 2048
kernel_params_grub_dropins:
  99-cpu-isolation:
    - isolcpus=domain,managed_irq,8-15,24-31
    - irqaffinity=0-7,16-23
  99-mem-isolation:
    - default_hugepagesz=2M
    - hugepagesz=1G
    - hugepages=64
kernel_params_ip_forwarding: true

# Postfix's name as it was; a Proxmox node's naming is Debian's and Proxmox's.
mail_relay_myhostname: prodingus.home.arpa
