---
# Every repository except Proxmox's pve-test, which stays in prodingus's sources
# for testing (the node tests things such as the bpg/proxmox provider) but is
# never upgraded from unattended. Origins-Pattern cannot negate, so the first
# entry allows every component not starting with "p", and the second adds back
# pve-no-subscription; devel ("main") and Ceph ("no-subscription") are covered
# by the first. Where pve-test has a newer version, unattended-upgrades takes
# the newest version from an allowed repository instead.
auto_updates_unattended_upgrade_origins_pattern:
  - origin=*,component=[!p]*
  - origin=*,component=pve-no-subscription
# The debian group's settings, with reboots held to 02:00: a reboot during the
# guests' own morning updates cut off git's initramfs build on 2026-10-22.
auto_updates_unattended_upgrade:
  AutoFixInterruptedDpkg: "true"
  MinimalSteps: "true"
  Mail: "{{ auto_updates_mail_to }}"
  MailReport: only-on-error
  Remove-Unused-Kernel-Packages: "true"
  Remove-New-Unused-Dependencies: "true"
  Remove-Unused-Dependencies: "true"
  Automatic-Reboot: "true"
  Automatic-Reboot-Time: "02:00"
  Sender: "{{ auto_updates_mail_from }}"

tailscale_enabled: true
tailscale_tags: [server]
tailscale_settings:
  accept_dns: false
  stateful_filtering: false
  auto_update: true
# Serve takes 8006 on the tailnet address, so pveproxy must bind its wildcard
# listener first.
tailscale_after: [pveproxy.service]
# The Proxmox web UI on the tailnet, with a Tailscale certificate.
tailscale_serve:
  - port: 8006
    target: https+insecure://localhost:8006

# A fixed reservation rather than Ubuntu's sized one, and a panic on hard
# lockups, which the hardware's NMI watchdog detects.
kdump_crashkernel: 1024M
kdump_sysctls_host:
  kernel.hardlockup_panic: 1

# Memory and CPU topology: boot-time 1 GiB hugepages back the VMs' memory
# (OpenTofu's hugepages = "1024": aboriginal's and dodo's 32 GiB each), and up
# to 2048 overcommitted 2 MiB pages serve anonymous hugepages in containers,
# such as PostgreSQL's. CPUs 8-15 and 24-31 are isolated for the pinned VMs
# (OpenTofu's cpu.affinity: aboriginal 8-11,24-27, dodo 12-15,28-31); IRQs stay
# on 0-7 and 16-23.
vm_hugepages_1gib: 64
kernel_params_sysctl_files:
  90-hugepages:
    vm.nr_overcommit_hugepages: 2048
kernel_params_grub_dropins:
  99-cpu-isolation:
    - isolcpus=domain,managed_irq,8-15,24-31
    - irqaffinity=0-7,16-23
  99-mem-isolation:
    - default_hugepagesz=2M
    - hugepagesz=1G
    - hugepages={{ vm_hugepages_1gib }}
kernel_params_ip_forwarding: true

# Postfix's name as it was; a Proxmox node's naming is Debian's and Proxmox's.
mail_relay_myhostname: prodingus.home.arpa

# zram is half of the RAM left after the VMs' hugepages, which MemTotal still
# counts, above the NVMe root's swapfile.
swap_zram_size: (ram - {{ vm_hugepages_1gib * 1024 }}) / 2
swap_zram_priority: 1000
swap_files:
  - path: /swapfile
    size_mib: 8192
    priority: 100

# Backups: the root filesystem as it is, ext4 having no snapshots to read
# from; the CephFS, and urbackup's disk (VM 111's), each from a snapshot.
# aboriginal's forget is the only one.
restic_jobs:
  simple:
    on_calendar: "*-*-* 05:25"
    paths: [/, /boot/efi]
    options: [--one-file-system, --exclude=/var/cache]
  cephfs:
    on_calendar: "Wed *-*-* 04:30"
    path: /mnt/pve/cephfs
    tag: cephfs
  rbd:
    on_calendar: "Fri *-*-* 07:34"
    image: rbd_cmr/vm-111-disk-0
    filename: urbackup.img
    tag: urbackup
restic_retired_scripts:
  - /root/backup_simple.sh
  - /root/backup_cephfs.sh
  - /root/backup_urbackup.sh

# The Ceph RADOS Gateway behind s3.regulad.xyz, which ingress's Caddy proxies
# to port 7480. Its users' S3 keys are rgw_keys, in the shared SOPS file.
ceph_rgw_instances:
  prodingus:
    host: prodingus
    rgw_frontends: beast endpoint=0.0.0.0:7480
ceph_rgw_config:
  rgw_dns_name: s3.regulad.xyz
ceph_rgw_users:
  - uid: regulad
    display_name: regulad
  - uid: synapse
    display_name: Matrix Synapse
  - uid: mastodon
    display_name: Mastodon
  - uid: appflowy
    display_name: AppFlowy
# Owned by regulad; each grants its application's user access through its
# policy.
ceph_rgw_buckets:
  - name: synapse-media
    owner: regulad
    acl: private
    policy:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Principal:
            AWS: arn:aws:iam:::user/synapse
          Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
          Resource:
            - arn:aws:s3:::synapse-media
            - arn:aws:s3:::synapse-media/*
  - name: mastodon-media
    owner: regulad
    acl: public-read
    policy:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Principal:
            AWS: arn:aws:iam:::user/mastodon
          Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket, s3:GetBucketLocation]
          Resource:
            - arn:aws:s3:::mastodon-media
            - arn:aws:s3:::mastodon-media/*
