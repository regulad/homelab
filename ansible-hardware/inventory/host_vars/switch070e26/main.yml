---
# svc-ansible, the account Ansible logs in as: its own key per switch, since
# the SG300s hold one key per user and accept only SHA-1 ssh-rsa signatures.
# The private key and the account's password are in secrets.sops.yml.
# yamllint disable-line rule:line-length
svc_ansible_public_key: ssh-rsa  svc-ansible@switch070e26
