---
# Each host's FreeIPA mail account, null-<short hostname> by convention; a
# host_vars mail_relay_account overrides it where two hosts share a name.
mail_relay_account: null-{{ inventory_hostname | split('.') | first }}
# The updaters mail their reports from that account's address, the only sender
# mail.regulad.xyz accepts from its login.
auto_updates_mail_from: "{{ mail_relay_account }}@regulad.xyz"
# FreeIPA's API calls run on prodingus, which is on the LAN with wako; turk is
# reached over the tailnet.
mail_relay_freeipa_delegate: prodingus
# The shared clamd's StreamMaxLength, in MiB, and MaxScanTime, in milliseconds:
# clamd_max_file_mib and clamd_max_scan_time_ms in ansible-generated's
# host_vars for clamd, which this stage cannot read. The clamav role's weekly
# scan needs both.
clamav_clamd_stream_max_mib: 2047
clamav_clamd_scan_time_ms: 600000
