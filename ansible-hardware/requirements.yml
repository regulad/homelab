---
# Collections, each pinned to an exact version when a role first needs it.
collections:
  # The sops vars plugin, which decrypts *.sops.yml in host_vars and group_vars.
  - name: community.sops
    version: 2.5.0
  # ipa_user, which manages each host's FreeIPA mail account over the JSON-RPC API.
  - name: community.general
    version: 13.5.0
  # Network switches over SSH: network_cli and the EOS cliconf and config modules.
  - name: ansible.netcommon
    version: 8.7.1
  # ansible.netcommon's dependency.
  - name: ansible.utils
    version: 6.1.1
  # eos_config, for the Arista 7010T.
  - name: arista.eos
    version: 12.3.0
  # The ciscosmb cliconf and terminal plugins and facts and command modules,
  # for the Cisco SG300s.
  - name: community.ciscosmb
    version: 1.0.12
