---
# Phase 2: the only playbook for hardware hosts, from the hand-written
# inventory/hardware.yml only. Every play converges hosts to the declared state
# and is safe to rerun.
- name: Hardware host baseline
  hosts: hardware
  roles:
    - base
    - tailscale

# Linux hosts by OS group; ca_trust_family comes from each group's group_vars.
- name: Root certificates trusted and distrusted
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - ca_trust

# Each Linux host's mail, relayed through mail.regulad.xyz as its FreeIPA
# null- account, by OS group.
- name: Mail relay
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - mail_relay

# Each Linux host's own automatic updater, by OS group.
- name: Automatic updates
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - auto_updates

# Ubuntu's amd64v3 builds, where the release and the CPU support them.
- name: APT architecture variant
  hosts: ubuntu
  gather_facts: false
  become: true
  roles:
    - apt_amd64v3

# Sysctl and GRUB drop-ins each host declares.
- name: Kernel parameters
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - kernel_params

# zram, and disk swapfiles on real drives, on hosts with their own kernel.
- name: Swap
  hosts: debian:ubuntu:!proxmox_containers
  gather_facts: false
  become: true
  roles:
    - swap

# Netplan as the only network configuration, where a host declares it.
- name: Network configuration
  hosts: ubuntu
  gather_facts: false
  become: true
  roles:
    - netplan

# Kernel crash dumps through kdump-tools, on the hosts in the kdump group.
- name: Kernel crash dumps
  hosts: kdump
  gather_facts: false
  become: true
  roles:
    - kdump

- name: Proxmox and Ceph cluster settings owned by Ansible
  hosts: proxmox_nodes
  roles:
    - proxmox_cluster

# Each Arista switch's whole running configuration, from files/<switch>/.
- name: Arista switches
  hosts: eos
  gather_facts: false
  roles:
    - eos

# Each Cisco SG300's whole running configuration, compared with
# files/<switch>/running-config.j2. Run through bin/with-switch-keys, which
# holds their keys; one switch at a time, as they are slow and few-sessioned.
- name: Cisco SG300 switches
  hosts: ciscosmb
  gather_facts: false
  serial: 1
  roles:
    - ciscosmb
