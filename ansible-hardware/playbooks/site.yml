---
# Phase 2: the only playbook for hardware hosts, from the hand-written
# inventory/hardware.yml only. Every play converges hosts to the declared state
# and is safe to rerun.
- name: Hardware host baseline
  hosts: hardware
  roles:
    - base
    - tailscale

# Linux hosts by OS group; ca_trust_family comes from each group's group_vars.
- name: Distrusted root certificates
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - ca_trust

# Each Linux host's mail, relayed through mail.regulad.xyz as its FreeIPA
# null- account, by OS group.
- name: Mail relay
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - mail_relay

# Each Linux host's own automatic updater, by OS group.
- name: Automatic updates
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - auto_updates

- name: Proxmox and Ceph cluster settings owned by Ansible
  hosts: proxmox_nodes
  roles:
    - proxmox_cluster
