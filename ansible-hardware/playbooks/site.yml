---
# Phase 2: the only playbook for hardware hosts, from the hand-written
# inventory/hardware.yml. Every play converges hosts to the declared state and
# is safe to rerun. The plays both stages share come first.
- name: Plays both stages share
  ansible.builtin.import_playbook: ../../ansible-common/playbooks/site.yml

- name: Proxmox and Ceph cluster settings owned by Ansible
  hosts: proxmox_nodes
  tags: [proxmox_cluster]
  roles:
    - proxmox_cluster

# mDNS on the Proxmox nodes, which run no systemd-resolved: Avahi answering
# for the node's own name.
- name: Multicast DNS
  hosts: proxmox_nodes
  gather_facts: false
  become: true
  tags: [avahi]
  roles:
    - avahi

# The Ceph RADOS Gateway, with its users and buckets, on the nodes that run one.
- name: Ceph RADOS Gateway
  hosts: proxmox_nodes
  gather_facts: false
  become: true
  tags: [ceph_rgw]
  roles:
    - ceph_rgw

# webhookd, which reboots the guests whose Uptime Kuma monitors go down.
- name: Uptime Kuma's webhooks
  hosts: webhookd
  become: true
  tags: [webhookd]
  roles:
    - webhookd

# USB ports whose devices would kill their controller, disabled at boot.
- name: USB ports disabled at boot
  hosts: usb_port_disable
  gather_facts: false
  become: true
  tags: [usb_port_disable]
  roles:
    - usb_port_disable

# Orchard workers, which run the orchard controller's Tart VMs.
- name: Orchard workers
  hosts: orchard_workers
  gather_facts: false
  tags: [orchard_worker]
  roles:
    - orchard_worker

# Each Arista switch's whole running configuration, from files/<switch>/.
- name: Arista switches
  hosts: eos
  gather_facts: false
  tags: [eos]
  roles:
    - eos

# Each Cisco SG300's whole running configuration, compared with
# files/<switch>/running-config.j2. Run through bin/with-switch-keys, which
# holds their keys; one switch at a time, as they are slow and few-sessioned.
- name: Cisco SG300 switches
  hosts: ciscosmb
  gather_facts: false
  serial: 1
  tags: [ciscosmb]
  roles:
    - ciscosmb

# Last: AIDE's baseline moved for the files this run wrote.
- name: File integrity baseline for this run's files
  ansible.builtin.import_playbook: ../../ansible-common/playbooks/aide-refresh.yml
