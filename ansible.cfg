# Ansible ignores this file when its working directory is world-writable, as a
# WSL checkout under /mnt/ is. Set ANSIBLE_CONFIG to this file's path there.
[defaults]
inventory = ansible/inventory
roles_path = ansible/roles
collections_path = ansible/collections

[inventory]
# Fail instead of skipping a source that cannot be parsed, such as an OpenTofu
# root inventory.py cannot read.
any_unparsed_is_failed = True
