---
# Last in each stage's site.yml and maintenance.yml: AIDE's baseline moved for
# the files the run wrote, as the aide_written callback recorded them. Tagged
# always, so that a run scoped with --tags refreshes what its plays wrote too.
# A host the run recorded nothing for ends at once, without a connection.
- name: File integrity baseline for this run's files
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [always, aide, aide_refresh]
  tasks:
    - name: AIDE's baseline for the files this run wrote
      ansible.builtin.import_role:
        name: aide
        tasks_from: refresh

# Then the hold aide-hold.yml put on each host's daily check ends, on every
# host, those the refresh left at once included, and a check it held runs now,
# against the baseline the refresh moved.
- name: AIDE's daily check released after this run
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [always, aide, aide_refresh]
  tasks:
    - name: The run's end marked, and any check held started
      ansible.builtin.command:
        argv: [/usr/local/bin/aide-report, --run-ended]
        removes: /usr/local/bin/aide-report
      register: aide_run_ended
      changed_when: "'Started' in aide_run_ended.stdout"
