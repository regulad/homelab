---
# The plays both stages share, which each stage's playbooks/site.yml imports
# before its own. Every play converges hosts to the declared state and is safe
# to rerun. Run it through a stage, whose ansible.cfg gives the inventory and
# the roles.

# AIDE's daily check held until the run's end (aide-hold.yml).
- name: AIDE's daily check held for this run
  ansible.builtin.import_playbook: aide-hold.yml

# Every host Ansible manages but pfSense and the network switches.
- name: Host baseline
  hosts: debian:ubuntu:rhel:macos
  roles:
    - role: base
      tags: [base]
    - role: tailscale
      tags: [tailscale]

# firewalld on every Linux host with its own kernel; Proxmox nodes keep
# pve-firewall, and containers the Proxmox guest firewall.
# Policies and direct rules are host files.
- name: Host firewall
  hosts: debian:ubuntu:rhel:!proxmox_containers:!proxmox_nodes
  gather_facts: false
  become: true
  tags: [firewalld]
  roles:
    - firewalld

# CVE-2026-98432's stopgap on hosts with their own kernel, removed once each
# runs a fixed kernel.
- name: CVE-2026-98432 stopgap
  hosts: debian:ubuntu:rhel:!proxmox_containers
  gather_facts: false
  become: true
  tags: [cve_2026_98432]
  roles:
    - cve_2026_98432

# Hosts by OS group; ca_trust_family comes from each group's group_vars.
- name: Root certificates trusted and distrusted
  hosts: debian:ubuntu:rhel:freebsd
  gather_facts: false
  become: true
  tags: [ca_trust]
  roles:
    - ca_trust

# Each Linux host's mail, relayed through mail.regulad.xyz as its FreeIPA
# null- account, by OS group.
- name: Mail relay
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [mail_relay]
  roles:
    - mail_relay

# Each Linux host's own automatic updater, by OS group.
- name: Automatic updates
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [auto_updates]
  roles:
    - auto_updates

# Ubuntu's amd64v3 builds, where the release and the CPU support them.
- name: APT architecture variant
  hosts: ubuntu
  gather_facts: false
  become: true
  tags: [apt_amd64v3]
  roles:
    - apt_amd64v3

# Sysctl and GRUB drop-ins each host declares.
- name: Kernel parameters
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [kernel_params]
  roles:
    - kernel_params

# zram, and disk swapfiles on real drives, on hosts with their own kernel.
- name: Swap
  hosts: debian:ubuntu:!proxmox_containers
  gather_facts: false
  become: true
  tags: [swap]
  roles:
    - swap

# Directories bound over themselves with noexec, on every Linux host, containers
# included.
- name: Directories mounted noexec
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [noexec]
  roles:
    - noexec

# auditd on every Linux host with its own kernel. Containers cannot run it;
# prodingus's records their processes.
- name: Audit records
  hosts: debian:ubuntu:rhel:!proxmox_containers
  gather_facts: false
  become: true
  tags: [auditd]
  roles:
    - auditd

# Access to the restic repository, and the host's backup jobs, on hosts with a
# key of their own.
- name: Restic repository access and backups
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [restic]
  roles:
    - restic

# Netplan as the only network configuration, where a host declares it.
- name: Network configuration
  hosts: ubuntu
  gather_facts: false
  become: true
  tags: [netplan]
  roles:
    - netplan

# Kernel crash dumps on the hosts in the kdump group.
- name: Kernel crash dumps
  hosts: kdump
  gather_facts: false
  become: true
  tags: [kdump]
  roles:
    - kdump

# ClamAV's on-access scanner, streaming to the shared clamd, on hosts with their
# own kernel and privileged containers that turn it on. An unprivileged
# container cannot run it: its root lacks CAP_SYS_ADMIN in the initial user
# namespace, which clamonacc's fanotify group needs.
- name: On-access scanning
  hosts: debian:ubuntu:rhel:!unprivileged_containers
  gather_facts: false
  become: true
  tags: [clamav, clamav_onaccess]
  tasks:
    - name: ClamAV's on-access scanner
      ansible.builtin.import_role:
        name: clamav
        tasks_from: onaccess

# ClamAV's weekly scan of each host's directories, through the shared clamd, on
# every Linux host, unprivileged containers included.
- name: Weekly scan
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [clamav, clamav_scan]
  tasks:
    - name: ClamAV's weekly scan
      ansible.builtin.import_role:
        name: clamav
        tasks_from: scan

# Go's telemetry off for root, on every Linux host with Go installed.
- name: Go's telemetry
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [go_telemetry]
  roles:
    - go_telemetry

# AIDE's daily report of the file changes the host's packages do not explain,
# against a baseline each mailed report moves, on every Linux host, containers
# included.
- name: File integrity
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [aide]
  roles:
    - aide
