---
# The plays both stages share, which each stage's playbooks/site.yml imports
# before its own. Every play converges hosts to the declared state and is safe
# to rerun. Run it through a stage, whose ansible.cfg gives the inventory and
# the roles.

# Every host Ansible manages but pfSense and the network switches.
- name: Host baseline
  hosts: debian:ubuntu:rhel:macos
  roles:
    - base
    - tailscale

# firewalld on Linux hosts with their own kernel, where a host declares zones;
# Proxmox nodes keep pve-firewall, and containers the Proxmox guest firewall.
# Policies and direct rules are host files.
- name: Host firewall
  hosts: debian:ubuntu:rhel:!proxmox_containers:!proxmox_nodes
  gather_facts: false
  become: true
  roles:
    - firewalld

# Hosts by OS group; ca_trust_family comes from each group's group_vars.
- name: Root certificates trusted and distrusted
  hosts: debian:ubuntu:rhel:freebsd
  gather_facts: false
  become: true
  roles:
    - ca_trust

# Each Linux host's mail, relayed through mail.regulad.xyz as its FreeIPA
# null- account, by OS group.
- name: Mail relay
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - mail_relay

# Each Linux host's own automatic updater, by OS group.
- name: Automatic updates
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - auto_updates

# Ubuntu's amd64v3 builds, where the release and the CPU support them.
- name: APT architecture variant
  hosts: ubuntu
  gather_facts: false
  become: true
  roles:
    - apt_amd64v3

# Sysctl and GRUB drop-ins each host declares.
- name: Kernel parameters
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - kernel_params

# zram, and disk swapfiles on real drives, on hosts with their own kernel.
- name: Swap
  hosts: debian:ubuntu:!proxmox_containers
  gather_facts: false
  become: true
  roles:
    - swap

# Access to the restic repository, and the host's backup jobs, on hosts with a
# key of their own.
- name: Restic repository access and backups
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  roles:
    - restic

# Netplan as the only network configuration, where a host declares it.
- name: Network configuration
  hosts: ubuntu
  gather_facts: false
  become: true
  roles:
    - netplan

# Kernel crash dumps on the hosts in the kdump group.
- name: Kernel crash dumps
  hosts: kdump
  gather_facts: false
  become: true
  roles:
    - kdump

# ClamAV's on-access scanner, streaming to the shared clamd, on hosts with their
# own kernel that turn it on.
- name: On-access scanning
  hosts: debian:ubuntu:rhel:!proxmox_containers
  gather_facts: false
  become: true
  roles:
    - clamonacc
