---
# Each host's facts gathered afresh, into the fact cache both stages keep for
# an hour (ansible.cfg): the shared site.yml and maintenance.yml import this
# right after aide-hold.yml, and each stage's imports it right before
# aide-refresh.yml. A run that changes hosts thus begins from their state and
# leaves the cache holding their state after it, so that its own later plays,
# and the runs after it in any worktree, read facts that are current. A check run changes nothing, so it gathers nothing here and
# reads the cache like any other play. The network switches have no facts.
- name: Facts gathered afresh for this run
  hosts: all
  gather_facts: false
  tags: [always]
  tasks:
    - name: Facts
      ansible.builtin.setup:
      when:
        - not ansible_check_mode
        - ansible_connection != 'ansible.netcommon.network_cli'
