---
# Maintenance both stages share, which each stage's playbooks/maintenance.yml
# imports before its own: each play here is a deliberate operation, run by hand
# after its declared version or setting is bumped. Run a single one with
# --tags, from inside a stage, whose ansible.cfg gives the inventory and roles.

# Align a hardware install's hostname and its /etc/hosts line with Ubuntu's
# installer (Subiquity), on the hosts that set base_hostname_managed.
- name: Align hostname with Subiquity settings
  hosts: ubuntu
  gather_facts: false
  tags: [hostname]
  tasks:
    - name: Hostname and /etc/hosts
      ansible.builtin.include_role:
        name: base
        tasks_from: hostname

# Rotate the restic repository's shared password, once, from either stage: add
# a repository key with a new password and make it restic_password in SOPS.
# Then deliver it with both stages' site.yml, and remove the old key with
# --tags restic-password-prune.
- name: Restic password rotation
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [restic-password]
  tasks:
    - name: Add a key with a new password, recorded in SOPS
      ansible.builtin.include_role:
        name: restic
        tasks_from: rotate_password

# After both stages' site.yml have delivered the new password: remove every
# other repository key.
- name: Restic password rotation, old keys
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [restic-password-prune]
  tasks:
    - name: Remove the keys of earlier passwords
      ansible.builtin.include_role:
        name: restic
        tasks_from: prune_keys

# Delete a retired host's FreeIPA mail account, once, from either stage, after
# the host has left the inventory:
# --tags mail-account-remove -e mail_relay_remove_account=null-<name>. The API
# calls run on the stage's mail_relay_freeipa_delegate.
- name: Mail account removal
  hosts: localhost
  gather_facts: false
  tags: [mail-account-remove]
  tasks:
    - name: Delete the retired host's account
      ansible.builtin.include_role:
        name: mail_relay
        tasks_from: remove_account

# Set the FreeIPA mail account of each host given with --limit to the host's
# SOPS password, which mail_relay sets only when it creates the account:
# --tags mail-password-reset --limit <host>.
- name: Mail account password reset
  hosts: debian:ubuntu:rhel
  gather_facts: false
  tags: [mail-password-reset]
  tasks:
    - name: Reset the account's password
      ansible.builtin.include_role:
        name: mail_relay
        tasks_from: password_reset

# Move AIDE's baseline to the files as they are, on the hosts given with
# --limit, where no mailed report has, such as one too long for a mail, once
# each change is accounted for.
- name: AIDE baseline accepted
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [aide-accept]
  tasks:
    - name: Accept the files as they are
      ansible.builtin.include_role:
        name: aide
        tasks_from: accept

# Remove the damaged images and layers that AIDE's report found in Podman's
# image store, on the hosts given with --limit, once each is accounted for.
# Images that containers use stay.
- name: Podman image store repaired
  hosts: debian:ubuntu:rhel
  gather_facts: false
  become: true
  tags: [podman-repair]
  tasks:
    - name: Remove the damaged images and layers
      ansible.builtin.include_role:
        name: aide
        tasks_from: repair
