---
# Files in /etc/sysctl.d, each a name without .conf mapped to its settings.
# 99-panic belongs to the kdump role, and files packages ship stay theirs.
kernel_params_sysctl_files: {}

# Per-task delay accounting (kernel.task_delayacct), written as 99-acct.conf:
# I/O and scheduling delays per task for tools such as iotop and getdelays, for
# a nearly trivial cost. On wherever the host runs its own kernel, so not in
# the Proxmox containers, which share the node's.
kernel_params_task_delayacct: "{{ 'proxmox_containers' not in group_names }}"

# IPv4 and IPv6 forwarding, written as 99-tailscale.conf, the file Tailscale's
# documentation names, on hosts that route for others.
kernel_params_ip_forwarding: false

# How the kernel gets its arguments, set by the host's OS group: debian
# (drop-ins in /etc/default/grub.d, which Debian's grub-mkconfig reads, and
# update-grub; on Debian and Ubuntu) or grubby (every boot loader entry; on
# Enterprise Linux).
kernel_params_mode: ""

# Kernel arguments, each set a name mapped to its arguments. With debian, the
# name is a file in /etc/default/grub.d, without .cfg, that appends them to
# GRUB_CMDLINE_LINUX_DEFAULT. With grubby, they go into every boot loader entry
# and /etc/kernel/cmdline, which kernel-install gives each kernel installed
# later, and the name is a label alone. kdump-tools belongs to the kdump role,
# and 99-audit comes from this role's own settings. A change takes effect on
# the next boot; the role never reboots, and takes out no argument it no
# longer declares.
kernel_params_grub_dropins: {}

# Auditing from boot, as the set 99-audit: without audit=1 the kernel audits
# only once auditd starts, and a process already running then, PID 1,
# journald and udevd among them, is never audited; the backlog holds their
# records until auditd reads them, as the audit package's rules size it
# (-b 8192). On wherever the host runs its own kernel, and so auditd (auditd
# role).
kernel_params_audit: "{{ 'proxmox_containers' not in group_names }}"
