---
# auditd with this role's rules and settings, running. Runs on every Linux host
# with its own kernel, hardware (Phase 2) and generated (Phase 4).
- name: Audit's package
  ansible.builtin.package:
    name: "{{ auditd_package }}"
    state: present
  register: auditd_install

- name: Read the root filesystem's size and which watched paths exist
  ansible.builtin.command:
    argv: "{{ ['sh', '-ec', auditd_script, 'sh'] + (auditd_watches + auditd_watches_admin + auditd_watches_host) | map(attribute='path') | list }}"
  vars:
    auditd_script: |
      findmnt --bytes --noheadings --output SIZE --mountpoint /
      for path in "$@"; do
        if [ -e "$path" ]; then echo "$path"; fi
      done
  register: auditd_read
  changed_when: false
  check_mode: false

- name: Gather the rules' and logs' settings
  ansible.builtin.set_fact:
    # The syscall tables to match: a rule for one alone is bypassed through
    # the other, and only x86_64 runs 32-bit programs here.
    auditd_arches: "{{ ['b64', 'b32'] if ansible_facts.architecture == 'x86_64' else ['b64'] }}"
    auditd_watched: >-
      {{ (auditd_watches + auditd_watches_admin + auditd_watches_host)
         | selectattr('path', 'in', auditd_read.stdout_lines[1:]) | list }}
    auditd_num_logs: >-
      {{ [2, [999, ((auditd_read.stdout_lines[0] | int) * auditd_root_share / 1048576
                    / auditd_max_log_file) | int] | min] | max }}

- name: Auditd's settings
  ansible.builtin.template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: "0640"
  # A check run cannot read what an install still pending would create.
  when: not (ansible_check_mode and auditd_install is changed)
  notify: Reload auditd's settings

# Beside the package's own audit.rules, which holds -D, -b and -f; augenrules
# joins them in name order into /etc/audit/audit.rules at each load.
- name: Rules
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/audit/rules.d/{{ item }}
    owner: root
    group: root
    mode: "0640"
  loop: [20-exclusions.rules, 30-watches.rules, 40-syscalls.rules, 50-exec.rules]
  when: not (ansible_check_mode and auditd_install is changed)
  notify: Load the rules

- name: Auditd running
  ansible.builtin.systemd_service:
    name: auditd.service
    enabled: true
    state: started
  when: not (ansible_check_mode and auditd_install is changed)
