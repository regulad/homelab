---
# The CVE-2026-98432 stopgap on hosts with their own kernel, hardware
# and generated: decide from the running kernel (the kernel_fixed
# role), then add or remove the stopgap's own nftables table (tasks/table.yml).
- name: Decide whether the running kernel has the fix
  ansible.builtin.include_role:
    name: kernel_fixed
  vars:
    kernel_fixed_name: CVE-2026-98432
    kernel_fixed_distribution: "{{ cve_2026_98432_fixed_kernels }}"
    kernel_fixed_introduced: "{{ cve_2026_98432_introduced }}"
    kernel_fixed_stable: "{{ cve_2026_98432_fixed_stable }}"
    kernel_fixed_from: "{{ cve_2026_98432_fixed_from }}"

- name: Note the decision
  ansible.builtin.set_fact:
    cve_2026_98432_vulnerable: "{{ kernel_fixed_vulnerable | bool }}"

- name: Stopgap table, while the kernel is vulnerable
  ansible.builtin.include_tasks: table.yml
