---
- name: Update GRUB
  ansible.builtin.command: update-grub
  changed_when: true
  # What update-grub rewrites, which the command does not name, for AIDE's
  # refresh at the end of the run (aide_written callback).
  vars:
    aide_writes: [/boot/grub/grub.cfg]

- name: Apply the panic sysctls
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-panic.conf
  changed_when: true

# kdump-config reloads the crash kernel only where memory is reserved for it.
- name: Reload the crash kernel
  ansible.builtin.systemd_service:
    name: kdump-tools
    state: restarted
  when: kdump_reserved | int > 0
