---
# Converge kernel crash dumps. Runs on the hosts in the kdump group, hardware
# (Phase 2) and generated (Phase 4).
- name: Kdump-tools
  ansible.builtin.import_tasks: debian.yml
  when: "'rhel' not in group_names"

- name: Kdump on Enterprise Linux
  ansible.builtin.import_tasks: rhel.yml
  when: "'rhel' in group_names"
