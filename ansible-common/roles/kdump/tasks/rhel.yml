---
# Kernel crash dumps on Enterprise Linux, through the kdump service its images
# ship on, with kexec-tools keeping each kernel's crashkernel= at its own
# default.
- name: Install kexec-tools
  ansible.builtin.package:
    name: kexec-tools
    state: present
  register: kdump_installed

- name: Kexec-tools sets the crash kernel reservation
  ansible.builtin.lineinfile:
    path: /etc/kdump.conf
    regexp: '^#?\s*auto_reset_crashkernel\s'
    line: auto_reset_crashkernel yes
  # A check run cannot read what an install still pending would create.
  when: not (ansible_check_mode and kdump_installed is changed)

- name: Read the memory reserved for the crash kernel
  ansible.builtin.slurp:
    src: /sys/kernel/kexec_crash_size
  register: kdump_crash_size

# Without reserved memory the unit fails; it starts on the boot that first
# reserves it.
- name: Kdump at boot, and loaded where memory is reserved
  ansible.builtin.systemd_service:
    name: kdump
    enabled: true
    state: "{{ 'started' if kdump_crash_size.content | b64decode | int > 0 else omit }}"
  when: not (ansible_check_mode and kdump_installed is changed)
