---
# Whether the host takes crash dumps: those in the kdump group. Enterprise
# Linux hosts outside it, whose images ship kdump on, have it turned off.
kdump_enabled: "{{ 'kdump' in group_names }}"

# The rest are kdump-tools', on Debian and Ubuntu. Enterprise Linux keeps its
# image's kdump.conf, and kexec-tools' own default reservation.

# Packages installed; kdump-tools brings kexec-tools and makedumpfile, and
# crash reads the dumps.
kdump_packages:
  - kdump-tools
  - crash

# Memory the kernel reserves for the crash kernel, as GRUB's crashkernel=
# argument in /etc/default/grub.d/kdump-tools.cfg. The default is Ubuntu's
# package default, sized by the host's memory. A change takes effect on the
# next boot.
kdump_crashkernel: 2G-4G:320M,4G-32G:512M,32G-64G:1024M,64G-128G:2048M,128G-:4096M

# Keys set in /etc/default/kdump-tools, uncommented where the package's file
# lists them; the rest of the file stays the package's.
kdump_settings:
  USE_KDUMP: "1"
  KDUMP_KERNEL: /var/lib/kdump/vmlinuz
  KDUMP_INITRD: /var/lib/kdump/initrd.img
  KDUMP_COREDIR: '"/var/crash"'
  KDUMP_NUM_DUMPS: "1"
  KDUMP_COMPRESSION: xz

# Sysctls in /etc/sysctl.d/99-panic.conf, so that a hang or oops panics the
# kernel, which kdump then dumps; the host reboots 10 seconds after a panic.
kdump_sysctls:
  kernel.panic: 10
  vm.panic_on_oom: 2
  kernel.hung_task_panic: 1
  kernel.softlockup_panic: 1
  kernel.panic_on_oops: 1
# Each host's additions and changes to kdump_sysctls, such as
# kernel.hardlockup_panic on hardware with an NMI watchdog.
kdump_sysctls_host: {}
