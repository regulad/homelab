# Managed by Ansible (aide). Podman's storage settings on a host whose Podman
# predates its own check of its image layers, so that the aide role's
# containers-storage, which has one, does not replace them with its own
# /usr/share/containers/storage.conf. Podman recorded no driver when it first
# ran, and refuses to run with any named here, even the same one. The library's
# defaults hold for the rest, the roots among them.
[storage]
# Without a driver, the library warns at every command unless a priority is
# set; it picks a driver by it only for storage not yet initialized.
driver_priority = ["overlay"]
