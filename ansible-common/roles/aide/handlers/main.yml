---
- name: Restart the daily report's timer
  ansible.builtin.systemd_service:
    name: aide-report.timer
    state: restarted
    daemon_reload: true
  # A check run cannot read what an install still pending would create.
  when: not (ansible_check_mode and (aide_units is changed or aide_timer is changed))

# A changed unit's options take effect by remounting the tmpfs, which keeps
# what it holds; restarting the unit would empty it.
- name: Remount AppArmor's policy cache
  ansible.builtin.systemd_service:
    name: var-cache-apparmor.mount
    state: reloaded
    daemon_reload: true
  # A check run cannot read what an install still pending would create.
  when: not (ansible_check_mode and aide_apparmor_cache_unit is changed)
