---
# AIDE's daily report on the host's files, by the package's own rules, of the
# changes since the accepted baseline that the host's packages do not explain,
# mailed to root through the host's mail relay. aide-report decides what the
# packages explain, and each report it mails moves the baseline to the files
# as that report's check found them, so each change is mailed once;
# maintenance.yml --tags aide-accept moves it where no report does.
aide_enabled: true

# The filesystems AIDE walks, by mount point: the system's own. aide-report
# excludes every other mount point at each run, with everything below it: data
# disks, the CephFS, container storage and the kernel's virtual filesystems
# among them. Those listed here that a host does not have are skipped.
aide_filesystems:
  - /
  - /boot
  - /boot/efi
  - /usr
  - /var
# Paths on those filesystems that are not checked, each with everything below
# it: AIDE's own databases, and data that changes as the host works rather than
# as it is configured. aide-report also leaves out swap files, from
# /proc/swaps, at each run.
aide_exclude_paths:
  - /var/lib/aide
  - /var/lib/aide-report
  # The container engines' image stores, which every pull changes. aide-report
  # runs each engine's own check of its image layers instead, where it has one:
  # Podman's, and Docker's on its own image store, not its containerd one.
  - /var/lib/containers
  - /var/lib/docker
  - /var/lib/containerd
  - /var/cache
  - /root/.cache
  # Logs, which their writers append to, rotate and remove as the host runs.
  # AIDE does not see a log truncated or removed there, or anything else put
  # there.
  - /var/log
  # Kernel crash dumps, gigabytes each.
  - /var/crash
  # Shared scratch space, scanned by ClamAV: /tmp a tmpfs by systemd's
  # tmp.mount (noexec role), /var/tmp on the root filesystem.
  - /tmp
  - /var/tmp
  # Ansible's scratch files, which every task it runs creates and removes, the
  # wait for aide-accept's new baseline among them: root's, and those of the
  # user it connects as over SSH, which the operator's SSH configuration may
  # name rather than the inventory. The role reads that user's home first.
  - /root/.ansible/tmp
  - /root/.ansible_async
  - "{{ aide_connection_home.stdout | default('/root') }}/.ansible/tmp"
  # Tailscale's logs and its caches of the DERP map and the control plane's
  # addresses. tailscaled.state, with the node's keys, stays watched.
  - /var/lib/tailscale/tailscaled.log1.txt
  - /var/lib/tailscale/tailscaled.log2.txt
  - /var/lib/tailscale/derpmap.cached.json
  - /var/lib/tailscale/dns-cache
  # The rules augenrules joins from /etc/audit/rules.d, which stays watched, at
  # each load, and the copy it keeps of those it replaced (auditd role).
  - /etc/audit/audit.rules
  - /etc/audit/audit.rules.prev
  # clamonacc-mail's journal cursor, its unit's StateDirectory (clamav role).
  - /var/lib/clamonacc-mail
  # ClamAV's quarantine, the clamav role's clamav_quarantine: ClamAV mails each
  # file it moves there, and clamonacc's --move leaves a lock file there at
  # each start, named for its process ID, which only a clean exit removes.
  - /root/quarantine
  # Postfix's queue, with its process IDs and the copies of /etc's files it
  # makes for its chroot, and its own state (mail_relay role).
  - /var/spool/postfix
  - /var/lib/postfix
  # smartd's record of each disk's attributes, and DHCP clients' leases.
  - /var/lib/smartmontools
  - /var/lib/dhcp
  # snapd's state, and what the login banner shows, on Ubuntu: the cache of the
  # system information, and update-notifier's count of the pending updates,
  # rewritten as updates arrive.
  - /var/lib/snapd/state.json
  - /var/lib/landscape/landscape-sysinfo.cache
  - /var/lib/update-notifier/updates-available
  # The Ubuntu Pro client's two copies of its machine token, with and without
  # the tokens, which its metering job rewrites with the activity the contract
  # server returns at each run, and its jobs' status. Its configuration,
  # uaclient.conf, stays watched.
  - /var/lib/ubuntu-advantage/private/machine-token.json
  - /var/lib/ubuntu-advantage/machine-token.json
  - /var/lib/ubuntu-advantage/jobs-status.json
# The package manager's own state, which every transaction rewrites and any
# query of it may touch, such as the rpm database's SQLite shared memory, and
# apt's lists of what its repositories offer, with Ubuntu Pro's copy of them
# and of apt's caches for its ESM repositories, and command-not-found's index
# of them. Also the automatic updater's own state, and apt-listchanges' record
# of the changelogs it has shown. dpkg's records of each package, its
# maintainer scripts among them, stay watched: aide-report explains them by
# their package's version. And /var/backups, where dpkg-db-backup keeps daily
# copies of dpkg's state and of the alternatives, and apt of its record of
# packages installed automatically, each rotated through seven; Debian's own
# rules for them say an exclusion handles them best, as AIDE cannot follow a
# rotation that leaves a file as it was. The noexec role binds it noexec.
aide_exclude_paths_packages: >-
  {{ ['/usr/lib/sysimage/rpm', '/var/lib/rpm', '/var/lib/dnf']
     if 'rhel' in group_names else
     ['/var/lib/apt/lists', '/var/lib/ubuntu-advantage/apt-esm', '/var/lib/command-not-found',
      '/var/lib/unattended-upgrades',
      '/var/lib/apt/listchanges', '/var/lib/apt/listchanges-old', '/var/backups'] }}
# Each group's additions, from its group_vars, such as what a platform's own
# agents write.
aide_exclude_paths_group: []
# Each host's additions, such as a service's data directory.
aide_exclude_paths_host: []
# Paths left out while the host's firmware reports Secure Boot on, which
# aide-report reads at each run: /boot, whose boot loader and kernels Secure
# Boot verifies. With shim and GRUB it does not verify the initramfs images,
# grub.cfg, grubenv or the boot entries, which go unwatched with them there.
aide_exclude_paths_secure_boot: [/boot]

# The package's own configuration, which aide-report's configuration includes
# after its exclusions, and the databases it names.
aide_package_config: "{{ '/etc/aide.conf' if 'rhel' in group_names else '/etc/aide/aide.conf' }}"
aide_database: "{{ '/var/lib/aide/aide.db.gz' if 'rhel' in group_names else '/var/lib/aide/aide.db' }}"
aide_database_new: "{{ '/var/lib/aide/aide.db.new.gz' if 'rhel' in group_names else '/var/lib/aide/aide.db.new' }}"

aide_settings_dir: /etc/aide-report
aide_state_dir: /var/lib/aide-report
# The package-owned paths at the accepted baseline, which aide-report writes
# with each baseline: a database without it is not one aide-report accepted,
# such as one the distribution's package made when it was installed.
aide_manifest: "{{ aide_state_dir }}/packages.json.gz"
# The exclusions, written by aide-report before each run, from the settings and
# what the host has mounted.
aide_exclusions: /run/aide-report/exclusions.conf

# The packages' own daily checks, masked before the packages are installed so
# that neither runs beside aide-report: Debian and Ubuntu's mails every change,
# package updates included, and Enterprise Linux's mails nothing.
aide_masked_units: >-
  {{ ['aide-check.timer', 'aide-check.service'] if 'rhel' in group_names
     else ['dailyaidecheck.timer', 'dailyaidecheck.service'] }}
