---
# Move AIDE's baseline to the host's files as they are, from maintenance.yml
# --tags aide-accept, where no mailed report has: on a host without one, after
# a report too long for one mail, or before the next report would list what a
# deliberate change, such as a release upgrade, wrote. Every other report
# moves it as its mail is sent. A run without --limit would accept every
# host's changes unread, so it refuses.
- name: Check the run names its hosts
  ansible.builtin.assert:
    that: ansible_limit is defined
    fail_msg: Name the hosts whose reports were reviewed with --limit.
    quiet: true
  run_once: true

# systemctl start waits for the oneshot to finish: a walk of every watched file.
- name: Accept the files as they are
  ansible.builtin.command:
    argv: [systemctl, start, aide-baseline.service]
  async: 7200
  poll: 30
  changed_when: true
