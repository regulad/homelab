---
# Converge AIDE's daily report, aide-report, on every Linux host: hardware
# (Phase 2) and generated (Phase 4), containers included. A host with no
# baseline yet gets its first one in the background; maintenance.yml
# --tags aide-accept moves it later.
- name: AIDE's daily report
  when: aide_enabled
  block:
    # invoke-rc.d and debhelper's scripts skip a masked unit, so installing the
    # package starts neither of its own checks.
    - name: The packages' own daily checks masked
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop: "{{ aide_masked_units }}"

    - name: AIDE
      ansible.builtin.package:
        name: aide
        state: present
      register: aide_installed

    # aide-report runs Podman's own check of its image stores, which AIDE does
    # not walk. Podman has one from 5.2; before it, containers-storage, from
    # the same library, has the same check.
    - name: Installed packages
      ansible.builtin.package_facts:

    - name: Podman before 5.2
      ansible.builtin.set_fact:
        aide_podman_before_check: >-
          {{ 'podman' in ansible_facts.packages
             and ansible_facts.packages.podman[0].version is version('5.2', '<') }}

    # containers-storage ships /usr/share/containers/storage.conf, which Podman
    # reads where /etc has none. Its driver, "overlay", does not match the
    # default, unnamed one Podman recorded when it first ran without either
    # file, and Podman then refuses to run. This file keeps the default.
    - name: Podman's storage settings, as it recorded them
      ansible.builtin.copy:
        src: storage.conf
        dest: /etc/containers/storage.conf
        owner: root
        group: root
        mode: "0644"
      when: aide_podman_before_check

    - name: Podman's layer check before Podman 5.2, from containers-storage
      ansible.builtin.package:
        name: containers-storage
        state: present
      when: aide_podman_before_check

    - name: Directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ aide_settings_dir }}", mode: "0755"}
        - {path: "{{ aide_state_dir }}", mode: "0700"}
        - {path: /usr/local/lib/systemd/system, mode: "0755"}

    # Each takes effect at the next run.
    - name: Settings
      ansible.builtin.template:
        src: settings.json.j2
        dest: "{{ aide_settings_dir }}/settings.json"
        owner: root
        group: root
        mode: "0644"

    - name: AIDE's configuration
      ansible.builtin.template:
        src: aide.conf.j2
        dest: "{{ aide_settings_dir }}/aide.conf"
        owner: root
        group: root
        mode: "0644"

    - name: Report and baseline
      ansible.builtin.copy:
        src: aide-report
        dest: /usr/local/bin/aide-report
        owner: root
        group: root
        mode: "0755"

    - name: Units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /usr/local/lib/systemd/system/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop: [aide-report.service, aide-baseline.service, aide-report.timer]
      register: aide_units
      notify: Restart the daily report's timer

    - name: Daily report's timer running
      ansible.builtin.systemd_service:
        name: aide-report.timer
        enabled: true
        state: started
        daemon_reload: true
      # A check run cannot read what an install still pending would create.
      when: not (ansible_check_mode and aide_units is changed)

    # AppArmor's compiled policy cache, /var/cache/apparmor, lies below
    # /var/cache, and AIDE does not walk into an excluded directory whatever a
    # deeper rule selects. So AppArmor keeps no cache: it compiles each profile
    # from its source in /etc/apparmor.d, which AIDE watches, at every load.
    # parser.conf is a dpkg conffile (AGENTS.md, AppArmor keeps no policy cache).
    - name: Read AppArmor's parser settings
      ansible.builtin.stat:
        path: /etc/apparmor/parser.conf
        get_checksum: false
      register: aide_apparmor_parser

    - name: AppArmor without a policy cache
      ansible.builtin.lineinfile:
        path: /etc/apparmor/parser.conf
        regexp: '^#?\s*skip-cache\s*$'
        line: skip-cache
      when: aide_apparmor_parser.stat.exists

    - name: AppArmor's old policy cache removed
      ansible.builtin.file:
        path: /var/cache/apparmor
        state: absent
      when: aide_apparmor_parser.stat.exists

    - name: Read the baseline
      ansible.builtin.stat:
        path: "{{ aide_database }}"
        get_checksum: false
      register: aide_baseline

    # Walking and hashing the files takes minutes, so the first baseline is built
    # in the background; the daily report mails that there is none until then.
    - name: First baseline
      ansible.builtin.systemd_service:
        name: aide-baseline.service
        state: started
        no_block: true
        daemon_reload: true
      when:
        - not aide_baseline.stat.exists
        - not (ansible_check_mode and (aide_units is changed or aide_installed is changed))
