---
# Each of noexec_paths and noexec_paths_host bound over itself with noexec by
# its own mount unit, started and enabled for local-fs.target; and /tmp a tmpfs
# by systemd's own tmp.mount, with noexec. Runs on every Linux host, containers
# included.
- name: Gather the paths
  ansible.builtin.set_fact:
    noexec_bind_paths: "{{ (noexec_paths + noexec_paths_host) | unique }}"

- name: Name the paths' mount units, and check fstab mounts none of them
  ansible.builtin.command:
    argv: "{{ ['sh', '-ec', noexec_script, 'sh'] + noexec_bind_paths }}"
  vars:
    noexec_script: |
      for path in "$@"; do
        if findmnt --fstab --noheadings --mountpoint "$path" > /dev/null 2>&1; then
          echo "$path has a line in /etc/fstab, which its mount unit would hide" >&2
          exit 1
        fi
      done
      # One name per path, separated by spaces, which escaped names never hold.
      systemd-escape --path --suffix=mount -- "$@"
  register: noexec_units
  changed_when: false
  check_mode: false

- name: Check each path has its unit's name
  ansible.builtin.assert:
    that: noexec_units.stdout.split() | length == noexec_bind_paths | length
    quiet: true

- name: Mount units
  ansible.builtin.template:
    src: bind.mount.j2
    dest: /etc/systemd/system/{{ item.1 }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ noexec_bind_paths | zip(noexec_units.stdout.split()) | list }}"
  loop_control:
    label: "{{ item.1 }}"
  register: noexec_unit_files
  notify: Remount the changed paths

- name: Paths mounted, and at each boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ noexec_units.stdout.split() }}"
  # A check run cannot read what an install still pending would create.
  when: not (ansible_check_mode and noexec_unit_files is changed)

- name: /tmp
  ansible.builtin.import_tasks: tmp.yml
  when: noexec_tmp
