---
# Each of noexec_paths, noexec_paths_packages and noexec_paths_host bound over
# itself with noexec by its own mount unit, started and enabled for
# local-fs.target; and /tmp a tmpfs by systemd's own tmp.mount, with noexec.
# Runs on every Linux host, containers included.
- name: Gather the paths
  ansible.builtin.set_fact:
    noexec_bind_paths: "{{ (noexec_paths + noexec_paths_packages + noexec_paths_host) | unique }}"

- name: Name the paths' mount units, and check fstab mounts none of them
  ansible.builtin.command:
    argv: "{{ ['sh', '-ec', noexec_script, 'sh'] + noexec_bind_paths }}"
  vars:
    noexec_script: |
      for path in "$@"; do
        if findmnt --fstab --noheadings --mountpoint "$path" > /dev/null 2>&1; then
          echo "$path has a line in /etc/fstab, which its mount unit would hide" >&2
          exit 1
        fi
      done
      # One name per path, separated by spaces, which escaped names never hold.
      systemd-escape --path --suffix=mount -- "$@"
  register: noexec_units
  changed_when: false
  check_mode: false

- name: Check each path has its unit's name
  ansible.builtin.assert:
    that: noexec_units.stdout.split() | length == noexec_bind_paths | length
    quiet: true

- name: Mount units
  ansible.builtin.template:
    src: bind.mount.j2
    dest: /etc/systemd/system/{{ item.1 }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ noexec_bind_paths | zip(noexec_units.stdout.split()) | list }}"
  loop_control:
    label: "{{ item.1 }}"
  register: noexec_unit_files
  notify: Remount the changed paths

- name: Paths mounted, and at each boot
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ noexec_units.stdout.split() }}"
  # A check run cannot read what an install still pending would create.
  when: not (ansible_check_mode and noexec_unit_files is changed)

# A path taken off the lists stays bound until its unit goes: each unit the
# role made, by the header its template writes, whose path is no longer
# listed, is stopped, which unbinds it, disabled and removed.
- name: Find the mount units the role made
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "*.mount"
    contains: "^# Managed by Ansible \\(noexec\\)\\. "
  register: noexec_made

- name: Name the units of paths no longer listed
  ansible.builtin.set_fact:
    noexec_stale_units: "{{ noexec_made.files | map(attribute='path') | map('basename') | difference(noexec_units.stdout.split()) }}"

# The template's LazyUnmount=, given to each before its stop, so that one the
# template rendered without it unbinds at once too: the path shows the same
# files once unbound, so its unbinding need not wait for what holds it open.
- name: Their units unmount lazily
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/{{ item }}
    line: LazyUnmount=yes
    insertafter: ^\[Mount\]$
  loop: "{{ noexec_stale_units }}"

- name: Their units stopped and disabled
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    daemon_reload: true
  loop: "{{ noexec_stale_units }}"

- name: Their unit files removed
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item }}
    state: absent
  loop: "{{ noexec_stale_units }}"
  notify: Reload the units

- name: /tmp
  ansible.builtin.import_tasks: tmp.yml
  when: noexec_tmp
