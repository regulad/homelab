---
# Directories bound over themselves with noexec, each by a mount unit of its
# own: nothing below one, on its filesystem, can be run as a program or mapped
# executable as a shared library is, though an interpreter can still read a
# script there. A filesystem mounted below one keeps its own options. Each must
# be a directory on its parent's filesystem: the role refuses one with a line
# in /etc/fstab, which its unit would hide.
noexec_paths:
  # Logs, which AIDE does not watch (aide role).
  - /var/log
# The package manager's copies of its own state, which AIDE does not watch
# (aide role): dpkg's and apt's daily ones in /var/backups, on Debian and Ubuntu.
noexec_paths_packages: "{{ [] if 'rhel' in group_names else ['/var/backups'] }}"
# Each host's additions, such as an application's logs.
noexec_paths_host: []

# Services that alone use a path above, each with the paths it uses. Each
# requires their binds by a drop-in, RequiresMountsFor=, so it runs only with
# them bound, mounting them first if need be, and stops before they are
# unbound; paths not listed above are left out. dpkg's daily backup and apt's
# daily runs, each of which runs apt.systemd.daily, write /var/backups.
noexec_services:
  dpkg-db-backup.service: [/var/backups]
  apt-daily.service: [/var/backups]
  apt-daily-upgrade.service: [/var/backups]
# Each host's additions.
noexec_services_host: {}

# /tmp a tmpfs by systemd's own tmp.mount, enabled, with noexec added to the
# unit's options by a drop-in where they lack it. Where /tmp is not a tmpfs
# yet, it becomes one at the next boot; where the distribution does not mount
# it itself, tmp-erase.service erases what the root filesystem holds there
# before each mount.
noexec_tmp: true
