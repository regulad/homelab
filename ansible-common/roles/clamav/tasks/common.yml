---
# What both entry points need: the role's own unit directory, as locally
# installed software's are, the configuration directory, and the quarantine
# both move infected files into.
- name: Local unit directory
  ansible.builtin.file:
    path: /usr/local/lib/systemd/system
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configuration directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ [clamav_scan_config | dirname, clamav_onaccess_config | dirname] | unique }}"

- name: Quarantine
  ansible.builtin.file:
    path: "{{ clamav_quarantine }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: clamav_quarantine | length > 0
