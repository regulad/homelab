---
# Converge clamonacc, against the shared clamd or the host's own, on a host that
# turns it on: hosts with their own kernel, hardware (Phase 2) and generated
# (Phase 4), and privileged containers. Its play leaves out the inventory's
# unprivileged_containers, from each container's unprivileged: clamonacc's
# fanotify group needs CAP_SYS_ADMIN in the initial user namespace, which a
# privileged container's root holds and an unprivileged one's lacks.

# The packages, which clamonacc and a local clamd need, and the weekly scan
# does not.
- name: ClamAV's packages
  when: clamav_onaccess_enabled or clamav_clamd_local
  block:
    # systemctl mask works on units not yet installed, and reloads systemd.
    # invoke-rc.d and debhelper's scripts skip a masked unit, so installing the
    # packages starts neither. Where clamd is local, they stay unmasked.
    - name: The packages' clamd and freshclam masked
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: "{{ not clamav_clamd_local }}"
      loop: "{{ clamav_masked_units }}"

    # The distribution and its release, which name the EPEL release package.
    - name: Enterprise Linux's distribution
      ansible.builtin.setup:
        gather_subset: [min]
      when: "'rhel' in group_names"

    - name: EPEL's release package
      ansible.builtin.package:
        name: "{{ clamav_epel_release }}"
        state: present
      register: clamav_epel_release_installed
      when: "'rhel' in group_names"

    - name: EPEL enabled
      community.general.dnf_config_manager:
        name: ["{{ clamav_epel_repo }}"]
        state: enabled
      register: clamav_epel_enabled
      when: "'rhel' in group_names"

    - name: ClamAV's packages installed
      ansible.builtin.package:
        name: "{{ clamav_packages }}"
        state: present
      register: clamav_packages_installed
      # A check run cannot read what an install still pending would create.
      when: not (ansible_check_mode and (clamav_epel_release_installed is changed or clamav_epel_enabled is changed))

    # A local clamd, which needs freshclam's first signatures: until they are
    # there, its units' conditions keep it from starting, and the packages'
    # postinst, which starts freshclam, starts nothing else.
    - name: Local clamd
      when: clamav_clamd_local and not (ansible_check_mode and clamav_packages_installed is changed)
      block:
        - name: Freshclam running
          ansible.builtin.systemd_service:
            name: clamav-freshclam.service
            enabled: true
            state: started

        - name: Freshclam's first signatures
          ansible.builtin.find:
            paths: /var/lib/clamav
            patterns: [main.cvd, main.cld, daily.cvd, daily.cld]
          register: clamav_signatures
          until: clamav_signatures.files | map(attribute='path') | map('basename') | map('regex_replace', '[.].*$', '') | unique | length == 2
          retries: 30
          delay: 10

        # Through its socket, which systemd holds open while clamd loads the
        # signatures, and which clamav-daemon.service enables with it.
        - name: Clamd running
          ansible.builtin.systemd_service:
            name: clamav-daemon.service
            enabled: true
            state: started

- name: Shared directories
  ansible.builtin.import_tasks: common.yml
  when: clamav_onaccess_enabled

- name: ClamAV on-access scanning
  when: clamav_onaccess_enabled
  block:
    # The start check's directory.
    - name: Local helper directory
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Detections reach the journal alone; a timer mails the new ones each
    # minute through mail_relay's Postfix, which the play before this one sets
    # up. The script and its service take effect at their next run.
    - name: Detections mailer
      ansible.builtin.copy:
        src: clamonacc-mail
        dest: /usr/local/bin/clamonacc-mail
        owner: root
        group: root
        mode: "0755"

    - name: Detections mailer's units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /usr/local/lib/systemd/system/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop:
        - clamonacc-mail.service
        - clamonacc-mail.timer
      register: clamav_mail_units
      notify: Restart the detections mailer's timer

    - name: Detections mailer's timer running
      ansible.builtin.systemd_service:
        name: clamonacc-mail.timer
        enabled: true
        state: started
        daemon_reload: true
      # A check run cannot read what an install still pending would create.
      when: not (ansible_check_mode and clamav_mail_units is changed)

    # A missing include path once spun clamonacc at full CPU
    # (https://github.com/Cisco-Talos/clamav/issues/793), so only the
    # directories that exist are watched.
    - name: Watched directories that exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ clamav_paths + clamav_paths_host }}"
      register: clamav_include_stat

    - name: Directories to watch
      ansible.builtin.set_fact:
        clamav_onaccess_watched: >-
          {{ clamav_include_stat.results | selectattr('stat.isdir', 'defined')
             | selectattr('stat.isdir') | map(attribute='item') | unique | list }}

    - name: Clamonacc's configuration
      ansible.builtin.template:
        src: clamonacc.conf.j2
        dest: "{{ clamav_onaccess_config }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart clamonacc

    # The unit's start check: it waits for clamonacc's walk of the watched
    # trees and fails the start if one was lost.
    - name: Start check
      ansible.builtin.copy:
        src: clamonacc-watched
        dest: /usr/local/libexec/clamonacc-watched
        owner: root
        group: root
        mode: "0755"

    # The packages' unit reads clamd's own configuration, and Debian's logs to a
    # file, out of the mailer's reach; it also requires a local clamd, which
    # most hosts lack. systemd reads /usr/local/lib/systemd/system before
    # /usr/lib/systemd/system, so this one, of the same name, replaces it.
    - name: Clamonacc's unit
      ansible.builtin.template:
        src: clamav-clamonacc.service.j2
        dest: /usr/local/lib/systemd/system/clamav-clamonacc.service
        owner: root
        group: root
        mode: "0644"
      register: clamav_unit
      notify: Restart clamonacc

    - name: Clamonacc running
      ansible.builtin.systemd_service:
        name: clamav-clamonacc.service
        enabled: true
        state: started
        daemon_reload: true
      # A check run cannot read what an install still pending would create.
      when: not (ansible_check_mode and clamav_unit is changed)
