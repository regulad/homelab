---
# Zones the host declares, each a name mapped to what it holds, set
# permanently and at once through ansible.posix.firewalld: target (default
# "default"), and lists of interfaces, sources, services, ports
# ("<port or range>/<protocol>") and rich_rules (as firewall-cmd --list-all
# prints them), and forward and masquerade (true or false). A zone that is not
# built in is created. The module adds what is declared and cannot remove
# entries it is not told of. Policies and direct rules, which it cannot manage,
# are whole files through host_files, reloading firewalld. A host that declares
# no zones is left alone: the role neither installs nor starts firewalld there.
firewalld_zones: {}

# Interfaces added to the trusted zone of every host whose zones the role
# manages. The tailnet's own ACLs, in regulad/tailscale-acls, filter what
# reaches tailscale0.
firewalld_trusted_interfaces: [tailscale0]

# Other firewall managers, removed where the role manages firewalld, so that
# each host's firewall has one owner. Whatever rules they held are described
# in the host's zones first.
firewalld_removed_packages: [ufw]

# tasks/table.yml: one nftables table beside firewalld, for a match that
# firewalld's zones, policies and rich rules cannot express. Another role
# includes it with these set; the table is that role's to add and remove.
# firewalld flushes only its own table, and a packet any table drops stays
# dropped, so such a table applies on every interface, trusted ones included.
# The table's name, its family (ip, ip6, inet, ...), its body (the chains and
# sets inside "table <family> <name> { ... }"), and present or absent.
firewalld_table_name: ""
firewalld_table_family: inet
firewalld_table_body: ""
firewalld_table_state: present
