---
# Trust ca_trust_trusted and distrust ca_trust_distrusted in the system trust
# store, the way the host's packaging expects, so both survive ca-certificates
# upgrades, and remove the anchors of ca_trust_retired. Runs on
# hardware hosts (Phase 2) and generated hosts (Phase 4) in an OS group.
- name: Check the trust store family
  ansible.builtin.assert:
    that: ca_trust_family in ['debian', 'rhel', 'freebsd']
    fail_msg: "Set ca_trust_family to debian, rhel or freebsd through the host's OS group."
    quiet: true

- name: Distrust roots in /etc/ca-certificates.conf
  # Negates a root's line only where the package lists it enabled; a root the
  # package dropped or already disabled is left as it is.
  ansible.builtin.lineinfile:
    path: /etc/ca-certificates.conf
    regexp: '^mozilla/{{ item | regex_escape }}\.crt$'
    line: "!mozilla/{{ item }}.crt"
    backrefs: true
  loop: "{{ ca_trust_distrusted }}"
  when: ca_trust_family == 'debian'
  notify: Update Debian CA store

- name: Distrust roots in p11-kit's blocklist
  ansible.builtin.copy:
    dest: "{{ ca_trust_rhel_blocklist_dir }}/{{ item }}.pem"
    src: "{{ item }}.crt"
    owner: root
    group: "{{ ca_trust_file_group }}"
    mode: "0644"
  loop: "{{ ca_trust_distrusted }}"
  when: ca_trust_family == 'rhel'
  notify: Update RHEL CA store

- name: Distrust roots in certctl's untrusted directory
  # A root FreeBSD already distrusts keeps the base system's own file.
  ansible.builtin.copy:
    dest: "{{ ca_trust_freebsd_untrusted_dir }}/{{ item }}.pem"
    src: "{{ item }}.crt"
    owner: root
    group: "{{ ca_trust_file_group }}"
    mode: "0644"
    force: false
  loop: "{{ ca_trust_distrusted }}"
  when: ca_trust_family == 'freebsd'
  notify: Rehash FreeBSD CA store

# update-ca-certificates reads only *.crt here.
- name: Trust roots in /usr/local/share/ca-certificates
  ansible.builtin.copy:
    dest: "{{ ca_trust_debian_anchor_dir }}/{{ item }}.crt"
    src: trusted/{{ item }}.crt
    owner: root
    group: "{{ ca_trust_file_group }}"
    mode: "0644"
  loop: "{{ ca_trust_trusted }}"
  when: ca_trust_family == 'debian'
  notify: Update Debian CA store

- name: Trust roots in p11-kit's anchors
  ansible.builtin.copy:
    dest: "{{ ca_trust_rhel_anchor_dir }}/{{ item }}.crt"
    src: trusted/{{ item }}.crt
    owner: root
    group: "{{ ca_trust_file_group }}"
    mode: "0644"
  loop: "{{ ca_trust_trusted }}"
  when: ca_trust_family == 'rhel'
  notify: Update RHEL CA store

- name: Trust roots in certctl's local directory
  ansible.builtin.copy:
    dest: "{{ ca_trust_freebsd_anchor_dir }}/{{ item }}.pem"
    src: trusted/{{ item }}.crt
    owner: root
    group: "{{ ca_trust_file_group }}"
    mode: "0644"
  loop: "{{ ca_trust_trusted }}"
  when: ca_trust_family == 'freebsd'
  notify: Rehash FreeBSD CA store

- name: Remove retired roots from /usr/local/share/ca-certificates
  ansible.builtin.file:
    path: "{{ ca_trust_debian_anchor_dir }}/{{ item }}.crt"
    state: absent
  loop: "{{ ca_trust_retired }}"
  when: ca_trust_family == 'debian'
  notify: Update Debian CA store

- name: Remove retired roots from p11-kit's anchors
  ansible.builtin.file:
    path: "{{ ca_trust_rhel_anchor_dir }}/{{ item }}.crt"
    state: absent
  loop: "{{ ca_trust_retired }}"
  when: ca_trust_family == 'rhel'
  notify: Update RHEL CA store

- name: Remove retired roots from certctl's local directory
  ansible.builtin.file:
    path: "{{ ca_trust_freebsd_anchor_dir }}/{{ item }}.pem"
    state: absent
  loop: "{{ ca_trust_retired }}"
  when: ca_trust_family == 'freebsd'
  notify: Rehash FreeBSD CA store

- name: Java's copy of the system store
  # After the anchors: the package's postinst builds the keystore from the
  # store as it stands, and the handler's update-ca-certificates brings it up
  # to date with anything changed above. A new container's template carries
  # stale package lists, so they are refreshed first.
  ansible.builtin.apt:
    name: "{{ ca_trust_debian_java_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 86400
  when: ca_trust_java and ca_trust_family == 'debian'
