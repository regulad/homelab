---
# Distrust ca_trust_distrusted in the system trust store, the way the host's
# packaging expects, so the choice survives ca-certificates upgrades. Runs on
# hardware hosts (Phase 2) and generated hosts (Phase 4) in an OS group.
- name: Check the trust store family
  ansible.builtin.assert:
    that: ca_trust_family in ['debian', 'rhel']
    fail_msg: "Set ca_trust_family to debian or rhel through the host's OS group."
    quiet: true

- name: Distrust roots in /etc/ca-certificates.conf
  # Negates a root's line only where the package lists it enabled; a root the
  # package dropped or already disabled is left as it is.
  ansible.builtin.lineinfile:
    path: /etc/ca-certificates.conf
    regexp: '^mozilla/{{ item | regex_escape }}\.crt$'
    line: "!mozilla/{{ item }}.crt"
    backrefs: true
  loop: "{{ ca_trust_distrusted }}"
  when: ca_trust_family == 'debian'
  notify: Update Debian CA store

- name: Distrust roots in p11-kit's blocklist
  ansible.builtin.copy:
    dest: "{{ ca_trust_rhel_blocklist_dir }}/{{ item }}.pem"
    src: "{{ item }}.crt"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ca_trust_distrusted }}"
  when: ca_trust_family == 'rhel'
  notify: Update RHEL CA store
