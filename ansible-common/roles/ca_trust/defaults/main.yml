---
# How this host's system trust store is built, set by its OS group: debian
# (Debian and Ubuntu, /etc/ca-certificates.conf), rhel (Enterprise Linux,
# p11-kit's blocklist) or freebsd (FreeBSD and pfSense, certctl's untrusted
# directory).
ca_trust_family: ""

# Group owning the files the role writes: root's group, gid 0, is wheel on FreeBSD.
ca_trust_file_group: root

# Root certificates the system store must not trust, each by its name in the
# Mozilla bundle as Debian ships it (mozilla/<name>.crt). files/<name>.crt holds
# each certificate for the blocklist.
#
# The eMudhra intermediates whose keys were compromised in October 2026 chain to
# these two roots; see https://emudhra.we-have-a-problem.com/#linux. SHA-256:
#   emSign_ECC_Root_CA_-_G3   86:A1:EC:BA:08:9C:4A:8D:3B:BE:27:34:C6:12:BA:34:1D:81:3E:04:3C:F9:E8:A8:62:CD:5C:57:A3:6B:BE:6B
#   Comodo_AAA_Services_root  D7:A7:A0:FB:5D:7E:27:31:D7:71:E9:48:4E:BC:DE:F7:1D:5F:0C:3E:0A:29:48:78:2B:C8:3E:E0:EA:69:9E:F4
ca_trust_distrusted:
  - emSign_ECC_Root_CA_-_G3
  - Comodo_AAA_Services_root

# p11-kit's blocklist directory. p11-kit before 0.24 names it blacklist.
ca_trust_rhel_blocklist_dir: /etc/pki/ca-trust/source/blocklist

# certctl's directory of untrusted certificates, which FreeBSD already fills
# with the roots its base system distrusts.
ca_trust_freebsd_untrusted_dir: /usr/share/certs/untrusted
