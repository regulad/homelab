---
# How this host's system trust store is built, set by its OS group: debian
# (Debian and Ubuntu, /etc/ca-certificates.conf), rhel (Enterprise Linux,
# p11-kit's blocklist) or freebsd (FreeBSD and pfSense, certctl's untrusted
# directory).
ca_trust_family: ""

# Group owning the files the role writes: root's group, gid 0, is wheel on FreeBSD.
ca_trust_file_group: root

# Root certificates the system store must not trust, each by its name in the
# Mozilla bundle as Debian ships it (mozilla/<name>.crt). files/<name>.crt holds
# each certificate for the blocklist.
#
# The eMudhra intermediates whose keys were compromised in October 2026 chain to
# these two roots; see https://emudhra.we-have-a-problem.com/#linux. SHA-256:
#   emSign_ECC_Root_CA_-_G3   86:A1:EC:BA:08:9C:4A:8D:3B:BE:27:34:C6:12:BA:34:1D:81:3E:04:3C:F9:E8:A8:62:CD:5C:57:A3:6B:BE:6B
#   Comodo_AAA_Services_root  D7:A7:A0:FB:5D:7E:27:31:D7:71:E9:48:4E:BC:DE:F7:1D:5F:0C:3E:0A:29:48:78:2B:C8:3E:E0:EA:69:9E:F4
ca_trust_distrusted:
  - emSign_ECC_Root_CA_-_G3
  - Comodo_AAA_Services_root

# The homelab's own roots of trust, which the system store trusts, each by its
# file name under files/trusted/ without .crt. SHA-256:
#   internal-ca               93:89:57:13:30:33:04:E9:06:92:22:FF:89:6D:72:D6:1C:54:0C:EB:FE:67:BA:C2:3B:3D:2C:80:63:03:C6:A4
#   regulad.internal          9E:35:4B:BA:83:74:E8:A2:61:A3:D2:B0:BC:01:CD:9B:D7:C1:5A:4B:C0:FB:54:A1:C9:D7:7D:13:9B:29:2B:12
#   freeipa-regulad.internal  EF:7A:CD:8A:96:CB:A9:D2:D0:88:65:7D:F8:7A:6B:9F:AD:5E:18:CB:BE:5A:1C:2F:45:85:22:87:F6:A3:7D:BF
#   freeipa-home.arpa         A9:98:42:97:3C:F1:60:7E:84:CF:0F:E8:C4:7F:3C:27:00:C8:0E:9F:CB:38:2A:74:E9:21:03:F3:14:7E:B9:EC
#   pve-root-ca               AC:58:41:9D:55:BF:27:ED:58:6F:53:F0:FF:1F:3A:01:5A:2D:0A:6C:F7:47:7D:78:BB:75:FF:E5:F6:E1:C7:4D
#   internal-ca and regulad.internal are arawi's (pfSense) CAs;
#   freeipa-regulad.internal is wako's FreeIPA CA, and freeipa-home.arpa the
#   old FreeIPA server's, which signs the certificate the freeipa stand-in
#   still presents; pve-root-ca is the gonkputer cluster's.
ca_trust_trusted:
  - internal-ca
  - regulad.internal
  - freeipa-regulad.internal
  - freeipa-home.arpa
  - pve-root-ca

# Names the role once trusted roots under, whose anchors it removes: ipa-ca was
# FreeIPA's CA, renamed because FreeIPA's own tooling deletes anchors by that
# name, as ipa-server-install did on wako.
ca_trust_retired:
  - ipa-ca

# Where each family's store takes local trust anchors: files there are trusted
# alongside the distribution's bundle and survive its upgrades.
ca_trust_debian_anchor_dir: /usr/local/share/ca-certificates
ca_trust_rhel_anchor_dir: /etc/pki/ca-trust/source/anchors
ca_trust_freebsd_anchor_dir: /usr/local/share/certs

# Java's copy of the system store, for hosts whose Java services must trust
# the roots above. On debian, ca-certificates-java builds
# /etc/ssl/certs/java/cacerts with a headless JRE and rebuilds it on every
# update-ca-certificates, distrusted roots included; rhel's update-ca-trust
# already extracts /etc/pki/ca-trust/extracted/java/cacerts without a JRE.
ca_trust_java: false
ca_trust_debian_java_packages: [ca-certificates-java, default-jre-headless]

# p11-kit's blocklist directory. p11-kit before 0.24 names it blacklist.
ca_trust_rhel_blocklist_dir: /etc/pki/ca-trust/source/blocklist

# certctl's directory of untrusted certificates, which FreeBSD already fills
# with the roots its base system distrusts.
ca_trust_freebsd_untrusted_dir: /usr/share/certs/untrusted
