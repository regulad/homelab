---
- name: Update Debian CA store
  ansible.builtin.command: update-ca-certificates
  changed_when: true

- name: Update RHEL CA store
  ansible.builtin.command: update-ca-trust extract
  changed_when: true

# Rebuilds /etc/ssl/certs and /etc/ssl/cert.pem without the untrusted roots.
- name: Rehash FreeBSD CA store
  ansible.builtin.command: certctl rehash
  changed_when: true
