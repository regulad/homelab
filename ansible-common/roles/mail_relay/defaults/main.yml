---
# Which packages and paths Postfix uses here, set by the host's OS group: debian
# or rhel.
mail_relay_family: ""

# The host's mail account in FreeIPA, following the null-<short hostname>
# convention; mail.regulad.xyz lets it log in and send as <account>@<domain>.
mail_relay_account: null-{{ inventory_hostname | split('.') | first }}
mail_relay_domain: regulad.xyz
# The account's password, from the host's secrets.sops.yml.
mail_relay_password: ""
# The name Postfix gives itself, in Received headers and its EHLO. Empty finds
# it on the host: its canonical name (hostname -f) where that has a domain,
# otherwise its short name in the DHCP domain of the preferred default route's
# link that has one; with neither, myhostname stays unset and Postfix derives it.
mail_relay_myhostname: ""
# Implicit TLS submission on mail.regulad.xyz.
mail_relay_relayhost: "[mail.{{ mail_relay_domain }}]:465"

# Every local sender, root, sudo's invoking user, cron, is rewritten to the
# account's address, the only one mail.regulad.xyz accepts from this login.
mail_relay_address: "{{ mail_relay_account }}@{{ mail_relay_domain }}"
# Every recipient, envelope and header, is rewritten to this one mailbox: the
# host only relays its own reports, and addresses such as root@ do not exist.
mail_relay_recipient: regulad@{{ mail_relay_domain }}

# FreeIPA's API on wako, which manages the account, as svc-ansible (User
# Administrator) from group_vars/all.sops.yml. The calls run on
# mail_relay_freeipa_delegate, which must resolve wako's name and trust its CA:
# by default the host itself.
mail_relay_freeipa_delegate: "{{ inventory_hostname }}"
mail_relay_freeipa_host: wako.regulad.internal
mail_relay_freeipa_user: svc-ansible
mail_relay_freeipa_password: ""
