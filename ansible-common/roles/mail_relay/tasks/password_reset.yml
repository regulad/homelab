---
# Set an existing mail account's password to the host's SOPS value, from
# either stage's maintenance.yml (--tags mail-password-reset --limit <host>).
# The main tasks set it only when they create the account, so an account that
# already existed keeps the password it had, and the relay's login fails.
- name: Check the reset names its hosts and has both passwords
  ansible.builtin.assert:
    that:
      - ansible_limit is defined
      - mail_relay_password | length > 0
      - mail_relay_freeipa_password | length > 0
    fail_msg: Name the hosts whose accounts to reset with --limit, and set both passwords through SOPS.
    quiet: true

- name: Mail account's password
  community.general.ipa_user:
    name: "{{ mail_relay_account }}"
    password: "{{ mail_relay_password }}"
    update_password: always
    state: present
    ipa_host: "{{ mail_relay_freeipa_host }}"
    ipa_user: "{{ mail_relay_freeipa_user }}"
    ipa_pass: "{{ mail_relay_freeipa_password }}"
    validate_certs: true
  delegate_to: "{{ mail_relay_freeipa_delegate }}"
  become: false
  no_log: true

# FreeIPA expires a password an administrator sets at once.
- name: Mail account's password expiry
  community.general.ipa_user:
    name: "{{ mail_relay_account }}"
    krbpasswordexpiration: "{{ mail_relay_password_expiration }}"
    state: present
    ipa_host: "{{ mail_relay_freeipa_host }}"
    ipa_user: "{{ mail_relay_freeipa_user }}"
    ipa_pass: "{{ mail_relay_freeipa_password }}"
    validate_certs: true
  delegate_to: "{{ mail_relay_freeipa_delegate }}"
  become: false
  no_log: true
