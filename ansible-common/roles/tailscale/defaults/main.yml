---
# Hosts that run Tailscale set this; on others the role does nothing.
tailscale_enabled: false

# Tailscale's dnf repository for Enterprise Linux, by distribution and major
# release, as pkgs.tailscale.com lays it out.
tailscale_dnf_path: >-
  {{ 'oracle' if ansible_facts['distribution'] == 'OracleLinux' else 'rhel' }}/{{ ansible_facts['distribution_major_version'] }}
# The SHA-256 of Tailscale's apt signing key, the same for every Ubuntu
# release, as pkgs.tailscale.com served it on 2026-10-28.
tailscale_apt_key_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39

# The node's tags, without "tag:". A joined node whose tags differ is retagged
# through Tailscale's API; a new node joins with a one-off, pre-approved key
# carrying exactly these tags.
tailscale_tags: []

# Settings converged with `tailscale set`, by name (see the tailscale_node
# module); undeclared settings are left alone.
tailscale_settings: {}

# The complete Serve configuration: a list of {port, target, funnel}. Null
# leaves Serve alone.
tailscale_serve: null

# Join only when set, on a node that is not logged in. Joining mints a one-off
# auth key through Tailscale's API with tailscale_api_token, from
# group_vars/all.sops.yml, and passes tailscale up the declared settings it
# takes, so the node never runs on Tailscale's defaults for them.
tailscale_join: false
tailscale_api_token: ""
tailscale_tailnet: "-"

# Protected nodes are never joined, re-authenticated or logged out by this role,
# whatever tailscale_join says; a protected node that is not logged in fails the
# run instead. Settings and Serve are still converged.
tailscale_protected: false

# macOS: Homebrew's prefix, and the label of the launchd job that
# `sudo brew services start tailscale` writes for tailscaled.
tailscale_homebrew_prefix: /opt/homebrew
tailscale_launchd_label: sh.brew.tailscale

# macOS: whether the kernel ignores the Route Information Options of IPv6
# router advertisements (net.inet6.icmp6.nd6_process_rti=0), set at every boot
# by a launchd job; false removes the job, and the kernel takes them again from
# the next boot. Set it on a Mac whose LAN advertises a route to the tailnet's
# IPv6 range, as tailscalerouter's radvd does at home: macOS keeps one route
# per prefix, so a /48 learned from the LAN stands in for tailscaled's, and the
# replies from the node's tailnet IPv6 address leave by the LAN and are lost.
tailscale_macos_ignore_route_info: false
tailscale_macos_route_info_label: xyz.regulad.homelab.ignore-route-info
# The tailnet's IPv6 range, as tofu/shared's tailscale_cidrs has it: the
# hardware stage reads no OpenTofu but tofu/backblaze's outputs.
tailscale_ipv6_range: fd7a:115c:a1e0::/48

# Units tailscaled starts after, as a tailscaled.service.d drop-in; empty
# removes it. A Proxmox node lists pveproxy.service: once Serve holds the
# tailnet address's 8006, pveproxy's wildcard listener on 8006 cannot bind.
tailscale_after: []
