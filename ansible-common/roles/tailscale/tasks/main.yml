---
# Install Tailscale and converge a joined node's settings and Serve; join only
# when tailscale_join is set and the node is not protected. Runs on hardware
# hosts (Phase 2) and generated hosts (Phase 4). Its play runs unprivileged,
# as Homebrew on macOS needs, so it becomes root everywhere else.
- name: Tailscale
  when: tailscale_enabled
  become: "{{ 'macos' not in group_names }}"
  block:
    - name: Check the declared tags
      ansible.builtin.assert:
        that: tailscale_tags | length > 0
        fail_msg: Declare tailscale_tags for every Tailscale node.
        quiet: true

    # Ahead of the install, which needs it on a new host.
    - name: Tailscale's dnf repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/tailscale.repo
        content: |
          [tailscale-stable]
          name=Tailscale stable
          baseurl=https://pkgs.tailscale.com/stable/{{ tailscale_dnf_path }}/$basearch
          enabled=1
          type=rpm
          repo_gpgcheck=1
          gpgcheck=1
          gpgkey=https://pkgs.tailscale.com/stable/{{ tailscale_dnf_path }}/repo.gpg
        owner: root
        group: root
        mode: "0644"
      when: "'rhel' in group_names"

    - name: Install Tailscale
      ansible.builtin.package:
        name: tailscale
        state: present

    - name: Tailscale start order directory
      ansible.builtin.file:
        path: /etc/systemd/system/tailscaled.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: tailscale_after | length > 0

    - name: Tailscale start order
      ansible.builtin.copy:
        dest: /etc/systemd/system/tailscaled.service.d/50-after.conf
        content: |
          [Unit]
          After={{ tailscale_after | join(' ') }}
        owner: root
        group: root
        mode: "0644"
      when: tailscale_after | length > 0
      notify: Reload systemd for Tailscale

    - name: No Tailscale start order
      ansible.builtin.file:
        path: /etc/systemd/system/tailscaled.service.d/50-after.conf
        state: absent
      when: tailscale_after | length == 0
      notify: Reload systemd for Tailscale

    - name: Tailscale daemon
      ansible.builtin.systemd_service:
        name: tailscaled
        enabled: true
        state: started

    - name: Tailscale settings and Serve
      tailscale_node:
        tags: "{{ tailscale_tags }}"
        settings: "{{ tailscale_settings }}"
        serve: "{{ tailscale_serve }}"
      register: tailscale_node_result

    - name: Join the tailnet
      when: not tailscale_node_result.joined
      block:
        - name: Refuse to join a protected or unapproved node
          ansible.builtin.assert:
            that:
              - not tailscale_protected
              - tailscale_join
            fail_msg: >-
              {{ inventory_hostname }} is not logged in ({{ tailscale_node_result.backend_state }}).
              {{ 'It is protected, so this role never joins it; log it in by hand.'
                 if tailscale_protected else 'Set tailscale_join to join it.' }}
            quiet: true

        - name: Mint a one-off auth key with the node's tags
          ansible.builtin.uri:
            url: https://api.tailscale.com/api/v2/tailnet/{{ tailscale_tailnet }}/keys
            method: POST
            headers:
              Authorization: Bearer {{ tailscale_api_token }}
            body_format: json
            body:
              description: ansible {{ inventory_hostname }}
              expirySeconds: 3600
              capabilities:
                devices:
                  create:
                    reusable: false
                    ephemeral: false
                    preauthorized: true
                    tags: "{{ tailscale_tags | map('regex_replace', '^', 'tag:') | list }}"
            status_code: 200
          register: tailscale_key
          delegate_to: localhost
          become: false
          no_log: true

        - name: Join with the key
          ansible.builtin.command:
            argv:
              - tailscale
              - up
              - --auth-key={{ tailscale_key.json.key }}
              - --advertise-tags={{ tailscale_tags | map('regex_replace', '^', 'tag:') | join(',') }}
          changed_when: true
          no_log: true

        - name: Tailscale settings and Serve after joining
          tailscale_node:
            tags: "{{ tailscale_tags }}"
            settings: "{{ tailscale_settings }}"
            serve: "{{ tailscale_serve }}"
