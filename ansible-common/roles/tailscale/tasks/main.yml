---
# Install Tailscale and converge a joined node's settings, Serve and tags; join
# only when tailscale_join is set and the node is not protected. Runs on
# hardware hosts (Phase 2) and generated hosts (Phase 4): on Linux, the
# package and its systemd unit; on macOS, Homebrew's open-source tailscaled
# under its launchd job. Its play runs unprivileged, as Homebrew on macOS
# needs, so it becomes root everywhere else, and wherever tailscale needs root.
- name: Tailscale
  when: tailscale_enabled
  become: "{{ 'macos' not in group_names }}"
  block:
    - name: Check the declared tags
      ansible.builtin.assert:
        that: tailscale_tags | length > 0
        fail_msg: Declare tailscale_tags for every Tailscale node.
        quiet: true

    # Ahead of the install, which needs it on a new host.
    - name: Tailscale's dnf repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/tailscale.repo
        content: |
          [tailscale-stable]
          name=Tailscale stable
          baseurl=https://pkgs.tailscale.com/stable/{{ tailscale_dnf_path }}/$basearch
          enabled=1
          type=rpm
          repo_gpgcheck=1
          gpgcheck=1
          gpgkey=https://pkgs.tailscale.com/stable/{{ tailscale_dnf_path }}/repo.gpg
        owner: root
        group: root
        mode: "0644"
      when: "'rhel' in group_names"

    # Tailscale's own key and list, byte for byte as its install script put
    # them on the Ubuntu hosts before. prodingus, on Debian, has a deb822
    # tailscale.sources instead.
    - name: Tailscale's apt key and repository
      when: "'ubuntu' in group_names"
      block:
        - name: Tailscale's apt key
          ansible.builtin.get_url:
            url: https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg
            dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
            checksum: sha256:{{ tailscale_apt_key_sha256 }}
            owner: root
            group: root
            mode: "0644"
          register: tailscale_apt_key

        - name: Tailscale's apt repository
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/tailscale.list
            content: |
              # Tailscale packages for ubuntu {{ tailscale_apt_release }}
              deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu {{ tailscale_apt_release }} main
            owner: root
            group: root
            mode: "0644"
          vars:
            tailscale_apt_release: "{{ ansible_facts['distribution_release'] }}"
          register: tailscale_apt_list

        # Before the install, which a handler would come after.
        - name: Read Tailscale's apt repository  # noqa: no-handler
          ansible.builtin.apt:
            update_cache: true
          when: tailscale_apt_key is changed or tailscale_apt_list is changed

    - name: Install Tailscale
      ansible.builtin.package:
        name: tailscale
        state: present
      when: "'macos' not in group_names"

    - name: Tailscale's systemd unit
      when: "'macos' not in group_names"
      block:
        - name: Tailscale start order directory
          ansible.builtin.file:
            path: /etc/systemd/system/tailscaled.service.d
            state: directory
            owner: root
            group: root
            mode: "0755"
          when: tailscale_after | length > 0

        - name: Tailscale start order
          ansible.builtin.copy:
            dest: /etc/systemd/system/tailscaled.service.d/50-after.conf
            content: |
              [Unit]
              After={{ tailscale_after | join(' ') }}
            owner: root
            group: root
            mode: "0644"
          when: tailscale_after | length > 0
          notify: Reload systemd for Tailscale

        - name: No Tailscale start order
          ansible.builtin.file:
            path: /etc/systemd/system/tailscaled.service.d/50-after.conf
            state: absent
          when: tailscale_after | length == 0
          notify: Reload systemd for Tailscale

        - name: Tailscale daemon
          ansible.builtin.systemd_service:
            name: tailscaled
            enabled: true
            state: started

    # macOS: Homebrew's open-source tailscaled, which runs as root under its
    # launchd job in the system domain. Homebrew installs as the user, never
    # root; `sudo brew services start` writes and loads the job.
    - name: Tailscale on macOS
      when: "'macos' in group_names"
      block:
        - name: Install Tailscale with Homebrew
          community.general.homebrew:
            name: tailscale
            state: present
            path: "{{ tailscale_homebrew_prefix }}/bin"

        - name: Read Tailscale's launchd job
          ansible.builtin.command:
            argv: [launchctl, print, "system/{{ tailscale_launchd_label }}"]
          register: tailscale_launchd
          changed_when: false
          failed_when: false
          check_mode: false
          become: true

        - name: Start Tailscale's launchd job
          ansible.builtin.command:
            argv: ["{{ tailscale_homebrew_prefix }}/bin/brew", services, start, tailscale]
          when: tailscale_launchd.rc != 0
          changed_when: true
          become: true

    # As root, which tailscale set needs on macOS as on Linux.
    - name: Tailscale settings and Serve
      tailscale_node:
        tags: "{{ tailscale_tags }}"
        settings: "{{ tailscale_settings }}"
        serve: "{{ tailscale_serve }}"
      register: tailscale_node_result
      become: true

    # A joined node's tags change only through Tailscale's API, by the node's
    # ID; tailscale up --advertise-tags would re-authenticate it.
    - name: Retag the node through Tailscale's API
      when:
        - tailscale_node_result.joined
        - tailscale_node_result.tags | sort != tailscale_tags | sort
      ansible.builtin.uri:
        url: https://api.tailscale.com/api/v2/device/{{ tailscale_node_result.node_id }}/tags
        method: POST
        headers:
          Authorization: Bearer {{ tailscale_api_token }}
        body_format: json
        body:
          tags: "{{ tailscale_tags | map('regex_replace', '^', 'tag:') | list }}"
        status_code: 200
      changed_when: true
      delegate_to: localhost
      become: false
      no_log: true

    - name: Join the tailnet
      when: not tailscale_node_result.joined
      block:
        - name: Refuse to join a protected or unapproved node
          ansible.builtin.assert:
            that:
              - not tailscale_protected
              - tailscale_join
            fail_msg: >-
              {{ inventory_hostname }} is not logged in ({{ tailscale_node_result.backend_state }}).
              {{ 'It is protected, so this role never joins it; log it in by hand.'
                 if tailscale_protected else 'Set tailscale_join to join it.' }}
            quiet: true

        - name: Mint a one-off auth key with the node's tags
          ansible.builtin.uri:
            url: https://api.tailscale.com/api/v2/tailnet/{{ tailscale_tailnet }}/keys
            method: POST
            headers:
              Authorization: Bearer {{ tailscale_api_token }}
            body_format: json
            body:
              # Letters, digits, spaces and hyphens alone.
              description: ansible {{ inventory_hostname | regex_replace('[^A-Za-z0-9 -]', '-') }}
              expirySeconds: 3600
              capabilities:
                devices:
                  create:
                    reusable: false
                    ephemeral: false
                    preauthorized: true
                    tags: "{{ tailscale_tags | map('regex_replace', '^', 'tag:') | list }}"
            status_code: 200
          register: tailscale_key
          delegate_to: localhost
          become: false
          no_log: true

        # With the declared settings that tailscale up takes too, so the node
        # never runs on Tailscale's defaults for them; the rest follow below.
        - name: Join with the key
          ansible.builtin.command:
            argv: >-
              {{ [tailscale_node_result.tailscale, 'up',
                  '--auth-key=' ~ tailscale_key.json.key,
                  '--advertise-tags=' ~ (tailscale_tags | map('regex_replace', '^', 'tag:') | join(','))]
                 + tailscale_node_result.up_flags }}
          changed_when: true
          become: true
          no_log: true

        - name: Tailscale settings and Serve after joining
          tailscale_node:
            tags: "{{ tailscale_tags }}"
            settings: "{{ tailscale_settings }}"
            serve: "{{ tailscale_serve }}"
          become: true

    # macOS: the launchd job that has the kernel ignore router advertisements'
    # Route Information Options from every boot. Last, as its first run can
    # restart tailscaled.
    - name: Route Information Options ignored on macOS
      when: "'macos' in group_names"
      block:
        - name: The route information job
          ansible.builtin.template:
            src: ignore-route-info.plist.j2
            dest: /Library/LaunchDaemons/{{ tailscale_macos_route_info_label }}.plist
            owner: root
            group: wheel
            mode: "0644"
            validate: plutil -lint %s
          register: tailscale_route_info_plist
          when: tailscale_macos_ignore_route_info
          become: true

        - name: Read the route information job
          ansible.builtin.command:
            argv: [launchctl, print, "system/{{ tailscale_macos_route_info_label }}"]
          register: tailscale_route_info_job
          changed_when: false
          failed_when: false
          check_mode: false
          become: true

        - name: Unload the route information job, changed or no longer wanted
          ansible.builtin.command:
            argv: [launchctl, bootout, "system/{{ tailscale_macos_route_info_label }}"]
          when:
            - tailscale_route_info_job.rc == 0
            - not tailscale_macos_ignore_route_info or tailscale_route_info_plist is changed
          changed_when: true
          become: true

        - name: Remove the route information job
          ansible.builtin.file:
            path: /Library/LaunchDaemons/{{ tailscale_macos_route_info_label }}.plist
            state: absent
          when: not tailscale_macos_ignore_route_info
          become: true

        # Loading runs it.
        - name: Load the route information job
          ansible.builtin.command:
            argv: [launchctl, bootstrap, system, "/Library/LaunchDaemons/{{ tailscale_macos_route_info_label }}.plist"]
          when:
            - tailscale_macos_ignore_route_info
            - tailscale_route_info_job.rc != 0 or tailscale_route_info_plist is changed
          changed_when: true
          become: true
