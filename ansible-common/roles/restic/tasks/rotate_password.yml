---
# Rotate the repository's password, once, from either stage's maintenance.yml
# (--tags restic-password): from one host with a key, add a repository key with
# a new password, check that it opens the repository, then make it the shared
# restic_password in SOPS. The old key keeps working until both stages'
# site.yml have delivered the new password and --tags restic-password-prune
# removes it. A key the run adds but fails to record is removed by that prune.
- name: Repository and keys
  ansible.builtin.include_tasks: outputs.yml

# A check run cannot add a key, so it has no new password to try.
- name: Report a check run
  ansible.builtin.debug:
    msg: A rotation would add the new key from {{ restic_key_hosts | first }}.
  run_once: true
  when: ansible_check_mode

- name: Rotate, from one host with a key
  run_once: true
  delegate_to: "{{ restic_key_hosts | first }}"
  when: not ansible_check_mode
  block:
    - name: New password
      ansible.builtin.set_fact:
        restic_new_password: "{{ lookup('community.general.random_string', length=restic_password_length, special=false) }}"
      no_log: true

    - name: Scratch file for the new password
      ansible.builtin.tempfile:
        state: file
        suffix: .restic-password
      register: restic_new_password_file

    - name: Add the key and record its password
      block:
        - name: Write the new password to it
          ansible.builtin.copy:
            dest: "{{ restic_new_password_file.path }}"
            content: "{{ restic_new_password }}\n"
            owner: root
            group: root
            mode: "0400"
          no_log: true

        - name: Add a repository key for the new password
          ansible.builtin.shell:
            cmd: >-
              set -a && . {{ restic_env_file }} && set +a &&
              exec restic --retry-lock={{ restic_retry_lock }} key add
              --new-password-file {{ restic_new_password_file.path }}
            executable: /bin/bash
          changed_when: true

        - name: Check the new password opens the repository
          ansible.builtin.shell:
            cmd: >-
              set -a && . {{ restic_env_file }} && set +a &&
              RESTIC_PASSWORD_FILE={{ restic_new_password_file.path }} exec restic --no-lock cat config >/dev/null
            executable: /bin/bash
          changed_when: false

        - name: Make it the shared password in SOPS
          ansible.builtin.command:
            argv: [sops, set, --value-stdin, "{{ restic_password_sops_file }}", '["restic_password"]']
            stdin: "{{ restic_new_password | to_json }}"
          delegate_to: localhost
          become: false
          changed_when: true
          no_log: true
      always:
        - name: Remove the scratch file
          ansible.builtin.file:
            path: "{{ restic_new_password_file.path }}"
            state: absent
