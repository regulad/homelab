---
# Run by test_ansible.py for a host whose own variables set ansible_become,
# with a become program that always fails: the aide role's way of reading the
# connecting user's home, and the keyword alone. Each runs printenv only.
- name: A host whose variables set become
  hosts: all
  gather_facts: false
  tasks:
    - name: As the aide role reads the connecting user's home
      ansible.builtin.command: printenv HOME
      become: false
      vars:
        ansible_become: false
      check_mode: false
      changed_when: false

    # Last: it fails, as the escalation it tries fails before its command runs,
    # which failed_when cannot pass over.
    - name: With the become keyword alone
      ansible.builtin.command: printenv HOME
      become: false
      check_mode: false
      changed_when: false
      failed_when: false
